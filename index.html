er. I am pitching you a deal where a buyer is acquiring an existing business. Tell me it doesn't fit your credit box, then say you are not doing many startups this year, then suggest I come back in six months. Be polite but brief. After three exchanges, stop and score me 1-5 on Acknowledge, Challenge, Investigate, Mitigate, Advance, and correct my English."},{"id":"g11","icon":"🏠","en":"Appraisal came in low","ar":"التقييم جاء منخفضاً","diff":2,"sit":"التقييم طلع أقل من سعر الشراء بـ 90 ألف، والبائع مش راضي ينزل.","goal":"تشرح أثر التقييم على التمويل، وتقدّم بدائل لسد الفجوة.","client":[2531,2532,2533],"moves":[2651,2652,2653,2654,2655],"rel":["L3s15","L4s19","Bd"],"drill":"Role-play: you are buying a small commercial building and business in Georgia. Tell me the appraisal came in $90,000 below the purchase price, then say the seller won't budge on price, then ask if you should just walk away. Sound stressed. After three exchanges, stop and score me 1-5 on Acknowledge, Challenge, Investigate, Mitigate, Advance, and correct my English."},{"id":"g12","icon":"⚖️","en":"Telling the client \"not fundable\"","ar":"إبلاغ العميل بأن الصفقة غير قابلة للتمويل","diff":3,"sit":"بعد التحليل، الصفقة بهيكلها الحالي مش هتتمول. العميل عايز إجابة صريحة.","goal":"صراحة كاملة بدون قسوة، وتحويل الرفض لخطة إعادة تفاوض.","client":[2534,2535,2536],"moves":[2656,2657,2658,2659,2660],"rel":["L4s20","L4s10","L4s19"],"drill":"Role-play: you are a first-time buyer trying to acquire a small trucking company. Ask me to be straight about whether the deal is fundable. When I say it isn't as structured, say that's not what you wanted to hear, then ask what I would do in your shoes. Be disappointed but respectful. After three exchanges, stop and score me 1-5 on Acknowledge, Challenge, Investigate, Mitigate, Advance, and correct my English."}],"STARTER":[2001,2002,2004,2007,2008,2011,2017,2021,2024,2028,93,99,57,202,1001,1008,1021,1026,1031,1032,1034,1053,1077,1108,1101,1102,1151,1155,1201,1205,1225,1   arVoices=vs.filter(v=>/^ar/i.test(v.lang));
  const us=vs.filter(v=>/^en[-_]?US/i.test(v.lang));
  const pool=us.length?us:(enVoices.length?enVoices:vs);
  const maleHints=['google us english','microsoft david','microsoft mark','microsoft guy','microsoft andrew','microsoft brian','microsoft christopher','david','mark','daniel','fred','alex','aaron','arthur','eric','guy','james','john','tom','andrew','brian'];
  const femaleRe=/female|zira|samantha|victoria|susan|karen|moira|tessa|fiona|hazel|catherine|jenny|aria|ava|emma|michelle|woman|girl/i;
  const byName=n=>n?vs.find(v=>v.name===n):null;
  let a=byName(S.voiceA);
  if(!a)a=pool.find(v=>maleHints.some(h=>v.name.toLowerCase().includes(h)));
  if(!a)a=pool.find(v=>!femaleRe.test(v.name));

/* ================= PRONUNCIATION SCORING ================= */
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function n2w(n){
  n=Math.floor(n);if(n<20)return ONES[n];
  if(n<100)return TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:'');
  if(n<1000)return ONES[Math.floor(n/100)]+' hundred'+(n%100?' '+n2w(n%100):'');
  const units=[[1e9,'billion'],[1e6,'million'],[1e3,'thousand']];
  for(const [v,w] of units){if(n>=v)return n2w(Math.floor(n/v))+' '+w+(n%v?' '+n2w(n%v):'');}
  return String(n);
}
function numWords(tok){
  const m=tok.match(/^(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d+))?$/);if(!m)return tok;
  const intStr=m[1].replace(/,/g,''),n=parseInt(intStr,10);
  let w;
  if(!m[2]&&!/,/.test(m[1])&&intStr.length===4&&n>=1900&&n<2100&&n%100!==0&&!(n>=2000&&n<2010)){w=n2w(Math.floor(n/100))+' '+n2w(n%100);}
  else w=n2w(n);
  if(m[2])w+=' point '+m[2].split('').map(d=>ONES[+d]).join(' ');
  return w;
}
const CONTR=[[/\bcan't\b/g,'can not'],[/\bcannot\b/g,'can not'],[/\bwon't\b/g,'will not'],[/\bshan't\b/g,'shall not'],[/n't\b/g,' not'],[/\bi'm\b/g,'i am'],[/'re\b/g,' are'],[/'ll\b/g,' will'],[/'ve\b/g,' have'],[/'d\b/g,' would'],[/\blet's\b/g,'let us'],[/\b(it|that|there|what|here|he|she|who|where|how)'s\b/g,'$1 is']];
function expandC(s){let t=s.toLowerCase().replace(/[’]/g,"'");CONTR.forEach(([r,v])=>{t=t.replace(r,v);});return t;}
function normSay(s){
  return expandC(s).replace(/[’]/g,"'").replace(/%/g,' percent').replace(/\$/g,' ').replace(/[-–—/]/g,' ')
    .split(/\s+/).map(t=>{const c=t.replace(/[^a-z0-9'.,]/g,'').replace(/[.,]+$/,'');return /^\d/.test(c)?numWords(c):c.replace(/[.,]/g,'');}).join(' ')
    .replace(/[^a-z0-9'\s]/g,' ').replace(/\s+/g,' ').trim();
}
function scorePron(target,said){
  const tW=normSay(target).split(' ').filter(Boolean);
  const sW=new Set(normSay(said).split(' ').filter(Boolean));
  const marks=tW.map(w=>({w,ok:sW.has(w)||sW.has(w.replace(/'/g,''))}));
  const hit=marks.filter(m=>m.ok).length;
  return {pct:Math.round(hit/Math.max(tW.length,1)*100),marks,said};
}

function bigr(s){s=s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();const m=new Map();for(let i=0;i<s.length-1;i++){const g=s.substr(i,2);m.set(g,(m.get(g)||0)+1);}return {m,n:Math.max(s.length-1,0)};}
function dice(a,b){if(!a.n||!b.n)return 0;let x=0;a.m.forEach((v,k)=>{const w=b.m.get(k);if(w)x+=Math.min(v,w);});return 2*x/(a.n+b.n);}

  return best;
}

/* list of phrases with filters */
function filtered(list){
  return list.filter(p=>{
    if(st.hidden.has(p.i)&&!st.showHidden)return false;
    if(st.filter==='star')return !!p.s;
    if(st.filter==='done')return st.mastered.has(p.i);
    if(st.filter==='todo')return !st.mastered.has(p.i);
    return true;
  });
}
function listToolbar(list,opts){
  opts=opts||{};

  [['all','الكل'],['star','★ أولوية'],['todo','○ لم أتقنها'],['done','✓ أتقنتها']].forEach(([v,l])=>{h+='<button class="t'+(st.filter===v?' on':'')+'" data-act="filter" data-v="'+v+'">'+l+'</button>';});
  h+='</div><div class="tb">';
  h+='<button class="t'+(S.showAr?' on':'')+'" data-act="tgl" data-k="showAr">🌐 الترجمة '+(S.showAr?'ظاهرة':'مخفية')+'</button>';

function cardsHtml(list,chip){
  const f=filtered(list);

  return f.map(p=>card(p,{chip})).join('');
}
function listFromSrc(src){
  if(!src)return [];
  const [k,v]=src.split(':');
  if(k==='sec')return secPh(v);
  if(k==='mod')return modPh(v);
  if(k==='starter')return STARTER.map(i=>BYID.get(i)).filter(Boolean);
  if(k==='active'){const due=dueIds();const rest=Object.keys(st.active).map(Number).filter(i=>!due.includes(i)&&BYID.has(i));return due.concat(rest).map(i=>BYID.get(i));}
  if(k==='star')return ALL.filter(p=>p.s);
  if(k==='pat'){const P=PATS.find(x=>x.k===v);return P?patList(P):[];}
  if(k==='scen'){const g=SCEN.find(x=>x.id===v);return g?g.client.concat(g.moves).map(i=>BYID.get(i)).filter(Boolean):[];}
  return [];
}
function srcName(src){
  if(!src)return '';const [k,v]=src.split(':');
  if(k==='sec'){const s=SECBY.get(v);return s?s.icon+' '+s.ar:'';}
  if(k==='mod'){const m=MODBY.get(v);return m?m.icon+' '+m.ar:'';}
  if(k==='starter')return '🌱 قائمة البداية';
  if(k==='active')return '⚡ القائمة النشطة';
  if(k==='star')return '★ كل جمل الأولوية';
  if(k==='pat'){const P=PATS.find(x=>x.k===v);return P?'🧩 '+P.en:'';}
  if(k==='scen'){const g=SCEN.find(x=>x.id===v);return g?'🥊 '+g.ar:'';}
  return src;
}

let SLIM=60;

  const el=document.getElementById('sres');if(!el)return;v=v.trim();

  else{const lv=v.toLowerCase();res=ALL.filter(p=>p.en.toLowerCase().includes(lv)||(p.ar&&p.ar.includes(v))||(p.note&&p.note.includes(v))||(p.memo&&p.memo.toLowerCase().includes(lv)));}

/* ================= SHARED DRILL HELPERS ================= */
function countdown(ms,tok,bar){
  return new Promise(res=>{
    const t0=performance.now();const el=bar?document.getElementById(bar):null;
    const iv=setInterval(()=>{const k=(performance.now()-t0)/ms;if(el)el.style.width=Math.min(100,k*100)+'%';if(tok!==runTok||k>=1){clearInterval(iv);if(el)el.style.width='0';res();}},80);
  });
}
function shS(t){const e=document.getElementById('shs');if(e)e.textContent=t;}
const CONJ=/^(and|but|because|which|that|so|before|after|if|while|rather|than|to|with|without|for|on|in|of|about|when|where|whether|or|including|despite|subject)$/i;
function chunks(t){
  const parts=t.split(/(?<=[,;:])\s+|\s+[—–-]\s+/).map(s=>s.trim()).filter(Boolean);
  const out=[];
  parts.forEach(pt=>{
    const w=pt.split(/\s+/);
    if(w.length<=6){out.push(pt);return;}
    let cur=[];
    w.forEach((x,i)=>{
      const left=w.length-i;
      if(cur.length>=3&&CONJ.test(x)&&left>=2){out.push(cur.join(' '));cur=[];}
      cur.push(x);
      if(cur.length>=6&&left-1>=2){out.push(cur.join(' '));cur=[];}
    });
    if(cur.length)out.push(cur.join(' '));
  });
  return out;
}
function renderChunks(ch,from){const z=document.getElementById('chk');if(!z)return;z.innerHTML=ch.map((c,i)=>'<span class="'+(from>=0&&i>=from?'on':'')+'">'+esc(c)+'</span>').join('');}

async function shRun(mode,id,btn){
  const p=BYID.get(id);if(!p)return;
  document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('on',b===btn));
  if(mode==='rc')return shRecord(id);
  if(mode==='test'){shS('🎤 قل الجملة الآن…');startPractice(p.en,null,(r,err)=>{shS(err?err:'');const z=document.getElementById('rcz');if(z)z.innerHTML=r?scoreHtml(r):'';});return;}
  stopAll();const tok=++runTok;await sleep(120);
  const W=who(p),gap=d=>Math.max(1300,(d||estMs(p.en))*S.gapMult)+400;
  wake();
  try{
    if(mode==='lr'){
      for(let r=1;r<=S.reps;r++){shS('🔊 استمع ('+r+'/'+S.reps+')');const d=await speakP(p.en,W);if(tok!==runTok)return;shS('🗣️ دورك — كرّر بصوت عالٍ بنفس الإيقاع');await countdown(gap(d),tok,'shbar');if(tok!==runTok)return;st.stats.shadowReps++;}
    }else if(mode==='bc'){
      const ch=chunks(p.en);
      for(let k=ch.length-1;k>=0;k--){
        const t=ch.slice(k).join(' ');renderChunks(ch,k);shS('🔊 مقطع '+(ch.length-k)+'/'+ch.length);
        const d=await speakP(t,W,Math.max(0.7,S.rate-0.08));if(tok!==runTok)return;
        shS('🗣️ كرّر المقطع');await countdown(Math.max(1100,(d||estMs(t))*S.gapMult)+300,tok,'shbar');if(tok!==runTok)return;st.stats.shadowReps++;
      }
      renderChunks(ch,0);shS('🔊 الجملة كاملة');const d=await speakP(p.en,W);if(tok!==runTok)return;shS('🗣️ الجملة كاملة — دورك');await countdown(gap(d),tok,'shbar');if(tok!==runTok)return;
    }else if(mode==='sl'){
      for(const r of [0.6,0.75,0.9,1.0]){shS('🔊 سرعة '+r.toFixed(2));const d=await speakP(p.en,W,r);if(tok!==runTok)return;shS('🗣️ كرّر بنفس السرعة');await countdown(Math.max(1300,(d||estMs(p.en,r))*S.gapMult)+400,tok,'shbar');if(tok!==runTok)return;st.stats.shadowReps++;}
    }else if(mode==='sync'){
      for(let r=1;r<=3;r++){shS('👥 تكلّم مع الصوت الآن ('+r+'/3)');await speakP(p.en,W);if(tok!==runTok)return;await sleep(1000);st.stats.shadowReps++;}
    }
    shS('✓ انتهى — جرّب 🎤 اختبار النطق أو 🎙️ سجّل وقارن');
  }finally{save.stats();if(tok===runTok)unwake();}
}
let recURL=null;
async function shRecord(id){
  const p=BYID.get(id);if(!p)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){modal('<div class="msg bad">التسجيل غير مدعوم هنا — يحتاج Chrome ورابط https.</div>');return;}
  stopAll();const tok=++runTok;await sleep(100);
  shS('🔊 اسمع النموذج أولاً');const d=await speakP(p.en,who(p));if(tok!==runTok)return;
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){shS('');modal('<div class="msg bad">تم منع الميكروفون — اسمح به من إعدادات الموقع.</div>');return;}
  if(tok!==runTok){stream.getTracks().forEach(t=>t.stop());return;}
  mstream=stream;const parts=[];const mr=new MediaRecorder(stream);mrec=mr;
  mr.ondataavailable=e=>{if(e.data&&e.data.size)parts.push(e.data);};
  mr.onstop=()=>{
    stream.getTracks().forEach(t=>t.stop());if(mstream===stream)mstream=null;mrec=null;
    if(!parts.length){shS('لم يُسجَّل شيء');return;}
    if(recURL)URL.revokeObjectURL(recURL);
    recURL=URL.createObjectURL(new Blob(parts,{type:parts[0].type||'audio/webm'}));
    shS('✓ تم التسجيل — قارن الآن');
    const z=document.getElementById('rcz');if(z)z.innerHTML='<div class="tb"><button class="t gold" data-act="rcPlay" data-w="me" data-id="'+id+'">▶ صوتك</button><button class="t" data-act="rcPlay" data-w="model" data-id="'+id+'">▶ النموذج</button><button class="t on" data-act="rcPlay" data-w="both" data-id="'+id+'">▶ النموذج ثم صوتك</button></div>';
  };
  mr.start();shS('🔴 سجّل الآن — قل الجملة (يتوقف تلقائياً)');
  const z=document.getElementById('rcz');if(z)z.innerHTML='<button class="t red" data-act="rcStop">■ إيقاف التسجيل</button>';
  await countdown(Math.max(4000,(d||estMs(p.en))*2+2500),tok,'shbar');
  if(mr.state!=='inactive')mr.stop();
}
function rcStop(){if(mrec&&mrec.state!=='inactive')mrec.stop();}
async function rcPlay(w,id){
  const p=BYID.get(id);const tok=++runTok;if(window.speechSynthesis)speechSynthesis.cancel();
  if(w!=='me'&&p){await speakP(p.en,who(p));if(tok!==runTok)return;await sleep(300);}
  if(w!=='model'&&recURL){const a=new Audio(recURL);a.play().catch(()=>toast('تعذّر تشغيل التسجيل'));}
}

  while(PL.idx<PL.list.length){
    if(tok!==runTok)return;

function listenAnswer(tok,liveId){
  return new Promise(res=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){res({err:'nosr',text:''});return;}
    const r=new SR();r.lang='en-US';r.continuous=true;r.interimResults=true;
    const t0=performance.now();let tFirst=0,tLast=0,lastEvt=0,freezes=0,ended=false;const finals=[];let interim='';
    activeSR=r;
    const live=()=>{const e=document.getElementById(liveId);if(e)e.textContent=(finals.join(' ')+' '+interim).trim()||'…';};
    r.onspeechstart=()=>{if(!tFirst)tFirst=performance.now();};
    r.onresult=e=>{const now=performance.now();if(!tFirst)tFirst=now;if(lastEvt&&now-lastEvt>3000)freezes++;lastEvt=now;tLast=now;interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)finals.push(x[0].transcript.trim());else interim+=x[0].transcript;}live();};
    r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')fin('mic');};
    r.onend=()=>{if(!ended&&tok===runTok&&performance.now()-t0<60000&&(!tLast||performance.now()-tLast<4500)){try{r.start();return;}catch(e){}}fin();};
    const iv=setInterval(()=>{const now=performance.now();if(tok!==runTok){fin('stop');return;}if(now-t0>60000)fin();else if(tLast&&now-tLast>6500)fin();else if(!tFirst&&now-t0>12000)fin();},400);
    function fin(err){if(ended)return;ended=true;clearInterval(iv);try{r.stop();}catch(e){}if(activeSR===r)activeSR=null;answerStop=null;res({err,text:(finals.join(' ')+' '+interim).trim(),t0,tFirst,tLast,freezes});}
    answerStop=()=>fin();
    try{r.start();}catch(e){fin('start');}
    live();
  });
}

  testVoice(d){testVoice(d.w);},
  closeModal(){closeModal();},
  stop(){stopAll();shS('■ توقف');const c=document.getElementById('cvst');if(c)c.textContent='';plPaint&&document.getElementById('plNum')&&plPaint();},
  more(){SLIM+=60;const i=document.getElementById('sq');if(i)doSearch(i.value);},
  cvPlay(d){cvRun(d.id,false);},
  cvRole(d){cvRun(d.id,true);},
  cvLine(d){const cv=CONVOS.find(c=>c.id===d.id);const ln=cv&&cv.lines[+d.n];if(ln)speakSentence(ln.en,'cv'+d.id+'_'+d.n,ln.who==='you'?'A':'B');},
  cvRec(d,el){const cv=CONVOS.find(c=>c.id===d.id);const ln=cv&&cv.lines[+d.n];if(ln)startPractice(ln.en,el);},
  ibCheck(){ibCheck();},
  ibAdd(){ibAdd();},
  ibDel(d){const id=+d.id;st.inbox=st.inbox.filter(x=>x.i!==id);delete st.active[id];st.mastered.delete(id);save.inbox();save.active();save.mastered();rebuild();BIG=null;PATC.clear();refresh();},
  ioCopy(){copyText(document.getElementById('io').value);},
  ioDown(){const a=document.createElement('a');const d=new Date();a.href=URL.createObjectURL(new Blob([exportJson()],{type:'application/json'}));a.download='bankerspeak-backup-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);},
  ioImp(){importJson(document.getElementById('io').value);},
  setChk(d,el){S[d.k]=!!el.checked;saveSet();},
  shMode(d,el){shRun(d.m,+d.id,el);},
  rcStop(){rcStop();},
  rcPlay(d){rcPlay(d.w,+d.id);},
  plMode(d){PL.mode=d.m;stopAll();refresh();},
  plReps(d){PL.reps=+d.n;refresh();},
  plShuf(){PL.shuffle=!PL.shuffle;stopAll();PL.list=listFromSrc(PL.src).filter(p=>!st.hidden.has(p.i));if(PL.shuffle)shuffleArr(PL.list);PL.idx=0;refresh();},
  plToggle(){plToggle();},
  plNext(){plStep(1);},
  plPrev(){plStep(-1);},
  plJump(d){const was=PL.running;stopAll();PL.idx=+d.n;plPaint();window.scrollTo({top:0,behavior:'smooth'});if(was)plRun();},
  actDel(d){delete st.active[+d.id];save.active();refresh();},
  aqShow(){if(!AQ)return;AQ.shown=true;aqPaint();const id=AQ.q[AQ.i];const p=BYID.get(id);if(p)speakSentence(p.en,id,who(p));},
  aqRec(d,el){const p=P(d);if(!p)return;startPractice(p.en,el,(r,err)=>{if(err){toast(err);return;}AQ.score=r;AQ.shown=true;aqPaint();});},
  aqGrade(d){aqGrade(d.v==='1');},
  gPlay(d){gPlay(d.id,false);},
  gShadow(d){gPlay(d.id,true);},
  gRun(d){gRun(d.id,+d.l);},
  gEnd(){if(answerStop)answerStop();},
  gCopy(d){gCopy(d.id);}
};
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.tagName==='W'&&!t.closest('.blur')){speakWord(t.textContent);t.classList.add('say');setTimeout(()=>t.classList.remove('say'),400);return;}
  const el=t.closest('[data-act]');
  if(!el){const g=t.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);}return;}
  const fn=ACT[el.dataset.act];
  if(!fn){console.warn('no action',el.dataset.act);return;}
  if(el.tagName==='BUTTON'||el.tagName==='A')e.preventDefault();
  try{fn(el.dataset,el,e);}catch(err){console.error(err);toast('خطأ: '+err.message);}
});
window.addEventListener('error',e=>{console.error(e.error||e.message);});
/* ---- app-feel hardening (TWA / installed PWA) ---- */
const EDITABLE='input,textarea,select,[contenteditable]';
document.addEventListener('contextmenu',e=>{if(!e.target.closest(EDITABLE))e.preventDefault();});
document.addEventListener('selectstart',e=>{if(!e.target.closest(EDITABLE))e.preventDefault();});
document.addEventListener('dragstart',e=>{if(!e.target.closest(EDITABLE))e.preventDefault();});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const g=e.target.closest&&e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);}}});
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);});
window.BSP={DATA,ALL,ACT,route,st,S};
route();

</script>

if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
