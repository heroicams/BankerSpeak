x new trucks. I've got a guy who'll do the package for four hundred bucks. So what do you do differently?","ar":"سأكون سريعاً — ننقل البضائع لعميلين كبيرين في التجزئة ونريد قرض SBA لستّ شاحنات جديدة. لديّ شخص سيُجهّز الحزمة بأربعمئة دولار. فما الذي تفعله بشكل مختلف؟","note":"يريد SBA + يقارن بمنافس أرخص"},{"who":"you","en":"Let me make sure I understand — six trucks to take on freight you're turning away, SBA package done right. Quick question: just the trucks, or working capital too?","ar":"دعني أتأكد أنني فهمت — ستّ شاحنات لتلبية شحنات ترفضها حالياً، وحزمة SBA مُعدّة بشكل صحيح. سؤال سريع: الشاحنات فقط أم رأس مال عامل أيضاً؟","note":"توضيح + سؤال تشخيص"},{"who":"them","name":"Dave","en":"Just the trucks. Two accounts are about seventy percent of our revenue, but they're rock solid.","ar":"الشاحنات فقط. عميلان يمثّلان نحو سبعين بالمئة من إيرادنا، لكنهما ثابتان تماماً.","note":"تركّز 70% في عميلين"},{"who":"you","en":"Okay, here's where I earn my fee. Two customers at seventy percent of revenue — that's concentration risk, and on an SBA file it's one of the first things the credit officer flags.","ar":"حسناً، هنا أستحق أتعابي. عميلان بسبعين بالمئة من الإيراد — هذا خطر تركّز، وفي ملف SBA هو من أول ما يلاحظه ضابط الائتمان.","note":"عدسة المصرفي — خطر التركّز"},{"who":"them","name":"Dave","en":"Huh. So does that kill it?","ar":"حسناً. هل يُفشل ذلك الصفقة؟","note":"يسأل إن كان قاتلاً"},{"who":"you","en":"No — it's manageable, but it has to be addressed head-on. We propose a mitigant: a covenant requiring advance notice on any material change to those contracts. That's the difference between a model that works and a file that gets approved.","ar":"لا — يمكن إدارته، لكن يجب معالجته مباشرةً. نقترح مُخفِّفاً: شرطاً يتطلب إشعاراً مسبقاً بأي تغيير جوهري في تلك العقود. هذا هو الفرق بين نموذج يعمل وملف يُعتمد.","note":"الحل + جملة الهوية"},{"who":"them","name":"Dave","en":"My four-hundred-dollar guy is definitely not saying any of this. But price matters — why pay you a multiple?","ar":"صاحب الأربعمئة دولار قطعاً لا يقول أياً من هذا. لكن السعر مهم — لماذا أدفع لك أضعافاً؟","note":"اعتراض السعر"},{"who":"you","en":"I hear you. Let me reframe it: what does it cost you if the deal gets declined and you start over? A cheaper package that gets rejected is the expensive option.","ar":"أفهمك. دعني أعيد التأطير: كم يكلّفك إن رُفضت الصفقة وبدأت من جديد؟ حزمة أرخص تُرفض هي الخيار الأغلى.","note":"إعادة تأطير السعر"},{"who":"them","name":"Dave","en":"Fair point. What's the next step?","ar":"نقطة وجيهة. ما الخطوة التالية؟","note":"يقتنع"},{"who":"you","en":"Let's start with the SBA index and the credit memo, then scope the full package. I'll send a short intake form and we can get moving today.","ar":"فلنبدأ بفهرس الـ SBA والمذكرة الائتمانية، ثم نحدّد الحزمة الكاملة. سأرسل استمارة قصيرة ويمكننا التحرّك اليوم.","note":"الـ funnel + الإغلاق"}]},{"id":"cv3","icon":"🏛️","title":"The Lender Call","col":"#880E4F","tag":"بنكي","sub":"تمثّل عميلك أمام ضابط ائتمان","lines":[{"who":"them","name":"Karen","en":"Hi, this is Karen with the bank — I understand you're representing the borrower on the FastTrack file?","ar":"مرحباً، أنا كارين من البنك — أفهم أنك تمثّل المقترض في ملف FastTrack؟","note":"ضابطة ائتمان تتصل"},{"who":"you","en":"I am — thanks for taking the call, Karen. I structured the package and wanted to walk you through it before it hits your desk. Give me two minutes to frame it.","ar":"نعم — شكراً لتلقّيك المكالمة يا كارين. أنا هيكلت الحزمة وأردت أن أشرحها لك قبل وصولها لمكتبك. أمهليني دقيقتين لأؤطّرها.","note":"تقديم مهني ندّ لندّ"},{"who":"them","name":"Karen","en":"Sure, go ahead.","ar":"بالتأكيد، تفضّل.","note":"تأذن"},{"who":"you","en":"We're presenting this as a medium-risk credit with a clear primary repayment source and adequate collateral coverage. The global DSCR comes in at one-point-four times, comfortably above the one-point-two-five benchmark.","ar":"نقدّم هذا كائتمان متوسط المخاطر بمصدر سداد أساسي واضح وتغطية ضمانات كافية. الـ DSCR الكلي يبلغ 1.4 مرة، فوق معيار الـ 1.25 بمريح.","note":"صياغة لجنة الائتمان + الأرقام"},{"who":"them","name":"Karen","en":"What about concentration? Two accounts, right? That'll come up.","ar":"ماذا عن التركّز؟ عميلان، صحيح؟ ستُثار هذه النقطة.","note":"تختبره بسؤال المخاطر"},{"who":"you","en":"It will, and we've addressed it directly rather than burying it. The mitigant is a covenant requiring advance notice on any material contract change. And on a stressed basis — a fifteen-percent revenue decline — the deal still services its debt.","ar":"ستُثار، وعالجناها مباشرةً بدل دفنها. المُخفِّف شرط يتطلب إشعاراً مسبقاً بأي تغيير جوهري في العقود. وعلى أساس مُجهَد — انخفاض إيراد خمسة عشر بالمئة — تظل الصفقة قادرة على خدمة دينها.","note":"معالجة المخاطر + stress test"},{"who":"them","name":"Karen","en":"You ran the stress case already? That's helpful.","ar":"أجريت حالة الضغط بالفعل؟ هذا مفيد.","note":"تتفاجأ إيجابياً"},{"who":"you","en":"We did — it's in the Banker's View section, with the assumptions laid out so your committee doesn't have to reverse-engineer them.","ar":"نعم — إنها في قسم رؤية المصرفي، مع الافتراضات مُوضّحة حتى لا تضطر لجنتك لتفكيكها عكسياً.","note":"يبرز جودة الملف"},{"who":"them","name":"Karen","en":"And collateral?","ar":"والضمانات؟","note":"تسأل عن الضمانات"},{"who":"you","en":"The trucks provide primary security, plus a personal guarantee. The use of funds is clean, the repayment is supported, and the collateral position is adequate.","ar":"الشاحنات تُوفّر الضمان الأساسي، إضافةً لكفالة شخصية. استخدام الأموال واضح، والسداد مدعوم، ووضع الضمانات كافٍ.","note":"ملخّص ائتماني محكم"},{"who":"them","name":"Karen","en":"Alright, send it through and I'll get it into the queue.","ar":"حسناً، أرسله وسأُدخله في قائمة الانتظار.","note":"تقبل الملف"},{"who":"you","en":"Will do — you'll have it today. And Karen, if your committee flags anything, call me directly. I'd rather solve it in five minutes than lose two weeks in back-and-forth.","ar":"سأفعل — سيصلك اليوم. وكارين، إن لاحظت لجنتك أي شيء، اتصلي بي مباشرةً. أفضّل حلّه في خمس دقائق على خسارة أسبوعين في التبادل.","note":"إغلاق مهني واثق"}]},{"id":"cv4","icon":"🚀","title":"Startup Founder — First Call","col":"#1565C0","tag":"بنكي","sub":"مؤسس SaaS محتار بين قرض ومستثمرين","lines":[{"who":"them","name":"Priya","en":"Hi, thanks for the call. We're a two-year-old SaaS company trying to raise a round, but honestly I'm not sure if we should go for a bank loan or investors.","ar":"مرحباً، شكراً على المكالمة. نحن شركة SaaS عمرها سنتان نحاول جمع جولة تمويل، لكنني صراحةً لست متأكدة إن كان علينا اللجوء لقرض بنكي أم لمستثمرين.","note":"محتارة بين قرض ومستثمرين"},{"who":"you","en":"Good morning, Priya — I appreciate you reaching out. Let's start with where you are: what's your revenue doing, and what would the funding actually be for?","ar":"صباح الخير يا بريا — أقدّر تواصلك. فلنبدأ بأين أنتم: كيف يسير إيرادكم، ولأي غرض سيكون التمويل فعلاً؟","note":"افتتاح + سؤال تشخيص"},{"who":"them","name":"Priya","en":"We're at about forty thousand monthly recurring, growing, but we burn cash on engineering. We'd use the money to hire.","ar":"نحن عند نحو أربعين ألفاً إيراداً متكرراً شهرياً، ينمو، لكننا نحرق نقداً على الهندسة. سنستخدم المال للتوظيف.","note":"إيراد متكرر + حرق نقدي"},{"who":"you","en":"That's helpful. Here's the honest read: a bank lends against repayment capacity, and right now you're burning cash, so a traditional loan will be an uphill battle. Your story is a growth story — that's an investor's language, not a lender's.","ar":"هذا مفيد. إليك القراءة الصادقة: البنك يُقرض مقابل القدرة على السداد، وأنتم الآن تحرقون نقداً، فالقرض التقليدي سيكون معركة شاقة. قصتكم قصة نمو — وتلك لغة مستثمر لا مقرض.","note":"صراحة في التوجيه"},{"who":"them","name":"Priya","en":"That actually makes sense. So a model wouldn't help?","ar":"هذا منطقي فعلاً. إذاً النموذج لن يساعد؟","note":"تسأل عن جدوى النموذج"},{"who":"you","en":"It absolutely would — but a different model. For investors, the model needs to sell the upside and the unit economics. For a lender, it sells downside protection. Same numbers, completely different story.","ar":"بالتأكيد سيساعد — لكن نموذجاً مختلفاً. للمستثمرين، النموذج يجب أن يبيع الصعود واقتصاديات الوحدة. للمقرض، يبيع حماية الهبوط. نفس الأرقام، قصة مختلفة تماماً.","note":"يميّز نموذج المستثمر عن المقرض"},{"who":"them","name":"Priya","en":"I hadn't thought about it that way. Can you build the investor version?","ar":"لم أفكّر فيها بهذه الطريقة. هل يمكنك بناء نسخة المستثمر؟","note":"تطلب النموذج"},{"who":"you","en":"That's exactly what I'd recommend we start with. I'll build the model and an investor memo that frames your growth credibly — let me send a short intake form and we'll get going.","ar":"هذا تماماً ما أوصي بالبدء به. سأبني النموذج ومذكرة مستثمر تؤطّر نموّكم بمصداقية — دعيني أرسل استمارة قصيرة ونبدأ.","note":"يقترح المسار + الإغلاق"}]},{"id":"cv5","icon":"💰","title":"The Price Shopper","col":"#E65100","tag":"بنكي","sub":"عميل يساوم بقوة — اختبار ثبات","lines":[{"who":"them","name":"Tom","en":"Look, I'll be straight — I've got three quotes and you're the most expensive. Give me one reason I shouldn't go with the cheap one.","ar":"اسمع، سأكون صريحاً — لديّ ثلاثة عروض وأنت الأغلى. أعطني سبباً واحداً لئلا أختار الأرخص.","note":"يساوم بقوة"},{"who":"you","en":"Fair question, and I respect that you're being direct. Let me reframe it: what does it cost you if the cheap one gets your file declined and you lose three months?","ar":"سؤال وجيه، وأحترم صراحتك. دعني أعيد التأطير: كم يكلّفك إن تسبّب الأرخص في رفض ملفك وخسرت ثلاثة أشهر؟","note":"إعادة التأطير"},{"who":"them","name":"Tom","en":"I mean… that would hurt. But how do I know yours gets approved?","ar":"أعني... ذلك سيؤلم. لكن كيف أعرف أن ملفك سيُعتمد؟","note":"يعترض بشكوك"},{"who":"you","en":"You don't, with certainty — nobody can promise an approval. What I can promise is that your file will answer every question a credit committee asks before they ask it. That's what I do for a living.","ar":"لا تعرف بيقين — لا أحد يستطيع وعدك بموافقة. ما أستطيع وعدك به أن ملفك سيُجيب كل سؤال تطرحه لجنة الائتمان قبل أن تسأله. هذا عملي.","note":"صدق + تموضع"},{"who":"them","name":"Tom","en":"The other guys didn't say anything like that.","ar":"الآخرون لم يقولوا شيئاً كهذا.","note":"يلاحظ الفرق"},{"who":"you","en":"That's the difference. I'm not the cheapest, and I won't pretend to be. I'm the one who's sat on the credit committee and knows what kills a deal.","ar":"هذا هو الفرق. لست الأرخص، ولن أدّعي ذلك. أنا من جلس في لجنة الائتمان ويعرف ما يقتل الصفقة.","note":"تموضع واثق"},{"who":"them","name":"Tom","en":"Alright. What if we start with something smaller?","ar":"حسناً. ماذا لو بدأنا بشيء أصغر؟","note":"ينفتح على البدء"},{"who":"you","en":"Smart move. Let's scope it down to a Basic tier first — you'll see the quality, and we can step up to the full package from there.","ar":"خطوة ذكية. فلنبدأ بمستوى أساسي أصغر — سترى الجودة، ويمكننا الترقّي للحزمة الكاملة من هناك.","note":"يحافظ على الصفقة"}]},{"id":"cv6","icon":"🤝","title":"Networking Introduction","col":"#4A148C","tag":"عام","sub":"تتعرّف على شخص في فعالية مهنية","lines":[{"who":"them","name":"Alex","en":"Hi, I don't think we've met — Alex, I work in commercial real estate.","ar":"مرحباً، لا أظن أننا التقينا — أليكس، أعمل في العقارات التجارية.","note":"تعارف في فعالية"},{"who":"you","en":"Pleasure to meet you, Alex — I'm Ahmed. I've heard your firm does a lot of SBA-backed deals.","ar":"سعدت بلقائك يا أليكس — أنا أحمد. سمعت أن شركتك تُنجز الكثير من الصفقات المدعومة بالـ SBA.","note":"تعارف + ربط مهني"},{"who":"them","name":"Alex","en":"We do, yeah. What's your line of work?","ar":"نعم، نفعل. ما مجال عملك؟","note":"يسأل عن مجالك"},{"who":"you","en":"I help business owners get their loan files approved — I structure the credit side so lenders say yes. Eighteen years on the banking side before I went independent.","ar":"أساعد أصحاب الأعمال على اعتماد ملفات قروضهم — أهيكل الجانب الائتماني ليقول المقرضون نعم. ثمانية عشر عاماً في الجانب المصرفي قبل أن أعمل مستقلاً.","note":"تقديم مهني للذات"},{"who":"them","name":"Alex","en":"Oh, that's useful. We've had a few clients struggle with their packages.","ar":"آه، هذا مفيد. واجه بعض عملائنا صعوبة في حزمهم.","note":"يرى صلة مهنية"},{"who":"you","en":"That's exactly where I come in. When a file gets stuck, it's usually not the numbers — it's how they're presented to the committee.","ar":"هنا تحديداً يأتي دوري. حين يتعثّر ملف، عادةً لا تكون الأرقام المشكلة — بل كيفية عرضها على اللجنة.","note":"عدسة المصرفي في سياق اجتماعي"},{"who":"them","name":"Alex","en":"Let's swap details — I might have some referrals for you.","ar":"فلنتبادل البيانات — قد تكون لديّ بعض الإحالات لك.","note":"يقترح تبادل البيانات"},{"who":"you","en":"I'd appreciate that — the referral means a lot. Let me give you my card, and feel free to reach out anytime.","ar":"أقدّر ذلك — الإحالة تعني الكثير. دعني أعطيك بطاقتي، ولا تتردد في التواصل في أي وقت.","note":"إغلاق ودّي مهني"}]},{"id":"cv7","icon":"🚧","title":"A Difficult Phone Line","col":"#D84315","tag":"عام","sub":"مكالمة بخط سيّئ ومتحدث سريع","lines":[{"who":"them","name":"Client","en":"Hey, sorry, I'm driving — so anyway we were thinking the, uh, the amount might need to go up to like three-fifty because of the equipment thing?","ar":"مرحباً، آسف، أنا أقود — على أي حال كنا نفكّر أن، آه، المبلغ قد يحتاج للارتفاع إلى نحو ثلاثمئة وخمسين بسبب موضوع المعدات؟","note":"متحدث سريع وخط سيّئ"},{"who":"you","en":"Sorry, you're breaking up a little — could you say that last part again?","ar":"عذراً، صوتك متقطّع قليلاً — هل يمكنك قول الجزء الأخير مجدداً؟","note":"طلب إعادة بأدب"},{"who":"them","name":"Client","en":"Yeah — the loan amount, we might bump it to three hundred fifty thousand.","ar":"نعم — مبلغ القرض، قد نرفعه إلى ثلاثمئة وخمسين ألفاً.","note":"يوضّح"},{"who":"you","en":"I want to make sure I caught that correctly — did you say the amount is going up to three hundred fifty thousand?","ar":"أريد التأكد أنني فهمت ذلك صحيحاً — هل قلت إن المبلغ سيرتفع إلى ثلاثمئة وخمسين ألفاً؟","note":"تأكيد الرقم"},{"who":"them","name":"Client","en":"Exactly, yeah.","ar":"بالضبط، نعم.","note":"يؤكّد"},{"who":"you","en":"Got it. Just so I don't misquote you later, let me write that down. And could you slow down just a touch? I want to get every detail right.","ar":"فهمت. حتى لا أنقل كلامك خطأ لاحقاً، دعني أدوّن ذلك. وهل يمكنك التمهّل قليلاً؟ أريد أن أضبط كل تفصيلة.","note":"يدوّن + يطلب التمهّل"},{"who":"them","name":"Client","en":"Ha, sure, sorry. So the extra hundred is for a second forklift.","ar":"ها، بالتأكيد، آسف. إذاً المئة الإضافية لرافعة شوكية ثانية.","note":"يتمهّل"},{"who":"you","en":"Perfect, that's clear now. Since you're driving, why don't I put this in an email so you have it in writing, and we can confirm the details later?","ar":"ممتاز، أصبح واضحاً الآن. بما أنك تقود، لمَ لا أضع هذا في بريد ليكون لديك كتابةً، ونؤكّد التفاصيل لاحقاً؟","note":"حل عملي + متابعة"}]},{"id":"cv8","icon":"⚠️","title":"Delivering Hard News","col":"#37474F","tag":"عام","sub":"تخبر عميلاً أن ملفه ليس جاهزاً","lines":[{"who":"them","name":"Sam","en":"So, is the file ready to submit? I told my supplier the money's coming next week.","ar":"إذاً، هل الملف جاهز للتقديم؟ أخبرت مورّدي أن المال سيصل الأسبوع القادم.","note":"يتوقّع جاهزية فورية"},{"who":"you","en":"Let me be direct with you, Sam, because I'd rather be honest than tell you what you want to hear. As it stands, I wouldn't submit this yet.","ar":"دعني أكون صريحاً معك يا سام، لأنني أفضّل الصدق على إخبارك بما تريد سماعه. بوضعه الحالي، لن أقدّم هذا بعد.","note":"صراحة بلباقة"},{"who":"them","name":"Sam","en":"What? Why not? It looks done to me.","ar":"ماذا؟ لماذا لا؟ يبدو لي مكتملاً.","note":"يستغرب"},{"who":"you","en":"I understand the frustration. Here's the issue: the cash flow statement has a gap the committee will catch in the first review, and one rejection makes the next lender more cautious. Submitting now actually hurts your odds.","ar":"أتفهّم الإحباط. إليك المشكلة: قائمة التدفق النقدي بها فجوة ستلتقطها اللجنة في أول مراجعة، ورفض واحد يجعل المقرض التالي أكثر حذراً. التقديم الآن يضرّ فرصك فعلاً.","note":"يشرح السبب بمنطق"},{"who":"them","name":"Sam","en":"But I've already made commitments.","ar":"لكنني قطعت التزامات بالفعل.","note":"يعبّر عن ضغط"},{"who":"you","en":"I hear you, and I don't say this lightly. Give me three more days to fix the gap properly, and you'll walk in with a file that gets a yes — not one that gets a maybe.","ar":"أسمعك، ولا أقول هذا باستخفاف. أمهلني ثلاثة أيام أخرى لإصلاح الفجوة بشكل صحيح، وستدخل بملف يحصل على نعم — لا ملف يحصل على ربما.","note":"تعاطف + حل + طمأنة"},{"who":"them","name":"Sam","en":"Okay… three days. You're sure?","ar":"حسناً... ثلاثة أيام. هل أنت متأكد؟","note":"يتردّد ثم يوافق"},{"who":"you","en":"I'm sure it's the right call. Better a short delay now than a rejection that costs you a month. Let me get to work and I'll update you Thursday.","ar":"متأكد أنه القرار الصحيح. تأخير قصير الآن أفضل من رفض يكلّفك شهراً. دعني أبدأ العمل وسأوافيك يوم الخميس.","note":"ثقة + خطوة تالية"}]},{"id":"cv9","icon":"🔁","title":"Following Up After Silence","col":"#00695C","tag":"عام","sub":"تتابع مع عميل توقّف عن الرد","lines":[{"who":"you","en":"Hi Lisa, just following up on the proposal I sent last week — I know things get busy, so no pressure at all.","ar":"مرحباً ليزا، مجرد متابعة على العرض الذي أرسلته الأسبوع الماضي — أعرف أن الأمور تزدحم، فلا ضغط إطلاقاً.","note":"متابعة بلا إلحاح"},{"who":"them","name":"Lisa","en":"Oh, hi — yeah, sorry, it's been hectic. I read it but haven't decided.","ar":"آه، مرحباً — نعم، آسفة، كان الأمر محموماً. قرأته لكنني لم أقرّر.","note":"مشغولة ولم تقرّر"},{"who":"you","en":"Totally understandable. Is there anything in there I can clarify, or a concern holding you back?","ar":"مفهوم تماماً. هل هناك أي شيء فيه يمكنني توضيحه، أو قلق يمنعك؟","note":"يفتح الباب للاعتراضات"},{"who":"them","name":"Lisa","en":"Honestly, the price gave me pause.","ar":"بصراحة، السعر جعلني أتردّد.","note":"تكشف اعتراض السعر"},{"who":"you","en":"I appreciate you being candid. Let me reframe it — what does it cost if the loan falls through? But if budget is the real constraint, we can start with a smaller scope and build from there.","ar":"أقدّر صراحتك. دعني أعيد التأطير — كم يكلّف إن فشل القرض؟ لكن إن كانت الميزانية هي القيد الحقيقي، يمكننا البدء بنطاق أصغر والبناء من هناك.","note":"إعادة تأطير + مرونة"},{"who":"them","name":"Lisa","en":"That might work, actually.","ar":"قد ينجح ذلك فعلاً.","note":"تنفتح"},{"who":"you","en":"Great. Why don't I put together a phased option that fits your budget — you'll have it within the hour, and you can decide when you're ready.","ar":"رائع. لمَ لا أُعدّ خياراً مرحلياً يناسب ميزانيتك — سيصلك خلال ساعة، ويمكنك القرار حين تكونين جاهزة.","note":"حل + إغلاق بلا ضغط"}]},{"id":"cv10","icon":"💡","title":"Clearing a Misunderstanding","col":"#AD1457","tag":"عام","sub":"سوء فهم حول النطاق","lines":[{"who":"them","name":"Omar","en":"Wait — I thought the price included the full SBA submission and dealing with the bank directly?","ar":"لحظة — ظننت أن السعر يشمل التقديم الكامل للـ SBA والتعامل مع البنك مباشرةً؟","note":"سوء فهم حول النطاق"},{"who":"you","en":"Let me make sure I understand you correctly — you're expecting me to handle the lender submission end to end?","ar":"دعني أتأكد أنني فهمتك صحيحاً — تتوقّع مني أن أتولّى التقديم للمقرض من البداية للنهاية؟","note":"إعادة صياغة لتأكيد الفهم"},{"who":"them","name":"Omar","en":"Yes, that's what I assumed.","ar":"نعم، هذا ما افترضته.","note":"يؤكّد افتراضه"},{"who":"you","en":"I think we might be talking about two different things — let me clarify. The price covers preparing and packaging the full file so it's submission-ready. Submitting to the lender on your behalf is a separate add-on.","ar":"أعتقد أننا قد نتحدث عن أمرين مختلفين — دعني أوضّح. السعر يغطّي إعداد وتجهيز الملف الكامل ليكون جاهزاً للتقديم. التقديم للمقرض نيابةً عنك إضافة منفصلة.","note":"يصحّح بهدوء + يوضّح"},{"who":"them","name":"Omar","en":"Ah, I see. That wasn't clear to me.","ar":"آه، فهمت. لم يكن ذلك واضحاً لي.","note":"يفهم"},{"who":"you","en":"That's on me — I should have spelled it out up front. The good news is the add-on is straightforward, and I'm happy to include it. Let me send a revised scope so there are no surprises.","ar":"هذا خطئي — كان عليّ توضيحه من البداية. الخبر الجيد أن الإضافة بسيطة، ويسعدني تضمينها. دعني أرسل نطاقاً مُعدّلاً حتى لا تكون هناك مفاجآت.","note":"يتحمّل المسؤولية + حل"},{"who":"them","name":"Omar","en":"That works. Send it over.","ar":"هذا يناسب. أرسله.","note":"يوافق"},{"who":"you","en":"Will do. Going forward, I'll always lay out exactly what's in and out of scope so we're on the same page from day one.","ar":"سأفعل. مستقبلاً، سأوضّح دائماً ما هو داخل النطاق وخارجه حتى نكون متفقين من اليوم الأول.","note":"إغلاق + درس مهني"}]},{"id":"cv11","icon":"🏢","title":"Business Acquisition","col":"#0D47A1","tag":"بنكي","sub":"عميل يريد شراء شركة قائمة بقرض SBA","lines":[{"who":"them","name":"Greg","en":"I'm looking to buy an existing HVAC company. The seller wants nine hundred thousand. Can SBA help with that?","ar":"أتطلّع لشراء شركة تكييف قائمة. البائع يريد تسعمئة ألف. هل يمكن للـ SBA المساعدة في ذلك؟","note":"يريد تمويل استحواذ"},{"who":"you","en":"It can — SBA 7(a) is built for acquisitions. First question: have you seen three years of the seller's tax returns and financials?","ar":"يمكنه — الـ SBA 7(a) مصمّم للاستحواذات. السؤال الأول: هل اطّلعت على ثلاث سنوات من إقرارات البائع الضريبية وقوائمه؟","note":"يوجّه + سؤال الفحص"},{"who":"them","name":"Greg","en":"He showed me a profit and loss, but said the returns are private.","ar":"أراني قائمة أرباح وخسائر، لكنه قال إن الإقرارات خاصة.","note":"البائع يتحفّظ"},{"who":"you","en":"That's a flag. For an acquisition, the lender verifies the seller's numbers — quality of earnings before you commit a dollar. A seller who won't share returns is a problem we solve early.","ar":"تلك علامة تحذير. في الاستحواذ، يتحقق المقرض من أرقام البائع — جودة الأرباح قبل أن تلتزم بدولار. بائع يرفض مشاركة الإقرارات مشكلة نحلّها مبكراً.","note":"عدسة المصرفي — quality of earnings"},{"who":"them","name":"Greg","en":"What if the numbers don't fully back the price?","ar":"ماذا لو لم تدعم الأرقام السعر بالكامل؟","note":"يسأل عن الفجوة"},{"who":"you","en":"Then we structure around it — a seller note on standby can bridge a valuation gap and count toward your equity. It also signals the seller's confidence to the lender.","ar":"عندها نهيكل حول ذلك — سند بائع على انتظار قد يسدّ فجوة التقييم ويُحتسب ضمن حقوق ملكيتك. كما يُشير لثقة البائع أمام المقرض.","note":"حل هيكلي"},{"who":"them","name":"Greg","en":"That's clever. So where do we start?","ar":"هذا ذكي. إذاً من أين نبدأ؟","note":"يقتنع"},{"who":"you","en":"We start with a quality-of-earnings review and the deal structure. I'll send an intake form, and we'll know quickly whether this deal is bankable.","ar":"نبدأ بمراجعة جودة الأرباح وهيكل الصفقة. سأرسل استمارة، وسنعرف سريعاً إن كانت هذه الصفقة قابلة للتمويل.","note":"الإغلاق"}]},{"id":"cv12","icon":"🏬","title":"Commercial Real Estate — 504","col":"#1A237E","tag":"بنكي","sub":"عميل يريد شراء مبنى تجاري","lines":[{"who":"them","name":"Nina","en":"We're renting our warehouse and the landlord is selling. We'd rather buy it than move. It's about 1.2 million.","ar":"نستأجر مستودعنا والمالك يبيعه. نفضّل شراءه على الانتقال. سعره نحو 1.2 مليون.","note":"تريد شراء العقار المؤجّر"},{"who":"you","en":"For owner-occupied commercial real estate, the SBA 504 is usually the better fit than a 7(a). Let me explain why.","ar":"للعقار التجاري الذي يشغله المالك، عادةً يكون الـ SBA 504 أنسب من الـ 7(a). دعيني أشرح لماذا.","note":"يوجّه للبرنامج الصحيح"},{"who":"them","name":"Nina","en":"Okay, what's the difference?","ar":"حسناً، ما الفرق؟","note":"تسأل عن الفرق"},{"who":"you","en":"The 504 splits it three ways: a bank loan for fifty percent, a CDC debenture for forty, and your ten percent down. Lower down payment, long fixed terms — ideal for real estate.","ar":"الـ 504 يقسّمه ثلاثة أقسام: قرض بنكي لخمسين بالمئة، وسند CDC لأربعين، ودفعتك المقدّمة عشرة بالمئة. دفعة أقل وآجال ثابتة طويلة — مثالي للعقار.","note":"يشرح هيكل الـ 504"},{"who":"them","name":"Nina","en":"Ten percent down? That's much less than I expected.","ar":"عشرة بالمئة مقدّماً؟ أقل بكثير مما توقعت.","note":"تتفاجأ إيجابياً"},{"who":"you","en":"Exactly — that's the advantage of the 504. It preserves your working capital for running the business instead of locking it in the building.","ar":"بالضبط — تلك ميزة الـ 504. تحافظ على رأس مالك العامل لتشغيل النشاط بدل حبسه في المبنى.","note":"يبرز الميزة"},{"who":"you","en":"We'll need an appraisal and your business financials. Let me put together the structure so you can see the numbers clearly.","ar":"سنحتاج تقييماً عقارياً وقوائمك المالية. دعيني أُجهّز الهيكل لتري الأرقام بوضوح.","note":"الخطوة التالية"}]},{"id":"cv13","icon":"🔧","title":"Equipment Financing","col":"#E65100","tag":"بنكي","sub":"مصنع صغير يريد تمويل ماكينة","lines":[{"who":"them","name":"Carlos","en":"We need a CNC machine — about two hundred K. Our current one can't keep up with orders.","ar":"نحتاج ماكينة CNC — نحو مئتي ألف. ماكينتنا الحالية لا تواكب الطلبات.","note":"يريد تمويل معدات"},{"who":"you","en":"Good problem to have — demand outpacing capacity. That's a strong story for a lender. Are the new orders contracted, or projected?","ar":"مشكلة جميلة أن تواجهها — الطلب يفوق الطاقة. تلك قصة قوية للمقرض. هل الطلبات الجديدة متعاقد عليها أم متوقّعة؟","note":"عدسة إيجابية + سؤال"},{"who":"them","name":"Carlos","en":"We've got signed POs we're turning away because we can't produce fast enough.","ar":"لدينا أوامر شراء موقّعة نرفضها لأننا لا ننتج بسرعة كافية.","note":"طلبات موقّعة مرفوضة"},{"who":"you","en":"That's exactly what a lender wants to see — the equipment pays for itself through orders you already have. We'll tie the loan directly to that contracted revenue.","ar":"هذا تماماً ما يريد المقرض رؤيته — المعدات تسدّد قيمتها عبر طلبات لديك بالفعل. سنربط القرض مباشرةً بذلك الإيراد المتعاقد عليه.","note":"يربط الأصل بالإيراد"},{"who":"them","name":"Carlos","en":"The machine itself is collateral, right?","ar":"الماكينة نفسها ضمان، صحيح؟","note":"يسأل عن الضمان"},{"who":"you","en":"It is — equipment serves as primary security. We match the loan term to the machine's useful life, so the payment stays comfortable.","ar":"نعم — المعدات تُشكّل الضمان الأساسي. نُطابق أجل القرض مع العمر الإنتاجي للماكينة، فتبقى الدفعة مريحة.","note":"هيكلة + مطابقة الأجل"},{"who":"you","en":"Send me the equipment quote and the POs, and I'll build a tight, fast file.","ar":"أرسل لي عرض المعدات وأوامر الشراء، وسأبني ملفاً محكماً وسريعاً.","note":"الإغلاق"}]},{"id":"cv14","icon":"💧","title":"Working Capital Line","col":"#01579B","tag":"بنكي","sub":"نشاط موسمي يعاني فجوات نقدية","lines":[{"who":"them","name":"Beth","en":"We're a landscaping company. Summers are huge, but winters drain our cash and we struggle to make payroll.","ar":"نحن شركة تنسيق حدائق. الصيف ضخم، لكن الشتاء يستنزف نقدنا ونكافح لدفع الرواتب.","note":"مشكلة موسمية"},{"who":"you","en":"Classic seasonal cash gap. The wrong fix is a term loan — the right fix is a line of credit that you draw in winter and repay in summer.","ar":"فجوة نقدية موسمية كلاسيكية. الحل الخاطئ قرض لأجل — الحل الصحيح خط ائتمان تسحب منه شتاءً وتسدّده صيفاً.","note":"يميّز التسهيل الصحيح"},{"who":"them","name":"Beth","en":"What's the difference, practically?","ar":"ما الفرق، عملياً؟","note":"تسأل عن الفرق"},{"who":"you","en":"A term loan is a lump sum you repay on a fixed schedule. A line of credit is flexible — you only pay interest on what you use, and it refills as you repay. It matches your cash cycle.","ar":"القرض لأجل مبلغ مقطوع تسدّده بجدول ثابت. خط الائتمان مرن — تدفع فائدة فقط على ما تستخدمه، ويتجدّد كلما سدّدت. يطابق دورتك النقدية.","note":"يشرح الفرق"},{"who":"them","name":"Beth","en":"That sounds exactly like what we need.","ar":"يبدو تماماً ما نحتاجه.","note":"تتجاوب"},{"who":"you","en":"To size it right, I'll map your monthly cash flow so we request a limit that covers the gap without overborrowing.","ar":"لأحدّد حجمه بدقة، سأرسم تدفقك النقدي الشهري لنطلب حدّاً يغطّي الفجوة دون اقتراض زائد.","note":"تحديد الحجم"},{"who":"you","en":"Send me twelve months of bank statements and I'll show you the seasonal pattern in numbers.","ar":"أرسلي لي اثني عشر شهراً من الكشوف البنكية وسأُريك النمط الموسمي بالأرقام.","note":"الخطوة التالية"}]},{"id":"cv15","icon":"📋","title":"Explaining DSCR to a Client","col":"#006064","tag":"بنكي","sub":"عميل لا يفهم لماذا رُفض ملفه","lines":[{"who":"them","name":"Raj","en":"The bank said my DSCR was too low. I don't even really know what that means. My business is profitable!","ar":"قال البنك إن الـ DSCR لديّ منخفض جداً. لا أعرف حتى ما يعنيه ذلك. نشاطي مربح!","note":"لا يفهم سبب الرفض"},{"who":"you","en":"Let me explain it simply. DSCR — debt service coverage ratio — measures whether your cash flow covers the loan payments. Profit on paper and cash to pay debt are two different things.","ar":"دعني أشرحها ببساطة. الـ DSCR — نسبة تغطية خدمة الدين — تقيس إن كان تدفقك النقدي يغطّي دفعات القرض. الربح على الورق والنقد لسداد الدين أمران مختلفان.","note":"يشرح المفهوم"},{"who":"them","name":"Raj","en":"So how is it calculated?","ar":"إذاً كيف يُحسب؟","note":"يسأل عن الحساب"},{"who":"you","en":"Net operating income divided by total debt payments. If you make a hundred twenty in cash and owe a hundred in payments, your DSCR is one-point-two. Lenders usually want at least one-point-two-five.","ar":"صافي الدخل التشغيلي مقسوماً على إجمالي دفعات الدين. إن كسبت مئة وعشرين نقداً وعليك مئة دفعات، فالـ DSCR لديك 1.2. المقرضون عادةً يريدون 1.25 على الأقل.","note":"يشرح المعادلة بمثال"},{"who":"them","name":"Raj","en":"Mine came out at one-point-one. Can that be fixed?","ar":"لديّ خرج 1.1. هل يمكن إصلاح ذلك؟","note":"يسأل عن الحل"},{"who":"you","en":"Often, yes. We can add back the owner's salary and one-time expenses, restructure the term to lower the payment, or right-size the request. Small changes can lift the ratio above the line.","ar":"غالباً، نعم. يمكننا إضافة راتب المالك والمصاريف غير المتكررة، أو إعادة هيكلة الأجل لخفض الدفعة، أو ضبط حجم الطلب. تغييرات صغيرة قد ترفع النسبة فوق الخط.","note":"حلول عملية"},{"who":"you","en":"Let me rework your numbers properly — I suspect your real DSCR is stronger than what was submitted.","ar":"دعني أعيد معالجة أرقامك بشكل صحيح — أظن أن الـ DSCR الحقيقي لديك أقوى مما قُدّم.","note":"الخطوة التالية"}]},{"id":"cv16","icon":"🔄","title":"Refinancing Existing Debt","col":"#4527A0","tag":"بنكي","sub":"عميل مثقل بديون عالية الفائدة","lines":[{"who":"them","name":"Tony","en":"I've got three merchant cash advances eating me alive — the daily payments are killing my cash flow.","ar":"لديّ ثلاث سلفات نقدية تجارية تلتهمني — الدفعات اليومية تقتل تدفقي النقدي.","note":"مثقل بديون باهظة"},{"who":"you","en":"Those MCAs are brutal — effective rates can hit triple digits. The play here is to refinance them into a single, longer-term SBA loan with one manageable monthly payment.","ar":"تلك السلفات قاسية — المعدلات الفعلية قد تصل لثلاثة أرقام. الحل هنا إعادة تمويلها في قرض SBA واحد أطول أجلاً بدفعة شهرية واحدة قابلة للإدارة.","note":"يشخّص + يقترح الحل"},{"who":"them","name":"Tony","en":"Can SBA even be used to pay off other debt?","ar":"هل يمكن استخدام الـ SBA أصلاً لسداد ديون أخرى؟","note":"يسأل عن الأهلية"},{"who":"you","en":"It can, if the debt being refinanced was for a sound business purpose and the new loan improves your position. High-cost short-term debt is a textbook refinance case.","ar":"يمكن، إن كان الدين المُعاد تمويله لغرض تجاري سليم والقرض الجديد يحسّن وضعك. الدين قصير الأجل باهظ التكلفة حالة إعادة تمويل نموذجية.","note":"يوضّح الأهلية"},{"who":"them","name":"Tony","en":"What would that do to my monthly outflow?","ar":"ماذا سيفعل ذلك بتدفقي الشهري الخارج؟","note":"يسأل عن الأثر"},{"who":"you","en":"Stretching the term from months to years can cut your debt payments dramatically — freeing up cash you can actually run the business with.","ar":"تمديد الأجل من أشهر إلى سنوات قد يخفّض دفعات دينك بشكل كبير — محرّراً نقداً تستطيع فعلاً تشغيل النشاط به.","note":"يبرز الأثر"},{"who":"you","en":"Send me the payoff statements on all three advances and I'll model the before-and-after for you.","ar":"أرسل لي كشوف السداد للسلفات الثلاث وسأُنمذج لك ما قبل وما بعد.","note":"الخطوة التالية"}]},{"id":"cv17","icon":"🤲","title":"The Declined-Elsewhere Client","col":"#311B92","tag":"بنكي","sub":"عميل رُفض في بنكين ومحبط","lines":[{"who":"them","name":"Frank","en":"Two banks already turned me down. Honestly I'm about to give up. Why would you be any different?","ar":"بنكان رفضاني بالفعل. صراحةً أوشك على الاستسلام. لماذا ستكون مختلفاً؟","note":"محبط بعد رفضين"},{"who":"you","en":"I understand the frustration. But here's a question the banks probably didn't ask: do you know why you were declined? Most borrowers don't, and that's the real problem.","ar":"أتفهّم الإحباط. لكن إليك سؤالاً غالباً لم تسأله البنوك: هل تعرف لماذا رُفضت؟ معظم المقترضين لا يعرفون، وتلك هي المشكلة الحقيقية.","note":"يعيد التأطير"},{"who":"them","name":"Frank","en":"They just said it didn't meet their criteria. No real explanation.","ar":"قالوا فقط إنه لم يستوفِ معاييرهم. بلا تفسير حقيقي.","note":"لم يُعطَ سبباً"},{"who":"you","en":"That's exactly it. A decline is usually a fixable problem presented poorly — weak cash flow framing, a missing document, or the wrong lender for your profile. Let me diagnose the real reason.","ar":"هذا هو بالضبط. الرفض عادةً مشكلة قابلة للإصلاح عُرضت بشكل سيّئ — تأطير ضعيف للتدفق النقدي، أو مستند مفقود، أو المقرض الخطأ لملفك. دعني أشخّص السبب الحقيقي.","note":"عدسة المصرفي"},{"who":"them","name":"Frank","en":"So you think it's salvageable?","ar":"إذاً تظن أنه قابل للإنقاذ؟","note":"يستعيد الأمل"},{"who":"you","en":"Often it is — and being declined isn't a permanent mark. We rebuild the file the way an underwriter wants to see it, and match you to the right lender. Two noes don't make a deal dead.","ar":"غالباً نعم — والرفض ليس علامة دائمة. نعيد بناء الملف بالطريقة التي يريد المُكتتِب رؤيتها، ونوصّلك بالمقرض المناسب. رفضان لا يعنيان موت الصفقة.","note":"طمأنة + خطة"},{"who":"you","en":"Send me the file you submitted, and I'll tell you exactly what went wrong and how we fix it.","ar":"أرسل لي الملف الذي قدّمته، وسأخبرك بالضبط بما حدث خطأ وكيف نصلحه.","note":"الخطوة التالية"}]},{"id":"cv18","icon":"🍽️","title":"Restaurant Expansion","col":"#BF360C","tag":"بنكي","sub":"مطعم ناجح يريد فرعاً ثانياً","lines":[{"who":"them","name":"Sofia","en":"My restaurant's been packed for two years. I want to open a second one, but I've never borrowed before and I'm nervous.","ar":"مطعمي ممتلئ منذ سنتين. أريد فتح ثانٍ، لكنني لم أقترض من قبل وأنا متوترة.","note":"ناجحة لكن متوترة"},{"who":"you","en":"A proven, profitable first location is one of the strongest things you can bring to a lender. Let's build on that. What's the first location's cash flow look like?","ar":"موقع أول مُثبت ومربح من أقوى ما يمكنك تقديمه لمقرض. فلنبنِ على ذلك. كيف يبدو التدفق النقدي للموقع الأول؟","note":"عدسة إيجابية + سؤال"},{"who":"them","name":"Sofia","en":"It clears about ninety thousand a year after everything.","ar":"يحقق نحو تسعين ألفاً سنوياً بعد كل شيء.","note":"تدفق نقدي صحي"},{"who":"you","en":"That existing cash flow can help support the new location's debt while it ramps up — that's exactly what reassures a lender about expansion risk.","ar":"ذلك التدفق النقدي القائم يمكن أن يدعم دين الموقع الجديد بينما ينمو — وهذا تحديداً ما يطمئن المقرض بشأن خطر التوسّع.","note":"يربط القائم بالجديد"},{"who":"them","name":"Sofia","en":"I was worried the new place having no track record would sink it.","ar":"كنت قلقة أن عدم وجود سجل للمكان الجديد سيُغرقه.","note":"تكشف مخاوفها"},{"who":"you","en":"That's the right instinct, and we address it head-on. We lean the projection on your proven model and your existing cash flow — not on hope. A lender funds a track record, and you have one.","ar":"ذلك حدس صحيح، ونعالجه مباشرةً. نسند التوقّع على نموذجك المُثبت وتدفقك القائم — لا على الأمل. المقرض يموّل سجلاً، وأنتِ لديك واحد.","note":"يعالج المخاطر"},{"who":"you","en":"Let me build the model and a Banker's View that turns your success into a lender's confidence.","ar":"دعيني أبني النموذج ورؤية مصرفية تحوّل نجاحك إلى ثقة المقرض.","note":"الإغلاق"}]},{"id":"cv19","icon":"🍔","title":"Franchise Financing","col":"#0D47A1","tag":"بنكي","sub":"عميل يريد شراء امتياز مطعم معروف","lines":[{"who":"them","name":"Mike","en":"I want to open a franchise — a well-known sandwich brand. They quoted about three hundred K all in. Is that SBA-friendly?","ar":"أريد فتح امتياز — علامة سندويتشات معروفة. قدّروا نحو ثلاثمئة ألف شاملاً. هل ذلك مناسب للـ SBA؟","note":"يريد تمويل امتياز"},{"who":"you","en":"Franchises can be very SBA-friendly, but step one is checking the SBA Franchise Directory — the brand has to be listed, and we'll need the Franchise Disclosure Document.","ar":"الامتيازات قد تكون مناسبة جداً للـ SBA، لكن الخطوة الأولى التحقق من دليل امتيازات الـ SBA — يجب أن تكون العلامة مُدرجة، وسنحتاج وثيقة الإفصاح عن الامتياز.","note":"يوجّه للأهلية"},{"who":"them","name":"Mike","en":"I think they're a major brand, so probably listed?","ar":"أظن أنهم علامة كبرى، فعلى الأرجح مُدرجون؟","note":"يفترض الأهلية"},{"who":"you","en":"Likely, but we verify before building anything — there's no point preparing a package for an ineligible franchise. Next, how much of the three hundred is your own equity?","ar":"على الأرجح، لكن نتحقق قبل بناء أي شيء — لا جدوى من تجهيز حزمة لامتياز غير مؤهّل. ثانياً، كم من الثلاثمئة هو رأس مالك الخاص؟","note":"تحقق + سؤال الإنجكشن"},{"who":"them","name":"Mike","en":"I can put in maybe forty thousand.","ar":"أستطيع وضع نحو أربعين ألفاً.","note":"يحدّد الإنجكشن"},{"who":"you","en":"That's a little over ten percent, which is in range for a startup franchise. The brand's track record actually strengthens your file — lenders like proven systems.","ar":"ذلك أكثر بقليل من عشرة بالمئة، وهو ضمن النطاق لامتياز ناشئ. سجل العلامة فعلاً يقوّي ملفك — المقرضون يحبّون الأنظمة المُثبتة.","note":"يقيّم + يبرز الميزة"},{"who":"you","en":"Let me confirm the directory listing and pull the FDD, then we'll map the full structure.","ar":"دعني أؤكّد الإدراج في الدليل وأسحب وثيقة الإفصاح، ثم نرسم الهيكل الكامل.","note":"الخطوة التالية"}]},{"id":"cv20","icon":"🤝","title":"Partnership Buyout","col":"#1A237E","tag":"بنكي","sub":"شريك يريد شراء حصة شريكه الخارج","lines":[{"who":"them","name":"Dana","en":"My business partner wants out. I need to buy his fifty percent share, but I don't have the cash sitting around.","ar":"شريكي يريد الخروج. أحتاج لشراء حصته البالغة خمسين بالمئة، لكن ليس لديّ النقد جاهزاً.","note":"تريد تمويل شراء حصة"},{"who":"you","en":"A partner buyout is a recognized SBA use of funds. The advantage here is you already know the business inside out — that's a strong management story for the lender.","ar":"شراء حصة شريك استخدام معترف به للـ SBA. الميزة هنا أنك تعرفين النشاط تماماً — وتلك قصة إدارة قوية للمقرض.","note":"يوضّح الأهلية + ميزة"},{"who":"them","name":"Dana","en":"Does the bank look at the business differently since it's a change of ownership?","ar":"هل ينظر البنك للنشاط بشكل مختلف بما أنه تغيير ملكية؟","note":"تسأل عن المنظور"},{"who":"you","en":"They look closely at whether the business can support the new debt on its own cash flow after the buyout — and whether you can run it solo. We build the file to answer both.","ar":"ينظرون عن قرب إن كان النشاط يستطيع تحمّل الدين الجديد بتدفقه النقدي بعد الشراء — وإن كنتِ تستطيعين إدارته بمفردك. نبني الملف ليُجيب كليهما.","note":"عدسة المصرفي"},{"who":"them","name":"Dana","en":"The business does well — about a hundred fifty in cash flow.","ar":"النشاط يعمل جيداً — نحو مئة وخمسين تدفقاً نقدياً.","note":"تدفق صحي"},{"who":"you","en":"That should comfortably support the buyout debt. We'll document your role, the partner's departure terms, and a clean valuation of his share.","ar":"ذلك يجب أن يدعم دين الشراء بمريح. سنوثّق دورك، وشروط خروج الشريك، وتقييماً نظيفاً لحصته.","note":"الخطة"},{"who":"you","en":"Send me the operating agreement and the financials, and I'll structure the buyout so it's bankable.","ar":"أرسلي لي اتفاقية التشغيل والقوائم المالية، وسأهيكل عملية الشراء لتكون قابلة للتمويل.","note":"الخطوة التالية"}]},{"id":"cv21","icon":"💸","title":"Investor Pitch — Equity Round","col":"#880E4F","tag":"بنكي","sub":"مؤسس يستعدّ لعرض على مستثمرين","lines":[{"who":"them","name":"Leo","en":"We're raising a seed round and I have a pitch meeting next week. I think my deck is strong but I'm not sure investors will buy the numbers.","ar":"نجمع جولة تأسيسية ولديّ اجتماع عرض الأسبوع القادم. أظن أن عرضي قوي لكنني لست متأكداً أن المستثمرين سيقتنعون بالأرقام.","note":"يستعدّ لعرض استثماري"},{"who":"you","en":"For investors, the story is the upside — but the numbers have to be defensible. What are your unit economics? That's the first thing a sharp investor checks.","ar":"للمستثمرين، القصة هي الصعود — لكن الأرقام يجب أن تكون قابلة للدفاع. ما اقتصاديات وحدتك؟ ذلك أول ما يفحصه مستثمر ذكي.","note":"يوجّه لاقتصاديات الوحدة"},{"who":"them","name":"Leo","en":"We make about sixty dollars per customer and it costs us forty to acquire them.","ar":"نكسب نحو ستين دولاراً لكل عميل ويكلّفنا أربعون للحصول عليه.","note":"يعطي الأرقام"},{"who":"you","en":"So a positive contribution per customer — good. But investors will ask about payback period and retention. If customers stay, that sixty compounds; if they churn, the forty is wasted.","ar":"إذاً مساهمة إيجابية لكل عميل — جيد. لكن المستثمرين سيسألون عن فترة الاسترداد والاحتفاظ. إن بقي العملاء، تتراكم الستون؛ وإن غادروا، تُهدر الأربعون.","note":"يعمّق التحليل"},{"who":"them","name":"Leo","en":"Retention is actually our strong point — ninety percent stay past a year.","ar":"الاحتفاظ فعلاً نقطة قوتنا — تسعون بالمئة يبقون بعد سنة.","note":"يكشف نقطة قوة"},{"who":"you","en":"Then lead with that — strong retention is the most investable metric you have. We frame the deck around proven retention and the lifetime value it creates.","ar":"إذاً ابدأ بذلك — الاحتفاظ القوي هو أكثر مقياس قابل للاستثمار لديك. نصوغ العرض حول الاحتفاظ المُثبت والقيمة الدائمة التي يخلقها.","note":"يعيد تأطير العرض"},{"who":"you","en":"Let me sharpen the financial story and the memo so the numbers sell as hard as the vision.","ar":"دعني أُحسّن القصة المالية والمذكرة لتبيع الأرقام بقوة الرؤية نفسها.","note":"الإغلاق"}]},{"id":"cv22","icon":"📄","title":"Term Sheet Negotiation","col":"#4527A0","tag":"بنكي","sub":"عميل تلقّى عرضاً ويريد التفاوض","lines":[{"who":"them","name":"Ahmed","en":"I got a term sheet from the bank. The rate is eight percent and they want a personal guarantee on everything. Should I just sign?","ar":"تلقّيت ورقة شروط من البنك. المعدل ثمانية بالمئة ويريدون كفالة شخصية على كل شيء. هل أوقّع فقط؟","note":"يريد التفاوض"},{"who":"you","en":"Never sign the first term sheet without reading the whole thing. Rate matters, but so do covenants, fees, and the guarantee scope. Let's look at the full picture.","ar":"لا توقّع أبداً ورقة الشروط الأولى دون قراءة كل شيء. المعدل مهم، لكن كذلك الشروط التعهّدية والرسوم ونطاق الكفالة. فلننظر للصورة الكاملة.","note":"يحذّر + يوجّه"},{"who":"them","name":"Ahmed","en":"Is eight percent even negotiable?","ar":"هل الثمانية بالمئة قابلة للتفاوض أصلاً؟","note":"يسأل عن المرونة"},{"who":"you","en":"Often, yes — especially if your file is strong or you have a competing offer. But don't negotiate rate alone. Sometimes a slightly higher rate with looser covenants is the better deal.","ar":"غالباً، نعم — خصوصاً إن كان ملفك قوياً أو لديك عرض منافس. لكن لا تتفاوض على المعدل وحده. أحياناً معدل أعلى قليلاً بشروط أرخى هو الصفقة الأفضل.","note":"استراتيجية التفاوض"},{"who":"them","name":"Ahmed","en":"What about the personal guarantee? That worries me most.","ar":"ماذا عن الكفالة الشخصية؟ تلك تقلقني أكثر.","note":"قلق الكفالة"},{"who":"you","en":"Guarantee scope is negotiable too. Sometimes you can get a limited guarantee, or one that burns off once the loan hits a certain balance. It depends on the strength of the deal.","ar":"نطاق الكفالة قابل للتفاوض أيضاً. أحياناً تحصل على كفالة محدودة، أو واحدة تتلاشى بمجرد وصول القرض لرصيد معيّن. يعتمد على قوة الصفقة.","note":"حلول الكفالة"},{"who":"you","en":"Let me review the full term sheet and prep you on exactly which points to push on and which to accept.","ar":"دعني أراجع ورقة الشروط الكاملة وأُجهّزك بالضبط على أي النقاط تضغط وأيها تقبل.","note":"الخطوة التالية"}]},{"id":"cv23","icon":"🦷","title":"Medical Practice Loan","col":"#311B92","tag":"بنكي","sub":"طبيبة أسنان تفتتح عيادتها الأولى","lines":[{"who":"them","name":"Dr. Patel","en":"I'm a dentist leaving a group practice to start my own. I need funding for equipment, build-out, and some working capital. Around four hundred K.","ar":"أنا طبيبة أسنان أترك عيادة جماعية لأبدأ عيادتي الخاصة. أحتاج تمويلاً للمعدات والتجهيز وبعض رأس المال العامل. نحو أربعمئة ألف.","note":"تفتتح عيادة"},{"who":"you","en":"Dental practices are among the most lender-friendly deals out there — low default rates and predictable cash flow. Your professional credentials are a big asset here.","ar":"عيادات الأسنان من أكثر الصفقات ملاءمةً للمقرضين — معدلات تعثّر منخفضة وتدفق نقدي متوقّع. مؤهّلاتك المهنية أصل كبير هنا.","note":"عدسة إيجابية"},{"who":"them","name":"Dr. Patel","en":"But I won't have any patients on day one. Doesn't that scare lenders?","ar":"لكن لن يكون لديّ مرضى في اليوم الأول. ألا يُخيف ذلك المقرضين؟","note":"تكشف قلقها"},{"who":"you","en":"Less than you'd think — lenders have strong data on dental startups ramping up. We support the projection with industry benchmarks and your earning history at the group.","ar":"أقل مما تظنّين — لدى المقرضين بيانات قوية عن نمو عيادات الأسنان الناشئة. ندعم التوقّع بمعايير القطاع وتاريخ دخلك في العيادة الجماعية.","note":"يعالج المخاطر"},{"who":"them","name":"Dr. Patel","en":"That's reassuring. What's the typical structure?","ar":"هذا مُطمئن. ما الهيكل المعتاد؟","note":"تسأل عن الهيكل"},{"who":"you","en":"Often a 7(a) covering equipment, build-out, and working capital, with a term long enough to keep payments light while you build your patient base.","ar":"غالباً 7(a) يغطّي المعدات والتجهيز ورأس المال العامل، بأجل طويل بما يكفي لإبقاء الدفعات خفيفة بينما تبنين قاعدة مرضاك.","note":"يقترح الهيكل"},{"who":"you","en":"Send me your equipment quotes and your earnings record, and I'll build a file lenders compete for.","ar":"أرسلي لي عروض المعدات وسجل دخلك، وسأبني ملفاً يتنافس عليه المقرضون.","note":"الخطوة التالية"}]},{"id":"cv24","icon":"🏗️","title":"Contractor — Collateral Shortfall","col":"#BF360C","tag":"بنكي","sub":"مقاول قوي التدفق لكن ضعيف الضمانات","lines":[{"who":"them","name":"Bruno","en":"My construction company is doing great on cash, but the bank says I don't have enough collateral. I don't own much equipment — I rent it.","ar":"شركة المقاولات لديّ ممتازة نقدياً، لكن البنك يقول إنني لا أملك ضماناً كافياً. لا أملك معدات كثيرة — أستأجرها.","note":"تدفق قوي ضمان ضعيف"},{"who":"you","en":"This is a common and very solvable situation. Strong cash flow with thin collateral is exactly where the SBA guarantee earns its keep — it bridges the collateral gap a conventional loan can't.","ar":"هذا موقف شائع وقابل للحل تماماً. تدفق قوي مع ضمان ضعيف هو تحديداً حيث يثبت ضمان الـ SBA قيمته — يسدّ فجوة الضمان التي لا يسدّها قرض تقليدي.","note":"يطمئن + يوضّح الحل"},{"who":"them","name":"Bruno","en":"So the SBA makes up for not having collateral?","ar":"إذاً الـ SBA يعوّض عدم وجود ضمان؟","note":"يستوضح"},{"who":"you","en":"It reduces the lender's risk enough that adequate collateral isn't a deal-breaker — as long as the cash flow clearly services the debt. And your cash flow is your strength.","ar":"يقلّل مخاطر المقرض بما يكفي ألا يكون الضمان الكافي عائقاً — طالما أن التدفق النقدي يخدم الدين بوضوح. وتدفقك النقدي هو قوتك.","note":"عدسة المصرفي"},{"who":"them","name":"Bruno","en":"What about a personal guarantee? Will they want my house?","ar":"ماذا عن كفالة شخصية؟ هل سيريدون منزلي؟","note":"قلق الكفالة"},{"who":"you","en":"A personal guarantee is standard, and available home equity may be pledged if business collateral falls short. But the stronger your cash flow, the less they lean on it — that's leverage we'll use.","ar":"الكفالة الشخصية قياسية، وقد تُرهن حقوق ملكية المنزل المتاحة إن نقص ضمان النشاط. لكن كلما قوي تدفقك، قلّ اعتمادهم عليه — وتلك ورقة سنستخدمها.","note":"صراحة + ورقة تفاوض"},{"who":"you","en":"Let me build the file around your cash flow strength so collateral becomes a footnote, not the headline.","ar":"دعني أبني الملف حول قوة تدفقك النقدي ليصبح الضمان هامشاً لا عنواناً.","note":"الإغلاق"}]},{"id":"cv25","icon":"⛽","title":"Gas Station Acquisition","col":"#0D47A1","tag":"بنكي","sub":"عميل يريد شراء محطة وقود ومتجر","lines":[{"who":"them","name":"Sam","en":"There's a gas station with a convenience store for sale near me. Asking seven hundred K. The owner says it makes good money.","ar":"هناك محطة وقود مع متجر صغير للبيع قربي. السعر سبعمئة ألف. يقول المالك إنها تربح جيداً.","note":"يريد شراء محطة"},{"who":"you","en":"Gas stations can be solid SBA deals, but they come with specific risks lenders watch — environmental liability from the fuel tanks is the big one.","ar":"محطات الوقود قد تكون صفقات SBA متينة، لكنها تأتي بمخاطر محددة يراقبها المقرضون — المسؤولية البيئية من خزانات الوقود هي الأكبر.","note":"يوضّح الخطر الخاص"},{"who":"them","name":"Sam","en":"Environmental liability? I hadn't thought of that.","ar":"مسؤولية بيئية؟ لم أُفكّر في ذلك.","note":"لم ينتبه للخطر"},{"who":"you","en":"Most buyers don't. The lender will require a Phase I environmental assessment, sometimes Phase II. We get ahead of it so it doesn't derail the closing.","ar":"معظم المشترين لا ينتبهون. سيطلب المقرض تقييماً بيئياً من المرحلة الأولى، وأحياناً الثانية. نسبقه حتى لا يُعطّل الإغلاق.","note":"عدسة المصرفي — حل استباقي"},{"who":"them","name":"Sam","en":"And the 'makes good money' claim — how do I verify that?","ar":"وادعاء \"تربح جيداً\" — كيف أتحقق منه؟","note":"يسأل عن التحقق"},{"who":"you","en":"We verify it the way the lender will — tax returns, fuel supply records, and store sales reports. We separate the fuel margin from the store margin, because they behave very differently.","ar":"نتحقق منه بالطريقة التي سيتحقق بها المقرض — الإقرارات الضريبية وسجلات توريد الوقود وتقارير مبيعات المتجر. نفصل هامش الوقود عن هامش المتجر، لأنهما يتصرّفان بشكل مختلف جداً.","note":"فحص نافٍ للجهالة"},{"who":"you","en":"Send me what the seller's provided and I'll tell you what's missing and what to verify before you commit.","ar":"أرسل لي ما قدّمه البائع وسأخبرك بما ينقص وما يجب التحقق منه قبل أن تلتزم.","note":"الخطوة التالية"}]},{"id":"cv26","icon":"🏭","title":"Manufacturing Expansion","col":"#1A237E","tag":"بنكي","sub":"مصنع يريد التوسّع لمضاعفة الإنتاج","lines":[{"who":"them","name":"Wei","en":"We manufacture auto parts and demand is outstripping our capacity. We want to expand the facility — roughly two million.","ar":"نصنّع قطع غيار سيارات والطلب يفوق طاقتنا. نريد توسيع المنشأة — نحو مليونين.","note":"يريد تمويل توسّع كبير"},{"who":"you","en":"That's a substantial expansion. For a deal this size, the lender will scrutinize your existing capacity utilization and the contracts driving the new demand. Walk me through both.","ar":"ذلك توسّع كبير. لصفقة بهذا الحجم، سيدقّق المقرض في استغلال طاقتك الحالية والعقود التي تدفع الطلب الجديد. اشرح لي كليهما.","note":"يوجّه للتدقيق المناسب"},{"who":"them","name":"Wei","en":"We're running at ninety-five percent capacity and we have a three-year contract with a major supplier that we can't fully serve.","ar":"نعمل بطاقة خمسة وتسعين بالمئة ولدينا عقد ثلاث سنوات مع مورّد كبير لا نستطيع خدمته بالكامل.","note":"طاقة شبه ممتلئة + عقد"},{"who":"you","en":"That's a textbook expansion case — you're capacity-constrained with contracted demand you can't meet. That de-risks the whole projection for the lender.","ar":"تلك حالة توسّع نموذجية — أنت مقيّد بالطاقة مع طلب متعاقد عليه لا تستطيع تلبيته. ذلك يقلّل مخاطر التوقّع كله للمقرض.","note":"عدسة إيجابية"},{"who":"them","name":"Wei","en":"Two million is a lot, though. Will the cash flow support it?","ar":"مليونان مبلغ كبير. هل سيدعمه التدفق النقدي؟","note":"قلق التغطية"},{"who":"you","en":"That's the key question, and we'll model it carefully — matching the loan term to the equipment and building life, and stress-testing the DSCR against a demand slowdown.","ar":"ذلك السؤال الجوهري، وسنُنمذجه بعناية — بمطابقة أجل القرض مع عمر المعدات والمبنى، واختبار الـ DSCR تحت الضغط مقابل تباطؤ الطلب.","note":"هيكلة + اختبار ضغط"},{"who":"you","en":"Send me your financials and the supplier contract, and I'll build a structure that makes a two-million ask look conservative.","ar":"أرسل لي قوائمك وعقد المورّد، وسأبني هيكلاً يجعل طلب المليونين يبدو متحفظاً.","note":"الإغلاق"}]},{"id":"cv27","icon":"🏠","title":"Real Estate Investor — DSCR Loan","col":"#880E4F","tag":"بنكي","sub":"مستثمر عقاري يريد تمويل عقار مُدرّ للدخل","lines":[{"who":"them","name":"Marcus","en":"I want to buy a small apartment building as an investment. I've heard about DSCR loans — the property's income qualifies it, not my personal income?","ar":"أريد شراء مبنى شقق صغير كاستثمار. سمعت عن قروض الـ DSCR — دخل العقار يؤهّله، لا دخلي الشخصي؟","note":"يسأل عن قرض DSCR عقاري"},{"who":"you","en":"Right — a DSCR loan qualifies on the property's cash flow rather than your personal income. The key number is the rental income against the mortgage payment.","ar":"صحيح — قرض الـ DSCR يتأهّل على التدفق النقدي للعقار بدل دخلك الشخصي. الرقم المفتاح هو دخل الإيجار مقابل دفعة الرهن.","note":"يشرح المبدأ"},{"who":"them","name":"Marcus","en":"So if the rent covers the mortgage, I'm good?","ar":"إذاً إن غطّى الإيجار الرهن، أكون بخير؟","note":"يبسّط"},{"who":"you","en":"Covering it isn't enough — lenders want a cushion. A DSCR of one-point-two-five means the rent is twenty-five percent above the payment. That margin is what protects you and the lender in a vacancy.","ar":"التغطية وحدها لا تكفي — المقرضون يريدون وسادة. DSCR بقيمة 1.25 يعني أن الإيجار أعلى بخمسة وعشرين بالمئة من الدفعة. ذلك الهامش هو ما يحميك والمقرض في حال الشغور.","note":"يصحّح + يعمّق"},{"who":"them","name":"Marcus","en":"What if a unit sits empty for a couple months?","ar":"ماذا لو بقيت وحدة فارغة لشهرين؟","note":"قلق الشغور"},{"who":"you","en":"That's exactly why we stress-test the rent roll against realistic vacancy and maintenance. A deal that only works at full occupancy isn't really ready.","ar":"لهذا تحديداً نختبر سجل الإيجارات تحت الضغط مقابل شغور وصيانة واقعيين. صفقة تنجح فقط بإشغال كامل ليست جاهزة فعلاً.","note":"اختبار ضغط"},{"who":"you","en":"Send me the rent roll and the asking price, and I'll run the DSCR so you know if this property pencils out.","ar":"أرسل لي سجل الإيجارات والسعر المطلوب، وسأحسب الـ DSCR لتعرف إن كان هذا العقار مُجدياً.","note":"الخطوة التالية"}]},{"id":"cv28","icon":"📦","title":"Inventory Financing","col":"#311B92","tag":"بنكي","sub":"تاجر تجزئة يحتاج تمويل مخزون موسمي","lines":[{"who":"them","name":"Hana","en":"I run a retail shop. I need to stock up heavily before the holidays but I won't see that cash back until December. It's a timing problem.","ar":"أدير متجر تجزئة. أحتاج للتخزين بكثافة قبل الأعياد لكنني لن أرى ذلك النقد عائداً حتى ديسمبر. إنها مشكلة توقيت.","note":"مشكلة تمويل مخزون"},{"who":"you","en":"That's a working-capital timing gap — money tied up in inventory before sales convert it back to cash. The right tool is inventory financing or a seasonal line of credit.","ar":"تلك فجوة توقيت في رأس المال العامل — مال محبوس في المخزون قبل أن تحوّله المبيعات إلى نقد. الأداة الصحيحة تمويل مخزون أو خط ائتمان موسمي.","note":"يشخّص + يقترح"},{"who":"them","name":"Hana","en":"How is that different from a regular loan?","ar":"كيف يختلف ذلك عن قرض عادي؟","note":"تسأل عن الفرق"},{"who":"you","en":"It's structured around your cycle — you draw to buy inventory, then repay as you sell it through the season. You're not carrying a fixed loan year-round for a seasonal need.","ar":"إنه مُهيكل حول دورتك — تسحب لشراء المخزون، ثم تسدّد كلما بعته عبر الموسم. لا تحمل قرضاً ثابتاً طوال العام لحاجة موسمية.","note":"يشرح الهيكل"},{"who":"them","name":"Hana","en":"How much could I borrow against inventory?","ar":"كم يمكنني الاقتراض مقابل المخزون؟","note":"تسأل عن الحد"},{"who":"you","en":"Lenders advance a percentage of inventory value — they discount it, since unsold stock isn't worth its full retail price in a liquidation. We'll base the request on realistic advance rates.","ar":"المقرضون يُسلّفون نسبة من قيمة المخزون — يخصمونها، لأن البضاعة غير المباعة لا تساوي سعر تجزئتها الكامل في التصفية. سنبني الطلب على نسب سلفة واقعية.","note":"يوضّح آلية التقييم"},{"who":"you","en":"Send me last year's seasonal sales and your inventory plan, and I'll size a facility that covers the buildup.","ar":"أرسلي لي مبيعات الموسم العام الماضي وخطة مخزونك، وسأحدّد حجم تسهيل يغطّي التكديس.","note":"الخطوة التالية"}]},{"id":"cv29","icon":"🙅","title":"Declining a Request","col":"#4A148C","tag":"عام","sub":"ترفض عملاً خارج تخصصك بلباقة","lines":[{"who":"them","name":"Client","en":"Hey, since you do financial stuff, could you also do my company's bookkeeping and monthly taxes?","ar":"مرحباً، بما أنك تعمل في الأمور المالية، هل يمكنك أيضاً مسك دفاتر شركتي والضرائب الشهرية؟","note":"يطلب عملاً خارج التخصص"},{"who":"you","en":"I appreciate the trust — that's a real compliment. But I want to be straight with you: bookkeeping and tax filing aren't my specialty, and you deserve someone who does it every day.","ar":"أقدّر الثقة — تلك إطراء حقيقي. لكن أريد أن أكون صريحاً معك: مسك الدفاتر وتقديم الضرائب ليسا تخصصي، وتستحق شخصاً يفعلها يومياً.","note":"رفض بلباقة + سبب"},{"who":"them","name":"Client","en":"Oh, I figured it was all kind of the same thing.","ar":"آه، ظننت أنها كلها نفس الشيء تقريباً.","note":"يظن أنها متشابهة"},{"who":"you","en":"It's a common assumption, but they're different skills. What I do is the credit and lending side — getting you funded. For the books, I can refer you to a great accountant I trust.","ar":"افتراض شائع، لكنها مهارات مختلفة. ما أفعله هو جانب الائتمان والإقراض — حصولك على التمويل. للدفاتر، يمكنني إحالتك لمحاسب رائع أثق به.","note":"يوضّح حدوده + يقدّم بديلاً"},{"who":"them","name":"Client","en":"That'd actually be helpful, thanks.","ar":"ذلك سيكون مفيداً فعلاً، شكراً.","note":"يتقبّل"},{"who":"you","en":"Happy to make the introduction. And when you're ready for funding, that's exactly where I add the most value.","ar":"يسعدني التعريف. وحين تكون جاهزاً للتمويل، هناك تحديداً أضيف أكبر قيمة.","note":"يحافظ على العلاقة"}]},{"id":"cv30","icon":"📈","title":"Asking for a Rate Increase","col":"#33691E","tag":"عام","sub":"تطلب رفع أتعابك من عميل قديم","lines":[{"who":"you","en":"I wanted to talk with you about my rates. I've really valued working with you over the past year, and I'm adjusting my pricing going forward.","ar":"أردت التحدث معك بشأن أتعابي. قدّرت حقاً العمل معك خلال العام الماضي، وأنا أُعدّل تسعيري مستقبلاً.","note":"تفتح موضوع رفع السعر"},{"who":"them","name":"Client","en":"Oh? By how much?","ar":"حقاً؟ بكم؟","note":"يسأل عن المقدار"},{"who":"you","en":"My rate is moving up about fifteen percent, in line with the depth of work I'm now bringing. I wanted to tell you directly rather than have it come as a surprise.","ar":"سعري يرتفع نحو خمسة عشر بالمئة، تماشياً مع عمق العمل الذي أقدّمه الآن. أردت إخبارك مباشرةً بدل أن يأتي مفاجأةً.","note":"تحدّد + تبرّر"},{"who":"them","name":"Client","en":"That's a noticeable jump. The old rate worked well for us.","ar":"تلك قفزة ملحوظة. السعر القديم كان مناسباً لنا.","note":"يعترض"},{"who":"you","en":"I understand, and I value our relationship. The results I deliver have grown too — and I'm confident the value still far outweighs the fee. I'm happy to phase it in over your next two projects.","ar":"أتفهّم، وأقدّر علاقتنا. النتائج التي أقدّمها نمت أيضاً — وأنا واثق أن القيمة لا تزال تفوق الأتعاب بكثير. يسعدني تطبيقه تدريجياً عبر مشروعيك القادمين.","note":"تثبت القيمة + مرونة"},{"who":"them","name":"Client","en":"A phased approach would make it easier. Let's do that.","ar":"النهج التدريجي سيُسهّله. فلنفعل ذلك.","note":"يتقبّل الحل"},{"who":"you","en":"Perfect — I appreciate your understanding, and I'm looking forward to the next project.","ar":"ممتاز — أقدّر تفهّمك، وأتطلّع للمشروع القادم.","note":"إغلاق إيجابي"}]},{"id":"cv31","icon":"🗣️","title":"Giving Difficult Feedback","col":"#0277BD","tag":"عام","sub":"تعطي عميلاً ملاحظة صعبة عن توقعاته","lines":[{"who":"them","name":"Client","en":"I want the model to show forty percent growth every year for five years. That'll impress the bank, right?","ar":"أريد أن يُظهر النموذج نمواً بأربعين بالمئة كل عام لخمس سنوات. ذلك سيُبهر البنك، صحيح؟","note":"يطلب توقعات مبالغاً فيها"},{"who":"you","en":"I have to be honest with you here, because it matters. Forty percent compounding for five years will do the opposite — it'll make the bank distrust the whole file.","ar":"يجب أن أكون صادقاً معك هنا، لأن الأمر يهمّ. أربعون بالمئة مركّبة لخمس سنوات ستفعل العكس — ستجعل البنك لا يثق بالملف كله.","note":"صراحة بلباقة"},{"who":"them","name":"Client","en":"Really? I thought bigger numbers looked better.","ar":"حقاً؟ ظننت أن الأرقام الأكبر تبدو أفضل.","note":"يستغرب"},{"who":"you","en":"To an investor, maybe — but a lender reads for risk, not optimism. An aggressive hockey-stick projection signals you don't understand your own business. Conservative and credible wins.","ar":"لمستثمر، ربما — لكن المقرض يقرأ بحثاً عن المخاطر لا التفاؤل. توقّع صاروخي عدواني يُشير إلى أنك لا تفهم نشاطك. المتحفظ والموثوق يفوز.","note":"يشرح منطق المقرض"},{"who":"them","name":"Client","en":"So what growth rate should I use?","ar":"إذاً أي معدل نمو أستخدم؟","note":"يطلب التوجيه"},{"who":"you","en":"One we can defend with industry data and your own history. A realistic number the business can beat is far more powerful than a big one it can't.","ar":"واحد نستطيع الدفاع عنه ببيانات القطاع وتاريخك. رقم واقعي يستطيع النشاط تجاوزه أقوى بكثير من رقم كبير لا يستطيع.","note":"يوجّه للواقعية"},{"who":"you","en":"Let me anchor the projections in real benchmarks so the bank trusts every number.","ar":"دعني أربط التوقعات بمعايير حقيقية ليثق البنك بكل رقم.","note":"الخطوة التالية"}]},{"id":"cv32","icon":"😤","title":"Handling an Upset Client","col":"#AD1457","tag":"عام","sub":"عميل غاضب بسبب تأخّر","lines":[{"who":"them","name":"Client","en":"This is taking way too long. You said a week and it's been ten days. I'm frustrated.","ar":"هذا يستغرق وقتاً طويلاً جداً. قلت أسبوعاً ومرّت عشرة أيام. أنا محبط.","note":"غاضب بسبب التأخّر"},{"who":"you","en":"You're right to be frustrated, and I owe you a straight explanation. The delay is on me, and I'm not going to make excuses.","ar":"لك الحق أن تكون محبطاً، وأنا مدين لك بتفسير صريح. التأخير خطئي، ولن أختلق الأعذار.","note":"يتحمّل المسؤولية بلا دفاعية"},{"who":"them","name":"Client","en":"So what happened?","ar":"إذاً ماذا حدث؟","note":"يطلب التفسير"},{"who":"you","en":"When I reviewed your financials, I found a gap that would have gotten the file rejected. I chose to fix it properly rather than deliver something that would fail. I should have called you to explain that.","ar":"حين راجعت قوائمك، وجدت فجوة كانت ستتسبّب في رفض الملف. اخترت إصلاحها بشكل صحيح بدل تسليم شيء سيفشل. كان عليّ الاتصال بك لأشرح ذلك.","note":"يشرح + يعترف بالخطأ"},{"who":"them","name":"Client","en":"Okay… I'd rather have it right than fast, I guess.","ar":"حسناً... أفضّل أن يكون صحيحاً على أن يكون سريعاً، أظن.","note":"يهدأ"},{"who":"you","en":"That's exactly the right call, and I appreciate your patience. You'll have the finished file by tomorrow, and I'll keep you updated every step from here.","ar":"ذلك القرار الصحيح تماماً، وأقدّر صبرك. سيصلك الملف المكتمل بحلول الغد، وسأُبقيك على اطلاع بكل خطوة من هنا.","note":"حل + التزام بالتواصل"}]},{"id":"cv33","icon":"🎉","title":"Celebrating a Win","col":"#00838F","tag":"عام","sub":"عميل حصل على الموافقة — لحظة احتفال","lines":[{"who":"them","name":"Client","en":"We got it! The bank approved the full amount. I honestly didn't think we'd make it.","ar":"حصلنا عليه! البنك اعتمد المبلغ الكامل. صراحةً لم أظن أننا سننجح.","note":"يشارك خبر الموافقة"},{"who":"you","en":"That's fantastic news — congratulations! You did the hard work of building a great business; we just told the story the right way.","ar":"هذا خبر رائع — مبارك! أنت أنجزت العمل الصعب ببناء نشاط رائع؛ نحن فقط روينا القصة بالطريقة الصحيحة.","note":"يحتفل + يُرجع الفضل للعميل"},{"who":"them","name":"Client","en":"I couldn't have done it without the file you put together. It made all the difference.","ar":"ما كنت لأنجح دون الملف الذي جهّزته. أحدث كل الفرق.","note":"يشكر"},{"who":"you","en":"That means a lot to hear. Seeing a deal come together like this is exactly why I do this work.","ar":"سماع ذلك يعني الكثير. رؤية صفقة تكتمل هكذا هو تحديداً سبب قيامي بهذا العمل.","note":"يقدّر اللحظة"},{"who":"them","name":"Client","en":"I'll definitely be recommending you to everyone I know.","ar":"سأوصي بك قطعاً لكل من أعرف.","note":"يعد بالإحالة"},{"who":"you","en":"I'd be grateful for that. And whenever the next stage of growth comes, you know where to find me. Congratulations again.","ar":"سأكون ممتناً لذلك. وحين تأتي مرحلة النمو القادمة، تعرف أين تجدني. مبارك مجدداً.","note":"يفتح باب المستقبل"}]},{"id":"cv34","icon":"📧","title":"Cold Outreach Reply","col":"#558B2F","tag":"عام","sub":"ترد على عميل محتمل تواصل أولاً","lines":[{"who":"them","name":"Prospect","en":"Hi, I saw your profile. I might need help with a loan but I'm not really sure what I need yet. Is that okay?","ar":"مرحباً، رأيت ملفك. قد أحتاج مساعدة في قرض لكنني لست متأكداً بعد ممّا أحتاجه. هل ذلك مقبول؟","note":"عميل محتمل غير محدّد"},{"who":"you","en":"Absolutely — that's actually a great place to start. Most people come to me not quite sure what they need, and figuring that out is part of the job.","ar":"بالتأكيد — تلك في الواقع نقطة بداية رائعة. معظم الناس يأتون إليّ غير متأكدين تماماً ممّا يحتاجون، ومعرفة ذلك جزء من العمل.","note":"يطمئن + يرحّب"},{"who":"them","name":"Prospect","en":"Okay, good. I have a small business and I want to grow but I don't know if I should borrow.","ar":"حسناً، جيد. لديّ نشاط صغير وأريد أن أنمو لكنني لا أعرف إن كان عليّ الاقتراض.","note":"يوضّح وضعه"},{"who":"you","en":"Let's start there. A quick fifteen-minute call would help me understand your business and tell you honestly whether borrowing makes sense — and if so, what kind.","ar":"فلنبدأ من هناك. مكالمة سريعة خمس عشرة دقيقة ستساعدني على فهم نشاطك وإخبارك بصدق إن كان الاقتراض منطقياً — وإن كان، فأي نوع.","note":"يقترح مكالمة تشخيص"},{"who":"them","name":"Prospect","en":"That sounds low-pressure. I like that.","ar":"يبدو بلا ضغط. يعجبني ذلك.","note":"يرتاح"},{"who":"you","en":"No pressure at all — by the end you'll know exactly where you stand, whether or not you work with me. When works for you?","ar":"بلا ضغط إطلاقاً — بنهايتها ستعرف بالضبط أين تقف، سواء عملت معي أم لا. متى يناسبك؟","note":"يغلق بلا ضغط"}]},{"id":"cv35","icon":"☀️","title":"Breaking the Ice","col":"#4A148C","tag":"عام","sub":"دردشة خفيفة قبل اجتماع عمل","lines":[{"who":"them","name":"David","en":"Beautiful weather today, isn't it? Finally feels like spring.","ar":"طقس جميل اليوم، أليس كذلك؟ أخيراً يبدو كالربيع.","note":"كسر جليد بالطقس"},{"who":"you","en":"It really is — I had to resist the urge to work from a park bench this morning.","ar":"فعلاً كذلك — اضطررت لمقاومة رغبة العمل من مقعد في الحديقة هذا الصباح.","note":"يتجاوب بخفّة"},{"who":"them","name":"David","en":"Ha, I know the feeling. So, how's business been treating you?","ar":"ها، أعرف الشعور. إذاً، كيف كان حال العمل معك؟","note":"ينتقل للعمل"},{"who":"you","en":"Busy, in a good way — a lot of business owners are looking at growth right now. How about you? How long have you been running your company?","ar":"مزدحم، بشكل جيد — كثير من أصحاب الأعمال ينظرون للنمو الآن. وأنت؟ منذ متى تدير شركتك؟","note":"يردّ + يبادل السؤال"},{"who":"them","name":"David","en":"About eight years now. It's been quite a ride.","ar":"نحو ثماني سنوات الآن. كانت رحلة حافلة.","note":"يشارك"},{"who":"you","en":"Eight years is a real milestone — most businesses don't make it that far. That tells me you're doing something right. Shall we dig into what brought you here today?","ar":"ثماني سنوات إنجاز حقيقي — معظم الأنشطة لا تصمد لذلك الحد. ذلك يخبرني أنك تفعل شيئاً صحيحاً. هل نبدأ بما أتى بك اليوم؟","note":"إطراء + انتقال للموضوع"}]},{"id":"cv36","icon":"🙏","title":"Apologizing for a Mistake","col":"#BF360C","tag":"عام","sub":"تعتذر عن خطأ في أرقام سلّمتها","lines":[{"who":"you","en":"I need to flag something before you submit. I found an error in the figures I sent — one of the totals was off, and I want to correct it.","ar":"أحتاج للإشارة لأمر قبل أن تقدّم. وجدت خطأً في الأرقام التي أرسلتها — أحد المجاميع كان غير صحيح، وأريد تصحيحه.","note":"يبادر بالاعتراف"},{"who":"them","name":"Client","en":"Wait, an error? I was about to send it to the bank.","ar":"لحظة، خطأ؟ كنت على وشك إرساله للبنك.","note":"قلق"},{"who":"you","en":"I'm glad I caught it in time, and I'm sorry it happened. That's on me — I should have caught it in my own review.","ar":"يسعدني أنني التقطته في الوقت المناسب، وآسف لحدوثه. ذلك خطئي — كان عليّ التقاطه في مراجعتي.","note":"اعتذار + تحمّل مسؤولية"},{"who":"them","name":"Client","en":"Does it change the overall picture?","ar":"هل يغيّر الصورة العامة؟","note":"يسأل عن الأثر"},{"who":"you","en":"Not materially — the corrected number actually strengthens your DSCR slightly. But accuracy is non-negotiable in front of a lender, so I've rechecked every figure in the file.","ar":"ليس جوهرياً — الرقم المُصحّح فعلاً يقوّي الـ DSCR لديك قليلاً. لكن الدقة غير قابلة للتفاوض أمام مقرض، لذا أعدت فحص كل رقم في الملف.","note":"يطمئن + يثبت الالتزام"},{"who":"them","name":"Client","en":"I appreciate you being upfront about it.","ar":"أقدّر صراحتك بشأنه.","note":"يتقبّل"},{"who":"you","en":"Always — you should never hear about a mistake from the bank. The corrected file is on its way now.","ar":"دائماً — يجب ألا تسمع عن خطأ من البنك أبداً. الملف المُصحّح في طريقه الآن.","note":"يعيد بناء الثقة"}]},{"id":"cv37","icon":"📅","title":"Rescheduling a Meeting","col":"#00838F","tag":"عام","sub":"تحتاج تأجيل موعد دون إزعاج","lines":[{"who":"them","name":"Client","en":"Just confirming we're still on for our call at three today?","ar":"فقط أؤكّد أننا ما زلنا على موعد مكالمتنا الثالثة اليوم؟","note":"يؤكّد الموعد"},{"who":"you","en":"Thanks for checking. I actually need to ask a favor — something urgent came up. Could we push to four, or move it to tomorrow morning?","ar":"شكراً للتأكيد. أحتاج فعلاً لطلب معروف — استجدّ أمر عاجل. هل يمكننا التأجيل للرابعة، أو نقله لصباح الغد؟","note":"يطلب التأجيل بأدب"},{"who":"them","name":"Client","en":"Four doesn't work for me, but tomorrow morning could.","ar":"الرابعة لا تناسبني، لكن صباح الغد قد ينفع.","note":"يقترح بديلاً"},{"who":"you","en":"Tomorrow morning is perfect. Would nine or ten suit you better?","ar":"صباح الغد ممتاز. هل التاسعة أم العاشرة أنسب لك؟","note":"يحدّد الوقت"},{"who":"them","name":"Client","en":"Let's say ten.","ar":"فلنقل العاشرة.","note":"يتفق"},{"who":"you","en":"Ten it is — I'll send a calendar invite to confirm. Thanks for being flexible, I really appreciate it.","ar":"العاشرة إذاً — سأرسل دعوة تقويم للتأكيد. شكراً لمرونتك، أقدّرها حقاً.","note":"يؤكّد + يشكر"}]},{"id":"cv38","icon":"🤝","title":"Handing Off to a Colleague","col":"#0277BD","tag":"عام","sub":"تحوّل عميلاً لمتخصص آخر تثق به","lines":[{"who":"them","name":"Client","en":"This has been great, but I also need someone to handle the legal side of the acquisition. Can you do that too?","ar":"كان هذا رائعاً، لكنني أحتاج أيضاً لمن يتولّى الجانب القانوني للاستحواذ. هل يمكنك ذلك أيضاً؟","note":"يطلب خدمة قانونية"},{"who":"you","en":"The legal side is critical, and you want a specialist for it — that's outside what I do, but I work with an excellent acquisition attorney.","ar":"الجانب القانوني حاسم، وتريد متخصصاً له — ذلك خارج ما أفعله، لكنني أعمل مع محامية استحواذ ممتازة.","note":"يوضّح حدوده + يقدّم بديلاً"},{"who":"them","name":"Client","en":"Could you connect us?","ar":"هل يمكنك توصيلنا؟","note":"يطلب التعريف"},{"who":"you","en":"Of course. I'll make a warm introduction and brief her on where your deal stands, so you don't have to start from scratch.","ar":"بالطبع. سأُجري تعريفاً وأُطلعها على وضع صفقتك، حتى لا تبدأ من الصفر.","note":"يقدّم تعريفاً مُجهّزاً"},{"who":"them","name":"Client","en":"That's really helpful — saves me a lot of explaining.","ar":"ذلك مفيد حقاً — يوفّر عليّ الكثير من الشرح.","note":"يقدّر"},{"who":"you","en":"That's the idea. She handles the legal, I handle the financing, and we'll keep each other in the loop so nothing falls through the cracks.","ar":"تلك هي الفكرة. هي تتولّى القانوني، وأنا أتولّى التمويل، وسنُبقي بعضنا على اطلاع حتى لا يضيع شيء.","note":"يطمئن على التنسيق"}]},{"id":"cv39","icon":"🚪","title":"Wrapping Up a Meeting","col":"#33691E","tag":"عام","sub":"تُنهي اجتماعاً بوضوح والتزامات","lines":[{"who":"you","en":"We've covered a lot of ground today. Before we wrap up, let me summarize the next steps so we're aligned.","ar":"غطّينا الكثير اليوم. قبل أن ننهي، دعني ألخّص الخطوات التالية حتى نكون متفقين.","note":"يبدأ الإغلاق"},{"who":"them","name":"Client","en":"Yes, please — I want to make sure I know what's expected.","ar":"نعم، من فضلك — أريد التأكد أنني أعرف المتوقّع.","note":"يرحّب"},{"who":"you","en":"You'll send me the bank statements and tax returns by Friday. I'll build the first draft of the model and the memo, and we'll meet again next week to review.","ar":"سترسل لي الكشوف البنكية والإقرارات الضريبية بحلول الجمعة. سأبني المسودة الأولى للنموذج والمذكرة، ونلتقي الأسبوع القادم للمراجعة.","note":"يوزّع المهام والمواعيد"},{"who":"them","name":"Client","en":"Got it. And if I have questions before then?","ar":"فهمت. وإن كانت لديّ أسئلة قبل ذلك؟","note":"يسأل عن التواصل"},{"who":"you","en":"Reach out anytime — I'd rather you ask than wonder. I'll also send a written recap of everything we agreed today so you have it in one place.","ar":"تواصل في أي وقت — أفضّل أن تسأل على أن تتساءل. سأرسل أيضاً ملخّصاً مكتوباً لكل ما اتفقنا عليه اليوم ليكون لديك في مكان واحد.","note":"يفتح التواصل + ملخّص"},{"who":"them","name":"Client","en":"Perfect. Thanks for a productive meeting.","ar":"ممتاز. شكراً على اجتماع مثمر.","note":"يختم إيجاباً"},{"who":"you","en":"Likewise — I'm looking forward to getting started. Talk soon.","ar":"وأنا كذلك — أتطلّع للبدء. نتحدث قريباً.","note":"إغلاق ودّي"}]},{"id":"cv40","icon":"💬","title":"Clarifying Expectations","col":"#AD1457","tag":"عام","sub":"تضبط توقعات عميل عن المدة والنتيجة","lines":[{"who":"them","name":"Client","en":"So once you build the model, the bank approves us right away, right?","ar":"إذاً بمجرد بنائك النموذج، يعتمدنا البنك فوراً، صحيح؟","note":"توقّع غير واقعي"},{"who":"you","en":"I want to set the right expectation here, because it matters. A great file dramatically improves your odds — but no one can guarantee an approval, and I'd be wary of anyone who does.","ar":"أريد ضبط التوقّع الصحيح هنا، لأنه يهمّ. ملف رائع يحسّن فرصك بشكل كبير — لكن لا أحد يستطيع ضمان موافقة، وسأكون حذراً من أي شخص يفعل.","note":"يضبط التوقّع بصدق"},{"who":"them","name":"Client","en":"Oh. So what does the model actually do for me?","ar":"آه. إذاً ماذا يفعل النموذج لي فعلاً؟","note":"يسأل عن القيمة"},{"who":"you","en":"It makes your file the easiest possible 'yes' — it answers the lender's questions before they ask, and presents your business the way an underwriter wants to see it. That's what moves the odds in your favor.","ar":"يجعل ملفك أسهل \"نعم\" ممكنة — يُجيب أسئلة المقرض قبل أن يسألها، ويعرض نشاطك بالطريقة التي يريد المُكتتِب رؤيتها. ذلك ما يُرجّح الفرص لصالحك.","note":"يوضّح القيمة الحقيقية"},{"who":"them","name":"Client","en":"And how long does the whole process usually take?","ar":"وكم تستغرق العملية كلها عادةً؟","note":"يسأل عن المدة"},{"who":"you","en":"Building the file is the fast part. The lender's own review takes its own time, which varies. I'll keep you realistic at every stage so there are no surprises.","ar":"بناء الملف هو الجزء السريع. مراجعة المقرض نفسه تأخذ وقتها، ويتفاوت. سأُبقيك واقعياً في كل مرحلة حتى لا تكون هناك مفاجآت.","note":"يوضّح المدة بصدق"},{"who":"you","en":"My job is to control everything we can control, and prepare you for everything we can't. Let's get started.","ar":"مهمتي التحكّم في كل ما نستطيع التحكّم فيه، وتجهيزك لكل ما لا نستطيع. فلنبدأ.","note":"إغلاق واثق"}]}]};'use strict';
/* ═══════════ 1. التخزين ═══════════ */
const KEY='bsp_v3', BK='bsp_bk_', LEG=['bsp_mastered','bsp_stats','bsp_convos'];
const Store={ok:true,corrupt:false,
  raw(k){try{return localStorage.getItem(k)}catch(e){this.ok=false;return null}},
  put(k,v){try{localStorage.setItem(k,v);return true}catch(e){this.ok=false;return false}},
  read(){const r=this.raw(KEY);
    if(r){try{const o=JSON.parse(r);if(o&&typeof o==='object')return o}catch(e){this.corrupt=true}}
    if(this.corrupt||!r){for(let i=1;i<=3;i++){const b=this.raw(BK+i);
      if(b){try{const o=JSON.parse(b);if(o&&o.v){this.restored=i;return o}}catch(e){}}}}
    return null},
  write(o){if(this.corrupt&&!this.cleared)return;this.put(KEY,JSON.stringify(o))},
  backup(o){const t=Date.now();if(o.__bk&&t-o.__bk<6*36e5)return;o.__bk=t;const s=JSON.stringify(o);
    this.put(BK+'3',this.raw(BK+'2')||'');this.put(BK+'2',this.raw(BK+'1')||'');this.put(BK+'1',s)}};

/* ═══════════ 2. أدوات ═══════════ */
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function card(i){ i=+i;

/* الفاصل التالي حسب الدرجة والأداء */
function nextIvl(c,ok){
  const o=S.opts, base=[o.iv1,o.iv2,o.iv3,o.iv4,o.iv5];
  if(!ok) return 1;
  if(c.ivl<=0) return base[clamp(c.l,0,4)]||1;
  const grown=Math.round(c.ivl*clamp(c.ef,1.3,2.8));
  return clamp(grown,1,365)}

/* تحديث معامل السهولة */
function bumpEF(c,ok,score){
  const q = !ok?1 : (score>=90?5 : score>=75?4 : 3);
  c.ef=clamp(c.ef+(0.1-(5-q)*(0.08+(5-q)*0.02)),1.3,2.8)}

/* هل يمكن الترقية من 2 إلى 3؟ يشترط مرور يومين لضمان أنها ليست ذاكرة لحظية */
function canReachAuto(prevLast){
  if(!prevLast) return false;
  return dBetween(prevLast,TODAY)>=2}

/* تسجيل نتيجة مراجعة. mode: 'recognize' | 'withText' | 'noText' */
function grade(i,ok,mode,score){
  const c=card(i), before=c.l;
  const prevLast=c.last;            // لازم قبل التحديث وإلا شرط اليومين ما يتحققش أبداً
  c.last=TODAY; c.n+=ok?1:0; c.f+=ok?0:1;
  bumpEF(c,ok,score||0);
  if(ok){
    if(c.l===0) c.l=1;
    else if(c.l===1&&mode!=='recognize') c.l=2;
    else if(c.l===2&&mode==='noText'&&canReachAuto(prevLast)) c.l=3;
    else if(c.l===3&&c.ivl>=(S.opts.iv5||60)) c.l=4;
    c.ivl=nextIvl(c,true);
  }else{
    c.l=Math.max(0,c.l-1);
    c.ivl=1;
  }
  c.due=addDays(TODAY,Math.max(1,c.ivl));
  save();
  return {before,after:c.l,up:c.l>before,down:c.l<before}}

function dueIds(on){

function newIds(){
  return scopeIds().filter(i=>!S.srs[i])}
