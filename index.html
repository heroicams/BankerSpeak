<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>BankerSpeak Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="BankerSpeak Pro — تدريب الإنجليزي المصرفي المنطوق">
<style>
:root{
  --bg:#EEF3FB;--card:#fff;--ink:#1d2433;--muted:#6b7890;--line:#d7e0ef;--soft:#f5f8fc;
  --acc:#1F3864;--pri:#1F3864;--prit:#fff;--gold:#C49A2E;--goldt:#8a6a14;
  --ok:#2E7D32;--okbg:#E8F5E9;--bad:#C62828;--badbg:#FDECEA;--warn:#E65100;--warnbg:#FFF3E0;
  --hdr1:#1F3864;--hdr2:#2E4D7B;--shadow:0 2px 8px rgba(20,35,70,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1420;--card:#182031;--ink:#e6ebf5;--muted:#95a2ba;--line:#2a3550;--soft:#131b2a;
  --acc:#a9c3f0;--pri:#3d5a99;--prit:#fff;--gold:#d8b45a;--goldt:#e7c877;
  --ok:#6cc070;--okbg:#18301d;--bad:#f07a7a;--badbg:#3a1c1c;--warn:#ffab66;--warnbg:#3a2614;
  --hdr1:#121a2b;--hdr2:#1c2a46;--shadow:0 2px 10px rgba(0,0,0,.35);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);overscroll-behavior:none;overscroll-behavior-y:none}
/* app-feel hardening: no text selection, no long-press callouts, no drag, no double-tap zoom */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
a,img,w{-webkit-user-drag:none}
[data-go]{cursor:pointer}
body{font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:70px}
.hdr{background:linear-gradient(135deg,var(--hdr1),var(--hdr2));padding:10px 12px 8px;position:sticky;top:0;z-index:20;box-shadow:0 2px 14px rgba(0,0,0,.28)}
.hrow{display:flex;align-items:center;gap:6px}
.hb{background:rgba(255,255,255,.16);border:none;border-radius:9px;min-width:36px;height:34px;padding:0 10px;color:#fff;cursor:pointer;font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.ht{color:#fff;font-size:15.5px;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs{display:flex;flex-wrap:wrap;gap:2px 4px;margin-top:6px;font-size:11.5px;color:rgba(255,255,255,.72)}
.crumbs a{color:rgba(255,255,255,.9);border-bottom:1px dotted rgba(255,255,255,.4)}
.crumbs .sep{opacity:.5}
.pbar{height:3px;background:rgba(255,255,255,.16);border-radius:2px;margin-top:7px;overflow:hidden}
.pbar>div{height:100%;background:var(--gold);transition:width .4s}
.hstat{display:flex;justify-content:space-between;color:rgba(255,255,255,.78);font-size:11.5px;margin-top:6px}
.hstat b{color:var(--gold)}
.msg{margin:10px 12px 0;background:var(--warnbg);border-right:4px solid var(--warn);padding:10px 12px;font-size:12.5px;border-radius:8px;line-height:1.65}
.msg.bad{background:var(--badbg);border-color:var(--bad)}
.voiceline{padding:10px 14px 0;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wrap{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.h2{font-size:13px;font-weight:800;color:var(--acc);margin:6px 2px 0}
.sub{font-size:11.5px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow);border:1.5px solid transparent;display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.tile .ic{font-size:24px;line-height:1}
.tile .tt{font-weight:800;font-size:13px;color:var(--acc)}
.tile .ts{font-size:10.5px;color:var(--muted);margin-top:2px}
.tile.hot{border-color:var(--gold)}
.tile.wide{grid-column:1/-1}
.mod{background:var(--card);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow);border-right:5px solid var(--c);display:block}
.mrow{display:flex;align-items:center;gap:10px}
.mod .ic{font-size:26px}
.mod .mt{font-weight:800;font-size:14px}
.mod .me{font-size:11px;color:var(--muted);direction:ltr;text-align:right}
.mod .md{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.55}
.cnt{font-size:11px;color:var(--muted);white-space:nowrap}
.mbar{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.mbar>div{height:100%;background:var(--c)}
.grp{font-size:11.5px;font-weight:800;color:var(--muted);margin:8px 2px -2px;display:flex;align-items:center;gap:6px}
.grp:after{content:'';flex:1;height:1px;background:var(--line)}
.sec{background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;border-right:4px solid var(--c)}
.sec .ic{font-size:20px;width:26px;text-align:center}
.sec .st{font-weight:700;font-size:13.5px}
.sec .se{font-size:10.5px;color:var(--muted);direction:ltr;text-align:right}
.sec .sb{flex:1;min-width:0}
.badge{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:20px;white-space:nowrap}
.bg-core{background:#1565C022;color:#1565C0}.bg-new{background:#C628281f;color:#C62828}.bg-old{background:#6b78901f;color:var(--muted)}
@media (prefers-color-scheme:dark){.bg-core{color:#8fb8f0}.bg-new{color:#f0a0a0}}
.tb{display:flex;gap:6px;flex-wrap:wrap}
.t{background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--acc);cursor:pointer;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.t.on{background:var(--pri);color:var(--prit);border-color:var(--pri)}
.t.gold{background:var(--gold);color:#1d1d1d;border-color:var(--gold)}
.t.red{background:var(--bad);color:#fff;border-color:var(--bad)}
.t:disabled{opacity:.45}
.pc{background:var(--card);border-radius:13px;padding:11px 12px;box-shadow:var(--shadow);border-right:4px solid var(--c);transition:box-shadow .2s}
.pc.m{background:linear-gradient(0deg,var(--okbg),var(--card) 70%)}
.pc.hid{opacity:.5}
.pc.act{box-shadow:0 0 0 2px var(--gold),var(--shadow)}
.pc.flash{animation:fl 1.6s ease}
@keyframes fl{0%,40%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:var(--shadow)}}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:5px}
.chip{font-size:10px;font-weight:700;border-radius:6px;padding:2px 7px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
@media (prefers-color-scheme:dark){.chip{color:color-mix(in srgb,var(--c) 45%,#fff)}}
.star{color:var(--gold);font-weight:800;font-size:12px}
.tag{font-size:9.5px;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.tag.tc{color:#AD1457;border-color:#AD145744}
.tag.ts{color:var(--warn);border-color:var(--warn)}
.tag.ta{color:var(--goldt);border-color:var(--gold)}
.pid{margin-right:auto;font-size:9.5px;color:var(--muted);opacity:.7}
.en{font-size:16.5px;line-height:1.7;font-weight:500;color:var(--ink);text-align:left;margin:2px 0 6px}
.en w{cursor:pointer;border-radius:3px;padding:0 1px;border-bottom:1px dotted var(--line)}
.en w:active,.en w.say{background:color-mix(in srgb,var(--gold) 40%,transparent)}
.en.blur{filter:blur(6px);opacity:.6;cursor:pointer;user-select:none}
.rh{font-size:10.5px;color:var(--goldt);font-weight:700;margin:-2px 0 6px}
.memo{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:8px;padding:7px 9px;margin-bottom:5px;font-family:Georgia,'Times New Roman',serif;text-align:left;direction:ltr}
.memo b{font-family:system-ui,sans-serif;direction:rtl;display:block;text-align:right;font-size:11px;color:var(--acc)}
.say{font-size:11px;font-weight:800;color:var(--ok);margin-bottom:-2px}
.pr{font-size:12px;background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:6px 8px;margin-bottom:6px;unicode-bidi:plaintext;text-align:start;color:var(--acc)}
.ar{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:6px}
.arbtn{background:none;border:1px dashed var(--line);color:var(--muted);border-radius:7px;font-size:11px;padding:3px 9px;margin-bottom:6px;cursor:pointer}
.note{font-size:11.5px;color:var(--ink);opacity:.85;background:var(--warnbg);border-radius:7px;padding:5px 8px;margin-bottom:7px;line-height:1.6}
.br{display:flex;gap:6px}
.b{border:none;border-radius:9px;padding:9px 6px;cursor:pointer;font-size:13px;font-weight:700;background:var(--soft);color:var(--acc);min-width:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.b.bp{flex:1;background:color-mix(in srgb,var(--c) 13%,var(--card));color:var(--ink)}
.b.bp.on{background:var(--gold);color:#1d1d1d;border-color:var(--gold)}
.b.bm{background:var(--okbg);color:var(--ok)}
.b.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.br2{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.s{background:none;border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:11px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.s.on{color:var(--goldt);border-color:var(--gold);font-weight:700}
.pager{display:flex;gap:8px}
.pager a{flex:1;background:var(--card);border-radius:10px;padding:10px;text-align:center;font-size:12px;font-weight:700;color:var(--acc);box-shadow:var(--shadow)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px}
.box{background:var(--card);border-radius:13px;padding:12px;box-shadow:var(--shadow)}
.box h3{margin:0 0 6px;font-size:14px;color:var(--acc)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.kv>div{background:var(--soft);border-radius:10px;padding:9px 6px;text-align:center}
.kv b{display:block;font-size:18px}
.kv span{font-size:10px;color:var(--muted)}
.big{font-size:20px;line-height:1.6;font-weight:600;text-align:left;direction:ltr;margin:4px 0}
.bigar{font-size:16px;line-height:1.7;margin:4px 0;color:var(--muted)}
.statusl{font-size:13px;font-weight:800;color:var(--acc);min-height:20px}
.cdbar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.cdbar>div{height:100%;background:var(--gold);width:0}
.chunks{display:flex;flex-wrap:wrap;gap:5px;direction:ltr;margin-top:6px}
.chunks span{background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:3px 7px;font-size:13px}
.chunks span.on{background:var(--gold);color:#1d1d1d;border-color:var(--gold)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mode{background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:10px;cursor:pointer;text-align:right;color:var(--ink)}
.mode b{display:block;font-size:13px;color:var(--acc)}
.mode span{font-size:10.5px;color:var(--muted)}
.mode.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.ctl{display:flex;gap:8px;justify-content:center}
.ctl button{width:54px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;color:var(--acc)}
.ctl button.main{background:var(--pri);color:var(--prit);width:70px}
.acima{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.acima div{border-radius:9px;padding:6px 2px;text-align:center;font-size:10px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.acima div b{display:block;font-size:15px}
.acima div.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.acima div.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.live{min-height:48px;background:var(--soft);border:1px dashed var(--line);border-radius:9px;padding:8px;direction:ltr;text-align:left;font-size:13.5px}
.mrows{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mrows div{background:var(--soft);border-radius:9px;padding:7px 4px;text-align:center}
.mrows b{display:block;font-size:16px}
.mrows span{font-size:9.5px;color:var(--muted)}
.lvl{display:flex;gap:6px}
.lvl a{flex:1;text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;font-size:12px;font-weight:700;color:var(--muted)}
.lvl a.on{border-color:var(--pri);color:var(--acc);box-shadow:0 0 0 1px var(--pri)}
.dots{color:var(--gold);letter-spacing:1px;font-size:11px}
textarea.io,input.in,select.in{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px;font-size:13px;background:var(--card);color:var(--ink);font-family:inherit}
textarea.io{height:110px;font-family:ui-monospace,monospace;font-size:11px;direction:ltr}
textarea.ta{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:9px;padding:9px;font-size:14px;background:var(--card);color:var(--ink);direction:ltr;font-family:inherit}
label.row,.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border-bottom:none}
input[type=range]{width:150px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);color:var(--ink);border-radius:16px;padding:16px;max-width:420px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222c;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:60;transition:opacity .4s;pointer-events:none;max-width:90%;text-align:center}
.bub{max-width:92%;border-radius:14px;padding:9px 11px;box-shadow:var(--shadow);background:var(--card)}
.bub.you{border-right:3px solid var(--acc);align-self:flex-start}
.bub.oth{border-left:3px solid var(--c);align-self:flex-end;background:var(--soft)}
.bub .who{font-size:11px;font-weight:800;margin-bottom:3px;color:var(--acc)}
.cvl{display:flex;flex-direction:column}
.sim{font-size:11.5px;padding:6px 8px;border-radius:8px;margin-top:4px}
.sim.dup{background:var(--badbg);color:var(--bad)}.sim.near{background:var(--warnbg);color:var(--warn)}.sim.okk{background:var(--okbg);color:var(--ok)}
.hist{width:100%;border-collapse:collapse;font-size:11.5px}
.hist td,.hist th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:center}
.hist th{color:var(--muted);font-weight:700}
details summary{cursor:pointer;font-weight:700;color:var(--acc);font-size:13px;padding:4px 0}
mark{background:color-mix(in srgb,var(--gold) 45%,transparent);color:inherit;border-radius:3px}
</style>
</head>
<body>
<div id="app"><div id="hdr"></div><div id="view"></div></div>

فق النقدي ورأس المال","col":"#1B5E20","g":"old","kind":"speak"},{"id":"Bd","mod":"M3","icon":"🔐","en":"Collateral & Guarantees","ar":"الضمانات والكفالات","col":"#4A148C","g":"old","kind":"speak"},{"id":"Bf","mod":"M3","icon":"🔮","en":"Projections & Assumptions","ar":"التوقعات والافتراضات","col":"#006064","g":"old","kind":"speak"},{"id":"Bi","mod":"M3","icon":"🔎","en":"Due Diligence","ar":"الفحص النافي للجهالة","col":"#37474F","g":"old","kind":"speak"},{"id":"Bm","mod":"M3","icon":"🏭","en":"Industry Analysis","ar":"تحليل القطاع","col":"#00695C","g":"old","kind":"speak"},{"id":"J","mod":"M4","icon":"🏛️","en":"Lender Language","ar":"لغة المقرّض","col":"#880E4F","g":"old","kind":"speak"},{"id":"Bl","mod":"M4","icon":"📝","en":"Underwriting Narrative","ar":"سرد الاكتتاب","col":"#311B92","g":"old","kind":"speak"},{"id":"Bk","mod":"M4","icon":"🎤","en":"Pitch & Memo","ar":"العرض والمذكرة","col":"#4527A0","g":"old","kind":"speak"},{"id":"Be","mod":"M4","icon":"⚠️","en":"Risk & Mitigation","ar":"المخاطر والتخفيف","col":"#B71C1C","g":"old","kind":"speak"},{"id":"Bh","mod":"M5","icon":"🏗️","en":"Loan Structuring","ar":"هيكلة القرض","col":"#E65100","g":"old","kind":"speak"},{"id":"Bj","mod":"M5","icon":"💸","en":"Investor & Equity","ar":"المستثمرون وحقوق الملكية","col":"#880E4F","g":"old","kind":"speak"},{"id":"Bn","mod":"M5","icon":"🤝","en":"Negotiation & Terms","ar":"التفاوض والشروط","col":"#BF360C","g":"old","kind":"speak"},{"id":"Bc","mod":"M6","icon":"🏦","en":"SBA Programs","ar":"برامج الـ SBA","col":"#1A237E","g":"old","kind":"speak"},{"id":"Np","mod":"M7","icon":"🔢","en":"Money Talk & Pronunciation","ar":"نطق الأرقام والتفاوض المالي","col":"#004D40","g":"old","kind":"speak"},{"id":"Gh","mod":"M7","icon":"🔢","en":"Numbers & Money","ar":"الأرقام والمال","col":"#33691E","g":"old","kind":"speak"},{"id":"E","mod":"M8","icon":"🤝","en":"Trust Building","ar":"بناء الثقة","col":"#6A1B9A","g":"old","kind":"speak"},{"id":"P","mod":"M8","icon":"💪","en":"Confidence","ar":"ثقة مهنية","col":"#283593","g":"old","kind":"speak"},{"id":"M","mod":"M8","icon":"🤙","en":"Agreement","ar":"موافقة وتفاهم","col":"#558B2F","g":"old","kind":"speak"},{"id":"S","mod":"M8","icon":"⚖️","en":"Agree / Disagree","ar":"الموافقة والرفض","col":"#1A237E","g":"old","kind":"speak"},{"id":"X","mod":"M8","icon":"🙏","en":"Gratitude & Apology","ar":"الشكر والاعتذار","col":"#BF360C","g":"old","kind":"speak"},{"id":"W","mod":"M8","icon":"🚪","en":"Ending Conversations","ar":"إنهاء المحادثة","col":"#3E2723","g":"old","kind":"speak"},{"id":"Z","mod":"M8","icon":"🤲","en":"Help & Support","ar":"المساعدة والتشجيع","col":"#2E7D32","g":"old","kind":"speak"},{"id":"Gb","mod":"M8","icon":"📅","en":"Meetings & Scheduling","ar":"الاجتماعات والمواعيد","col":"#00838F","g":"old","kind":"speak"},{"id":"Gc","mod":"M8","icon":"💭","en":"Opinions & Views","ar":"الآراء ووجهات النظر","col":"#558B2F","g":"old","kind":"speak"},{"id":"Gd","mod":"M8","icon":"😊","en":"Feelings & Reactions","ar":"المشاعر وردود الفعل","col":"#AD1457","g":"old","kind":"speak"},{"id":"Ge","mod":"M8","icon":"🧩","en":"Problem Solving","ar":"حل المشكلات","col":"#283593","g":"old","kind":"speak"},{"id":"Gf","mod":"M8","icon":"🎯","en":"Persuasion & Influence","ar":"الإقناع والتأثير","col":"#D84315","g":"old","kind":"speak"},{"id":"Gg","mod":"M8","icon":"🌐","en":"Networking","ar":"التشبيك والعلاقات","col":"#6A1B9A","g":"old","kind":"speak"},{"id":"Ga","mod":"MW","icon":"✉️","en":"Email & Written","ar":"البريد والكتابة","col":"#0277BD","g":"old","kind":"write"}],"PH":[{"i":1,"c":"A","s":1,"en":"Thanks for hopping on — I know your time is tight, so let's make this count.","ar":"شكراً لانضمامك — أعرف أن وقتك ضيّق، فلنستغلّ هذه الدقائق جيداً."},{"i":2,"c":"A","s":1,"en":"Before we dive in, give me the thirty-second version: what are you trying to get funded, and by when?","ar":"قبل أن نبدأ، أعطني النسخة المختصرة: ما الذي تريد تمويله، ومتى؟"},{"i":3,"c":"A","s":0,"en":"I've had a quick look at what you sent over, and I already have a couple of thoughts — but I'd rather hear it from you first.","ar":"ألقيت نظرة سريعة على ما أرسلته، ولديّ ملاحظات — لكنني أفضّل سماعها منك أولاً."},{"i":4,"c":"A","s":0,"en":"Let's keep this practical. By the end of these fifteen minutes, you'll know exactly whether I'm the right fit.","ar":"فلنُبقِ الأمر عملياً. بنهاية هذه الدقائق ستعرف إن كنت الشخص المناسب."},{"i":5,"c":"A","s":1,"en":"Walk me through the deal as if I were the lender sitting across the table from you.","ar":"اشرح لي الصفقة كأنني المقرض الجالس أمامك على الطاولة."},{"i":6,"c":"B","s":0,"en":"What's the use of funds, specifically — working capital, equipment, an acquisition, or real estate?","ar":"ما الغرض من التمويل تحديداً — رأس مال عامل، معدات، استحواذ، أم عقارات؟"},{"i":7,"c":"B","s":0,"en":"Who's the lender you're targeting, and have they given you any signal on what they want to see?","ar":"مَن المقرض الذي تستهدفه، وهل أعطاك إشارة عمّا يريد رؤيته؟"},{"i":8,"c":"B","s":0,"en":"What's your repayment going to come from — existing cash flow, or projected growth?","ar":"من أين سيأتي السداد — من التدفق النقدي الحالي، أم من النمو المتوقع؟"},{"i":9,"c":"B","s":1,"en":"Where do you feel the file is weakest right now? That's usually where I add the most value.","ar":"أين تشعر أن الملف أضعف ما يكون الآن؟ هذا حيث أضيف أكبر قيمة."},{"i":10,"c":"B","s":0,"en":"Has anyone looked at this from the lender's side yet, or is this the first pass?","ar":"هل نظر أحد إلى هذا من جهة المقرض بعد، أم أنها المحاولة الأولى؟"},{"i":11,"c":"B","s":0,"en":"What happens to the business if this funding doesn't come through?","ar":"ماذا يحدث للنشاط إن لم يتم هذا التمويل؟"},{"i":12,"c":"C","s":0,"en":"Here's what a credit committee is going to flag immediately.","ar":"إليك ما ستلاحظه لجنة الائتمان فوراً."},{"i":13,"c":"C","s":0,"en":"The numbers aren't the problem — the way they're presented is. Lenders read for risk, not for optimism.","ar":"الأرقام ليست المشكلة — بل طريقة عرضها. المقرضون يقرأون بحثاً عن المخاطر لا التفاؤل."},{"i":14,"c":"C","s":0,"en":"Your DSCR looks fine on paper, but the committee will stress-test it, and that's where this falls short.","ar":"الـ DSCR يبدو جيداً على الورق، لكن اللجنة ستختبره تحت الضغط، وهنا يقصُر الملف."},{"i":15,"c":"C","s":1,"en":"What's not in this file is louder than what is. Let me show you what's missing.","ar":"ما هو غير موجود في هذا الملف أعلى صوتاً مما هو موجود. دعني أريك ما ينقص."},{"i":16,"c":"C","s":1,"en":"A lender doesn't fund a business — they fund a repayment story. Right now, your story has a gap.","ar":"المقرض لا يموّل نشاطاً — بل يموّل قصة سداد. قصتك الآن بها فجوة."},{"i":17,"c":"C","s":1,"en":"I'm not going to build you a model that works. I'm going to build you a file that gets approved.","ar":"لن أبني لك نموذجاً يعمل. سأبني لك ملفاً يُعتمَد."},{"i":18,"c":"C","s":0,"en":"The strength here is real, but it's buried. My job is to make the credit officer see it in the first ninety seconds.","ar":"القوة هنا حقيقية لكنها مدفونة. مهمتي أن أجعل ضابط الائتمان يراها في أول تسعين ثانية."},{"i":19,"c":"C","s":1,"en":"I've sat on the other side of that table for eighteen years. I know exactly which questions kill a deal.","ar":"جلست على الجانب الآخر من تلك الطاولة لثمانية عشر عاماً. أعرف أي الأسئلة يقتل الصفقة."},{"i":20,"c":"D","s":0,"en":"Think of it as three layers: the model proves the numbers, the memo tells the story, and the package gets it across the line.","ar":"فكّر فيها كثلاث طبقات: النموذج يثبت الأرقام، والمذكرة تروي القصة، والحزمة تعبر بها خط النهاية."},{"i":21,"c":"D","s":0,"en":"The financial model is the entry point — but the real value is the credit lens I put on top of it.","ar":"النموذج المالي هو نقطة الدخول — لكن القيمة الحقيقية في العدسة الائتمانية التي أضعها فوقه."},{"i":22,"c":"D","s":0,"en":"Most freelancers stop at a clean spreadsheet. I take it all the way to a lender-ready decision document.","ar":"معظم المستقلين يتوقفون عند جدول نظيف. أنا آخذه إلى وثيقة قرار جاهزة للمقرض."},{"i":23,"c":"D","s":0,"en":"The Banker's View section is where I tell you, candidly, how a lender will see your deal — strengths, risks, and conditions.","ar":"قسم رؤية المصرفي هو حيث أخبرك بصراحة كيف سيرى المقرض صفقتك — نقاط القوة والمخاطر والشروط."},{"i":24,"c":"D","s":0,"en":"I'll give you the model, but I'll also give you the answers to the questions you haven't been asked yet.","ar":"سأعطيك النموذج، لكنني سأعطيك أيضاً إجابات الأسئلة التي لم تُسأل بعد."},{"i":25,"c":"D","s":0,"en":"For an SBA package, the order of the documents matters as much as the documents themselves.","ar":"في حزمة الـ SBA، ترتيب المستندات يهمّ بقدر المستندات نفسها."},{"i":26,"c":"E","s":1,"en":"I'm new to this platform — I'm not new to credit. I've reviewed hundreds of funding decisions.","ar":"أنا جديد على هذه المنصة — لست جديداً على الائتمان. راجعت مئات قرارات التمويل."},{"i":27,"c":"E","s":0,"en":"Fair question. Judge me on the work, not the profile — take a look at the sample and tell me if a lender would say no to it.","ar":"سؤال وجيه. احكم عليّ بالعمل لا بالملف — انظر إلى النموذج وأخبرني إن كان مقرض سيرفضه."},{"i":28,"c":"E","s":0,"en":"My reviews here are just getting started, but my track record in banking goes back eighteen years.","ar":"تقييماتي هنا في بدايتها، لكن سجلّي في البنوك يعود لثمانية عشر عاماً."},{"i":29,"c":"E","s":0,"en":"I'd rather under-promise and let the deliverable speak. Give me one project to prove it.","ar":"أفضّل أن أَعِد بأقل وأدع المُنتَج يتكلم. أعطني مشروعاً واحداً لأثبت ذلك."},{"i":30,"c":"E","s":0,"en":"You're not taking a risk on an unknown — you're getting a credit manager's eye at a freelancer's rate.","ar":"أنت لا تخاطر بمجهول — أنت تحصل على عين مدير ائتمان بسعر مستقل."},{"i":31,"c":"F","s":1,"en":"I hear you. Let me reframe it: what does it cost you if the deal gets declined and you have to start over?","ar":"أفهمك. دعني أعيد التأطير: كم يكلّفك إن رُفضت الصفقة واضطُررت للبدء من جديد؟"},{"i":32,"c":"F","s":0,"en":"My pricing reflects the approval — not the spreadsheet. A cheaper model that gets rejected is the expensive option.","ar":"سعري يعكس الموافقة — لا الجدول. النموذج الأرخص الذي يُرفض هو الخيار الأغلى."},{"i":33,"c":"F","s":0,"en":"I'm not the cheapest, and I won't pretend to be. I'm the one who knows what the committee is looking for.","ar":"لست الأرخص، ولن أدّعي ذلك. أنا من يعرف ما تبحث عنه اللجنة."},{"i":34,"c":"F","s":0,"en":"Let's scope it down to a Basic tier first — you can step up to the full package once you see the quality.","ar":"فلنبدأ بمستوى أساسي أصغر — يمكنك الترقّي للحزمة الكاملة عندما ترى الجودة."},{"i":35,"c":"F","s":0,"en":"The fee is a fraction of the funding you're trying to unlock. Let's keep that in proportion.","ar":"الأتعاب جزء يسير من التمويل الذي تحاول الحصول عليه. فلنضع ذلك في نصابه."},{"i":36,"c":"F","s":0,"en":"I can work within that budget, but let me be straight about what comes out of scope so there are no surprises.","ar":"أستطيع العمل ضمن هذه الميزانية، لكن دعني أوضّح ما سيخرج من النطاق حتى لا تكون هناك مفاجآت."},{"i":37,"c":"F","s":0,"en":"If price is the only concern, we can find a fit. If quality is the concern, that's where I shine.","ar":"إن كان السعر هو الهمّ الوحيد، يمكننا إيجاد حل. وإن كانت الجودة هي الهمّ، فهنا أتألّق."},{"i":38,"c":"G","s":1,"en":"Anyone can generate a model now. What they can't generate is the judgment of someone who's denied loans for a living.","ar":"أي أحد يستطيع توليد نموذج الآن. ما لا يستطيعون توليده هو حُكم شخص رفض القروض كمهنة."},{"i":39,"c":"G","s":0,"en":"An AI gives you a model that's technically correct. I give you a model that's persuasive to a real lender.","ar":"الذكاء الاصطناعي يعطيك نموذجاً صحيحاً تقنياً. أنا أعطيك نموذجاً مُقنِعاً لمقرض حقيقي."},{"i":40,"c":"G","s":0,"en":"The difference is accountability — I stand behind the credit logic, not just the formulas.","ar":"الفرق هو المساءلة — أنا أقف خلف المنطق الائتماني، لا المعادلات فقط."},{"i":41,"c":"G","s":0,"en":"Tools tell you what the numbers are. I tell you what the lender will do with them.","ar":"الأدوات تخبرك بما هي الأرقام. أنا أخبرك بما سيفعله المقرض بها."},{"i":42,"c":"G","s":0,"en":"I'm not competing on speed or price — I'm competing on getting you funded.","ar":"أنا لا أنافس على السرعة أو السعر — أنافس على حصولك على التمويل."},{"i":43,"c":"H","s":0,"en":"Let me make sure we're aligned on scope before we start — that's where most projects go sideways.","ar":"دعني أتأكد أننا متفقون على النطاق قبل أن نبدأ — فهنا تنحرف معظم المشاريع."},{"i":44,"c":"H","s":0,"en":"Here's what's included, and here's what would be a separate phase. I'd rather be clear up front.","ar":"هذا ما هو مشمول، وهذا ما سيكون مرحلة منفصلة. أفضّل الوضوح من البداية."},{"i":45,"c":"H","s":0,"en":"To do this properly, I'll need a few documents from you first — I'll send a short intake form.","ar":"لأنجز هذا بشكل صحيح، سأحتاج بعض المستندات منك أولاً — سأرسل استمارة قصيرة."},{"i":46,"c":"H","s":0,"en":"I'll build in two revision rounds. Beyond that, we'd treat it as a new scope.","ar":"سأُضمّن جولتي مراجعة. وما بعد ذلك نعتبره نطاقاً جديداً."},{"i":47,"c":"I","s":1,"en":"Here's what I'd suggest as the next step.","ar":"إليك ما أقترحه كخطوة تالية."},{"i":48,"c":"I","s":1,"en":"If that sounds right, I'll send over a short intake form and we can get started today.","ar":"إن بدا ذلك مناسباً، سأرسل استمارة قصيرة ويمكننا البدء اليوم."},{"i":49,"c":"I","s":0,"en":"Let me put a proposal together that reflects exactly what we discussed — you'll have it within the hour.","ar":"دعني أُعدّ عرضاً يعكس تماماً ما ناقشناه — سيصلك خلال ساعة."},{"i":50,"c":"I","s":0,"en":"Take your time on the decision. When you're ready, the deliverable will be too.","ar":"خذ وقتك في القرار. عندما تكون جاهزاً، سيكون المُنتَج جاهزاً أيضاً."},{"i":51,"c":"I","s":0,"en":"Let's start with the model, and once you see the credit lens, we can talk about the full package.","ar":"فلنبدأ بالنموذج، وعندما ترى العدسة الائتمانية، نتحدث عن الحزمة الكاملة."},{"i":52,"c":"J","s":0,"en":"We're presenting this as a medium-risk credit with a clear primary repayment source and adequate collateral coverage.","ar":"نقدّم هذا كائتمان متوسط المخاطر بمصدر سداد أساسي واضح وتغطية ضمانات كافية."},{"i":53,"c":"J","s":0,"en":"The global DSCR comes in at one-point-four times, which gives the committee comfortable headroom above the one-point-two-five benchmark.","ar":"الـ DSCR الكلي يبلغ 1.4 مرة، مما يعطي اللجنة هامشاً مريحاً فوق معيار الـ 1.25."},{"i":54,"c":"J","s":0,"en":"The principal mitigant for the concentration risk is a covenant requiring advance notice on any material contract change.","ar":"المُخفِّف الأساسي لخطر التركّز هو شرط يتطلب إشعاراً مسبقاً بأي تغيير جوهري في العقود."},{"i":55,"c":"J","s":0,"en":"On a stressed basis — a fifteen-percent revenue decline — the deal still services its debt.","ar":"على أساس مُجهَد — انخفاض إيراد بنسبة 15% — تظل الصفقة قادرة على خدمة دينها."},{"i":56,"c":"J","s":0,"en":"The use of funds is clean, the repayment is supported, and the collateral position is adequate.","ar":"استخدام الأموال واضح، والسداد مدعوم، ووضع الضمانات كافٍ."},{"i":57,"c":"K","s":1,"en":"That's a great question — let me think about that for a second.","ar":"سؤال ممتاز — دعني أفكّر في ذلك لحظة."},{"i":58,"c":"K","s":0,"en":"Good point. The way I'd look at that is…","ar":"نقطة جيدة. الطريقة التي أنظر بها لذلك هي…"},{"i":59,"c":"K","s":1,"en":"Let me make sure I understand — are you asking about the first option, or the second?","ar":"دعني أتأكد أنني فهمت — هل تسأل عن الخيار الأول أم الثاني؟"},{"i":60,"c":"K","s":0,"en":"Right, so — here's the short answer, and then I'll give you the longer one.","ar":"حسناً — إليك الإجابة المختصرة، ثم سأعطيك الأطول."},{"i":61,"c":"K","s":0,"en":"It depends — and let me tell you exactly what it depends on.","ar":"يعتمد على عدة أمور — ودعني أخبرك بالضبط على ماذا يعتمد."},{"i":62,"c":"K","s":0,"en":"I want to give you a precise answer, not a quick one — so let me frame it properly.","ar":"أريد أن أعطيك إجابة دقيقة لا سريعة — فدعني أصوغها بشكل صحيح."},{"i":63,"c":"L","s":0,"en":"Good morning — this is Ahmed, thanks for taking my call.","ar":"صباح الخير — معك أحمد، شكراً لتلقّيك مكالمتي."},{"i":64,"c":"L","s":0,"en":"It's a pleasure to finally connect with you.","ar":"يسعدني أن أتواصل معك أخيراً."},{"i":65,"c":"L","s":0,"en":"I appreciate you making the time today.","ar":"أقدّر تخصيصك الوقت اليوم."},{"i":66,"c":"L","s":0,"en":"Thanks for reaching out — I've been looking forward to this conversation.","ar":"شكراً لتواصلك — كنت أتطلّع لهذه المحادثة."},{"i":67,"c":"L","s":0,"en":"Let me quickly introduce myself and what I do.","ar":"دعني أعرّف بنفسي وبما أعمله بسرعة."},{"i":68,"c":"L","s":0,"en":"I look forward to working with you on this.","ar":"أتطلّع للعمل معك على هذا."},{"i":69,"c":"M","s":0,"en":"That makes a lot of sense.","ar":"هذا منطقي جداً."},{"i":70,"c":"M","s":0,"en":"Absolutely, I see your point.","ar":"بالتأكيد، أرى وجهة نظرك."},{"i":71,"c":"M","s":0,"en":"You're right — and that's exactly what I want to address.","ar":"أنت محقّ — وهذا تماماً ما أريد معالجته."},{"i":72,"c":"M","s":0,"en":"I completely agree with your assessment.","ar":"أتفق تماماً مع تقييمك."},{"i":73,"c":"M","s":0,"en":"That's a valid concern, and here's how I'd address it.","ar":"هذا قلق وجيه، وإليك كيف سأعالجه."},{"i":74,"c":"M","s":0,"en":"I hear you, and I think we can work through that.","ar":"أفهمك، وأعتقد أننا نستطيع تجاوز ذلك."},{"i":75,"c":"N","s":0,"en":"Just to make sure I have this right.","ar":"فقط لأتأكد أنني فهمت هذا صحيحاً."},{"i":76,"c":"N","s":0,"en":"Could you walk me through that in a bit more detail?","ar":"هل يمكنك شرح ذلك بمزيد من التفصيل؟"},{"i":77,"c":"N","s":1,"en":"When you say that, do you mean the first option — or the second?","ar":"عندما تقول ذلك، هل تعني الخيار الأول أم الثاني؟"},{"i":78,"c":"N","s":0,"en":"Can you give me a concrete example?","ar":"هل يمكنك إعطائي مثالاً عملياً؟"},{"i":79,"c":"N","s":0,"en":"I want to make sure I'm understanding you correctly — you're saying…","ar":"أريد التأكد أنني أفهمك صحيحاً — أنت تقول…"},{"i":80,"c":"N","s":0,"en":"So if I'm hearing you right, the core issue is…","ar":"إذاً إن كنت أسمعك صحيحاً، فالمشكلة الجوهرية هي…"},{"i":81,"c":"O","s":0,"en":"That actually connects directly to what I wanted to raise.","ar":"هذا يرتبط مباشرةً بما أردت طرحه."},{"i":82,"c":"O","s":0,"en":"Let me touch on something important here.","ar":"دعني أتطرّق لأمر مهم هنا."},{"i":83,"c":"O","s":0,"en":"Building on what you just said…","ar":"بناءً على ما قلته للتو…"},{"i":84,"c":"O","s":0,"en":"To summarize what we've covered so far…","ar":"لتلخيص ما غطّيناه حتى الآن…"},{"i":85,"c":"O","s":0,"en":"Before we wrap up, I want to flag one more thing.","ar":"قبل أن ننهي، أريد الإشارة لأمر أخير."},{"i":86,"c":"O","s":0,"en":"Let me shift gears for a moment.","ar":"دعني أنتقل لموضوع آخر للحظة."},{"i":87,"c":"P","s":0,"en":"Let me be direct with you.","ar":"دعني أكون صريحاً معك."},{"i":88,"c":"P","s":0,"en":"From my experience, the most effective approach here is…","ar":"من خبرتي، النهج الأكثر فاعلية هنا هو…"},{"i":89,"c":"P","s":0,"en":"In my professional judgment…","ar":"في تقديري المهني…"},{"i":90,"c":"P","s":0,"en":"I'll be transparent about that.","ar":"سأكون شفافاً بخصوص ذلك."},{"i":91,"c":"P","s":0,"en":"The way I see it…","ar":"كما أراها…"},{"i":92,"c":"P","s":0,"en":"I'd recommend we approach this carefully, and here's why.","ar":"أوصي بأن نتعامل مع هذا بحذر، وإليك السبب."},{"i":93,"c":"Q","s":1,"en":"Sorry, could you repeat that last part?","ar":"عذراً، هل يمكنك إعادة الجزء الأخير؟"},{"i":94,"c":"Q","s":1,"en":"You're breaking up a little — would you mind saying that again?","ar":"صوتك متقطّع قليلاً — هل تمانع قول ذلك مجدداً؟"},{"i":95,"c":"Q","s":0,"en":"Could you speak up just a bit? The line is a little weak.","ar":"هل يمكنك رفع صوتك قليلاً؟ الخط ضعيف بعض الشيء."},{"i":96,"c":"Q","s":1,"en":"I want to make sure I caught that correctly — did you say the loan amount was 250,000?","ar":"أريد التأكد أنني فهمت ذلك صحيحاً — هل قلت إن مبلغ القرض 250 ألف؟"},{"i":97,"c":"Q","s":0,"en":"Could you slow down just a touch? I want to get every detail right.","ar":"هل يمكنك التمهّل قليلاً؟ أريد أن أضبط كل تفصيلة."},{"i":98,"c":"Q","s":0,"en":"Apologies, I didn't quite follow — could you put it another way?","ar":"آسف، لم أتابع تماماً — هل يمكنك صياغتها بطريقة أخرى؟"},{"i":99,"c":"Q","s":1,"en":"I didn't catch that — could you say it one more time?","ar":"لم ألتقط ذلك — هل يمكنك قوله مرة أخرى؟"},{"i":100,"c":"Q","s":0,"en":"I'm not sure I'm familiar with that term — what do you mean exactly?","ar":"لست متأكداً أنني أعرف هذا المصطلح — ماذا تعني بالضبط؟"},{"i":101,"c":"Q","s":0,"en":"Bear with me for a second — there's a bit of background noise on my end.","ar":"تحمّلني لحظة — هناك بعض الضوضاء في الخلفية عندي."},{"i":102,"c":"Q","s":0,"en":"Just so I don't misquote you later, let me write that down.","ar":"حتى لا أنقل كلامك خطأ لاحقاً، دعني أدوّن ذلك."},{"i":103,"c":"Q","s":0,"en":"Do you speak — sorry, would you prefer we continue in English, or is there another language easier for you?","ar":"هل تتحدث — عذراً، هل تفضّل أن نكمل بالإنجليزية، أم هناك لغة أسهل لك؟"},{"i":104,"c":"R","s":1,"en":"Let me make sure I understand you correctly — you're saying the cash flow won't cover the new debt?","ar":"دعني أتأكد أنني فهمتك صحيحاً — تقول إن التدفق النقدي لن يغطّي الدين الجديد؟"},{"i":105,"c":"R","s":1,"en":"So if I'm hearing you right, the core issue is timing, not the amount.","ar":"إذاً إن كنت أسمعك صحيحاً، فالمشكلة الجوهرية هي التوقيت، لا المبلغ."},{"i":106,"c":"R","s":0,"en":"I think we might be talking about two different things — let me clarify what I meant.","ar":"أعتقد أننا قد نتحدث عن أمرين مختلفين — دعني أوضّح ما قصدته."},{"i":107,"c":"R","s":0,"en":"Just to avoid any confusion, when I say 'package,' I mean the full SBA file.","ar":"تجنّباً لأي لبس، عندما أقول \"حزمة\"، أعني ملف الـ SBA الكامل."},{"i":108,"c":"R","s":0,"en":"Let me back up — I don't think I explained that clearly.","ar":"دعني أعود خطوة — لا أعتقد أنني شرحت ذلك بوضوح."},{"i":109,"c":"R","s":0,"en":"Di
