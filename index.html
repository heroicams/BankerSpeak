w this reads like a loan request. We need it to read like a sound investment for the bank.","ar":"حالياً يبدو هذا كطلب قرض. نحتاجه أن يبدو كاستثمار سليم للبنك."},{"i":187,"c":"C","s":0,"en":"Every weakness in a file needs an answer attached to it before the committee asks the question.","ar":"كل ضعف في الملف يحتاج إجابةً مرفقة به قبل أن تسأل اللجنة."},{"i":188,"c":"D","s":0,"en":"I package the file the way an underwriter wants to receive it, not the way most borrowers submit it.","ar":"أُجهّز الملف بالطريقة التي يريد بها المُكتتِب استلامه، لا بالطريقة التي يقدّمها بها معظم المقترضين."},{"i":189,"c":"D","s":0,"en":"Once the model is done, the credit memo is where the real persuasion happens.","ar":"بمجرد انتهاء النموذج، تأتي المذكرة الائتمانية حيث يحدث الإقناع الحقيقي."},{"i":190,"c":"F","s":0,"en":"Let's talk about value before we talk about price.","ar":"فلنتحدث عن القيمة قبل أن نتحدث عن السعر."},{"i":191,"c":"F","s":0,"en":"I'd rather do one thing exceptionally than three things cheaply.","ar":"أفضّل أن أُتقن أمراً واحداً على أن أؤدّي ثلاثة بثمن بخس."},{"i":192,"c":"F","s":0,"en":"Think of it as an investment in approval odds, not just a deliverable.","ar":"اعتبره استثماراً في احتمالات الموافقة، لا مجرد مُنتَج."},{"i":193,"c":"I","s":0,"en":"Shall I send the agreement over so we can lock in the timeline?","ar":"هل أرسل الاتفاقية لنثبّت الجدول الزمني؟"},{"i":194,"c":"I","s":0,"en":"I can start as early as this week if that works for you.","ar":"يمكنني البدء هذا الأسبوع إن كان ذلك مناسباً لك."},{"i":195,"c":"I","s":0,"en":"What would you need from me to feel confident moving forward?","ar":"ماذا تحتاج مني لتشعر بالثقة في المضي قدماً؟"},{"i":196,"c":"E","s":0,"en":"Happy to start with a smaller piece so you can see how I work before committing further.","ar":"يسعدني البدء بجزء أصغر لترى كيف أعمل قبل الالتزام أكثر."},{"i":197,"c":"E","s":0,"en":"I'll be upfront if I ever think something isn't in your best interest.","ar":"سأكون صريحاً إن ظننت يوماً أن شيئاً ليس في مصلحتك."},{"i":198,"c":"J","s":0,"en":"The borrower brings relevant industry experience, which strengthens the management assessment.","ar":"المقترض يجلب خبرة قطاعية ذات صلة، مما يقوّي تقييم الإدارة."},{"i":199,"c":"J","s":0,"en":"Primary repayment is supported by contracted revenue; secondary is the collateral position.","ar":"السداد الأساسي مدعوم بإيراد متعاقَد عليه؛ والثانوي هو وضع الضمانات."},{"i":200,"c":"J","s":0,"en":"We've structured the request to fit comfortably within the SBA eligibility and size standards.","ar":"هيكلنا الطلب ليندرج بمرونة ضمن أهلية ومعايير حجم الـ SBA."},{"i":201,"c":"Q","s":0,"en":"Sorry, the audio cut out — what was the last thing you said?","ar":"عذراً، انقطع الصوت — ما آخر ما قلته؟"},{"i":202,"c":"Q","s":1,"en":"Let me repeat that back to make sure we're aligned.","ar":"دعني أكرّر ذلك لأتأكد أننا متفقان."},{"i":203,"c":"Q","s":0,"en":"Could you spell that out for me?","ar":"هل يمكنك تهجئة ذلك لي؟"},{"i":204,"c":"R","s":0,"en":"I may have given you the wrong impression — let me clear that up.","ar":"ربما أعطيتك انطباعاً خاطئاً — دعني أوضّح ذلك."},{"i":205,"c":"R","s":0,"en":"Let's make sure we mean the same thing by 'collateral' here.","ar":"فلنتأكد أننا نقصد الشيء نفسه بكلمة \"ضمانات\" هنا."},{"i":206,"c":"S","s":0,"en":"I can live with that.","ar":"يمكنني تقبّل ذلك."},{"i":207,"c":"S","s":0,"en":"Let's meet in the middle on this.","ar":"فلنلتقِ في منتصف الطريق بشأن هذا."},{"i":208,"c":"S","s":0,"en":"I'd rather be honest with you than just tell you what you want to hear.","ar":"أفضّل أن أكون صادقاً معك على أن أقول لك ما تريد سماعه فقط."},{"i":209,"c":"T","s":0,"en":"Let me check my notes and call you right back.","ar":"دعني أراجع ملاحظاتي وأعاود الاتصال بك فوراً."},{"i":210,"c":"T","s":0,"en":"Is this still a good time, or did I catch you in the middle of something?","ar":"هل ما زال الوقت مناسباً، أم وصلتك في وسط شيء ما؟"},{"i":211,"c":"U","s":0,"en":"Thanks for making time on short notice.","ar":"شكراً لتخصيصك وقتاً رغم قِصَر المهلة."},{"i":212,"c":"U","s":0,"en":"I've been looking forward to discussing this with you.","ar":"كنت أتطلّع لمناقشة هذا معك."},{"i":213,"c":"V","s":0,"en":"How's your week shaping up?","ar":"كيف يتشكّل أسبوعك؟"},{"i":214,"c":"V","s":0,"en":"Busy season for you right now?","ar":"موسم مزدحم بالنسبة لك حالياً؟"},{"i":215,"c":"W","s":0,"en":"I'll send a recap by end of day.","ar":"سأرسل ملخّصاً بنهاية اليوم."},{"i":216,"c":"W","s":0,"en":"Reach out anytime if questions come up.","ar":"تواصل في أي وقت إن ظهرت أسئلة."},{"i":217,"c":"X","s":0,"en":"I owe you one for catching that.","ar":"أنا مدين لك لملاحظتك ذلك."},{"i":218,"c":"X","s":0,"en":"Let me make that right.","ar":"دعني أصحّح ذلك."},{"i":219,"c":"H","s":0,"en":"Let's define what 'done' looks like so we both know when we're there.","ar":"فلنحدّد كيف يبدو \"الإنجاز\" حتى نعرف كلانا متى نصل إليه."},{"i":220,"c":"H","s":0,"en":"I'd suggest we phase this — start with the model, then decide on the rest.","ar":"أقترح أن نقسّم هذا على مراحل — نبدأ بالنموذج، ثم نقرّر الباقي."},{"i":221,"c":"Y","s":0,"en":"Following up on our conversation, here's a quick summary of what we discussed.","ar":"متابعةً لمحادثتنا، إليك ملخّصاً سريعاً لما ناقشناه."},{"i":222,"c":"Y","s":0,"en":"As promised, please find the proposal attached.","ar":"كما وعدت، تجد العرض مرفقاً."},{"i":223,"c":"Y","s":0,"en":"Let me know if you'd like me to adjust anything.","ar":"أخبرني إن أردت أن أعدّل أي شيء."},{"i":224,"c":"Y","s":0,"en":"I'll await your go-ahead before I begin.","ar":"سأنتظر موافقتك قبل أن أبدأ."},{"i":225,"c":"Z","s":0,"en":"We'll get you ready for that lender conversation.","ar":"سنجهّزك لتلك المحادثة مع المقرض."},{"i":226,"c":"Z","s":0,"en":"Leave the heavy lifting to me.","ar":"اترك العبء الثقيل لي."},{"i":227,"c":"P","s":0,"en":"I've seen this exact situation many times — here's what works.","ar":"رأيت هذا الموقف بالضبط مرات عديدة — وإليك ما ينجح."},{"i":228,"c":"P","s":0,"en":"Trust me on this one — it's worth doing right.","ar":"ثق بي في هذه — تستحق أن تُنجَز بشكل صحيح."},{"i":229,"c":"P","s":0,"en":"Let me tell you what I'd do if this were my own file.","ar":"دعني أخبرك بما كنت سأفعله لو كان هذا ملفي الخاص."},{"i":230,"c":"M","s":0,"en":"Understood — that's clear.","ar":"مفهوم — هذا واضح."},{"i":231,"c":"M","s":0,"en":"Good — then we're aligned.","ar":"جيد — إذاً نحن متفقان."},{"i":232,"c":"N","s":0,"en":"What exactly do you mean by that?","ar":"ماذا تعني بذلك بالضبط؟"},{"i":233,"c":"N","s":0,"en":"Help me understand the reasoning behind that.","ar":"ساعدني على فهم المنطق وراء ذلك."},{"i":234,"c":"O","s":0,"en":"Now, on to the most important part.","ar":"الآن، إلى الجزء الأهم."},{"i":235,"c":"O","s":0,"en":"That brings me to my next point.","ar":"هذا يقودني إلى نقطتي التالية."},{"i":236,"c":"K","s":0,"en":"Let me give that the thought it deserves.","ar":"دعني أعطي ذلك التفكير الذي يستحقه."},{"i":237,"c":"K","s":0,"en":"Hold on — let me make sure I get this exactly right for you.","ar":"لحظة — دعني أتأكد أنني أضبط هذا تماماً لك."},{"i":238,"c":"D","s":0,"en":"My goal is simple: make your file the easiest 'yes' on the underwriter's desk.","ar":"هدفي بسيط: أن أجعل ملفك أسهل \"نعم\" على مكتب المُكتتِب."},{"i":239,"c":"G","s":0,"en":"Software can format a file. It can't anticipate the question a credit officer hasn't asked yet.","ar":"البرمجيات تستطيع تنسيق ملف. لا تستطيع توقّع السؤال الذي لم يطرحه ضابط الائتمان بعد."},{"i":240,"c":"G","s":0,"en":"You're not paying me to type — you're paying me to know what matters.","ar":"أنت لا تدفع لي لأكتب — تدفع لي لأعرف ما المهم."},{"i":241,"c":"J","s":0,"en":"We're looking at a loan-to-value of roughly seventy percent, which is well within range.","ar":"ننظر إلى نسبة قرض-إلى-قيمة تبلغ نحو 70%، وهي ضمن النطاق المريح."},{"i":242,"c":"J","s":0,"en":"The debt yield comes in strong, which gives the lender additional comfort.","ar":"عائد الدين يأتي قوياً، مما يمنح المقرض راحة إضافية."},{"i":243,"c":"B","s":0,"en":"What are your gross margins running at, roughly?","ar":"كم تبلغ هوامشك الإجمالية تقريباً؟"},{"i":244,"c":"B","s":0,"en":"How seasonal is the revenue — are there months that carry the year?","ar":"ما مدى موسمية الإيراد — هل هناك أشهر تحمل العام كله؟"},{"i":245,"c":"C","s":0,"en":"Seasonality isn't a weakness if we show the lender how the cash cushion covers the slow months.","ar":"الموسمية ليست ضعفاً إن أرينا المقرض كيف يغطّي الاحتياطي النقدي الأشهر البطيئة."},{"i":246,"c":"T","s":0,"en":"Does Tuesday or Thursday work better for a follow-up call?","ar":"هل الثلاثاء أم الخميس أنسب لمكالمة متابعة؟"},{"i":247,"c":"T","s":0,"en":"I'll send a calendar invite to confirm.","ar":"سأرسل دعوة تقويم للتأكيد."},{"i":248,"c":"T","s":0,"en":"Let's pencil in a time and firm it up by email.","ar":"فلنحدّد وقتاً مبدئياً ونثبّته بالبريد."},{"i":249,"c":"F","s":0,"en":"I understand budgets are tight — let's find the version that fits and still gets results.","ar":"أتفهّم أن الميزانيات ضيّقة — فلنجد النسخة التي تناسب وتحقق نتائج رغم ذلك."},{"i":250,"c":"F","s":0,"en":"If timing is the issue rather than price, I can be flexible on the schedule.","ar":"إن كان التوقيت هو المشكلة لا السعر، يمكنني أن أكون مرناً في الجدول."},{"i":251,"c":"E","s":0,"en":"Check the sample, talk to me for ten minutes, and decide for yourself.","ar":"راجع النموذج، تحدّث معي عشر دقائق، وقرّر بنفسك."},{"i":252,"c":"B","s":0,"en":"Who are your main customers, and how concentrated is the revenue among them?","ar":"مَن عملاؤك الرئيسيون، وما مدى تركّز الإيراد بينهم؟"},{"i":253,"c":"B","s":0,"en":"Are there any contingent liabilities or pending obligations I should know about?","ar":"هل هناك التزامات محتملة أو معلّقة يجب أن أعرفها؟"},{"i":254,"c":"B","s":0,"en":"What does your existing debt look like — any other loans on the books?","ar":"كيف يبدو دينك الحالي — هل هناك قروض أخرى في الدفاتر؟"},{"i":255,"c":"C","s":0,"en":"Concentration, seasonality, thin margins — none of these kill a deal if they're addressed head-on.","ar":"التركّز، الموسمية، الهوامش الرفيعة — لا شيء منها يقتل صفقة إن عُولج مباشرةً."},{"i":256,"c":"C","s":0,"en":"The goal isn't to hide the risks — it's to show the lender you've already managed them.","ar":"الهدف ليس إخفاء المخاطر — بل أن تُري المقرض أنك أدرتها بالفعل."},{"i":257,"c":"Y","s":0,"en":"I've outlined the scope, timeline, and deliverables below for your review.","ar":"حدّدت النطاق والجدول والمُخرجات أدناه لمراجعتك."},{"i":258,"c":"Y","s":0,"en":"Thanks again for the opportunity — I'm confident I can add real value here.","ar":"شكراً مجدداً على الفرصة — أنا واثق أنني أستطيع إضافة قيمة حقيقية هنا."},{"i":259,"c":"Y","s":0,"en":"Looking forward to your thoughts whenever you've had a chance to review.","ar":"أتطلّع لرأيك متى ما أتيحت لك فرصة المراجعة."},{"i":260,"c":"P","s":0,"en":"I'd rather lose the project than promise an outcome I can't stand behind.","ar":"أفضّل أن أخسر المشروع على أن أعد بنتيجة لا أستطيع الوقوف خلفها."},{"i":261,"c":"P","s":0,"en":"Let me show you, not just tell you.","ar":"دعني أُريك، لا أن أخبرك فقط."},{"i":262,"c":"S","s":0,"en":"I hear the concern, and it's exactly the right question to ask.","ar":"أسمع القلق، وهو تماماً السؤال الصحيح الذي يجب طرحه."},{"i":263,"c":"I","s":0,"en":"Why don't we start small and build from there?","ar":"لمَ لا نبدأ صغيراً ونبني من هناك؟"},{"i":264,"c":"I","s":0,"en":"I'll get the paperwork over to you today, and we can begin as soon as you're ready.","ar":"سأرسل لك الأوراق اليوم، ويمكننا البدء بمجرد أن تكون جاهزاً."},{"i":265,"c":"U","s":0,"en":"Congratulations on the growth — it's a great problem to have.","ar":"مبارك على النمو — إنها مشكلة جميلة أن تواجهها."},{"i":266,"c":"U","s":0,"en":"I appreciate the referral — that means a lot.","ar":"أقدّر الإحالة — هذا يعني الكثير."},{"i":267,"c":"Z","s":0,"en":"I'll be in your corner through the whole process.","ar":"سأكون في صفّك طوال العملية."},{"i":268,"c":"Z","s":0,"en":"If the bank pushes back, we'll have an answer ready.","ar":"إن اعترض البنك، سيكون لدينا إجابة جاهزة."},{"i":269,"c":"V","s":0,"en":"How long have you been in this line of business?","ar":"منذ متى وأنت في هذا المجال؟"},{"i":270,"c":"V","s":0,"en":"Sounds like you've built something impressive.","ar":"يبدو أنك بنيت شيئاً مثيراً للإعجاب."},{"i":271,"c":"R","s":0,"en":"Let me restate that more clearly.","ar":"دعني أعيد صياغة ذلك بوضوح أكبر."},{"i":272,"c":"R","s":0,"en":"I think I jumped ahead — let me back up a step.","ar":"أعتقد أنني تقدّمت كثيراً — دعني أعود خطوة."},{"i":273,"c":"Q","s":0,"en":"One moment, let me move somewhere quieter.","ar":"لحظة، دعني أنتقل لمكان أهدأ."},{"i":274,"c":"Q","s":0,"en":"Sorry to interrupt — I just want to make sure I follow.","ar":"آسف للمقاطعة — أريد فقط أن أتأكد أنني أتابع."},{"i":275,"c":"X","s":0,"en":"Thanks for bearing with me on that.","ar":"شكراً لتحمّلك معي في ذلك."},{"i":276,"c":"X","s":0,"en":"I appreciate your candor.","ar":"أقدّر صراحتك."},{"i":277,"c":"P","s":0,"en":"This is what I do — let me handle it.","ar":"هذا عملي — دعني أتولّاه."},{"i":278,"c":"D","s":0,"en":"By the time I'm done, you'll walk into that bank knowing every question before it's asked.","ar":"حين أنتهي، ستدخل ذلك البنك عارفاً كل سؤال قبل أن يُطرَح."},{"i":279,"c":"I","s":0,"en":"Let's get you funded.","ar":"فلنحصل لك على التمويل."},{"i":280,"c":"A","s":0,"en":"I appreciate you reaching out — let's see if I can help.","ar":"أقدّر تواصلك — فلنرَ إن كنت أستطيع المساعدة."},{"i":281,"c":"Ba","s":1,"en":"Let's start with your three statements — income statement, balance sheet, and cash flow. They have to tell one consistent story.","ar":"فلنبدأ بقوائمك الثلاث — قائمة الدخل والميزانية والتدفق النقدي. يجب أن تروي قصة واحدة متّسقة."},{"i":282,"c":"Ba","s":0,"en":"Your income statement shows profit, but the balance sheet shows where that profit actually went.","ar":"قائمة الدخل تُظهر الربح، لكن الميزانية تُظهر أين ذهب هذا الربح فعلاً."},{"i":283,"c":"Ba","s":0,"en":"Revenue is vanity, profit is sanity, but cash flow is reality — that's what the lender funds.","ar":"الإيراد مظهر، والربح عقل، لكن التدفق النقدي هو الواقع — وهو ما يموّله المقرض."},{"i":284,"c":"Ba","s":0,"en":"On the balance sheet, I'm looking at your current ratio and your debt-to-equity before anything else.","ar":"في الميزانية، أنظر إلى نسبة التداول ونسبة الدين إلى حقوق الملكية قبل أي شيء آخر."},{"i":285,"c":"Ba","s":0,"en":"Your retained earnings line tells me how much the business has reinvested over time.","ar":"بند الأرباح المحتجزة يخبرني كم أعاد النشاط استثماره عبر الوقت."},{"i":286,"c":"Ba","s":0,"en":"There's a mismatch here — net income is up, but operating cash flow is down. That's a red flag we need to explain.","ar":"هناك تضارب — صافي الدخل ارتفع لكن التدفق النقدي التشغيلي انخفض. علامة تحذير يجب أن نشرحها."},{"i":287,"c":"Ba","s":0,"en":"Let's normalize the financials — strip out the one-time items so the lender sees the true earning power.","ar":"فلنُطبّع القوائم — نزيل البنود غير المتكررة ليرى المقرض القوة الربحية الحقيقية."},{"i":288,"c":"Ba","s":0,"en":"Add-backs matter here: owner's salary, depreciation, and any personal expenses run through the business.","ar":"الإضافات المرتجعة مهمة هنا: راتب المالك والإهلاك وأي مصاريف شخصية مرّت عبر النشاط."},{"i":289,"c":"Ba","s":0,"en":"Your accounts receivable is climbing faster than revenue — that ties up cash you can't use.","ar":"ذممك المدينة ترتفع أسرع من الإيراد — وهذا يجمّد نقداً لا تستطيع استخدامه."},{"i":290,"c":"Ba","s":0,"en":"EBITDA gives the lender a cleaner view of operating performance before financing and tax effects.","ar":"الـ EBITDA يعطي المقرض رؤية أنظف للأداء التشغيلي قبل آثار التمويل والضريبة."},{"i":291,"c":"Ba","s":0,"en":"We need at least three years of historical statements, plus interim figures if the year is well underway.","ar":"نحتاج ثلاث سنوات على الأقل من القوائم التاريخية، إضافةً لأرقام مرحلية إن كان العام قد تقدّم."},{"i":292,"c":"Ba","s":0,"en":"Inventory turnover tells me how efficiently you're converting stock into sales.","ar":"معدل دوران المخزون يخبرني بكفاءة تحويلك للبضاعة إلى مبيعات."},{"i":293,"c":"Ba","s":0,"en":"Gross margin is holding, but your operating margin is being squeezed — let's see where the cost is leaking.","ar":"الهامش الإجمالي ثابت، لكن هامشك التشغيلي يتعرّض للضغط — فلنرَ أين تتسرّب التكلفة."},{"i":294,"c":"Ba","s":0,"en":"The notes to the financials often hold the risks the headline numbers hide.","ar":"الإيضاحات المرفقة بالقوائم غالباً تحمل المخاطر التي تخفيها الأرقام الرئيسية."},{"i":295,"c":"Ba","s":0,"en":"Let's reconcile the tax returns with the financial statements — lenders check that they match.","ar":"فلنطابق الإقرارات الضريبية مع القوائم المالية — المقرضون يتحققون من تطابقهما."},{"i":296,"c":"Ba","s":0,"en":"A clean, professionally presented statement signals discipline before the lender reads a single number.","ar":"قائمة نظيفة ومعروضة باحتراف تشير إلى الانضباط قبل أن يقرأ المقرض رقماً واحداً."},{"i":297,"c":"Bb","s":1,"en":"DSCR is the single most important number in the file — it tells the lender whether the cash covers the debt.","ar":"الـ DSCR هو أهم رقم في الملف — يخبر المقرض إن كان النقد يغطّي الدين."},{"i":298,"c":"Bb","s":1,"en":"We calculate DSCR as net operating income divided by total debt service. Anything below 1.25 makes lenders nervous.","ar":"نحسب الـ DSCR كصافي الدخل التشغيلي مقسوماً على إجمالي خدمة الدين. أي قيمة تحت 1.25 تُقلق المقرضين."},{"i":299,"c":"Bb","s":0,"en":"There's global DSCR and project DSCR — the lender will usually look at both for a new venture.","ar":"هناك DSCR كلي وDSCR للمشروع — المقرض عادةً ينظر لكليهما في مشروع جديد."},{"i":300,"c":"Bb","s":0,"en":"Global DSCR includes the owner's personal obligations, not just the business debt.","ar":"الـ DSCR الكلي يشمل التزامات المالك الشخصية، لا دين النشاط فقط."},{"i":301,"c":"Bb","s":0,"en":"Your current ratio is 1.8, which means you have comfortable short-term liquidity.","ar":"نسبة التداول لديك 1.8، ما يعني سيولة قصيرة الأجل مريحة."},{"i":302,"c":"Bb","s":0,"en":"Debt-to-equity of three-to-one is high — the lender will see the business as heavily leveraged.","ar":"نسبة دين إلى حقوق ملكية 3:1 مرتفعة — سيرى المقرض النشاط مثقلاً بالرفع المالي."},{"i":303,"c":"Bb","s":0,"en":"The quick ratio strips out inventory to test whether you can cover obligations with liquid assets alone.","ar":"نسبة السيولة السريعة تستبعد المخزون لاختبار تغطيتك للالتزامات بالأصول السائلة وحدها."},{"i":304,"c":"Bb","s":0,"en":"Let's stress-test the DSCR — if revenue drops fifteen percent, does it still clear 1.0?","ar":"فلنختبر الـ DSCR تحت الضغط — إن انخفض الإيراد 15%، هل يظل فوق 1.0؟"},{"i":305,"c":"Bb","s":0,"en":"A DSCR of 1.4 gives the committee a comfortable cushion above the benchmark.","ar":"DSCR بقيمة 1.4 يمنح اللجنة وسادة مريحة فوق المعيار."},{"i":306,"c":"Bb","s":0,"en":"Where you place the owner's salary — above or below the line — can swing the DSCR significantly.","ar":"أين تضع راتب المالك — فوق الخط أم تحته — قد يُرجّح الـ DSCR بشكل كبير."},{"i":307,"c":"Bb","s":0,"en":"Interest coverage shows how many times your earnings cover the interest alone.","ar":"تغطية الفائدة تُظهر كم مرة تغطّي أرباحك الفائدة وحدها."},{"i":308,"c":"Bb","s":0,"en":"The fixed-charge coverage ratio adds lease payments to the picture, which matters post-ASC 842.","ar":"نسبة تغطية الأعباء الثابتة تضيف مدفوعات الإيجار للصورة، وهو ما يهمّ بعد معيار ASC 842."},{"i":309,"c":"Bb","s":0,"en":"Margins, leverage, liquidity, coverage — those four families of ratios frame the whole credit decision.","ar":"الهوامش والرفع والسيولة والتغطية — هذه العائلات الأربع من النسب تؤطّر قرار الائتمان كله."},{"i":310,"c":"Bb","s":0,"en":"I always compare your ratios to the industry benchmark, not just to last year.","ar":"أقارن نسبك دائماً بمعيار القطاع، لا بالعام الماضي فقط."},{"i":311,"c":"Bb","s":0,"en":"A ratio in isolation means little — it's the trend and the context that tell the story.","ar":"النسبة بمعزلها تعني القليل — الاتجاه والسياق هما ما يرويان القصة."},{"i":312,"c":"Bb","s":0,"en":"Let me walk you through how the lender reads each ratio before you ever sit across from them.","ar":"دعني أشرح لك كيف يقرأ المقرض كل نسبة قبل أن تجلس أمامه."},{"i":313,"c":"Bc","s":1,"en":"For general needs like working capital, equipment, or an acquisition, SBA 7(a) is usually the right fit.","ar":"للاحتياجات العامة كرأس المال العامل أو المعدات أو الاستحواذ، عادةً يكون الـ SBA 7(a) هو الأنسب."},{"i":314,"c":"Bc","s":1,"en":"If you're buying commercial real estate or heavy equipment, the 504 program is built for that.","ar":"إن كنت تشتري عقاراً تجارياً أو معدات ثقيلة، فبرنامج الـ 504 مصمّم لذلك."},{"i":315,"c":"Bc","s":0,"en":"The 504 splits the financing: a bank loan, a CDC debenture, and your equity injection.","ar":"الـ 504 يقسّم التمويل: قرض بنكي، وسند من الـ CDC، وحقن رأس المال منك."},{"i":316,"c":"Bc","s":0,"en":"For a startup, the SBA usually wants to see at least ten percent equity injection from the borrower.","ar":"للمشروع الناشئ، عادةً تريد الـ SBA رؤية حقن رأس مال لا يقل عن 10% من المقترض."},{"i":317,"c":"Bc","s":0,"en":"You'll need to pass the size standard — the SBA defines 'small' by NAICS code, revenue, or employee count.","ar":"ستحتاج لتجاوز معيار الحجم — تُعرّف الـ SBA \"الصغير\" حسب رمز NAICS أو الإيراد أو عدد الموظفين."},{"i":318,"c":"Bc","s":0,"en":"There's also the alternative size standard — tangible net worth under fifteen million and average net income under five.","ar":"هناك أيضاً معيار الحجم البديل — صافي ثروة ملموسة تحت 15 مليوناً ومتوسط صافي دخل تحت 5."},{"i":319,"c":"Bc","s":0,"en":"The Credit Elsewhere test asks whether you could get this loan on reasonable terms without the SBA guarantee.","ar":"اختبار \"الائتمان من مكان آخر\" يسأل إن كان بإمكانك الحصول على القرض بشروط معقولة دون ضمان الـ SBA."},{"i":320,"c":"Bc","s":0,"en":"Form 1919 is the borrower information form, and Form 413 is your personal financial statement.","ar":"النموذج 1919 هو نموذج معلومات المقترض، والنموذج 413 هو قائمتك المالية الشخصية."},{"i":321,"c":"Bc","s":0,"en":"If it's a franchise, we'll need to check the SBA Franchise Directory and the FDD.","ar":"إن كان امتيازاً، سنحتاج للتحقق من دليل امتيازات الـ SBA ووثيقة الـ FDD."},{"i":322,"c":"Bc","s":0,"en":"A PLP lender can approve the loan in-house, which moves much faster than standard processing.","ar":"مُقرض الـ PLP يستطيع اعتماد القرض داخلياً، ما يسير أسرع بكثير من المعالجة القياسية."},{"i":323,"c":"Bc","s":0,"en":"SOP 50 10 is the rulebook — knowing the current version is what separates a clean file from a rejected one.","ar":"الـ SOP 50 10 هو كتاب القواعد — معرفة النسخة الحالية هي ما يفصل الملف النظيف عن المرفوض."},{"i":324,"c":"Bc","s":0,"en":"The SBA guarantee reduces the lender's risk, which is exactly why they'll consider a deal a bank alone might pass on.","ar":"ضمان الـ SBA يقلّل مخاطر المقرض، ولهذا تحديداً سينظرون في صفقة قد يرفضها البنك وحده."},{"i":325,"c":"Bc","s":0,"en":"A seller note can sometimes count toward your equity injection if it's on full standby.","ar":"سند البائع قد يُحتسب أحياناً ضمن حقن رأس مالك إن كان على انتظار كامل."},{"i":326,"c":"Bc","s":0,"en":"Eligibility comes first — there's no point building a beautiful package for an ineligible business.","ar":"الأهلية أولاً — لا جدوى من بناء حزمة جميلة لنشاط غير مؤهّل."},{"i":327,"c":"Bc","s":0,"en":"Let me map which SBA program fits your goal before we touch a single document.","ar":"دعني أحدّد أي برنامج SBA يناسب هدفك قبل أن نلمس مستنداً واحداً."},{"i":328,"c":"Bc","s":0,"en":"Personal guarantees are generally required from anyone owning twenty percent or more.","ar":"الكفالات الشخصية مطلوبة عموماً من أي شخص يملك 20% أو أكثر."},{"i":329,"c":"Bd","s":1,"en":"Collateral is the lender's backstop — it's what they fall back on if the cash flow fails.","ar":"الضمان هو شبكة أمان المقرض — ما يلجأ إليه إن فشل التدفق النقدي."},{"i":330,"c":"Bd","s":0,"en":"We'll list your collateral with realistic values, not wishful ones — lenders discount aggressively.","ar":"سنُدرج ضمانك بقيم واقعية لا متفائلة — المقرضون يخصمون بقوة."},{"i":331,"c":"Bd","s":0,"en":"Real estate, equipment, receivables, and inventory each get a different advance rate.","ar":"العقارات والمعدات والذمم والمخزون لكل منها نسبة سلفة مختلفة."},{"i":332,"c":"Bd","s":0,"en":"A personal guarantee puts your own assets behind the loan — it shows the lender you have skin in the game.","ar":"الكفالة الشخصية تضع أصولك خلف القرض — وتُظهر للمقرض أن لك حصة في المخاطرة."},{"i":333,"c":"Bd","s":0,"en":"If collateral is short, the SBA guarantee often bridges the gap a conventional loan couldn't.","ar":"إن نقص الضمان، فإن ضمان الـ SBA غالباً يسدّ الفجوة التي لا يسدّها قرض تقليدي."},{"i":334,"c":"Bd","s":0,"en":"Lenders take a lien on the collateral — a UCC filing for business assets, a mortgage for real estate.","ar":"المقرضون يأخذون حقاً على الضمان — تسجيل UCC لأصول النشاط، ورهن للعقار."},{"i":335,"c":"Bd","s":0,"en":"Loan-to-value tells the lender how much cushion exists between the loan and the collateral's worth.","ar":"نسبة القرض إلى القيمة تخبر المقرض بحجم الوسادة بين القرض وقيمة الضمان."},{"i":336,"c":"Bd","s":0,"en":"For SBA loans, available equity in your home may be pledged if business collateral falls short.","ar":"في قروض الـ SBA، قد تُرهن حقوق الملكية المتاحة في منزلك إن نقص ضمان النشاط."},{"i":337,"c":"Bd","s":0,"en":"A guarantee isn't just a signature — it's a real claim on real assets, so understand it fully.","ar":"الكفالة ليست مجرد توقيع — بل مطالبة حقيقية بأصول حقيقية، فافهمها تماماً."},{"i":338,"c":"Bd","s":0,"en":"We position the collateral so the lender sees adequate coverage without overpledging your assets.","ar":"نضع الضمان بحيث يرى المقرض تغطية كافية دون رهن أصولك بإفراط."},{"i":339,"c":"Bd","s":0,"en":"Depreciated equipment may carry a forced-liquidation value far below its book value.","ar":"المعدات المُهلكة قد تحمل قيمة تصفية قسرية أقل بكثير من قيمتها الدفترية."},{"i":340,"c":"Bd","s":0,"en":"A blanket lien covers substantially all business assets — know what you're signing.","ar":"الرهن الشامل يغطّي جميع أصول النشاط تقريباً — اعرف ما توقّع عليه."},{"i":341,"c":"Bd","s":0,"en":"Sometimes a limited guarantee or a carve-out can be negotiated — it depends on the strength of the deal.","ar":"أحياناً يمكن التفاوض على كفالة محدودة أو استثناء — يعتمد على قوة الصفقة."},{"i":342,"c":"Bd","s":0,"en":"The stronger your cash flow, the less the lender leans on collateral — that's leverage in negotiation.","ar":"كلما قوي تدفقك النقدي، قلّ اعتماد المقرض على الضمان — وهذه ورقة تفاوض."},{"i":343,"c":"Bd","s":0,"en":"Let me show you exactly what they can claim, and what we can protect, before you sign anything.","ar":"دعني أُريك بالضبط ما يمكنهم المطالبة به، وما نستطيع حمايته، قبل أن توقّع أي شيء."},{"i":344,"c":"Be","s":1,"en":"Every deal has risks — the difference is whether you've identified them before the committee does.","ar":"كل صفقة بها مخاطر — الفرق هو إن كنت قد حدّدتها قبل أن تفعل اللجنة."},{"i":345,"c":"Be","s":1,"en":"Customer concentration is the classic killer — if two clients are seventy percent of revenue, that's a flag.","ar":"تركّز العملاء هو القاتل الكلاسيكي — إن كان عميلان يمثّلان 70% من الإيراد، فتلك علامة تحذير."},{"i":346,"c":"Be","s":0,"en":"For every risk, we attach a mitigant — that's what turns a 'no' into a 'yes, with conditions'.","ar":"لكل خطر نُرفق مُخفِّفاً — وهذا ما يحوّل الـ \"لا\" إلى \"نعم، بشروط\"."},{"i":347,"c":"Be","s":0,"en":"The mitigant for concentration might be a covenant requiring advance notice on any contract change.","ar":"مُخفِّف التركّز قد يكون شرطاً يتطلب إشعاراً مسبقاً بأي تغيير في العقود."},{"i":348,"c":"Be","s":0,"en":"Key-person risk is real in a small business — what happens to revenue if the owner steps away?","ar":"خطر الشخص الرئيسي حقيقي في النشاط الصغير — ماذا يحدث للإيراد إن غاب المالك؟"},{"i":349,"c":"Be","s":0,"en":"We rate each risk High, Medium, or Low, and propose a specific mitigant for each.","ar":"نُصنّف كل خطر عالٍ أو متوسط أو منخفض، ونقترح مُخفِّفاً محدداً لكل منه."},{"i":350,"c":"Be","s":0,"en":"A good risk section doesn't hide weaknesses — it shows the lender you've already thought them through.","ar":"قسم المخاطر الجيد لا يخفي نقاط الضعف — بل يُظهر للمقرض أنك فكّرت فيها بالفعل."},{"i":351,"c":"Be","s":0,"en":"Industry risk matters — a cyclical business needs to show how it survives the down part of the cycle.","ar":"خطر القطاع مهم — النشاط الدوري يحتاج أن يُظهر كيف ينجو في الجزء الهابط من الدورة."},{"i":352,"c":"Be","s":0,"en":"Supplier concentration cuts both ways — losing a key supplier can be as damaging as losing a customer.","ar":"تركّز المورّدين سيف ذو حدين — فقدان مورّد رئيسي قد يكون مضرّاً كفقدان عميل."},{"i":353,"c":"Be","s":0,"en":"Vague risks like 'competition' are weak — name the specific, documented risk with numbers.","ar":"المخاطر الغامضة كـ \"المنافسة\" ضعيفة — سَمِّ الخطر المحدد الموثّق بالأرقام."},{"i":354,"c":"Be","s":0,"en":"A personal guarantee and adequate insurance often mitigate key-person concerns.","ar":"الكفالة الشخصية والتأمين الكافي غالباً يُخفّفان مخاوف الشخص الرئيسي."},{"i":355,"c":"Be","s":0,"en":"Refinancing risk appears when a balloon payment looms — show the lender your exit plan.","ar":"خطر إعادة التمويل يظهر عند اقتراب دفعة كبيرة — أرِ المقرض خطة خروجك."},{"i":356,"c":"Be","s":0,"en":"The strongest files convert each weakness into a managed, monitored, documented condition.","ar":"أقوى الملفات تحوّل كل ضعف إلى شرط مُدار ومُراقَب وموثّق."},{"i":357,"c":"Be","s":0,"en":"Let me show you the three risks the committee will raise — and the answer we'll have ready for each.","ar":"دعني أُريك المخاطر الثلاثة التي ستطرحها اللجنة — والإجابة التي سنجهّزها لكل منها."},{"i":358,"c":"Be","s":0,"en":"Regulatory or licensing risk can stop a deal cold — we flag it early and document compliance.","ar":"الخطر التنظيمي أو الترخيصي قد يوقف صفقة تماماً — نُشير إليه مبكراً ونوثّق الامتثال."},{"i":359,"c":"Bf","s":1,"en":"Projections are only as credible as the assumptions behind them — every number needs a justification.","ar":"التوقعات مصداقيتها بقدر الافتراضات خلفها — كل رقم يحتاج تبريراً."},{"i":360,"c":"Bf","s":1,"en":"I build conservative projections — lenders trust realistic over optimistic every single time.","ar":"أبني توقعات متحفظة — المقرضون يثقون بالواقعي على المتفائل في كل مرة."},{"i":361,"c":"Bf","s":0,"en":"Each assumption sits next to a one-line rationale, so the lender never has to guess where it came from.","ar":"كل افتراض بجانبه سطر تبرير واحد، فلا يضطر المقرض أبداً لتخمين مصدره."},{"i":362,"c":"Bf","s":0,"en":"I anchor revenue growth to industry data, not to hope — that's what survives scrutiny.","ar":"أربط نمو الإيراد ببيانات القطاع لا بالأمل — وهذا ما ينجو من التدقيق."},{"i":363,"c":"Bf","s":0,"en":"A hockey-stick projection with no basis is the fastest way to lose a lender's trust.","ar":"توقّع صاروخي بلا أساس هو أسرع طريق لفقدان ثقة المقرض."},{"i":364,"c":"Bf","s":0,"en":"We model a base case, a downside case, and sometimes an upside — the downside is what the lender studies.","ar":"نُنمذج حالة أساسية وحالة هابطة وأحياناً صاعدة — الهابطة هي ما يدرسه المقرض."},{"i":365,"c":"Bf","s":0,"en":"The sensitivity table shows what happens to the numbers if growth or margin moves against you.","ar":"جدول الحساسية يُظهر ما يحدث للأرقام إن تحرّك النمو أو الهامش ضدك."},{"i":366,"c":"Bf","s":0,"en":"Nothing in the model is hard-coded — every cell traces back to an assumption you can change.","ar":"لا شيء في النموذج مُثبّت يدوياً — كل خلية تعود لافتراض يمكنك تغييره."},{"i":367,"c":"Bf","s":0,"en":"If the projections only work in the best case, the deal isn't ready — let's pressure-test it.","ar":"إن كانت التوقعات تنجح فقط في أفضل حالة، فالصفقة ليست جاهزة — فلنختبرها تحت الضغط."},{"i":368,"c":"Bf","s":0,"en":"Tie the use of funds directly to the revenue it generates — that closes the loop for the lender.","ar":"اربط استخدام الأموال مباشرةً بالإيراد الذي يولّده — وهذا يُغلق الدائرة للمقرض."},{"i":369,"c":"Bf","s":0,"en":"Seasonality has to show in the monthly projections, or the lender will question the annual figure.","ar":"الموسمية يجب أن تظهر في التوقعات الشهرية، وإلا شكّك المقرض في الرقم السنوي."},{"i":370,"c":"Bf","s":0,"en":"A break-even analysis tells the lender how much cushion exists before the business loses money.","ar":"تحليل نقطة التعادل يخبر المقرض بحجم الوسادة قبل أن يخسر النشاط المال."},{"i":371,"c":"Bf","s":0,"en":"I'd rather under-promise in the model and let the business outperform than the reverse.","ar":"أفضّل أن أَعِد بأقل في النموذج وأدع النشاط يتفوّق، لا العكس."},{"i":372,"c":"Bf","s":0,"en":"Every aggressive assumption is a question you're handing the committee — keep them defensible.","ar":"كل افتراض جريء هو سؤال تسلّمه للجنة — أبقِها قابلة للدفاع."},{"i":373,"c":"Bf","s":0,"en":"Let me walk you through the assumptions a lender will challenge first.","ar":"دعني أشرح لك الافتراضات التي سيتحدّاها المقرض أولاً."},{"i":374,"c":"Bg","s":1,"en":"Cash flow is what repays the loan — not profit on paper. That's the lender's first and last question.","ar":"التدفق النقدي هو ما يسدّد القرض — لا الربح على الورق. وهذا أول وآخر سؤال للمقرض."},{"i":375,"c":"Bg","s":0,"en":"We'll use the indirect method — start from net income, add back depreciation, adjust for working capital.","ar":"سنستخدم الطريقة غير المباشرة — نبدأ من صافي الدخل، نُضيف الإهلاك، نُعدّل لرأس المال العامل."},{"i":376,"c":"Bg","s":0,"en":"Working capital is the cash trapped in the gap between paying suppliers and collecting from customers.","ar":"رأس المال العامل هو النقد المحبوس في الفجوة بين دفعك للمورّدين وتحصيلك من العملاء."},{"i":377,"c":"Bg","s":0,"en":"A growing business can be profitable and still run out of cash — that's the working-capital trap.","ar":"النشاط النامي قد يكون رابحاً ويظل ينفد منه النقد — تلك هي فخّ رأس المال العامل."},{"i":378,"c":"Bg","s":0,"en":"The cash conversion cycle measures how many days your money is tied up before it comes back.","ar":"دورة تحويل النقد تقيس كم يوماً يبقى مالك محبوساً قبل أن يعود."},{"i":379,"c":"Bg","s":0,"en":"Free cash flow is what's left after the business funds its own operations and reinvestment.","ar":"التدفق النقدي الحر هو ما يتبقى بعد تمويل النشاط لعملياته وإعادة استثماره."},{"i":380,"c":"Bg","s":0,"en":"Slow receivables and fast payables drain cash — we can structure the facility to bridge that gap.","ar":"الذمم البطيئة والدفعات السريعة تستنزف النقد — يمكننا هيكلة التسهيل لسدّ تلك الفجوة."},{"i":381,"c":"Bg","s":0,"en":"A line of credit smooths seasonal cash gaps; a term loan funds long-term assets. Don't mix them up.","ar":"خط الائتمان يُنعّم الفجوات النقدية الموسمية؛ والقرض لأجل يموّل الأصول طويلة الأجل. لا تخلط بينهما."},{"i":382,"c":"Bg","s":0,"en":"The lender wants to see that operating cash flow — not new debt — services the existing debt.","ar":"المقرض يريد أن يرى أن التدفق النقدي التشغيلي — لا الدين الجديد — يخدم الدين القائم."},{"i":383,"c":"Bg","s":0,"en":"If you're hiring ahead of revenue, the burn has to be funded — let's size that correctly.","ar":"إن كنت توظّف قبل الإيراد، فالحرق يجب تمويله — فلنحدّد حجمه بدقة."},{"i":384,"c":"Bg","s":0,"en":"Cash runway tells you how many months you can operate before you need more funding.","ar":"مدرج النقد يخبرك بكم شهراً تستطيع العمل قبل أن تحتاج تمويلاً إضافياً."},{"i":385,"c":"Bg","s":0,"en":"Let's separate operating, investing, and financing cash flows — each tells the lender a different thing.","ar":"فلنفصل التدفقات التشغيلية والاستثمارية والتمويلية — كل منها يخبر المقرض بشيء مختلف."},{"i":386,"c":"Bg","s":0,"en":"Improving your collection terms by ten days can free up more cash than a small loan.","ar":"تحسين شروط تحصيلك بعشرة أيام قد يحرّر نقداً أكثر من قرض صغير."},{"i":387,"c":"Bg","s":0,"en":"The forecast has to show cash never dips below zero — even in the tightest month.","ar":"التوقّع يجب أن يُظهر أن النقد لا ينخفض تحت الصفر — حتى في أضيق شهر."},{"i":388,"c":"Bg","s":0,"en":"Let me map your cash cycle so we request exactly the right amount — not too much, not too little.","ar":"دعني أرسم دورتك النقدية لنطلب المبلغ الصحيح تماماً — لا أكثر ولا أقل."},{"i":389,"c":"Bh","s":1,"en":"Structure is everything — the same business can be bankable or not depending on how the deal is built.","ar":"الهيكلة هي كل شيء — النشاط نفسه قد يكون قابلاً للتمويل أو لا حسب كيفية بناء الصفقة."},{"i":390,"c":"Bh","s":0,"en":"We match the loan term to the asset life — you don't finance a ten-year asset with a three-year loan.","ar":"نُطابق أجل القرض مع عمر الأصل — لا تموّل أصلاً عمره عشر سنوات بقرض لثلاث سنوات."},{"i":391,"c":"Bh","s":0,"en":"Amortization, term, and rate together determine the monthly payment — and that drives the DSCR.","ar":"الإطفاء والأجل والمعدل معاً يحدّدون الدفعة الشهرية — وهي تقود الـ DSCR."},{"i":392,"c":"Bh","s":0,"en":"A longer amortization lowers the payment and improves coverage — sometimes that's the whole fix.","ar":"إطفاء أطول يخفّض الدفعة ويحسّن التغطية — أحياناً يكون هذا هو الحل كله."},{"i":393,"c":"Bh","s":0,"en":"We can blend facilities — a term loan for equipment plus a line of credit for working capital.","ar":"يمكننا مزج التسهيلات — قرض لأجل للمعدات إضافةً لخط ائتمان لرأس المال العامل."},{"i":394,"c":"Bh","s":0,"en":"A balloon payment lowers monthly cost but creates refinancing risk — the lender will want an exit plan.","ar":"الدفعة الكبيرة تخفّض التكلفة الشهرية لكنها تخلق خطر إعادة تمويل — وسيريد المقرض خطة خروج."},{"i":395,"c":"Bh","s":0,"en":"Interest-only periods can help a startup ramp up before full payments kick in.","ar":"فترات الفائدة فقط قد تساعد المشروع الناشئ على النمو قبل بدء الدفعات الكاملة."},{"i":396,"c":"Bh","s":0,"en":"Covenants protect the lender, but over-tight covenants choke the borrower — we negotiate the balance.","ar":"الشروط التعهّدية تحمي المقرض، لكن الشروط المُحكمة بإفراط تخنق المقترض — نتفاوض على التوازن."},{"i":397,"c":"Bh","s":0,"en":"Fixed versus floating rate is a risk decision — we look at where rates are heading.","ar":"المعدل الثابت مقابل المتغيّر قرار مخاطرة — ننظر إلى أين تتجه المعدلات."},{"i":398,"c":"Bh","s":0,"en":"Structuring the equity injection correctly can be the difference between approval and decline.","ar":"هيكلة حقن رأس المال بشكل صحيح قد تكون الفرق بين الموافقة والرفض."},{"i":399,"c":"Bh","s":0,"en":"A seller note on standby can fill a gap and signal the seller's confidence to the lender.","ar":"سند بائع على انتظار قد يسدّ فجوة ويُشير لثقة البائع أمام المقرض."},{"i":400,"c":"Bh","s":0,"en":"The goal is a structure the business can comfortably service even in a soft year.","ar":"الهدف هيكل يستطيع النشاط خدمته بمرونة حتى في سنة ضعيفة."},{"i":401,"c":"Bh","s":0,"en":"We right-size the request — asking for too much raises risk, too little starves the plan.","ar":"نضبط حجم الطلب — طلب الكثير يرفع المخاطر، والقليل يُجوّع الخطة."},{"i":402,"c":"Bh","s":0,"en":"Prepayment terms matter — some loans penalize early payoff, and you should know before you sign.","ar":"شروط السداد المبكر مهمة — بعض القروض تعاقب السداد المبكر، ويجب أن تعرف قبل التوقيع."},{"i":403,"c":"Bh","s":0,"en":"Let me design two or three structures so you can see the trade-offs side by side.","ar":"دعني أصمّم هيكلين أو ثلاثة لترى المفاضلات جنباً إلى جنب."},{"i":404,"c":"Bi","s":1,"en":"Due diligence is where deals are won or lost — let's get ahead of every question the lender will ask.","ar":"الفحص النافي للجهالة هو حيث تُربح الصفقات أو تُخسر — فلنسبق كل سؤال سيطرحه المقرض."},{"i":405,"c":"Bi","s":0,"en":"We'll need tax returns, bank statements, an aging report, and a debt schedule to start.","ar":"سنحتاج إقرارات ضريبية وكشوف بنكية وتقرير أعمار ذمم وجدول ديون للبدء."},{"i":406,"c":"Bi","s":0,"en":"A clean data room signals to the lender that the business is well-run and the file is trustworthy.","ar":"غرفة بيانات نظيفة تُشير للمقرض أن النشاط مُدار جيداً وأن الملف جدير بالثقة."},{"i":407,"c":"Bi","s":0,"en":"Let's reconcile the bank deposits to reported revenue — that's one of the first checks an underwriter runs.","ar":"فلنطابق الإيداعات البنكية مع الإيراد المُبلّغ — وهو أول فحص يجريه المُكتتِب."},{"i":408,"c":"Bi","s":0,"en":"For an acquisition, we verify the seller's numbers — quality of earnings before you commit.","ar":"في الاستحواذ، نتحقق من أرقام البائع — جودة الأرباح قبل أن تلتزم."},{"i":409,"c":"Bi","s":0,"en":"Outstanding litigation, tax liens, or judgments will surface — better we find them first.","ar":"الدعاوى القائمة أو الحجوزات الضريبية أو الأحكام ستظهر — والأفضل أن نجدها أولاً."},{"i":410,"c":"Bi","s":0,"en":"We document customer contracts, leases, and key agreements — the lender funds certainty, not surprises.","ar":"نوثّق عقود العملاء والإيجارات والاتفاقيات الرئيسية — المقرض يموّل اليقين لا المفاجآت."},{"i":411,"c":"Bi","s":0,"en":"Inconsistencies between documents are what trigger deeper scrutiny — consistency builds confidence.","ar":"التناقضات بين المستندات هي ما يُطلق تدقيقاً أعمق — والاتّساق يبني الثقة."},{"i":412,"c":"Bi","s":0,"en":"A debt schedule lists every existing obligation — lenders need the full picture, not a partial one.","ar":"جدول الديون يُدرج كل التزام قائم — المقرضون يحتاجون الصورة الكاملة لا الجزئية."},{"i":413,"c":"Bi","s":0,"en":"Let me build you a document checklist so nothing slows the file down at the last minute.","ar":"دعني أبني لك قائمة مستندات حتى لا يُبطئ شيء الملف في اللحظة الأخيرة."},{"i":414,"c":"Bi","s":0,"en":"The cleaner the diligence, the faster the approval — disorganization reads as risk.","ar":"كلما نظُف الفحص، أسرعت الموافقة — والفوضى تُقرأ كمخاطرة."},{"i":415,"c":"Bi","s":0,"en":"We'll prepare answers to the tough questions before they're asked — that's what a prepared file looks like.","ar":"سنُجهّز إجابات الأسئلة الصعبة قبل أن تُطرح — هكذا يبدو الملف المُجهّز."},{"i":416,"c":"Bj","s":1,"en":"For investors, the story is the upside — for lenders, it's the downside protection. Same business, opposite pitch.","ar":"للمستثمرين، القصة هي الصعود — للمقرضين، هي حماية الهبوط. نفس النشاط، عرض معاكس."},{"i":417,"c":"Bj","s":0,"en":"Investors buy a piece of the future; lenders buy a promise of repayment. Know which one you're approaching.","ar":"المستثمرون يشترون قطعة من المستقبل؛ المقرضون يشترون وعداً بالسداد. اعرف أيهما تخاطب."},{"i":418,"c":"Bj","s":0,"en":"Unit economics are what a sharp investor checks first — what you make on each customer after costs.","ar":"اقتصاديات الوحدة هي ما يفحصه المستثمر الذكي أولاً — ما تكسبه من كل عميل بعد التكاليف."},{"i":419,"c":"Bj","s":0,"en":"Your cap table tells the investor who owns what — keep it clean before you raise.","ar":"جدول ملكيتك يخبر المستثمر بمن يملك ماذا — أبقِه نظيفاً قبل أن تجمع."},{"i":420,"c":"Bj","s":0,"en":"A pre-money valuation sets the price; the raise sets how much of the company you give up.","ar":"التقييم قبل الاستثمار يحدّد السعر؛ والجولة تحدّد كم من الشركة تتنازل عنه."},{"i":421,"c":"Bj","s":0,"en":"Burn rate and runway are the two numbers every investor asks a startup about.","ar":"معدل الحرق والمدرج هما الرقمان اللذان يسأل عنهما كل مستثمر أي مشروع ناشئ."},{"i":422,"c":"Bj","s":0,"en":"If you're burning cash, a bank loan is an uphill battle — your story is an equity story.","ar":"إن كنت تحرق نقداً، فالقرض البنكي معركة شاقة — قصتك قصة حقوق ملكية."},{"i":423,"c":"Bj","s":0,"en":"Traction beats projections — show the investor real customers, real revenue, real retention.","ar":"الجذب يتفوّق على التوقعات — أرِ المستثمر عملاء حقيقيين وإيراداً حقيقياً واحتفاظاً حقيقياً."},{"i":424,"c":"Bj","s":0,"en":"Dilution is the cost of capital here — raise what you need, not the most you can.","ar":"التخفيف هو تكلفة رأس المال هنا — اجمع ما تحتاجه لا أقصى ما تستطيع."},{"i":425,"c":"Bj","s":0,"en":"A convertible note or SAFE delays the valuation question to a later, priced round.","ar":"السند القابل للتحويل أو الـ SAFE يؤجّل سؤال التقييم لجولة لاحقة مُسعّرة."},{"i":426,"c":"Bj","s":0,"en":"The same model, framed for an investor, sells growth; framed for a lender, it sells safety.","ar":"النموذج نفسه، مُصاغاً لمستثمر، يبيع النمو؛ ومُصاغاً لمقرض، يبيع الأمان."},{"i":427,"c":"Bj","s":0,"en":"Let me build the version that speaks the language of whoever's writing the check.","ar":"دعني أبني النسخة التي تتحدث بلغة من سيكتب الشيك."},{"i":428,"c":"Bk","s":1,"en":"The executive summary is the whole deal in one paragraph — if it doesn't land, nothing else gets read.","ar":"الملخّص التنفيذي هو الصفقة كلها في فقرة واحدة — إن لم ينجح، لن يُقرأ شيء آخر."},{"i":429,"c":"Bk","s":0,"en":"A credit memo answers five questions: who, how much, for what, how repaid, and what's the recommendation.","ar":"المذكرة الائتمانية تُجيب خمسة أسئلة: مَن، كم، لماذا، كيف يُسدّد، وما التوصية."},{"i":430,"c":"Bk","s":0,"en":"The recommendation has to be clear — a hedged conclusion signals weak conviction.","ar":"التوصية يجب أن تكون واضحة — الخلاصة المتردّدة تُشير لقناعة ضعيفة."},{"i":431,"c":"Bk","s":0,"en":"A pitch deck has ten slides and one job: make them want the next meeting.","ar":"العرض التقديمي عشر شرائح ومهمة واحدة: أن يجعلهم يريدون الاجتماع التالي."},{"i":432,"c":"Bk","s":0,"en":"Lead with the problem, then the solution, then the proof — that's the order that holds attention.","ar":"ابدأ بالمشكلة، ثم الحل، ثم الإثبات — هذا الترتيب الذي يُمسك الانتباه."},{"i":433,"c":"Bk","s":0,"en":"In an investment memo, the risks section builds credibility — hiding risks destroys it.","ar":"في مذكرة الاستثمار، قسم المخاطر يبني المصداقية — وإخفاء المخاطر يدمّرها."},{"i":434,"c":"Bk","s":0,"en":"Every claim in the memo needs a number behind it — assertions without evidence get discounted.","ar":"كل ادعاء في المذكرة يحتاج رقماً خلفه — الادعاءات بلا دليل تُخصم."},{"i":435,"c":"Bk","s":0,"en":"Write the memo the way the credit officer thinks — in their order, in their language.","ar":"اكتب المذكرة بالطريقة التي يفكّر بها ضابط الائتمان — بترتيبه، بلغته."},{"i":436,"c":"Bk","s":0,"en":"The financial analysis is the heart — for each ratio, describe the number, then interpret it.","ar":"التحليل المالي هو القلب — لكل نسبة، صِف الرقم، ثم فسّره."},{"i":437,"c":"Bk","s":0,"en":"A strong memo doesn't just present data — it makes a case and reaches a verdict.","ar":"المذكرة القوية لا تعرض البيانات فقط — بل تبني حجّة وتصل لحُكم."},{"i":438,"c":"Bk","s":0,"en":"If your summary can't fit the ask, the repayment, and the recommendation in 150 words, it's not tight enough.","ar":"إن لم يستطع ملخّصك احتواء الطلب والسداد والتوصية في 150 كلمة، فهو ليس مُحكماً بما يكفي."},{"i":439,"c":"Bk","s":0,"en":"Let me draft the memo so a busy officer can approve it on the first read.","ar":"دعني أصوغ المذكرة بحيث يستطيع ضابط مشغول اعتمادها من أول قراءة."},{"i":440,"c":"Bl","s":1,"en":"Underwriting is storytelling with numbers — the narrative connects the figures into a repayment case.","ar":"الاكتتاب هو سرد بالأرقام — السرد يربط الأرقام في قضية سداد."},{"i":441,"c":"Bl","s":0,"en":"The narrative explains not just what the numbers are, but why they are what they are.","ar":"السرد يشرح ليس فقط ما هي الأرقام، بل لماذا هي كذلك."},{"i":442,"c":"Bl","s":0,"en":"I write the credit narrative the way I'd want to read it if I were back on the committee.","ar":"أكتب السرد الائتماني بالطريقة التي كنت أتمنى قراءتها لو كنت في اللجنة."},{"i":443,"c":"Bl","s":0,"en":"Character, capacity, capital, collateral, conditions — the five Cs frame the whole narrative.","ar":"الشخصية والقدرة ورأس المال والضمان والظروف — الخمسة Cs تؤطّر السرد كله."},{"i":444,"c":"Bl","s":0,"en":"Capacity is the heart of it — can the cash flow service this debt through a full cycle?","ar":"القدرة هي قلب الأمر — هل يستطيع التدفق النقدي خدمة هذا الدين عبر دورة كاملة؟"},{"i":445,"c":"Bl","s":0,"en":"A good narrative anticipates the objection and answers it in the same paragraph.","ar":"السرد الجيد يتوقّع الاعتراض ويُجيبه في الفقرة نفسها."},{"i":446,"c":"Bl","s":0,"en":"Management strength is part of the story — relevant experience reassures the lender.","ar":"قوة الإدارة جزء من القصة — الخبرة ذات الصلة تطمئن المقرض."},{"i":447,"c":"Bl","s":0,"en":"The narrative ties the use of funds to the repayment source — that loop has to close cleanly.","ar":"السرد يربط استخدام الأموال بمصدر السداد — وتلك الدائرة يجب أن تُغلق بنظافة."},{"i":448,"c":"Bl","s":0,"en":"I present strengths first, risks second, mitigants third — that order earns trust.","ar":"أعرض نقاط القوة أولاً، المخاطر ثانياً، المُخفّفات ثالثاً — وهذا الترتيب يكسب الثقة."},{"i":449,"c":"Bl","s":0,"en":"This is the part of the file no software can write — it takes someone who's sat on the committee.","ar":"هذا الجزء من الملف لا تكتبه أي برمجية — يحتاج شخصاً جلس في اللجنة."},{"i":450,"c":"Bl","s":0,"en":"A weak narrative buries the strength; a strong one makes the officer see it in ninety seconds.","ar":"السرد الضعيف يدفن القوة؛ والقوي يجعل الضابط يراها في تسعين ثانية."},{"i":451,"c":"Bl","s":0,"en":"Let me write the narrative that turns your numbers into an approval.","ar":"دعني أكتب السرد الذي يحوّل أرقامك إلى موافقة."},{"i":452,"c":"Bm","s":1,"en":"The lender judges your business against its industry — strong numbers in a weak sector still raise questions.","ar":"المقرض يحكم على نشاطك مقابل قطاعه — أرقام قوية في قطاع ضعيف تظل تثير أسئلة."},{"i":453,"c":"Bm","s":0,"en":"I benchmark your margins, turnover, and leverage against industry norms, not just your own history.","ar":"أقارن هوامشك ودورانك ورفعك بمعايير القطاع، لا بتاريخك فقط."},{"i":454,"c":"Bm","s":0,"en":"A cyclical industry needs a story for how the business survives the downturn.","ar":"القطاع الدوري يحتاج قصة لكيفية نجاة النشاط في الركود."},{"i":455,"c":"Bm","s":0,"en":"Barriers to entry, competitive position, and supplier power all shape the lender's view of risk.","ar":"حواجز الدخول والموقع التنافسي وقوة المورّدين كلها تُشكّل رؤية المقرض للمخاطر."},{"i":456,"c":"Bm","s":0,"en":"Regulatory trends can make or break a sector — we flag them before the lender does.","ar":"الاتجاهات التنظيمية قد تصنع قطاعاً أو تكسره — نُشير إليها قبل المقرض."},{"i":457,"c":"Bm","s":0,"en":"Showing you understand your own industry's risks reassures the lender more than rosy optimism.","ar":"إظهار فهمك لمخاطر قطاعك يطمئن المقرض أكثر من التفاؤل الوردي."},{"i":458,"c":"Bm","s":0,"en":"Where you sit in the value chain affects your pricing power and your margins.","ar":"موقعك في سلسلة القيمة يؤثر على قوتك التسعيرية وهوامشك."},{"i":459,"c":"Bm","s":0,"en":"A growing market lifts the whole story; a shrinking one means you need a share-gain narrative.","ar":"سوق نامٍ يرفع القصة كلها؛ وسوق منكمش يعني أنك تحتاج سردَ كسبِ حصة."},{"i":460,"c":"Bm","s":0,"en":"I pull industry data from credible sources so the benchmark holds up under scrutiny.","ar":"أسحب بيانات القطاع من مصادر موثوقة ليصمد المعيار تحت التدقيق."},{"i":461,"c":"Bm","s":0,"en":"Knowing the sector's typical DSCR and margin ranges lets us position you accurately.","ar":"معرفة نطاقات الـ DSCR والهامش المعتادة للقطاع تتيح لنا وضعك بدقة."},{"i":462,"c":"Bm","s":0,"en":"Let me show how your business compares to its peers — that context strengthens the whole file.","ar":"دعني أُظهر كيف يقارن نشاطك بأقرانه — هذا السياق يقوّي الملف كله."},{"i":463,"c":"Bn","s":1,"en":"Everything is negotiable — rate, term, covenants, collateral — if the deal is strong enough.","ar":"كل شيء قابل للتفاوض — المعدل والأجل والشروط والضمان — إن كانت الصفقة قوية بما يكفي."},{"i":464,"c":"Bn","s":0,"en":"Your leverage in negotiation is the strength of your cash flow and the quality of your file.","ar":"ورقتك في التفاوض هي قوة تدفقك النقدي وجودة ملفك."},{"i":465,"c":"Bn","s":0,"en":"Don't negotiate rate alone — a slightly higher rate with looser covenants can be the better deal.","ar":"لا تتفاوض على المعدل وحده — معدل أعلى قليلاً بشروط أرخى قد يكون الصفقة الأفضل."},{"i":466,"c":"Bn","s":0,"en":"Ask for what you need, justify why, and be ready to trade — that's how terms get better.","ar":"اطلب ما تحتاجه، برّر السبب، وكن مستعداً للمقايضة — هكذا تتحسّن الشروط."},{"i":467,"c":"Bn","s":0,"en":"A competing offer is the strongest negotiating tool — it gives you real leverage.","ar":"عرض منافس هو أقوى أداة تفاوض — يمنحك ورقة حقيقية."},{"i":468,"c":"Bn","s":0,"en":"Watch the fees, not just the rate — origination, packaging, and prepayment penalties add up.","ar":"راقب الرسوم لا المعدل فقط — رسوم الإصدار والتجهيز وغرامات السداد المبكر تتراكم."},{"i":469,"c":"Bn","s":0,"en":"Personal guarantee scope is negotiable — sometimes a limited or burning-off guarantee is achievable.","ar":"نطاق الكفالة الشخصية قابل للتفاوض — أحياناً يمكن تحقيق كفالة محدودة أو متناقصة."},{"i":470,"c":"Bn","s":0,"en":"Negotiate from the file, not from emotion — the numbers make your case for you.","ar":"تفاوض من الملف لا من العاطفة — الأرقام تبني حجّتك عنك."},{"i":471,"c":"Bn","s":0,"en":"A covenant you can't realistically meet is a default waiting to happen — push back on it now.","ar":"شرط تعهّدي لا تستطيع تحقيقه واقعياً هو تعثّر ينتظر الحدوث — اعترض عليه الآن."},{"i":472,"c":"Bn","s":0,"en":"Know your walk-away point before you start — that's what keeps you from a bad deal.","ar":"اعرف نقطة انسحابك قبل أن تبدأ — وهذا ما يحميك من صفقة سيّئة."},{"i":473,"c":"Bn","s":0,"en":"The best terms go to prepared borrowers — a strong file is your strongest argument.","ar":"أفضل الشروط تذهب للمقترضين المُجهّزين — الملف القوي هو أقوى حُججك."},{"i":474,"c":"Bn","s":0,"en":"Let me prep you for the term sheet conversation so you know exactly what to push on.","ar":"دعني أُجهّزك لمحادثة ورقة الشروط لتعرف بالضبط على ماذا تضغط."},{"i":475,"c":"Ga","s":1,"en":"I wanted to follow up on our conversation and put the key points in writing.","ar":"أردت المتابعة على محادثتنا ووضع النقاط الرئيسية كتابةً."},{"i":476,"c":"Ga","s":0,"en":"Please find the proposal attached, and let me know if anything needs adjusting.","ar":"تجد العرض مرفقاً، وأخبرني إن كان أي شيء يحتاج تعديلاً."},{"i":477,"c":"Ga","s":0,"en":"Thanks for your email — I'll get back to you with a full response by tomorrow.","ar":"شكراً على بريدك — سأوافيك برد كامل بحلول الغد."},{"i":478,"c":"Ga","s":0,"en":"Just a quick note to confirm we're on track for the deadline.","ar":"مجرد ملاحظة سريعة لأؤكّد أننا في المسار الصحيح للموعد النهائي."},{"i":479,"c":"Ga","s":0,"en":"To summarize the next steps: I'll prepare the draft, and you'll review it by Friday.","ar":"لتلخيص الخطوات التالية: سأُعدّ المسودة، وستراجعها بحلول الجمعة."},{"i":480,"c":"Ga","s":0,"en":"Apologies for the delayed reply — I wanted to give your question the attention it deserved.","ar":"أعتذر عن تأخّر الرد — أردت أن أعطي سؤالك الاهتمام الذي يستحقه."},{"i":481,"c":"Ga","s":0,"en":"I welcome any feedback once you have read it through.","ar":"أرحّب بأي ملاحظات بمجرد قراءتك له بالكامل."},{"i":482,"c":"Ga","s":0,"en":"As discussed, I've outlined the scope and timeline below for your records.","ar":"كما اتفقنا، حدّدت النطاق والجدول أدناه لسجلاتك."},{"i":483,"c":"Ga","s":0,"en":"Please don't hesitate to reach out if any questions come up in the meantime.","ar":"لا تتردد في التواصل إن ظهرت أي أسئلة في هذه الأثناء."},{"i":484,"c":"Ga","s":0,"en":"I'll keep this brief — just three things I need from you to move forward.","ar":"سأُبقي هذا موجزاً — فقط ثلاثة أمور أحتاجها منك للمضي قدماً."},{"i":485,"c":"Ga","s":0,"en":"Circling back on this — have you had a chance to look at the document I sent?","ar":"أعود لهذا — هل أتيحت لك فرصة للاطلاع على المستند الذي أرسلته؟"},{"i":486,"c":"Ga","s":0,"en":"Thank you for the opportunity — I'm confident I can add real value here.","ar":"شكراً على الفرصة — أنا واثق أنني أستطيع إضافة قيمة حقيقية هنا."},{"i":487,"c":"Ga","s":0,"en":"I've attached a short intake form — once it's back, I can get started right away.","ar":"أرفقت استمارة قصيرة — بمجرد عودتها، أستطيع البدء فوراً."},{"i":488,"c":"Ga","s":0,"en":"Per your request, here's a breakdown of the costs and what each covers.","ar":"بناءً على طلبك، إليك تفصيلاً للتكاليف وما يغطّيه كل بند."},{"i":489,"c":"Ga","s":0,"en":"Happy to jump on a quick call if that's easier than going back and forth over email.","ar":"يسعدني إجراء مكالمة سريعة إن كان ذلك أسهل من التبادل عبر البريد."},{"i":490,"c":"Ga","s":0,"en":"Wishing you a good week — talk soon.","ar":"أتمنى لك أسبوعاً طيباً — نتحدث قريباً."},{"i":491,"c":"Gb","s":1,"en":"Does Tuesday or Thursday work better for you?","ar":"هل الثلاثاء أم الخميس أنسب لك؟"},{"i":492,"c":"Gb","s":0,"en":"I'll send a calendar invite to confirm the time.","ar":"سأرسل دعوة تقويم لتأكيد الوقت."},{"i":493,"c":"Gb","s":0,"en":"Shall we tentatively hold a slot and confirm later?","ar":"هل نحجز موعداً مبدئياً ونؤكّده لاحقاً؟"},{"i":494,"c":"Gb","s":0,"en":"Would a fifteen-minute call work, or do you prefer something longer?","ar":"هل تناسبك مكالمة 15 دقيقة، أم تفضّل شيئاً أطول؟"},{"i":495,"c":"Gb","s":0,"en":"I'm flexible most of the afternoon — what suits you?","ar":"أنا مرن معظم بعد الظهر — ما الذي يناسبك؟"},{"i":496,"c":"Gb","s":0,"en":"Something's come up — could we push our meeting by an hour?","ar":"استجدّ أمر — هل يمكننا تأجيل اجتماعنا ساعة؟"},{"i":497,"c":"Gb","s":0,"en":"Let's keep this meeting to thirty minutes so we both stay on schedule.","ar":"فلنُبقِ هذا الاجتماع في 30 دقيقة حتى نظل كلانا في الموعد."},{"i":498,"c":"Gb","s":0,"en":"Before we wrap up, let's agree on the next steps and who owns what.","ar":"قبل أن ننهي، فلنتفق على الخطوات التالية ومن يتولّى ماذا."},{"i":499,"c":"Gb","s":0,"en":"Can we reschedule for early next week? I want to give this my full attention.","ar":"هل يمكننا إعادة الجدولة لأوائل الأسبوع القادم؟ أريد أن أعطي هذا كامل اهتمامي."},{"i":500,"c":"Gb","s":0,"en":"Thanks for making the time — I know your calendar is full.","ar":"شكراً لتخصيصك الوقت — أعرف أن جدولك ممتلئ."},{"i":501,"c":"Gb","s":0,"en":"Let's set a recurring check-in so nothing falls through the cracks.","ar":"فلنحدّد لقاءً دورياً حتى لا يضيع شيء."},{"i":502,"c":"Gb","s":0,"en":"I'll circulate an agenda beforehand so we use the time well.","ar":"سأوزّع جدول أعمال مسبقاً لنستغل الوقت جيداً."},{"i":503,"c":"Gb","s":0,"en":"Sorry to keep you waiting — shall we dive right in?","ar":"آسف لإبقائك منتظراً — هل نبدأ مباشرةً؟"},{"i":504,"c":"Gb","s":0,"en":"Let's park that for now and come back to it if we have time.","ar":"فلنؤجّل ذلك الآن ونعود إليه إن توفّر وقت."},{"i":505,"c":"Gb","s":0,"en":"I'll follow up with notes and action items after the call.","ar":"سأتابع بملاحظات وبنود إجرائية بعد المكالمة."},{"i":506,"c":"Gb","s":0,"en":"Let's find a time that works across both our schedules.","ar":"فلنجد وقتاً يناسب جدولينا معاً."},{"i":507,"c":"Gc","s":1,"en":"In my view, the smarter move here is to start small and scale.","ar":"في رأيي، الخطوة الأذكى هنا أن نبدأ صغيراً ثم نتوسّع."},{"i":508,"c":"Gc","s":0,"en":"If you ask me, the timing matters more than the amount.","ar":"إن سألتني، فالتوقيت يهمّ أكثر من المبلغ."},{"i":509,"c":"Gc","s":0,"en":"I'd argue the opposite, actually — and here's my reasoning.","ar":"أرى العكس في الواقع — وإليك منطقي."},{"i":510,"c":"Gc","s":0,"en":"From where I stand, that's a risk worth taking.","ar":"من موقعي، تلك مخاطرة تستحق الإقدام عليها."},{"i":511,"c":"Gc","s":0,"en":"My honest take is that you're underpricing yourself.","ar":"رأيي الصادق أنك تُسعّر نفسك بأقل من قيمتك."},{"i":512,"c":"Gc","s":0,"en":"I see it differently, but I understand where you're coming from.","ar":"أراها بشكل مختلف، لكنني أفهم وجهة نظرك."},{"i":513,"c":"Gc","s":0,"en":"There's a strong case on both sides, but I'd lean toward the conservative option.","ar":"هناك حُجّة قوية للجانبين، لكنني أميل للخيار المتحفظ."},{"i":514,"c":"Gc","s":0,"en":"I'm not entirely convinced — can you help me see what I'm missing?","ar":"لست مقتنعاً تماماً — هل تساعدني على رؤية ما يفوتني؟"},{"i":515,"c":"Gc","s":0,"en":"Honestly, I think that's the right call.","ar":"بصراحة، أعتقد أن ذلك هو القرار الصحيح."},{"i":516,"c":"Gc","s":0,"en":"That's one way to look at it, though I'd frame it differently.","ar":"تلك طريقة للنظر إليها، رغم أنني سأصوغها بشكل مختلف."},{"i":517,"c":"Gc","s":0,"en":"My instinct says wait, but I'd want to see the numbers first.","ar":"حدسي يقول انتظر، لكنني أريد رؤية الأرقام أولاً."},{"i":518,"c":"Gc","s":0,"en":"I respect that view, even though I don't fully share it.","ar":"أحترم هذا الرأي، رغم أنني لا أشاركه تماماً."},{"i":519,"c":"Gc","s":0,"en":"If I'm being candid, I think there's a  — let's continue it sometime.","ar":"استمتعت حقاً بمحادثتنا — فلنكملها في وقت ما."},{"i":578,"c":"Gg","s":0,"en":"Feel free to connect with me on LinkedIn.","ar":"لا تتردد في التواصل معي على لينكدإن."},{"i":579,"c":"Gg","s":0,"en":"Who would be the best person to talk to about that?","ar":"من سيكون أفضل شخص للتحدث معه بشأن ذلك؟"},{"i":580,"c":"Gg","s":0,"en":"Thanks for the introduction — I appreciate you thinking of me.","ar":"شكراً على التعريف — أقدّر تفكيرك بي."},{"i":581,"c":"Gg","s":0,"en":"If there's ever a way I can help you, don't hesitate to ask.","ar":"إن كان هناك يوماً ما أستطيع به مساعدتك، فلا تتردد في الطلب."},{"i":582,"c":"Gg","s":0,"en":"I've heard great things about your work.","ar":"سمعت أموراً رائعة عن عملك."},{"i":583,"c":"Gg","s":0,"en":"Let's grab a coffee and talk shop sometime.","ar":"فلنحتسِ قهوة ونتحدث عن العمل في وقت ما."},{"i":584,"c":"Gg","s":0,"en":"It was a pleasure meeting you — I hope our paths cross again.","ar":"كان من دواعي سروري لقاؤك — أتمنى أن تتقاطع طرقنا مجدداً."},{"i":585,"c":"Gg","s":0,"en":"I'll send you that resource I mentioned.","ar":"سأرسل لك ذلك المصدر الذي ذكرته."},{"i":586,"c":"Gg","s":0,"en":"Mind if I reach out if a relevant opportunity comes up?","ar":"هل تمانع إن تواصلت معك حين تظهر فرصة ذات صلة؟"},{"i":587,"c":"Gh","s":1,"en":"Let's talk numbers — what budget are you working with?","ar":"فلنتحدث عن الأرقام — ما الميزانية التي تعمل ضمنها؟"},{"i":588,"c":"Gh","s":0,"en":"That comes to roughly twelve hundred a month, all in.","ar":"يبلغ ذلك نحو 1200 شهرياً، شاملاً كل شيء."},{"i":589,"c":"Gh","s":0,"en":"Let's round that to the nearest thousand to keep it simple.","ar":"فلنقرّب ذلك لأقرب ألف لإبقائه بسيطاً."},{"i":590,"c":"Gh","s":0,"en":"We're looking at a fifteen percent increase year over year.","ar":"ننظر إلى زيادة 15% عاماً بعد عام."},{"i":591,"c":"Gh","s":0,"en":"That's well within budget — actually, it leaves room to spare.","ar":"هذا ضمن الميزانية تماماً — في الواقع، يترك هامشاً فائضاً."},{"i":592,"c":"Gh","s":0,"en":"The total works out to about thirty thousand over the year.","ar":"الإجمالي يصل إلى نحو 30 ألفاً على مدار العام."},{"i":593,"c":"Gh","s":0,"en":"Let me break the cost down line by line so it's transparent.","ar":"دعني أفصّل التكلفة بنداً بنداً لتكون شفّافة."},{"i":594,"c":"Gh","s":0,"en":"We can spread the payments quarterly if that helps your cash flow.","ar":"يمكننا توزيع الدفعات ربع سنوية إن كان ذلك يساعد تدفقك النقدي."},{"i":595,"c":"Gh","s":0,"en":"The return more than justifies the upfront cost.","ar":"العائد يبرّر التكلفة المُقدّمة بأكثر من كافٍ."},{"i":596,"c":"Gh","s":0,"en":"Let's compare the cost per unit, not just the total price.","ar":"فلنقارن التكلفة لكل وحدة، لا السعر الإجمالي فقط."},{"i":597,"c":"Gh","s":0,"en":"At that rate, it pays for itself within six months.","ar":"بهذا المعدل، تسترد قيمتها خلال ستة أشهر."},{"i":598,"c":"Gh","s":0,"en":"Give or take a few percent, that's the ballpark.","ar":"بزيادة أو نقصان بضع نقاط مئوية، هذا هو التقدير التقريبي."},{"i":599,"c":"Gh","s":0,"en":"Let's make sure we're comparing apples to apples on price.","ar":"فلنتأكد أننا نقارن المثيل بالمثيل في السعر."},{"i":600,"c":"Gh","s":0,"en":"The margin is thin, so volume is what makes it work.","ar":"الهامش رفيع، فالحجم هو ما يجعلها مُجدية."},{"i":601,"c":"Gh","s":0,"en":"Let's run the numbers before we commit to anything.","ar":"فلنحسب الأرقام قبل أن نلتزم بأي شيء."},{"i":602,"c":"Gh","s":0,"en":"Even on conservative assumptions, the math holds up.","ar":"حتى بافتراضات متحفظة، الحساب يصمد."},{"i":603,"c":"A","s":0,"en":"Let's make the most of these few minutes — where would you like to start?","ar":"فلنستغل هذه الدقائق القليلة — من أين تحب أن نبدأ؟"},{"i":604,"c":"A","s":0,"en":"I read through your message carefully before this call.","ar":"قرأت رسالتك بعناية قبل هذه المكالمة."},{"i":605,"c":"A","s":0,"en":"Tell me a bit about the business and what brought you here.","ar":"أخبرني قليلاً عن النشاط وما الذي أتى بك إلى هنا."},{"i":606,"c":"B","s":0,"en":"What's your end goal — is this about growth, survival, or an opportunity you can't miss?","ar":"ما هدفك النهائي — هل يتعلق بالنمو أم البقاء أم فرصة لا يمكنك تفويتها؟"},{"i":607,"c":"B","s":0,"en":"How much of your own capital are you prepared to put in?","ar":"كم من رأس مالك الخاص أنت مستعد لوضعه؟"},{"i":608,"c":"B","s":0,"en":"Have you worked with a lender before, or is this your first time?","ar":"هل تعاملت مع مقرض من قبل، أم أنها مرتك الأولى؟"},{"i":609,"c":"B","s":0,"en":"What's your timeline looking like — is there a hard deadline driving this?","ar":"كيف يبدو جدولك الزمني — هل هناك موعد نهائي صارم يدفع هذا؟"},{"i":610,"c":"C","s":0,"en":"Let me tell you what I'd be worried about if I were underwriting this.","ar":"دعني أخبرك بما كنت سأقلق بشأنه لو كنت أكتتب هذا."},{"i":611,"c":"C","s":0,"en":"The lender doesn't care how hard you worked — they care whether the cash repays the loan.","ar":"المقرض لا يهتم بكم اجتهدت — بل بإن كان النقد يسدّد القرض."},{"i":612,"c":"C","s":0,"en":"What looks obvious to you may be a question mark to a stranger reading your file cold.","ar":"ما يبدو بديهياً لك قد يكون علامة استفهام لغريب يقرأ ملفك للمرة الأولى."},{"i":613,"c":"D","s":0,"en":"I don't just hand you a document — I prepare you for the conversation that follows.","ar":"لا أُسلّمك مستنداً فحسب — بل أُجهّزك للمحادثة التي تليه."},{"i":614,"c":"D","s":0,"en":"My job is to make your file the easiest decision on the underwriter's desk.","ar":"مهمتي أن أجعل ملفك أسهل قرار على مكتب المُكتتِب."},{"i":615,"c":"D","s":0,"en":"The model is the entry point; the strategy around it is the real product.","ar":"النموذج هو نقطة الدخول؛ والاستراتيجية حوله هي المنتج الحقيقي."},{"i":616,"c":"E","s":0,"en":"I'll tell you honestly if your deal isn't ready — I won't waste your money.","ar":"سأخبرك بصدق إن لم تكن صفقتك جاهزة — لن أُهدر مالك."},{"i":617,"c":"E","s":0,"en":"My reputation depends on your file getting approved, not just delivered.","ar":"سمعتي تعتمد على اعتماد ملفك، لا مجرد تسليمه."},{"i":618,"c":"F","s":0,"en":"Let's separate cost from value — what's getting funded matters more than what you pay me.","ar":"فلنفصل التكلفة عن القيمة — ما سيُموّل يهمّ أكثر مما تدفعه لي."},{"i":619,"c":"F","s":0,"en":"A rejected application costs you months — that's the real price to weigh.","ar":"طلب مرفوض يكلّفك شهوراً — تلك هي التكلفة الحقيقية التي يجب موازنتها."},{"i":620,"c":"F","s":0,"en":"I price by the value of the outcome, not by the hours it takes me.","ar":"أُسعّر بقيمة النتيجة، لا بالساعات التي تستغرقها مني."},{"i":621,"c":"G","s":0,"en":"A tool formats your file; I make sure it survives a skeptical credit officer.","ar":"أداة تُنسّق ملفك؛ وأنا أتأكد أنه ينجو من ضابط ائتمان متشكّك."},{"i":622,"c":"G","s":0,"en":"The judgment of someone who's said no a thousand times can't be automated.","ar":"حُكم شخص قال \"لا\" ألف مرة لا يمكن أتمتته."},{"i":623,"c":"H","s":0,"en":"Let's be clear on deliverables up front so expectations match on both sides.","ar":"فلنكن واضحين بشأن المُخرجات مسبقاً لتتطابق التوقعات على الجانبين."},{"i":624,"c":"H","s":0,"en":"Anything beyond this scope, we'll treat as a separate, agreed phase.","ar":"أي شيء يتجاوز هذا النطاق، سنعتبره مرحلة منفصلة متفقاً عليها."},{"i":625,"c":"I","s":0,"en":"If you're comfortable, let's lock in the start date and get moving.","ar":"إن كنت مرتاحاً، فلنثبّت تاريخ البدء ونتحرّك."},{"i":626,"c":"I","s":0,"en":"What's holding you back from saying yes today?","ar":"ما الذي يمنعك من قول نعم اليوم؟"},{"i":627,"c":"I","s":0,"en":"I'll send the agreement now, and we can begin as soon as it's signed.","ar":"سأرسل الاتفاقية الآن، ويمكننا البدء بمجرد توقيعها."},{"i":628,"c":"J","s":0,"en":"The request is well-supported by historical cash flow and a credible projection.","ar":"الطلب مدعوم جيداً بتدفق نقدي تاريخي وتوقّع موثوق."},{"i":629,"c":"J","s":0,"en":"We're presenting a borrower with relevant experience and adequate liquidity.","ar":"نقدّم مقترضاً ذا خبرة ذات صلة وسيولة كافية."},{"i":630,"c":"J","s":0,"en":"The structure keeps the global DSCR above the bank's threshold in every year.","ar":"الهيكل يُبقي الـ DSCR الكلي فوق عتبة البنك في كل سنة."},{"i":631,"c":"K","s":0,"en":"Let me pull the exact figure so I don't give you a number off the top of my head.","ar":"دعني أستخرج الرقم الدقيق حتى لا أعطيك رقماً من ذاكرتي."},{"i":632,"c":"K","s":0,"en":"That deserves a proper answer — give me a moment to think it through.","ar":"ذلك يستحق إجابة لائقة — أمهلني لحظة لأفكّر فيه."},{"i":633,"c":"L","s":0,"en":"Thank you for considering me for this — I don't take it for granted.","ar":"شكراً لأخذي في الاعتبار لهذا — لا أعتبره أمراً مسلّماً به."},{"i":634,"c":"L","s":0,"en":"I'm glad we could connect today.","ar":"يسعدني أننا تمكّنا من التواصل اليوم."},{"i":635,"c":"M","s":0,"en":"Agreed — let's run with that.","ar":"متفقان — فلنمضِ بذلك."},{"i":636,"c":"M","s":0,"en":"That works for me.","ar":"هذا يناسبني."},{"i":637,"c":"N","s":0,"en":"Before I answer, let me make sure I understand the question fully.","ar":"قبل أن أُجيب، دعني أتأكد أنني فهمت السؤال بالكامل."},{"i":638,"c":"N","s":0,"en":"When you say 'soon,' what timeframe are we talking about?","ar":"عندما تقول \"قريباً\"، عن أي إطار زمني نتحدث؟"},{"i":639,"c":"O","s":0,"en":"That leads nicely into the next thing I wanted to cover.","ar":"هذا يقود بسلاسة إلى الأمر التالي الذي أردت تغطيته."},{"i":640,"c":"O","s":0,"en":"Let's set that aside for a moment and come back to it.","ar":"فلنضع ذلك جانباً للحظة ونعود إليه."},{"i":641,"c":"P","s":0,"en":"I've done this many times — trust the process.","ar":"فعلت هذا مرات عديدة — ثق بالعملية."},{"i":642,"c":"P","s":0,"en":"Let me give you my straight, professional opinion.","ar":"دعني أعطيك رأيي المهني المباشر."},{"i":643,"c":"P","s":0,"en":"If this were my own file, here's exactly what I'd do.","ar":"لو كان هذا ملفي الخاص، إليك بالضبط ما كنت سأفعله."},{"i":644,"c":"B","s":0,"en":"Walk me through a typical month — your busiest and your slowest.","ar":"اشرح لي شهراً نموذجياً — أكثره ازدحاماً وأقله."},{"i":645,"c":"B","s":0,"en":"Are there any obligations or debts not showing on the statements?","ar":"هل هناك التزامات أو ديون لا تظهر في القوائم؟"},{"i":646,"c":"C","s":0,"en":"We're going to anticipate the committee's objections and answer them in advance.","ar":"سنتوقّع اعتراضات اللجنة ونُجيبها مسبقاً."},{"i":647,"c":"C","s":0,"en":"A lender funds confidence — our whole job is to build that confidence on paper.","ar":"المقرض يموّل الثقة — ومهمتنا كلها بناء تلك الثقة على الورق."},{"i":648,"c":"D","s":0,"en":"By the time you walk into that bank, you'll know every question before it's asked.","ar":"حين تدخل ذلك البنك، ستعرف كل سؤال قبل أن يُطرح."},{"i":649,"c":"I","s":0,"en":"Let's get you funded — that's what this is all about.","ar":"فلنحصل لك على التمويل — هذا هو جوهر الأمر كله."},{"i":650,"c":"F","s":0,"en":"I'd rather earn your trust on a small project than oversell on a big one.","ar":"أفضّل أن أكسب ثقتك في مشروع صغير على أن أُبالغ في بيع مشروع كبير."},{"i":651,"c":"E","s":0,"en":"Let the sample do the talking — judge me on the work.","ar":"دع النموذج يتكلم — احكم عليّ بالعمل."},{"i":652,"c":"J","s":0,"en":"Collateral coverage is adequate, and the personal guarantee adds a secondary source.","ar":"تغطية الضمان كافية، والكفالة الشخصية تضيف مصدراً ثانوياً."},{"i":653,"c":"A","s":0,"en":"I appreciate you taking the time — let's make it worth your while.","ar":"أقدّر تخصيصك الوقت — فلنجعله يستحق العناء."},{"i":654,"c":"C","s":0,"en":"The story your numbers tell is more important than the numbers themselves.","ar":"القصة التي ترويها أرقامك أهم من الأرقام نفسها."},{"i":655,"c":"D","s":0,"en":"Think of me as the translator between your business and the lender's language.","ar":"اعتبرني المترجم بين نشاطك ولغة المقرض."},{"i":656,"c":"P","s":0,"en":"You're in good hands — this is exactly what I do.","ar":"أنت في أيدٍ أمينة — هذا تحديداً ما أفعله."},{"i":657,"c":"I","s":0,"en":"Shall we take the first step together?","ar":"هل نأخذ الخطوة الأولى معاً؟"},{"i":658,"c":" re expanding the scope.","ar":"يمكننا البدء بتقييم مركّز قبل توسيع النطاق."},{"i":1188,"c":"L1s19","s":0,"en":"I'd be happy to outline a proposed engagement structure.","ar":"يسعدني أن أعرض هيكلاً مقترحاً للتعاقد."},{"i":1189,"c":"L1s19","s":0,"en":"I can prepare a detailed plan for your review.","ar":"يمكنني إعداد خطة تفصيلية لمراجعتك."},{"i":1190,"c":"L1s19","s":0,"en":"We can develop a roadmap based on today's discussion.","ar":"يمكننا وضع خارطة طريق بناءً على نقاش اليوم."},{"i":1191,"c":"L1s20","s":1,"en":"Does that approach align with your expectations?","ar":"هل يتوافق هذا النهج مع توقعاتك؟"},{"i":1192,"c":"L1s20","s":0,"en":"How does that sound from your perspective?","ar":"كيف يبدو ذلك من وجهة نظرك؟"},{"i":1193,"c":"L1s20","s":0,"en":"Would that address the concerns we discussed today?","ar":"هل سيعالج ذلك المخاوف التي ناقشناها اليوم؟"},{"i":1194,"c":"L1s20","s":0,"en":"Do you feel this direction makes sense for the business?","ar":"هل تشعر أن هذا الاتجاه منطقي للنشاط؟"},{"i":1195,"c":"L1s20","s":0,"en":"Is there anything that would prevent us from moving forward?","ar":"هل هناك ما قد يمنعنا من المضي قدماً؟"},{"i":1196,"c":"L1s20","s":0,"en":"What additional information would help you make a decision?","ar":"ما المعلومات الإضافية التي ستساعدك على اتخاذ القرار؟"},{"i":1197,"c":"L1s20","s":0,"en":"Are there any concerns we haven't addressed yet?","ar":"هل هناك مخاوف لم نعالجها بعد؟"},{"i":1198,"c":"L1s20","s":0,"en":"What would you need to see in a proposal?","ar":"ما الذي تحتاج أن تراه في العرض؟"},{"i":1199,"c":"L1s20","s":0,"en":"Would it be helpful if I prepared a formal recommendation?","ar":"هل سيكون مفيداً أن أُعدّ توصية رسمية؟"},{"i":1200,"c":"L1s20","s":0,"en":"I appreciate your time today, and I look forward to continuing the conversation.","ar":"أقدّر وقتك اليوم، وأتطلع لمواصلة الحديث."},{"i":1201,"c":"L2s01","s":1,"en":"My focus is not simply delivering a report; it's helping you make a better decision.","ar":"تركيزي ليس مجرد تسليم تقرير، بل مساعدتك  believe disciplined analysis leads to better outcomes.","ar":"أؤمن بأن التحليل المنضبط يقود إلى نتائج أفضل."},{"i":1215,"c":"L2s02","s":0,"en":"Every recommendation should be supported by evidence.","ar":"كل توصية يجب أن تكون مدعومة بالدليل."},{"i":1216,"c":"L2s02","s":0,"en":"I prefer to challenge assumptions before capital is deployed.","ar":"أفضّل اختبار الافتراضات قبل ضخّ رأس المال."},{"i":1217,"c":"L2s02","s":0,"en":"My approach is built around identifying both opportunities and risks.","ar":"نهجي مبني على تحديد الفرص والمخاطر معاً."},{"i":1218,"c":"L2s02","s":0,"en":"I believe execution risk deserves as much attention as financial risk.","ar":"أعتقد أن مخاطر التنفيذ تستحق نفس اهتمام المخاطر المالية."},{"i":1219,"c":"L2s02","s":0,"en":"My objective is to help clients make informed decisions.","ar":"هدفي مساعدة العملاء على اتخاذ قرارات مدروسة."},{"i":1220,"c":"L2s02","s":0,"en":"I approach every engagement with a long-term perspective.","ar":"أتعامل مع كل تعاقد بمنظور طويل الأجل."},{"i":1221,"c":"L2s03","s":0,"en":"Clients typically engage me when the decision carries meaningful financial consequences.","ar":"عادةً يتعاقد العملاء معي حين يكون للقرار عواقب مالية مؤثرة."},{"i":1222,"c":"L2s03","s":0,"en":"The situations I work on often involve significant uncertainty.","ar":"المواقف التي أعمل عليها غالباً تنطوي على قدر كبير من عدم اليقين."},{"i":1223,"c":"L2s03","s":0,"en":"My work is intended to support high-quality decision making.","ar":"عملي يهدف إلى دعم اتخاذ قرارات عالية الجودة."},{"i":1224,"c":"L2s03","s":0,"en":"I specialize in situations where careful analysis is critical.","ar":"أتخصص في المواقف التي يكون فيها التحليل الدقيق حاسماً."},{"i":1225,"c":"L2s03","s":1,"en":"The goal is not simply obtaining financing, but obtaining the right financing.","ar":"الهدف ليس الحصول على تمويل فقط، بل الحصول على التمويل المناسب."},{"i":1226,"c":"L2s03","s":0,"en":"A successful transaction begins with proper preparation.","ar":"الصفقة الناجحة تبدأ بإعداد سليم."},{"i":1227,"c":"L2s03","s":0,"en":"Strong underwriting starts long before a lender reviews the file.","ar":"الاكتتاب القوي يبدأ قبل أن يراجع المقرض الملف بوقت طويل."},{"i":1228,"c":"L2s03","s":0,"en":"A well-prepared borrower is often in a stronger negotiating position.","ar":"المقترض المُعَدّ جيداً غالباً يكون في موقف تفاوضي أقوى."},{"i":1229,"c":"L2s03","s":1,"en":"Good decisions are rarely the result of guesswork.","ar":"القرارات الجيدة نادراً ما تكون نتيجة تخمين."},{"i":1230,"c":"L2s03","s":0,"en":"The strongest transactions are usually supported by strong analysis.","ar":"أقوى الصفقات عادةً تكون مدعومة بتحليل قوي."},{"i":1231,"c":"L2s04","s":0,"en":"I believe my approach combines technical rigor with practical business judgment.","ar":"أعتقد أن نهجي يجمع بين الصرامة الفنية والحكم العملي على النشاط."},{"i":1232,"c":"L2s04","s":0,"en":"I focus on understanding the business before proposing solutions.","ar":"أركّز على فهم النشاط قبل اقتراح الحلول."},{"i":1233,"c":"L2s04","s":0,"en":"I prioritize quality over shortcuts.","ar":"أقدّم الجودة على الطرق المختصرة."},{"i":1234,"c":"L2s04","s":0,"en":"I aim to provide recommendations that remain useful long after the engagement ends.","ar":"أسعى لتقديم توصيات تظل مفيدة بعد انتهاء التعاقد بوقت طويل."},{"i":1235,"c":"L2s04","s":0,"en":"My goal is to become a trusted advisor rather than a one-time service provider.","ar":"هدفي أن أصبح مستشاراً موثوقاً لا مقدّم خدمة لمرة واحدة."},{"i":1236,"c":"L2s04","s":0,"en":"I take ownership of the quality of my work.","ar":"أتحمّل مسؤولية جودة عملي."},{"i":1237,"c":"L2s04","s":0,"en":"I believe clear communication is just as important as strong analysis.","ar":"أؤمن بأن التواصل الواضح لا يقل أهمية عن التحليل القوي."},{"i":1238,"c":"L2s04","s":0,"en":"I strive to make complex topics understandable and actionable.","ar":"أسعى لجعل الموضوعات المعقدة مفهومة وقابلة للتنفيذ."},{"i":1239,"c":"L2s04","s":0,"en":"I focus on helping clients avoid costly mistakes.","ar":"أركّز على مساعدة العملاء على تجنب
