function buildSession(force){
  const o=S.opts;
  if(o.paused) return {ids:[],paused:1};
  // جلسة اليوم محفوظة؟ استكملها
  if(!force && S.sess.date===TODAY && S.sess.ids.length)
    return {ids:S.sess.ids,resumed:1,done:S.sess.done};
  const due=dueIds().sort((a,b)=>{
    const ca=S.srs[a],cb=S.srs[b];
    if(ca.due!==cb.due)return ca.due<cb.due?-1:1;
    return (cb.f-ca.f)||(ca.l-cb.l)});
  const rev=due.slice(0,o.reviewCap);
  const room=Math.max(0,o.sessionCap-rev.length);
  const fresh=shuffle(newIds()).slice(0,Math.min(o.newPerDay,room));
  const ids=shuffle(rev.concat(fresh));
  S.sess={date:TODAY,done:0,total:ids.length,ids};
  save();
  return {ids,fresh:fresh.length,rev:rev.length}}

function sessionInfo(){
  const b=buildSession();
  if(b.paused) return {paused:1,total:0,done:0,left:0};
  const done=S.sess.date===TODAY?S.sess.done:0;
  const total=S.sess.ids.length;
  let nw=0,rv=0,wk=0;
  const weak=new Set(weakIds());
  S.sess.ids.forEach(i=>{ if(!S.srs[i]||S.srs[i].n===0)nw++; else rv++; if(weak.has(i))wk++ });
  return {total,done,left:Math.max(0,total-done),nw,rv,wk,
          mins:Math.max(1,Math.round(total*0.6))}}

function sessionAdvance(){
  if(S.sess.date!==TODAY)return;
  S.sess.done=Math.min(S.sess.total,S.sess.done+1);
  if(S.sess.done>=S.sess.total) completeDay();
  save()}
function completeDay(){
  const st=S.stats;
  if(st.lastDay===TODAY) return;
  const y=addDays(TODAY,-1);
  st.streak = (st.lastDay===y)? st.streak+1 : 1;
  if(st.streak>st.best) st.best=st.streak;
  st.lastDay=TODAY; st.sessions++;
  save()}

const norm=s=>String(s||'').toLowerCase().replace(/[^\w\s']/g,' ').replace(/\s+/g,' ').trim();
function scorePron(target,said){
  const T1=norm(target).split(' ').filter(Boolean);
  const S1=norm(said).split(' ').filter(Boolean);
  const pool=S1.slice(); const marks=[]; let hit=0;
  T1.forEach(w=>{
    const k=pool.indexOf(w);
    if(k>=0){pool.splice(k,1);hit++;marks.push({w,ok:1})}
    else{
      const near=pool.findIndex(x=>x.length>3&&w.length>3&&(x.startsWith(w.slice(0,4))||w.startsWith(x.slice(0,4))));
      if(near>=0){pool.splice(near,1);hit+=0.5;marks.push({w,ok:1,near:1})}
      else marks.push({w,ok:0})}});
  const pct=T1.length?Math.round(hit/T1.length*100):0;
  return {pct,marks,said:String(said||'')}}

function scoreVoice(v){

  if(/en[-_]us/i.test(v.lang))s+=1000; else if(/en[-_]ca/i.test(v.lang))s+=400;
  else if(/^en/i.test(v.lang))s+=150; else return -9999;
  if(/network/.test(t))s+=600;
  if(/neural|natural|premium|wavenet|studio/.test(t))s+=500;
  if(/enhanced/.test(t))s+=350;
  if(/siri/.test(t))s+=300;
  if(/google/.test(t))s+=180;
  if(v.localService===false)s+=120;
  if(/compact/.test(t))s-=350;
  if(/espeak|pico|festival/.test(t))return -5000;
  return s}

const FEM=/female|zira|samantha|victoria|susan|karen|moira|tessa|fiona|hazel|catherine|jenny|aria|nicole|serena|allison|ava|joanna|salli|kendra|kimberly|amy|emma|woman/i;
const MAL=/male|david|mark|guy|daniel|fred|alex|aaron|arthur|eric|rishi|james|john|tom|matthew|justin|joey|brian|ryan|christopher/i;
function guessGender(v){const n=v.name||'';
  if(FEM.test(n))return'f'; if(MAL.test(n))return'm';
  const u=(v.voiceURI||'').toLowerCase();

  if(/x-(iob|iol|sfg|tpf)-/.test(u))return'f';
  return'?'}

  const sy=window.speechSynthesis; if(!sy)return false;
  const vs=sy.getVoices(); if(!vs.length)return false;
  VOICES=vs.filter(v=>/^en/i.test(v.lang)).map(v=>({v,score:scoreVoice(v),g:guessGender(v)}))
           .sort((a,b)=>b.score-a.score);
  if(!VOICES.length)return false;
  const byURI=u=>u?(VOICES.find(x=>x.v.voiceURI===u)||null):null;
  const m=byURI(VP().maleURI)||VOICES.find(x=>x.g==='m')||VOICES.find(x=>x.g!=='f')||VOICES[0];
  const f=byURI(VP().femaleURI)||VOICES.find(x=>x.g==='f'&&x.v!==m.v)||VOICES.find(x=>x.v!==m.v)||m;
  voiceA=m.v; voiceB=f.v; voiceName=voiceA.name;

  const u=new SpeechSynthesisUtterance(polish(text));
  u.lang='en-US'; u.rate=clampR(rate||VP().rate); u.pitch=activePitch(w); u.volume=1;

  if(opt.onstart)u.onstart=opt.onstart;

/* ═══════════ 23. مشغّل الجلسة ═══════════ */
let SESS={on:0,ids:[],k:0,mode:'',revealed:0,phase:'ask',result:null,busy:0};

function startSession(){
  const b=buildSession();
  if(b.paused){openSheet('opts');return}
  if(!b.ids.length){toast(t('noDue'));return}
  const done=S.sess.date===TODAY?S.sess.done:0;
  SESS={on:1,ids:b.ids.slice(),k:Math.min(done,b.ids.length-1),mode:'',revealed:0,phase:'ask',result:null,busy:0};
  if(done>=b.ids.length)SESS.k=0;
  nextCard(1);
}
function nextCard(first){
  if(SESS.k>=SESS.ids.length){endSession();return}
  const i=SESS.ids[SESS.k];
  SESS.mode=askMode(i); SESS.revealed=(SESS.mode!=='noText'); SESS.phase='ask'; SESS.result=null;
  draw();
  if(SESS.mode!=='noText') setTimeout(()=>sayCur(),first?420:260);
}
const curId=()=>SESS.ids[SESS.k];
const curPh=()=>PHBY[curId()];
function sayCur(rate){const p=curPh();if(p)say(p.en,{rate})}

function vSession(){
  const p=curPh(); if(!p) return '';
  const total=SESS.ids.length, k=SESS.k;
  const pct=total?(k/total*100):0;
  const l=lvOf(p.i);
  let body,acts;

  if(SESS.phase==='result'){
    const r=SESS.result, good=r.pct>=70;
    const marks=r.marks.map(m=>`<span class="mk${m.ok?(m.near?' near':''):' bad'}">${esc(m.w)}</span>`).join(' ');
    body=`<div class="qcard">
      <div class="ctr"><div class="scorebig" style="color:${good?'var(--emerald)':r.pct>=45?'var(--gold)':'var(--red)'}">${N0(r.pct)}%</div>
        <div class="q-hint">${esc(good?t('scoreGreat'):r.pct>=45?t('scoreOk'):t('scoreLow'))}</div></div>
      <div class="mkwrap mt12">${marks}</div>
      ${r.said?`<div class="mkheard">${esc(t('heard'))}: "${esc(r.said)}"</div>`:''}
      ${SESS.lvMove?`<div class="note ${SESS.lvMove.up?'g':'r'} mt12">
        ${esc(SESS.lvMove.up?t('promoted'):t('demoted'))} <b>${esc(lvName(SESS.lvMove.after))}</b>
        — ${esc(lvDesc(SESS.lvMove.after))}</div>`:''}
      <div class="ph-en mt12" style="font-size:calc(14px*var(--fs));color:var(--mute)">${esc(p.en)}</div>
    </div>`;
    acts=`<div class="rowbtns">
      <button class="bigbtn" data-act="sayCur">${ico('sound',18)} ${esc(t('listen'))}</button>
      <button class="bigbtn gold" data-act="sessNext">${esc(t('next'))} ←</button></div>`;
  }
  else if(SESS.mode==='recognize'){
    body=`<div class="qcard">
      <div class="eyebrow mb8">${esc(t('lv0'))} · ${esc(t('lv1d'))}</div>
      <div class="q-en">${esc(p.en)}</div>
      <div class="q-ar mt12">${esc(p.ar||'')}</div>
      <div class="q-hint">${isAr()?'اسمعها كويس، وبعدين قول فهمتها':'Listen carefully, then confirm'}</div>
    </div>`;
    acts=`<button class="bigbtn" data-act="sayCur">${ico('sound',18)} ${esc(t('listen'))}</button>
      <div class="rowbtns">
        <button class="bigbtn" data-act="grade" data-ok="0">${esc(t('notYet'))}</button>
        <button class="bigbtn em" data-act="grade" data-ok="1">${ico('check',17)} ${esc(t('understood'))}</button></div>`;
  }
  else{
    const noText=SESS.mode==='noText';
    body=`<div class="qcard">
      <div class="eyebrow mb8">${lvChip(l)}</div>
      ${noText&&!SESS.revealed
        ? `<div class="q-ar">${esc(p.ar||'')}</div>
           <div class="q-en q-blur mt12" data-act="reveal">${esc(p.en)}</div>
           <div class="q-hint">${isAr()?'قولها بالإنجليزي من غير ما تبص':'Say it in English without looking'}</div>`
        : `<div class="q-en">${esc(p.en)}</div>
           <div class="q-ar mt12">${esc(p.ar||'')}</div>`}
    </div>`;
    acts=`<button class="bigbtn ${SESS.busy?'rec':'gold'}" data-act="record">
        ${ico('mic',18)} ${esc(SESS.busy?t('listening'):t('sayIt'))}</button>
      <div class="rowbtns">
        <button class="bigbtn" data-act="sayCur">${ico('sound',17)} ${esc(t('listen'))}</button>
        ${noText&&!SESS.revealed
          ? `<button class="bigbtn" data-act="reveal">${esc(t('showText'))}</button>`
          : `<button class="bigbtn" data-act="skip">${esc(t('skip'))}</button>`}</div>`;
  }

  return `<div class="sess"><div class="sess-top">
      <button class="ib" data-act="endSess">✕</button>
      <div class="sess-prog"><i style="width:${pct}%"></i></div>
      <span class="sess-cnt">${N0(k+1)}/${N0(total)}</span>
    </div>
    <div class="sess-body"><div class="sess-mid">${body}</div>
      <div class="sess-acts">${acts}</div></div></div>`}

function doRecord(){
  if(SESS.busy)return;
  if(!micAvailable()){toast(t('micNo'));return}
  SESS.busy=1; draw();
  const p=curPh();
  listen(said=>{
    const r=scorePron(p.en,said);
    S.stats.tested++; S.stats.scoreSum+=r.pct; S.stats.scoreCount++;
    const ok=r.pct>=70;
    const mv=grade(p.i,ok,SESS.revealed&&SESS.mode==='noText'?'withText':SESS.mode,r.pct);
    SESS.result=r; SESS.lvMove=(mv.up||mv.down)?mv:null; SESS.phase='result'; SESS.busy=0;
    SND.fx(ok?'correct':'wrong'); buzz(ok?[12,40]:[30]);
    if(mv.up){SND.fx('up');
      if(mv.after===4){SND.fx('big');celebrate(lvName(4)+' ✦',p.en.slice(0,42)+'…',1)}}
    save(); draw();
  },err=>{
    SESS.busy=0;
    toast(err==='not-allowed'||err==='service-not-allowed'?t('micDenied'):t('micNo'));
    draw();
  },()=>{ if(SESS.busy){SESS.busy=0;draw()} });
}
function gradeManual(ok){
  const p=curPh();
  const mv=grade(p.i,ok,'recognize',ok?80:0);
  SND.fx(ok?'correct':'wrong');
  if(mv.up)SND.fx('up');
  sessionAdvance(); SESS.k++; nextCard();
}
function sessNext(){ sessionAdvance(); SESS.k++; nextCard() }
function endSession(){
  const si=sessionInfo();
  SESS.on=0; stopSpeak(); stopListen();
  if(si.left===0&&si.total>0){
    SND.fx('day');
    const st=S.stats;
    celebrate(t('sessionDone'), t('tomorrow')+' '+N0(tomorrowCount())+' '+t('phrase'), st.streak%7===0&&st.streak>0);
    if(st.streak>0&&st.streak%7===0)setTimeout(()=>SND.fx('big'),700);
  }
  draw();
}

      <span class="clbody"><b>${esc(t('fav'))}</b><span>${N0(dictCount().f)} ${esc(t('phrases'))}</span></span>
      <span class="clnum">${ico('play',18)}</span></button>
  </div>`}`}

function shStart(ids,title){
  if(!ids||!ids.length){toast(isAr()?'المجموعة فاضية':'Empty set');return}
  SH={on:1,ids:shuffle(ids).slice(0,40),k:0,rep:0,phase:'idle',timer:null,title:title||''};
  shStep();
}
function shStop(){
  SH.on=0; clearTimeout(SH.timer); stopSpeak(); draw();
}
function shStep(){
  if(!SH.on)return;
  const c=shCfg(), p=PHBY[SH.ids[SH.k]];
  if(!p){shStop();return}
  if(SH.rep>=c.reps){ SH.rep=0; SH.k++;
    if(SH.k>=SH.ids.length){SH.on=0;draw();SND.fx('day');
      celebrate(isAr()?'خلصت المجموعة':'Set complete','',0);return}
    SH.timer=setTimeout(shStep,700); draw(); return}

  const words=p.en.split(/\s+/).length;
  const spoken=Math.max(1200,words*(c.speed<0.8?420:c.speed<0.95?360:300));

  if(c.mode==='listen'){
    SH.phase='play'; draw();
    say(p.en,{rate:c.speed,onend:()=>{ if(!SH.on)return;
      SH.rep++; SH.timer=setTimeout(shStep,900) }});
    SH.timer=setTimeout(()=>{if(SH.on&&SH.phase==='play'){SH.rep++;shStep()}},spoken+2200);
  }
  else if(c.mode==='echo'){
    SH.phase='play'; draw();
    let advanced=false;
    const toYou=()=>{ if(!SH.on||advanced)return; advanced=true;
      SH.phase='you'; draw();
      SH.timer=setTimeout(()=>{ if(!SH.on)return; SH.rep++; shStep() }, spoken+400) };
    say(p.en,{rate:c.speed,onend:toYou});
    SH.timer=setTimeout(toYou,spoken+2400);
  }
  else{ // with — لوب متواصل
    SH.phase='with'; draw();
    say(p.en,{rate:c.speed,onend:()=>{ if(!SH.on)return;
      SH.rep++; SH.timer=setTimeout(shStep,260) }});
    SH.timer=setTimeout(()=>{if(SH.on&&SH.phase==='with'){SH.rep++;shStep()}},spoken+2400);
  }
}

  const c=CONVOS.find(x=>x.id===R.cv); if(!c)return;

  CV.playing=1; CV.idx=0; draw(); cvStep(c);

function cvStep(c){
  if(!CV.playing)return;
  const ln=(c.lines||[])[CV.idx];
  if(!ln){CV.playing=0;draw();SND.fx('day');return}
  draw();
  try{const el=document.getElementById('ln'+CV.idx);
    if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}catch(e){}
  let moved=false;
  const go=()=>{if(!CV.playing||moved)return;moved=true;CV.idx++;CV.timer=setTimeout(()=>cvStep(c),520)};
  say(ln.en,{who:ln.who==='you'?'A':'B',onend:go});
  CV.timer=setTimeout(go,Math.max(2600,ln.en.split(/\s+/).length*430+2400));
}

/* ═══════════ 28. التصدير ═══════════ */
function payload(){flush();const c=JSON.parse(JSON.stringify(S));
  c.audioNames={};Object.keys(AUD.meta).forEach(k=>c.audioNames[k]=AUD.meta[k].name);
  return JSON.stringify(c,null,1)}
async function doExport(){
  const txt=payload(), fn='bankerspeak-'+TODAY+'.json';
  try{const f=new File([txt],fn,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})&&navigator.share){
      await navigator.share({files:[f],title:'BankerSpeak backup'});toast(isAr()?'اتشاركت ✓':'Shared ✓');return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{if(window.showSaveFilePicker){
    const h=await showSaveFilePicker({suggestedName:fn,types:[{description:'JSON',accept:{'application/json':['.json']}}]});
    const w=await h.createWritable();await w.write(txt);await w.close();toast(isAr()?'اتحفظت ✓':'Saved ✓');return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{const b=new Blob([txt],{type:'application/json'});const u=URL.createObjectURL(b);
    const l=document.createElement('a');l.href=u;l.download=fn;document.body.appendChild(l);l.click();l.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){}
  const box=$('#ioBox'); if(box)box.value=txt;
  toast(isAr()?'لو مالقتوش، انسخ النص من الخانة':'If not found, copy the text below')}
function applyImport(txt){
  let o=null;try{o=JSON.parse(txt)}catch(e){return toast(isAr()?'النص مش صالح':'Invalid text')}
  if(!o||(!o.srs&&!o.dict&&!o.v))return toast(isAr()?'الملف مش من BankerSpeak':'Not a BankerSpeak backup');
  const n=Object.keys(o.srs||{}).length;
  askConfirm({t:isAr()?'استيراد النسخة؟':'Import backup?',danger:1,ok:t('import'),
    b:isAr()?`الملف فيه <b>${N0(n)}</b> جملة مسجّلة. هيستبدل كل بياناتك الحالية. مش هيتراجع.`
            :`Contains <b>${N0(n)}</b> tracked phrases. This replaces all current data and cannot be undone.`,
    fn:()=>{try{S=migrate(o);Store.corrupt=false;Store.cleared=1;save();flush();
      applyTheme();closeSheet();draw();toast(isAr()?'تم الاستيراد ✓':'Imported ✓')}
      catch(e){toast(isAr()?'تعذّر الاستيراد':'Import failed')}}})}

/* ═══════════ 29. الرجوع ═══════════ */
let histDepth=0, exitArm=0;
function pushHist(){try{history.pushState({d:++histDepth},'')}catch(e){}}
function goBack(){
  if(ASK.on){ASK={on:0};drawAsk();return true}
  if(sheetOpen()){closeSheet();return true}
  if(SESS.on){endSession();return true}
  if(SH.on){shStop();return true}
  if(CV.playing){CV.playing=0;clearTimeout(CV.timer);stopSpeak();draw();return true}
  if(NAV.length){R=NAV.pop();draw();return true}
  if(R.p!=='today'){R={p:'today'};draw();return true}
  return false}
window.addEventListener('popstate',()=>{
  if(goBack()){pushHist();return}
  if(exitArm){exitArm=0;history.back();return}
  exitArm=1; toast(t('exitWarn')); pushHist();
  setTimeout(()=>{exitArm=0},2200)});

/* ═══════════ 30. الرسم ═══════════ */
function applyTheme(){document.documentElement.dataset.theme=S.theme||'dark';
  document.documentElement.lang=S.lang; document.documentElement.dir=isAr()?'rtl':'ltr'}
function bodyHtml(){switch(R.p){
  case 'dict':    return vDict();
  case 'cluster': return vCluster();
  case 'cat':     return vCat();
  case 'studio':  return vStudio();
  case 'convos':  return vConvos();
  case 'convo':   return vConvo();
  case 'rehearse':return vRehearse();
  case 'settings':return '';
  default:        return vToday()}}
function draw(){
  applyTheme();
  const se=document.scrollingElement||document.documentElement, sc=se?se.scrollTop:0;
  if(SESS.on){$('#app').innerHTML=vSession();drawAsk();return}
  $('#app').innerHTML=vHeader()+'<main>'+bodyHtml()+'</main>'+vNav();
  if(se)se.scrollTop=sc;
  drawAsk()}
function go(p,keep){ if(!keep)NAV.push({...R}); R=p; try{window.scrollTo(0,0)}catch(e){} pushHist(); draw() }

/* ═══════════ 31. الأحداث ═══════════ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const a=el.dataset.act, d=el.dataset;
  switch(a){
   case 'nav': {const id=d.id;
     if(id==='settings'){openSheet('set');return}
     NAV=[]; R={p:id}; try{window.scrollTo(0,0)}catch(x){}; SND.fx('tap'); draw(); return}
   case 'back': goBack(); return;
   case 'cluster': SND.fx('tap'); return go({p:'cluster',cl:d.id,mode:d.mode||''});
   case 'cat': DF={q:'',filter:'all'}; SND.fx('tap'); return go({p:'cat',cat:d.id,mode:d.mode||''});
   case 'convo': CV={playing:0,idx:0,timer:null}; return go({p:'convo',cv:d.id});
   case 'rehearse': return go({p:'rehearse'});
   case 'rehGo': return rehearseGo(d.k);
   case 'filter': DF.filter=d.k; return draw();
   case 'sheet': return openSheet(d.k);
   case 'closeSheet': return closeSheet();
   case 'askYes': {const f=ASK.fn;ASK={on:0};drawAsk();if(f)try{f()}catch(x){toast('!')} return}
   case 'askNo': ASK={on:0}; return drawAsk();
   /* الجلسة */
   case 'startSess': return startSession();
   case 'endSess': return endSession();
   case 'sayCur': return sayCur();
   case 'record': return doRecord();
   case 'reveal': SESS.revealed=1; return draw();
   case 'skip': {const p=curPh(); grade(p.i,false,SESS.mode,0); SND.fx('wrong'); sessionAdvance(); SESS.k++; return nextCard()}
   case 'grade': return gradeManual(d.ok==='1');
   case 'sessNext': return sessNext();
   /* الاستوديو */
   case 'shMode': S.shadow.mode=d.k; save(); return draw();
   case 'shSpeed': S.shadow.speed=+d.v; save(); return draw();
   case 'shReps': S.shadow.reps=+d.v; save(); return draw();
   case 'shSet': {const c=CL(d.id); return shStart(phrasesOfCluster(d.id).map(p=>p.i), c?clName(c):'')}
   case 'shDue': return shStart(S.sess.ids.slice(), t('sessionToday'));
   case 'shFav': return shStart((S.dict.fav||[]).slice(), t('fav'));
   case 'shStop': return shStop();
   case 'shadowOne': {NAV.push({...R}); R={p:'studio'}; pushHist(); return shStart([+d.i], '')}
   /* المحادثات */
   case 'cvPlay': return cvPlay();
   case 'cvLine': {const c=CONVOS.find(x=>x.id===R.cv); const ln=c&&c.lines[+d.k];
     if(ln)say(ln.en,{who:ln.who==='you'?'A':'B'}); return}
   case 'cvDone': {const s=new Set(S.doneConvos||[]);
     if(s.has(R.cv))s.delete(R.cv); else {s.add(R.cv);SND.fx('day')}
     S.doneConvos=[...s]; save(); return draw()}
   /* الجمل */
   case 'say': {const p=PHBY[+d.i]; if(p){say(p.en);SND.fx('tap')} return}
   case 'dmast': {const on=dictToggle('mastered',d.i); SND.fx(on?'correct':'tap');
     if(on){const r=el.getBoundingClientRect();sparks(r.left+r.width/2,r.top+r.height/2)} return draw()}
   case 'dfav': dictToggle('fav',d.i); SND.fx('tap'); return draw();
   /* الإعداد */
   case 'ob': {const n=+d.n;
     if(n>0&&OB===1&&!S.scope.length){toast(isAr()?'اختار عنقود واحد على الأقل':'Pick at least one');return}
     OB=clamp(OB+n,0,3);
     if(OB>=3){S.onboarded=1;save();closeSheet();
       celebrate(isAr()?'يلا نبدأ':"Let's go", isAr()?'جلستك الأولى مستنياك':'Your first session awaits');return}
     return reSheet()}
   case 'scopeTog': {const s=new Set(S.scope||[]);
     if(s.has(d.id))s.delete(d.id); else s.add(d.id);
     S.scope=[...s]; S.sess={date:'',done:0,total:0,ids:[]};   // النطاق اتغيّر ← أعِد بناء الجلسة
     save(); SND.fx('tap'); return reSheet()}
   case 'lang': S.lang=d.v; save(); applyTheme(); reSheet(); return draw();
   case 'theme': S.theme=d.v; save(); applyTheme(); reSheet(); return draw();
   case 'reonboard': OB=0; S.onboarded=0; save(); return openSheet('onboard');
   /* الصوت */
   case 'vTest': {const it=VOICES.find(x=>x.v.voiceURI===d.u); if(!it)return;
     stopSpeak(); setTimeout(()=>{try{const u=new SpeechSynthesisUtterance("Let me walk you through the numbers.");
       u.lang='en-US';u.rate=clampR(VP().rate);u.pitch=basePitch();u.voice=it.v;
       window.speechSynthesis.speak(u)}catch(x){}},160); return}
   case 'vPick': {if(d.g==='f')VP().femaleURI=d.u; else VP().maleURI=d.u;
     save(); pickVoices(); toast(isAr()?'اتظبط ✓':'Set ✓'); return reSheet()}
   case 'vUse': VP().use=d.v; save(); return reSheet();
   case 'vRate': VP().rate=clampR(+d.v); save(); return reSheet();
   case 'vPitch': {const p=clampP(basePitch()+ +d.d);
     if(VP().use==='female')VP().pitchF=p; else VP().pitchM=p; save(); return reSheet()}
   case 'fxOn': S.sound.fx=+d.v?1:0; save(); if(S.sound.fx)SND.fx('correct'); return reSheet();
   /* الصوتيات */
   case 'audSlot': AUD.target=d.k; SND.buffer(d.k).then(()=>reSheet()); return openSheet('audSlot',d.k);
   case 'audPick': {AUD.target=d.k; const f=$('#faud'); if(f){f.value='';f.click()} return}
   case 'audPlay': SND.stopPreview(); SND.playFile(d.k).then(ok=>{if(!ok)toast('!')}); return;
   case 'audDel': askConfirm({t:isAr()?'حذف الملف؟':'Delete file?',danger:1,ok:t('remove'),
     b:isAr()?'الخانة هترجع للنغمة المولّدة.':'The slot returns to a generated tone.',
     fn:()=>{ADB.del(d.k).then(()=>{SND.drop(d.k);loadAudio();toast('✓')})}}); return;
   case 'audClear': askConfirm({t:isAr()?'مسح كل الصوتيات؟':'Clear all audio?',danger:1,ok:t('remove'),
     b:isAr()?'سجلك وبياناتك مش هيتأثروا.':'Your progress is unaffected.',
     fn:()=>{const ks=Object.keys(AUD.meta);Promise.all(ks.map(k=>ADB.del(k))).then(()=>{
       ks.forEach(k=>SND.drop(k));loadAudio();toast('✓')})}}); return;
   case 'audPersist': ADB.persist().then(ok=>toast(ok?'✓':(isAr()?'الجهاز مارضيش':'Device declined'))); return;
   /* الخيارات */
   case 'pauseTog': S.opts.paused=S.opts.paused?0:1;
     S.sess={date:'',done:0,total:0,ids:[]}; save(); reSheet(); return draw();
   /* البيانات */
   case 'export': return doExport();
   case 'impPick': {const f=$('#fimp'); if(f){f.value='';f.click()} return}
   case 'importText': {const b=$('#ioBox'); if(!b||!b.value.trim())return toast(isAr()?'الصق النص الأول':'Paste text first');
     return applyImport(b.value)}
   case 'copyData': {const b=$('#ioBox'); if(!b)return; b.value=payload();
     try{b.select();b.setSelectionRange(0,999999)}catch(x){}
     const ok=()=>toast(isAr()?'اتنسخ ✓':'Copied ✓');
     if(navigator.clipboard&&navigator.clipboard.writeText)
       navigator.clipboard.writeText(b.value).then(ok,()=>{try{document.execCommand('copy');ok()}catch(x){}});
     else{try{document.execCommand('copy');ok()}catch(x){}}
     return}
   case 'reset': askConfirm({t:t('reset'),danger:1,ok:t('reset'),
     b:isAr()?'هيتمسح تقدّمك كله والقاموس والإعدادات. <b>مش هيتراجع.</b>':'All progress, library marks and settings will be erased. <b>Cannot be undone.</b>',
     fn:()=>{const th=S.theme,lg=S.lang;S=fresh();S.theme=th;S.lang=lg;
       Store.corrupt=false;Store.cleared=1;save();flush();closeSheet();NAV=[];R={p:'today'};draw();toast('✓')}});
     return;
  }
});

document.addEventListener('input',e=>{const t2=e.target,d=t2.dataset;
  if(d.srch!==undefined){DF.q=t2.value;
    const main=$('main'); if(main){const sel=document.activeElement;
      main.innerHTML=bodyHtml();
      const inp=$('[data-srch]'); if(inp&&sel&&sel.dataset&&sel.dataset.srch!==undefined){
        inp.focus(); try{inp.setSelectionRange(inp.value.length,inp.value.length)}catch(x){}}}
    return}
  if(d.vol){S.sound.vol=+t2.value;SND.vol(+t2.value);save();return}});

document.addEventListener('change',e=>{const el=e.target,d=el.dataset;
  if(el.id==='fimp'&&el.files[0]){const r=new FileReader();
    r.onload=()=>applyImport(String(r.result||''));
    r.onerror=()=>toast('!'); r.readAsText(el.files[0]); return}
  if(el.id==='faud'&&el.files[0]){const f=el.files[0], sl=AUD.target; if(!sl)return;
    if(f.size>20*1048576)return toast(isAr()?'الملف كبير جداً':'File too large');
    ADB.put(sl,f,{start:0,dur:2,vol:1}).then(ok=>{
      SND.drop(sl);
      if(!ok){toast(isAr()?'تعذّر الحفظ':'Save failed');return}
      loadAudio(); SND.buffer(sl).then(b=>{reSheet();
        if(!b){toast(isAr()?'التطبيق مش عارف يقرا الملف — جرّب MP3':'Cannot decode — try MP3');return}
        SND.playFile(sl); toast(isAr()?'اترفع ✓':'Uploaded ✓')})});
    return}
  if(d.aud!==undefined){const sl=d.k;
    ADB.get(sl).then(rec=>{if(!rec)return;
      rec[d.aud]=+el.value||0;
      const file=new File([new Blob([rec.buf],{type:rec.type||'audio/mpeg'})],rec.name||'a',{type:rec.type||'audio/mpeg'});
      ADB.put(sl,file,{start:+rec.start||0,dur:+rec.dur||0,vol:rec.vol===undefined?1:+rec.vol}).then(()=>{
        SND.drop(sl);loadAudio();SND.buffer(sl).then(()=>{reSheet();SND.playFile(sl)})})});
    return}
  if(d.opt!==undefined){S.opts[d.opt]=clamp(+el.value||0,0,999);
    S.sess={date:'',done:0,total:0,ids:[]};   // الإعدادات اتغيّرت ← أعِد بناء الجلسة
    save();return}});

/* ═══════════ 32. التشغيل ═══════════ */
function boot(){
  applyTheme();
  TODAY=iso(new Date());
  if(S.sess.date!==TODAY){S.sess={date:'',done:0,total:0,ids:[]}}
  ensureVoices();
  if(window.speechSynthesis)window.speechSynthesis.onvoiceschanged=()=>{pickVoices();if(SHT.k==='voice')reSheet()};
  loadAudio();
  pushHist();
  draw();
  if(!S.onboarded){OB=0;openSheet('onboard')}
  ['click','touchstart','keydown'].forEach(ev=>window.addEventListener(ev,()=>{SND.init();SND.resume()},{once:true}));
  document.addEventListener('contextmenu',e=>{if(!e.target.closest('input,textarea'))e.preventDefault()});
  document.addEventListener('selectstart',e=>{if(!e.target.closest('input,textarea'))e.preventDefault()});
  try{if('serviceWorker'in navigator&&location.protocol.startsWith('http'))
    navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){flush();stopSpeak();if(SH.on)shStop();if(CV.playing){CV.playing=0;clearTimeout(CV.timer)}return}
  const d=iso(new Date());
  if(d!==TODAY){TODAY=d;S.sess={date:'',done:0,total:0,ids:[]};save();draw()}});
window.addEventListener('beforeunload',()=>flush());
window.addEventListener('pagehide',()=>{flush();stopSpeak()});
boot();

</script>
