<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0E1014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BankerSpeak">
<meta name="description" content="Spoken banking &amp; credit English — spaced repetition, shadowing studio, and 40 full dialogues.">
<title>BankerSpeak Pro</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ═══ الهوية: فحمي داكن + ذهبي ═══ */
:root[data-theme="dark"]{
 --bg:#0E1014; --bg2:#111419; --surf:#171B22; --surf2:#1E232C; --sunk:#0B0D11;
 --line:#262C38; --line2:#333A48;
 --tx:#EDEFF4; --mute:#98A1B2; --mute2:#6B7386;
 --gold:#D4AF37; --gold2:#F0D268; --gold-d:#8A6E1C; --gold-bg:#211B08;
 --on-gold:#14100A;
 --emerald:#2FA37C; --emerald2:#49C79C; --emerald-bg:#0C221B;
 --azure:#4A8FD4; --azure2:#6EAEE8; --azure-bg:#0C1826;
 --plum:#A868C4; --plum2:#C089D8; --plum-bg:#1A0F22;
 --violet:#8B7BE8; --violet2:#A99CF0; --violet-bg:#141130;
 --slate:#5C6577; --slate2:#7A8496; --slate-bg:#14171E;
 --red:#D45B5B; --red-bg:#241012;
 --sh:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);
 --sh-h:0 10px 40px rgba(0,0,0,.55);
 --glow:0 0 0 1px rgba(212,175,55,.18),0 8px 32px rgba(212,175,55,.09);
}
:root[data-theme="light"]{
 --bg:#F4F5F8; --bg2:#EDEFF3; --surf:#FFFFFF; --surf2:#F7F8FA; --sunk:#E9ECF1;
 --line:#DCE0E8; --line2:#C6CCD8;
 --tx:#141821; --mute:#5A6272; --mute2:#828B9C;
 --gold:#9A7A16; --gold2:#C9A227; --gold-d:#7A5F10; --gold-bg:#FAF3DC;
 --on-gold:#FFFFFF;
 --emerald:#12775A; --emerald2:#1E9B76; --emerald-bg:#DFF3EC;
 --azure:#2A6BAE; --azure2:#3E8BD4; --azure-bg:#E0EDFA;
 --plum:#7E3C9A; --plum2:#A05FC0; --plum-bg:#F3E4F9;
 --violet:#5B4AC4; --violet2:#7B6BDD; --violet-bg:#E7E4FA;
 --slate:#5C6577; --slate2:#8A93A4; --slate-bg:#E8EBF0;
 --red:#B93030; --red-bg:#FBE4E4;
 --sh:0 1px 2px rgba(20,24,33,.06),0 4px 14px rgba(20,24,33,.05);
 --sh-h:0 8px 28px rgba(20,24,33,.13);
 --glow:0 0 0 1px rgba(154,122,22,.16),0 8px 28px rgba(154,122,22,.08);
}
[data-c="gold"]   {--cc:var(--gold);   --cc2:var(--gold2);   --ccbg:var(--gold-bg)}
[data-c="emerald"]{--cc:var(--emerald);--cc2:var(--emerald2);--ccbg:var(--emerald-bg)}
[data-c="azure"]  {--cc:var(--azure);  --cc2:var(--azure2);  --ccbg:var(--azure-bg)}
[data-c="plum"]   {--cc:var(--plum);   --cc2:var(--plum2);   --ccbg:var(--plum-bg)}
[data-c="violet"] {--cc:var(--violet); --cc2:var(--violet2); --ccbg:var(--violet-bg)}
[data-c="slate"]  {--cc:var(--slate);  --cc2:var(--slate2);  --ccbg:var(--slate-bg)}
[data-c="red"]    {--cc:var(--red);    --cc2:var(--red);     --ccbg:var(--red-bg)}

:root[data-font="s"]{--fs:.92}:root[data-font="m"]{--fs:1}
:root[data-font="l"]{--fs:1.1}:root[data-font="xl"]{--fs:1.2}
:root{--fs:1;--cc:var(--gold);--cc2:var(--gold2);--ccbg:var(--gold-bg);
 --sans:'Inter',system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;
 --mono:ui-monospace,'SF Mono',Menlo,monospace;
 --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
 --r:18px;--rs:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
/* منع التظليل والقائمة السياقية — يوقف انتقال كروم عند الضغط المطوّل */
html,body,#app{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);
 font-size:calc(15px*var(--fs));line-height:1.6;-webkit-font-smoothing:antialiased;
 padding-bottom:calc(76px + var(--sb));overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit;color:inherit}
svg{display:block}
#app{max-width:520px;margin:0 auto;min-height:100vh}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--mute2)}.ok{color:var(--emerald)}.bad{color:var(--red)}
.eyebrow{font-family:var(--mono);font-size:calc(10px*var(--fs));letter-spacing:.14em;
 text-transform:uppercase;color:var(--mute2)}
.sp{height:14px}.w{width:100%}.f1{flex:1}.ctr{text-align:center}
.mt6{margin-top:6px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}
.wrapx{word-break:break-word;overflow-wrap:break-word;hyphens:auto}

/* ═══ الرأس ═══ */
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--bg) 72%,transparent);
 padding-top:var(--st)}
.top{display:flex;align-items:center;gap:9px;padding:11px 14px 9px}
.ib{width:38px;height:38px;min-width:38px;border-radius:12px;display:grid;place-items:center;
 background:var(--surf);border:1px solid var(--line);color:var(--mute);transition:.15s}
.ib:active{background:var(--surf2);transform:scale(.94)}
.ib.gold{color:var(--gold);border-color:var(--gold-d)}
.htitle{flex:1;min-width:0}
.htitle b{display:block;font-size:calc(16px*var(--fs));font-weight:700;letter-spacing:-.01em;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle span{display:block;font-size:calc(11px*var(--fs));color:var(--mute2)}
.hpill{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;
 background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--on-gold);
 font-family:var(--mono);font-size:calc(13px*var(--fs));font-weight:700;flex:0 0 auto;
 box-shadow:0 2px 10px rgba(212,175,55,.25)}

main{padding:0 14px}

/* ═══ البطاقة البطلة ═══ */
.hero{position:relative;overflow:hidden;border-radius:24px;margin:6px 0 14px;
 background:linear-gradient(155deg,var(--surf2) 0%,var(--surf) 55%,var(--sunk) 100%);
 border:1px solid var(--line);box-shadow:var(--sh-h)}
.hero::before{content:'';position:absolute;inset:-40% -20% auto -20%;height:160%;
 background:radial-gradient(ellipse at 70% 0%,rgba(212,175,55,.16),transparent 62%);
 pointer-events:none}
.hero-grid{position:absolute;inset:0;opacity:.5;pointer-events:none}
.hero-in{position:relative;padding:18px 18px 15px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.hero-num{font-family:var(--mono);font-size:calc(52px*var(--fs));font-weight:700;line-height:.94;
 letter-spacing:-.045em;background:linear-gradient(135deg,var(--gold2),var(--gold));
 -webkit-background-clip:text;background-clip:text;color:transparent}
.hero-pct{font-family:var(--mono);font-size:calc(17px*var(--fs));color:var(--gold);font-weight:600;
 margin-top:3px}
.hero-lbl{font-size:calc(12.5px*var(--fs));color:var(--mute);margin-top:5px;line-height:1.5}
.hero-bank{font-size:calc(10.5px*var(--fs));color:var(--mute2);margin-top:2px;font-family:var(--mono)}
.ring-wrap{flex:0 0 auto;position:relative}
.ring{color:var(--gold)}
.ring .rt{fill:var(--tx);font-family:var(--mono);font-size:15px;font-weight:700}
.ring .rs{fill:var(--mute2);font-size:8px;font-family:var(--sans)}
.hero-bars{display:flex;gap:3px;margin-top:14px;height:7px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.hero-bars i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hero-key{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}
.hero-key span{display:flex;align-items:center;gap:4px;font-size:calc(10px*var(--fs));color:var(--mute2)}
.hero-key i{width:8px;height:8px;border-radius:3px;display:block}
.hero-foot{display:flex;border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.hf{flex:1;text-align:center;border-left:1px solid var(--line)}
.hf:last-child{border-left:0}
.hf b{display:block;font-family:var(--mono);font-size:calc(17px*var(--fs));font-weight:700}
.hf span{font-size:calc(9.5px*var(--fs));color:var(--mute2)}

/* ═══ زر الجلسة ═══ */
.cta{position:relative;overflow:hidden;width:100%;display:flex;align-items:center;gap:13px;
 padding:16px 18px;border-radius:20px;margin-bottom:12px;
 background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--gold-d));
 color:var(--on-gold);box-shadow:0 6px 26px rgba(212,175,55,.3);transition:.16s}
.cta:active{transform:scale(.985)}
.cta::after{content:'';position:absolute;top:-60%;bottom:-60%;width:38px;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
 transform:skewX(-18deg);animation:sheen 3.4s ease-in-out infinite}
@keyframes sheen{0%{right:-15%}55%{right:112%}100%{right:112%}}
.cta-ic{width:46px;height:46px;min-width:46px;border-radius:15px;display:grid;place-items:center;
 background:rgba(0,0,0,.16)}
.cta-tx{flex:1;min-width:0;position:relative}
.cta-tx b{display:block;font-size:calc(16px*var(--fs));font-weight:800}
.cta-tx span{display:block;font-size:calc(11.5px*var(--fs));opacity:.85}
.cta-go{font-size:22px;opacity:.75;position:relative}
.cta.done{background:linear-gradient(135deg,var(--emerald2),var(--emerald));
 color:#fff;box-shadow:0 6px 26px rgba(47,163,124,.25)}
.cta.done::after{display:none}
.cta.flat{background:var(--surf);color:var(--tx);border:1px solid var(--line);box-shadow:var(--sh)}
.cta.flat::after{display:none}
.cta.flat .cta-ic{background:var(--sunk);color:var(--gold)}

/* ═══ العناقيد ═══ */
.clgrid{display:grid;gap:11px;margin-bottom:12px}
.clcard{position:relative;overflow:hidden;display:flex;align-items:center;gap:13px;
 padding:15px;border-radius:20px;background:var(--surf);border:1px solid var(--line);
 box-shadow:var(--sh);transition:.16s}
.clcard:active{transform:scale(.985);border-color:var(--cc)}
.clcard::before{content:'';position:absolute;inset:0 auto 0 0;width:4px;
 background:linear-gradient(180deg,var(--cc2),var(--cc))}
.gbox{width:var(--sz,48px);height:var(--sz,48px);min-width:var(--sz,48px);
 border-radius:calc(var(--sz,48px)*.32);display:grid;place-items:center;color:#fff;
 background:linear-gradient(145deg,var(--cc2),var(--cc));
 box-shadow:0 4px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.2)}
.clbody{flex:1;min-width:0}
.clbody b{display:block;font-size:calc(15px*var(--fs));font-weight:700;letter-spacing:-.01em}
.clbody span{display:block;font-size:calc(11px*var(--fs));color:var(--mute2);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clbar{height:5px;border-radius:5px;background:var(--sunk);overflow:hidden;margin-top:8px}
.clbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cc2),var(--cc));
 transition:width .5s cubic-bezier(.2,.8,.2,1)}
.clnum{flex:0 0 auto;text-align:center;min-width:52px}
.clnum b{display:block;font-family:var(--mono);font-size:calc(19px*var(--fs));color:var(--cc);font-weight:700}
.clnum span{font-size:calc(9px*var(--fs));color:var(--mute2)}

/* ═══ بطاقات عامة ═══ */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
 margin-bottom:12px;overflow:hidden;box-shadow:var(--sh)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:9px;
 padding:13px 15px 10px;border-bottom:1px solid var(--line)}
.ch h3{margin:0;font-size:calc(14px*var(--fs));font-weight:700}
.cb{padding:13px 15px 15px}
.note{font-size:calc(12px*var(--fs));color:var(--mute);line-height:1.65;
 padding:10px 12px;border-radius:12px;background:var(--sunk);border-right:3px solid var(--line2)}
.note.g{border-right-color:var(--emerald);background:var(--emerald-bg)}
.note.w{border-right-color:var(--gold);background:var(--gold-bg)}
.note.r{border-right-color:var(--red);background:var(--red-bg)}
.note b{color:var(--tx)}

/* ═══ شبكة الأقسام ═══ */
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.catcard{position:relative;overflow:hidden;padding:13px 12px;border-radius:var(--r);
 background:var(--surf);border:1px solid var(--line);box-shadow:var(--sh);transition:.15s}
.catcard:active{transform:scale(.97)}
.cat-ic{font-size:22px;line-height:1;margin-bottom:7px}
.catcard b{display:block;font-size:calc(13px*var(--fs));font-weight:700;line-height:1.3;
 word-break:break-word}
.catcard span{display:block;font-size:calc(10.5px*var(--fs));color:var(--mute2);margin-top:2px;
 word-break:break-word}
.catbar{height:4px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:9px}
.catbar i{display:block;height:100%;background:var(--cc);transition:width .5s}
.catmeta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;
 font-family:var(--mono);font-size:calc(10px*var(--fs));color:var(--mute2)}

/* ═══ بطاقة الجملة ═══ */
.ph{background:var(--surf);border:1px solid var(--line);border-radius:16px;
 padding:14px;margin-bottom:10px;box-shadow:var(--sh);position:relative;overflow:hidden}
.ph.mast{border-color:var(--emerald)}
.ph.mast::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--emerald)}
.ph-en{font-size:calc(15.5px*var(--fs));line-height:1.7;font-weight:500;direction:ltr;
 text-align:left;word-break:break-word;overflow-wrap:break-word}
.ph-ar{font-size:calc(12.5px*var(--fs));color:var(--mute);line-height:1.65;margin-top:8px;
 padding:9px 11px;background:var(--sunk);border-radius:11px;word-break:break-word}
.ph-row{display:flex;gap:7px;margin-top:11px;align-items:center}
.pbtn{flex:1;padding:11px 6px;border-radius:12px;background:var(--sunk);border:1px solid var(--line);
 font-size:calc(12.5px*var(--fs));font-weight:600;display:flex;align-items:center;
 justify-content:center;gap:5px;transition:.14s}
.pbtn:active{transform:scale(.96)}
.pbtn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on-gold);border-color:transparent}
.pbtn.on{background:var(--emerald);color:#fff;border-color:transparent}
.pbtn.sm{flex:0 0 auto;width:44px;padding:11px 0}
.lvchip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
 background:var(--ccbg);color:var(--cc);font-size:calc(10px*var(--fs));font-weight:700;
 border:1px solid var(--cc)}
.lvdot{width:7px;height:7px;border-radius:50%;background:var(--cc);flex:0 0 auto}

/* ═══ التنقّل ═══ */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
 background:color-mix(in srgb,var(--surf) 92%,transparent);
 backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
 border-top:1px solid var(--line);padding:7px 0 calc(7px + var(--sb));max-width:520px;margin:0 auto}
@supports not (backdrop-filter:blur(1px)){nav{background:var(--surf)}}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
 font-size:calc(9.5px*var(--fs));color:var(--mute2);padding:3px 2px;position:relative;transition:.16s}
nav button.on{color:var(--gold)}
nav button.on::before{content:'';position:absolute;top:-7px;width:26px;height:3px;border-radius:0 0 4px 4px;
 background:var(--gold);box-shadow:0 0 12px var(--gold)}
nav .ic{transition:transform .2s}
nav button.on .ic{transform:translateY(-1px) scale(1.06)}

/* ═══ الجلسة ═══ */
.sess{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;
 padding-top:var(--st)}
.sess-top{display:flex;align-items:center;gap:10px;padding:12px 14px}
.sess-prog{flex:1;height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.sess-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));
 transition:width .4s cubic-bezier(.2,.8,.2,1)}
.sess-cnt{font-family:var(--mono);font-size:calc(12px*var(--fs));color:var(--mute)}
.sess-body{flex:1;overflow-y:auto;padding:6px 16px 16px;display:flex;flex-direction:column}
.sess-mid{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.qcard{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:20px 18px;
 box-shadow:var(--sh-h);animation:qin .3s cubic-bezier(.2,.9,.25,1)}
@keyframes qin{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.q-en{font-size:calc(20px*var(--fs));line-height:1.55;font-weight:600;direction:ltr;text-align:left;
 word-break:break-word;overflow-wrap:break-word}
.q-ar{font-size:calc(15px*var(--fs));color:var(--tx);line-height:1.7;word-break:break-word}
.q-hint{font-size:calc(11.5px*var(--fs));color:var(--mute2);margin-top:10px}
.q-blur{filter:blur(9px);opacity:.5;transition:.3s}
.sess-acts{display:flex;flex-direction:column;gap:8px;padding-top:14px}
.bigbtn{width:100%;padding:15px;border-radius:16px;font-size:calc(15px*var(--fs));font-weight:700;
 display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;
 background:var(--surf);border:1px solid var(--line)}
.bigbtn:active{transform:scale(.98)}
.bigbtn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on-gold);border-color:transparent;
 box-shadow:0 5px 20px rgba(212,175,55,.26)}
.bigbtn.em{background:var(--emerald);color:#fff;border-color:transparent}
.bigbtn.rec{background:var(--red);color:#fff;border-color:transparent;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,91,91,.5)}50%{box-shadow:0 0 0 14px rgba(212,91,91,0)}}
.rowbtns{display:flex;gap:8px}.rowbtns .bigbtn{flex:1}

/* ═══ نتيجة النطق — كسر الأسطر مضمون ═══ */
.mkwrap{display:flex;flex-wrap:wrap;gap:6px 5px;direction:ltr;text-align:left;
 font-size:calc(15px*var(--fs));line-height:1.6;align-items:baseline;max-width:100%}
.mk{padding:2px 6px;border-radius:7px;color:var(--emerald);font-weight:500;
 word-break:break-word;max-width:100%;background:var(--emerald-bg)}
.mk.near{color:var(--gold);background:var(--gold-bg)}
.mk.bad{color:var(--red);background:var(--red-bg);text-decoration:underline;font-weight:700}
.mkheard{font-size:calc(11px*var(--fs));color:var(--mute2);margin-top:9px;direction:ltr;
 text-align:left;word-break:break-word;overflow-wrap:break-word;line-height:1.55}
.scorebig{font-family:var(--mono);font-size:calc(46px*var(--fs));font-weight:700;line-height:1;
 letter-spacing:-.04em}

/* ═══ الاستوديو ═══ */
.segrow{display:flex;gap:6px;margin-bottom:10px}
.seg{flex:1;padding:11px 5px;border-radius:13px;background:var(--surf);border:1px solid var(--line);
 font-size:calc(12px*var(--fs));font-weight:700;color:var(--mute);text-align:center;transition:.14s}
.seg.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on-gold);border-color:transparent}
.seg small{display:block;font-size:calc(9.5px*var(--fs));font-weight:500;opacity:.8;margin-top:2px}
.shpanel{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:16px;
 box-shadow:var(--sh);margin-bottom:12px}
.shnow{font-size:calc(17px*var(--fs));line-height:1.6;direction:ltr;text-align:left;font-weight:600;
 word-break:break-word;min-height:52px}
.shcount{display:flex;align-items:center;justify-content:center;gap:7px;margin:14px 0 4px}
.shdot{width:11px;height:11px;border-radius:50%;background:var(--sunk);border:1px solid var(--line);transition:.2s}
.shdot.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px var(--gold);transform:scale(1.18)}
.shdot.you{background:var(--emerald);border-color:var(--emerald);box-shadow:0 0 10px var(--emerald)}
.shstate{text-align:center;font-size:calc(12.5px*var(--fs));color:var(--mute);min-height:20px}
.shstate b{color:var(--gold)}
.shstate.you b{color:var(--emerald)}

/* ═══ المحادثات ═══ */
.bub{max-width:88%;padding:11px 13px;border-radius:17px;font-size:calc(14px*var(--fs));
 line-height:1.6;direction:ltr;text-align:left;word-break:break-word;margin-bottom:3px}
.bub.you{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on-gold);
 border-bottom-right-radius:6px;margin-inline-start:auto}
.bub.them{background:var(--surf2);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubar{font-size:calc(11px*var(--fs));color:var(--mute2);margin-bottom:12px;line-height:1.55;
 word-break:break-word}
.bubrow{display:flex;flex-direction:column;margin-bottom:6px}
.bubname{font-size:calc(10px*var(--fs));color:var(--mute2);margin-bottom:3px;font-weight:700}

/* ═══ النوافذ ═══ */
.sheet{position:fixed;inset:0;z-index:80;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(4,6,10,.68);backdrop-filter:blur(3px)}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;
 background:var(--bg2);border-radius:26px 26px 0 0;border-top:1px solid var(--line);
 padding:8px 14px calc(22px + var(--sb));animation:up .3s cubic-bezier(.2,.9,.25,1);
 max-width:520px;margin:0 auto}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line2);margin:6px auto 12px}
.sheet h2{margin:0 0 4px;font-size:calc(18px*var(--fs));font-weight:700}
.sect{font-family:var(--mono);font-size:calc(10px*var(--fs));letter-spacing:.14em;text-transform:uppercase;
 color:var(--gold);margin:20px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.fld{margin:11px 0}
.fld label{display:block;font-size:calc(12px*var(--fs));color:var(--mute);margin-bottom:6px}
.fld input,.fld select,.frow input,.frow select{width:100%;padding:12px;border-radius:13px;
 background:var(--surf);border:1px solid var(--line);font-family:var(--mono);
 font-size:calc(13.5px*var(--fs));color:var(--tx)}
.fld input:focus,.frow input:focus,.fld select:focus{outline:2px solid var(--gold)}
.frow{display:flex;gap:8px;margin:9px 0;align-items:center}
.frow>.fld{flex:1;margin:0}
.btn{padding:12px 16px;border-radius:13px;border:1px solid var(--line);background:var(--surf);
 font-size:calc(13px*var(--fs));font-weight:600;text-align:center;transition:.14s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on-gold);border-color:transparent}
.btn.em{background:var(--emerald);color:#fff;border-color:transparent}
.btn.bad{background:var(--red);color:#fff;border-color:transparent}
.btn.sm{padding:7px 11px;font-size:calc(11.5px*var(--fs))}
.rng{-webkit-appearance:none;height:7px;border-radius:9px;background:var(--sunk);padding:0!important;
 border:1px solid var(--line)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
 background:linear-gradient(135deg,var(--gold2),var(--gold));border:2px solid var(--bg);
 box-shadow:0 2px 8px rgba(0,0,0,.4)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surf);
 font-size:calc(12px*var(--fs));font-weight:600;color:var(--mute);transition:.14s}
.chip.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on-gold);border-color:transparent}
.chip.em.on{background:var(--emerald);color:#fff}

/* ═══ اختيار النطاق ═══ */
.scopecard{display:flex;align-items:center;gap:13px;padding:15px;border-radius:19px;
 background:var(--surf);border:2px solid var(--line);margin-bottom:10px;transition:.16s}
.scopecard.on{border-color:var(--cc);background:var(--ccbg)}
.scopecard:active{transform:scale(.985)}
.scb{width:26px;height:26px;min-width:26px;border-radius:9px;border:2px solid var(--line2);
 display:grid;place-items:center;font-size:14px;color:transparent;transition:.16s}
.scopecard.on .scb{background:var(--cc);border-color:var(--cc);color:#fff}

/* ═══ الصوتيات ═══ */
.aud-r{display:flex;align-items:center;gap:11px;padding:12px;border-radius:15px;
 background:var(--surf);border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:right}
.aud-r.has{border-color:var(--gold)}
.aud-i{width:38px;height:38px;min-width:38px;border-radius:12px;display:grid;place-items:center;
 background:var(--sunk);color:var(--mute2);border:1px dashed var(--line2);font-size:15px}
.aud-r.has .aud-i{background:linear-gradient(145deg,var(--gold2),var(--gold));color:var(--on-gold);border:0}
.aud-m{flex:1;min-width:0}
.aud-m b{display:block;font-size:calc(13px*var(--fs))}
.aud-m small{display:block;font-size:calc(10.5px*var(--fs));color:var(--mute2);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:7px}
.vrow.sel{border-color:var(--emerald);background:var(--emerald-bg)}
.vq{border-radius:999px;padding:1px 8px;font-size:calc(9.5px*var(--fs));margin-inline-start:5px}
.vq.hi{background:var(--emerald-bg);color:var(--emerald)}
.vq.md{background:var(--gold-bg);color:var(--gold)}
.vq.lo{background:var(--slate-bg);color:var(--mute2)}
.vacts{display:flex;gap:5px;margin-top:8px}
.vacts button{flex:1;padding:8px 4px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);
 font-size:calc(11.5px*var(--fs));font-weight:700;color:var(--mute)}
.vacts button.play{flex:0 0 46px;background:var(--gold);color:var(--on-gold);border-color:transparent}
.vacts button.on{background:var(--emerald);color:#fff;border-color:transparent}
.vpitch{display:flex;align-items:center;gap:9px;margin:9px 0}
.vpitch button{padding:10px 13px;border-radius:12px;background:var(--surf);border:1px solid var(--line);
 font-size:calc(12px*var(--fs));font-weight:700;color:var(--gold);white-space:nowrap}
.vpbar{flex:1;height:8px;border-radius:9px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.vpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--emerald),var(--gold),var(--red));transition:width .25s}

/* ═══ تنبيهات ═══ */
.toast{position:fixed;bottom:calc(88px + var(--sb));right:14px;left:14px;max-width:492px;margin:0 auto;
 z-index:95;background:var(--surf);border:1px solid var(--gold);border-radius:15px;padding:13px 15px;
 font-size:calc(13px*var(--fs));text-align:center;box-shadow:var(--sh-h);animation:up .24s}
.toast.out{opacity:0;transition:opacity .26s}
.ask{position:fixed;inset:0;z-index:110;display:grid;place-items:center}
.ask-bd{position:absolute;inset:0;background:rgba(4,6,10,.7);backdrop-filter:blur(3px)}
.ask-p{position:relative;width:min(360px,88vw);background:var(--surf);border:1px solid var(--line);
 border-radius:22px;padding:20px 18px;box-shadow:var(--sh-h);animation:pop .25s cubic-bezier(.2,.9,.25,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.ask-p>b{display:block;font-size:calc(16px*var(--fs));margin-bottom:8px}
.ask-p p{margin:0 0 16px;font-size:calc(12.5px*var(--fs));color:var(--mute);line-height:1.65}
.ask-r{display:flex;gap:9px}.ask-r .btn{flex:1}

/* ═══ الاحتفاء ═══ */
.cel{position:fixed;inset:0;z-index:100;display:grid;place-items:center;pointer-events:none;
 background:radial-gradient(circle at 50% 45%,rgba(0,0,0,.4),rgba(0,0,0,.1) 62%,transparent);
 animation:fade .2s}
.cel.out{animation:fadeout .35s forwards}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
.cel-b{text-align:center;padding:26px 30px;border-radius:26px;background:var(--surf);
 border:1px solid var(--gold-d);box-shadow:0 18px 60px rgba(0,0,0,.6);
 animation:celin .6s cubic-bezier(.2,.9,.25,1);max-width:300px}
@keyframes celin{0%{transform:scale(.5) rotate(-7deg);opacity:0}
  55%{transform:scale(1.07) rotate(2deg);opacity:1}100%{transform:scale(1);opacity:1}}
.cel-b b{display:block;font-size:calc(17px*var(--fs));margin-top:10px;line-height:1.5}
.cel-b span{display:block;font-size:calc(12px*var(--fs));color:var(--mute);margin-top:5px}
.cel svg{margin:0 auto;color:var(--gold)}
.cel .rays line{animation:ray .95s ease-out both;transform-origin:60px 60px}
@keyframes ray{0%{opacity:0;stroke-dasharray:0 60}55%{opacity:.8}100%{opacity:.3;stroke-dasharray:16 60}}
.spark{position:fixed;width:7px;height:7px;border-radius:50%;background:var(--gold);z-index:98;pointer-events:none}

.empty{text-align:center;padding:44px 20px;color:var(--mute2)}
.empty b{display:block;font-size:calc(15px*var(--fs));color:var(--tx);margin:12px 0 5px}
.empty span{font-size:calc(12px*var(--fs));line-height:1.6}
.srch{width:100%;padding:12px 14px;border-radius:14px;background:var(--surf);border:1px solid var(--line);
 font-size:calc(13.5px*var(--fs));color:var(--tx);margin-bottom:10px}
.srch:focus{outline:2px solid var(--gold)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>

n":"📅","en":"Meetings & Scheduling","ar":"الاجتماعات والمواعيد","col":"#00838F","layer":2},{"id":"Gc","icon":"💭","en":"Opinions & Views","ar":"الآراء ووجهات النظر","col":"#558B2F","layer":2},{"id":"Gd","icon":"😊","en":"Feelings & Reactions","ar":"المشاعر وردود الفعل","col":"#AD1457","layer":2},{"id":"Ge","icon":"🧩","en":"Problem Solving","ar":"حل المشكلات","col":"#283593","layer":2},{"id":"Gf","icon":"🎯","en":"Persuasion & Influence","ar":"الإقناع والتأثير","col":"#D84315","layer":2},{"id":"Gg","icon":"🌐","en":"Networking","ar":"التشبيك والعلاقات","col":"#6A1B9A","layer":2},{"id":"Gh","icon":"🔢","en":"Numbers & Money","ar":"الأرقام والمال","col":"#33691E","layer":2}],"PH":[{"i":1,"c":"A","s":1,"en":"Thanks for hopping on — I know your time is tight, so let's make this count.","ar":"شكراً لانضمامك — أعرف أن وقتك ضيّق، فلنستغلّ هذه الدقائق جيداً."},{"i":2,"c":"A","s":1,"en":"Before we dive in, give me the thirty-second version: what are you trying to get funded, and by when?","ar":"قبل أن نبدأ، أعطني النسخة المختصرة: ما الذي تريد تمويله، ومتى؟"},{"i":3,"c":"A","s":0,"en":"I've had a quick look at what you sent over, and I already have a couple of thoughts — but I'd rather hear it from you first.","ar":"ألقيت نظرة سريعة على ما أرسلته، ولديّ ملاحظات — لكنني أفضّل سماعها منك أولاً."},{"i":4,"c":"A","s":0,"en":"Let's keep this practical. By the end of these fifteen minutes, you'll know exactly whether I'm the right fit.","ar":"فلنُبقِ الأمر عملياً. بنهاية هذه الدقائق ستعرف إن كنت الشخص المناسب."},{"i":5,"c":"A","s":1,"en":"Walk me through the deal as if I were the lender sitting across the table from you.","ar":"اشرح لي الصفقة كأنني المقرض الجالس أمامك على الطاولة."},{"i":6,"c":"B","s":0,"en":"What's the use of funds, specifically — working capital, equipment, an acquisition, or real estate?","ar":"ما الغرض من التمويل تحديداً — رأس مال عامل، معدات، استحواذ، أم عقارات؟"},{"i":7,"c":"B","s":0,"en":"Who's the lender you're targeting, and have they given you any signal on what they want to see?","ar":"مَن المقرض الذي تستهدفه، وهل أعطاك إشارة عمّا يريد رؤيته؟"},{"i":8,"c":"B","s":0,"en":"What's your repayment going to come from — existing cash flow, or projected growth?","ar":"من أين سيأتي السداد — من التدفق النقدي الحالي، أم من النمو المتوقع؟"},{"i":9,"c":"B","s":1,"en":"Where do you feel the file is weakest right now? That's usually where I add the most value.","ar":"أين تشعر أن الملف أضعف ما يكون الآن؟ هذا حيث أضيف أكبر قيمة."},{"i":10,"c":"B","s":0,"en":"Has anyone looked at this from the lender's side yet, or is this the first pass?","ar":"هل نظر أحد إلى هذا من جهة المقرض بعد، أم أنها المحاولة الأولى؟"},{"i":11,"c":"B","s":0,"en":"What happens to the business if this funding doesn't come through?","ar":"ماذا يحدث للنشاط إن لم يتم هذا التمويل؟"},{"i":12,"c":"C","s":0,"en":"Here's what a credit committee is going to flag immediately.","ar":"إليك ما ستلاحظه لجنة الائتمان فوراً."},{"i":13,"c":"C","s":0,"en":"The numbers aren't the problem — the way they're presented is. Lenders read for risk, not for optimism.","ar":"الأرقام ليست المشكلة — بل طريقة عرضها. المقرضون يقرأون بحثاً عن المخاطر لا التفاؤل."},{"i":14,"c":"C","s":0,"en":"Your DSCR looks fine on paper, but the committee will stress-test it, and that's where this falls short.","ar":"الـ DSCR يبدو جيداً على الورق، لكن اللجنة ستختبره تحت الضغط، وهنا يقصُر الملف."},{"i":15,"c":"C","s":1,"en":"What's not in this file is louder than what is. Let me show you what's missing.","ar":"ما هو غير موجود في هذا الملف أعلى صوتاً مما هو موجود. دعني أريك ما ينقص."},{"i":16,"c":"C","s":1,"en":"A lender doesn't fund a business — they fund a repayment story. Right now, your story has a gap.","ar":"المقرض لا يموّل نشاطاً — بل يموّل قصة سداد. قصتك الآن بها فجوة."},{"i":17,"c":"C","s":1,"en":"I'm not going to build you a model that works. I'm going to build you a file that gets approved.","ar":"لن أبني لك نموذجاً يعمل. سأبني لك ملفاً يُعتمَد."},{"i":18,"c":"C","s":0,"en":"The strength here is real, but it's buried. My job is to make the credit officer see it in the first ninety seconds.","ar":"القوة هنا حقيقية لكنها مدفونة. مهمتي أن أجعل ضابط الائتمان يراها في أول تسعين ثانية."},{"i":19,"c":"C","s":1,"en":"I've sat on the other side of that table for eighteen years. I know exactly which questions kill a deal.","ar":"جلست على الجانب الآخر من تلك الطاولة لثمانية عشر عاماً. أعرف أي الأسئلة يقتل الصفقة."},{"i":20,"c":"D","s":0,"en":"Think of it as three layers: the model proves the numbers, the memo tells the story, and the package gets it across the line.","ar":"فكّر فيها كثلاث طبقات: النموذج يثبت الأرقام، والمذكرة تروي القصة، والحزمة تعبر بها خط النهاية."},{"i":21,"c":"D","s":0,"en":"The financial model is the entry point — but the real value is the credit lens I put on top of it.","ar":"النموذج المالي هو نقطة الدخول — لكن القيمة الحقيقية في العدسة الائتمانية التي أضعها فوقه."},{"i":22,"c":"D","s":0,"en":"Most freelancers stop at a clean spreadsheet. I take it all the way to a lender-ready decision document.","ar":"معظم المستقلين يتوقفون عند جدول نظيف. أنا آخذه إلى وثيقة قرار جاهزة للمقرض."},{"i":23,"c":"D","s":0,"en":"The Banker's View section is where I tell you, candidly, how a lender will see your deal — strengths, risks, and conditions.","ar":"قسم رؤية المصرفي هو حيث أخبرك بصراحة كيف سيرى المقرض صفقتك — نقاط القوة والمخاطر والشروط."},{"i":24,"c":"D","s":0,"en":"I'll give you the model, but I'll also give you the answers to the questions you haven't been asked yet.","ar":"سأعطيك النموذج، لكنني سأعطيك أيضاً إجابات الأسئلة التي لم تُسأل بعد."},{"i":25,"c":"D","s":0,"en":"For an SBA package, the order of the documents matters as much as the documents themselves.","ar":"في حزمة الـ SBA، ترتيب المستندات يهمّ بقدر المستندات نفسها."},{"i":26,"c":"E","s":1,"en":"I'm new to this platform — I'm not new to credit. I've reviewed hundreds of funding decisions.","ar":"أنا جديد على هذه المنصة — لست جديداً على الائتمان. راجعت مئات قرارات التمويل."},{"i":27,"c":"E","s":0,"en":"Fair question. Judge me on the work, not the profile — take a look at the sample and tell me if a lender would say no to it.","ar":"سؤال وجيه. احكم عليّ بالعمل لا بالملف — انظر إلى النموذج وأخبرني إن كان مقرض سيرفضه."},{"i":28,"c":"E","s":0,"en":"My reviews here are just getting started, but my track record in banking goes back eighteen years.","ar":"تقييماتي هنا في بدايتها، لكن سجلّي في البنوك يعود لثمانية عشر عاماً."},{"i":29,"c":"E","s":0,"en":"I'd rather under-promise and let the deliverable speak. Give me one project to prove it.","ar":"أفضّل أن أَعِد بأقل وأدع المُنتَج يتكلم. أعطني مشروعاً واحداً لأثبت ذلك."},{"i":30,"c":"E","s":0,"en":"You're not taking a risk on an unknown — you're getting a credit manager's eye at a freelancer's rate.","ar":"أنت لا تخاطر بمجهول — أنت تحصل على عين مدير ائتمان بسعر مستقل."},{"i":31,"c":"F","s":1,"en":"I hear you. Let me reframe it: what does it cost you if the deal gets declined and you have to start over?","ar":"أفهمك. دعني أعيد التأطير: كم يكلّفك إن رُفضت الصفقة واضطُررت للبدء من جديد؟"},{"i":32,"c":"F","s":0,"en":"My pricing reflects the approval — not the spreadsheet. A cheaper model that gets rejected is the expensive option.","ar":"سعري يعكس الموافقة — لا الجدول. النموذج الأرخص الذي يُرفض هو الخيار الأغلى."},{"i":33,"c":"F","s":0,"en":"I'm not the cheapest, and I won't pretend to be. I'm the one who knows what the committee is looking for.","ar":"لست الأرخص، ولن أدّعي ذلك. أنا من يعرف ما تبحث عنه اللجنة."},{"i":34,"c":"F","s":0,"en":"Let's scope it down to a Basic tier first — you can step up to the full package once you see the quality.","ar":"فلنبدأ بمستوى أساسي أصغر — يمكنك الترقّي للحزمة الكاملة عندما ترى الجودة."},{"i":35,"c":"F","s":0,"en":"The fee is a fraction of the funding you're trying to unlock. Let's keep that in proportion.","ar":"الأتعاب جزء يسير من التمويل الذي تحاول الحصول عليه. فلنضع ذلك في نصابه."},{"i":36,"c":"F","s":0,"en":"I can work within that budget, but let me be straight about what comes out of scope so there are no surprises.","ar":"أستطيع العمل ضمن هذه الميزانية، لكن دعني أوضّح ما سيخرج من النطاق حتى لا تكون هناك مفاجآت."},{"i":37,"c":"F","s":0,"en":"If price is the only concern, we can find a fit. If quality is the concern, that's where I shine.","ar":"إن كان السعر هو الهمّ الوحيد، يمكننا إيجاد حل. وإن كانت الجودة هي الهمّ، فهنا أتألّق."},{"i":38,"c":"G","s":1,"en":"Anyone can generate a model now. What they can't generate is the judgment of someone who's denied loans for a living.","ar":"أي أحد يستطيع توليد نموذج الآن. ما لا يستطيعون توليده هو حُكم شخص رفض القروض كمهنة."},{"i":39,"c":"G","s":0,"en":"An AI gives you a model that's technically correct. I give you a model that's persuasive to a real lender.","ar":"الذكاء الاصطناعي يعطيك نموذجاً صحيحاً تقنياً. أنا أعطيك نموذجاً مُقنِعاً لمقرض حقيقي."},{"i":40,"c":"G","s":0,"en":"The difference is accountability — I stand behind the credit logic, not just the formulas.","ar":"الفرق هو المساءلة — أنا أقف خلف المنطق الائتماني، لا المعادلات فقط."},{"i":41,"c":"G","s":0,"en":"Tools tell you what the numbers are. I tell you what the lender will do with them.","ar":"الأدوات تخبرك بما هي الأرقام. أنا أخبرك بما سيفعله المقرض بها."},{"i":42,"c":"G","s":0,"en":"I'm not competing on speed or price — I'm competing on getting you funded.","ar":"أنا لا أنافس على السرعة أو السعر — أنافس على حصولك على التمويل."},{"i":43,"c":"H","s":0,"en":"Let me make sure we're aligned on scope before we start — that's where most projects go sideways.","ar":"دعني أتأكد أننا متفقون على النطاق قبل أن نبدأ — فهنا تنحرف معظم المشاريع."},{"i":44,"c":"H","s":0,"en":"Here's what's included, and here's what would be a separate phase. I'd rather be clear up front.","ar":"هذا ما هو مشمول، وهذا ما سيكون مرحلة منفصلة. أفضّل الوضوح من البداية."},{"i":45,"c":"H","s":0,"en":"To do this properly, I'll need a few documents from you first — I'll send a short intake form.","ar":"لأنجز هذا بشكل صحيح، سأحتاج بعض المستندات منك أولاً — سأرسل استمارة قصيرة."},{"i":46,"c":"H","s":0,"en":"I'll build in two revision rounds. Beyond that, we'd treat it as a new scope.","ar":"سأُضمّن جولتي مراجعة. وما بعد ذلك نعتبره نطاقاً جديداً."},{"i":47,"c":"I","s":1,"en":"Here's what I'd suggest as the next step.","ar":"إليك ما أقترحه كخطوة تالية."},{"i":48,"c":"I","s":1,"en":"If that sounds right, I'll send over a short intake form and we can get started today.","ar":"إن بدا ذلك مناسباً، سأرسل استمارة قصيرة ويمكننا البدء اليوم."},{"i":49,"c":"I","s":0,"en":"Let me put a proposal together that reflects exactly what we discussed — you'll have it within the hour.","ar":"دعني أُعدّ عرضاً يعكس تماماً ما ناقشناه — سيصلك خلال ساعة."},{"i":50,"c":"I","s":0,"en":"Take your time on the decision. When you're ready, the deliverable will be too.","ar":"خذ وقتك في القرار. عندما تكون جاهزاً، سيكون المُنتَج جاهزاً أيضاً."},{"i":51,"c":"I","s":0,"en":"Let's start with the model, and once you see the credit lens, we can talk about the full package.","ar":"فلنبدأ بالنموذج، وعندما ترى العدسة الائتمانية، نتحدث عن الحزمة الكاملة."},{"i":52,"c":"J","s":0,"en":"We're presenting this as a medium-risk credit with a clear primary repayment source and adequate collateral coverage.","ar":"نقدّم هذا كائتمان متوسط المخاطر بمصدر سداد أساسي واضح وتغطية ضمانات كافية."},{"i":53,"c":"J","s":0,"en":"The global DSCR comes in at one-point-four times, which gives the committee comfortable headroom above the one-point-two-five benchmark.","ar":"الـ DSCR الكلي يبلغ 1.4 مرة، مما يعطي اللجنة هامشاً مريحاً فوق معيار الـ 1.25."},{"i":54,"c":"J","s":0,"en":"The principal mitigant for the concentration risk is a covenant requiring advance notice on any material contract change.","ar":"المُخفِّف الأساسي لخطر التركّز هو شرط يتطلب إشعاراً مسبقاً بأي تغيير جوهري في العقود."},{"i":55,"c":"J","s":0,"en":"On a stressed basis — a fifteen-percent revenue decline — the deal still services its debt.","ar":"على أساس مُجهَد — انخفاض إيراد بنسبة 15% — تظل الصفقة قادرة على خدمة دينها."},{"i":56,"c":"J","s":0,"en":"The use of funds is clean, the repayment is supported, and the collateral position is adequate.","ar":"استخدام الأموال واضح، والسداد مدعوم، ووضع الضمانات كافٍ."},{"i":57,"c":"K","s":1,"en":"That's a great question — let me think about that for a second.","ar":"سؤال ممتاز — دعني أفكّر في ذلك لحظة."},{"i":58,"c":"K","s":0,"en":"Good point. The way I'd look at that is…","ar":"نقطة جيدة. الطريقة التي أنظر بها لذلك هي…"},{"i":59,"c":"K","s":1,"en":"Let me make sure I understand — are you asking about the first option, or the second?","ar":"دعني أتأكد أنني فهمت — هل تسأل عن الخيار الأول أم الثاني؟"},{"i":60,"c":"K","s":0,"en":"Right, so — here's the short answer, and then I'll give you the longer one.","ar":"حسناً — إليك الإجابة المختصرة، ثم سأعطيك الأطول."},{"i":61,"c":"K","s":0,"en":"It depends — and let me tell you exactly what it depends on.","ar":"يعتمد على عدة أمور — ودعني أخبرك بالضبط على ماذا يعتمد."},{"i":62,"c":"K","s":0,"en":"I want to give you a precise answer, not a quick one — so let me frame it properly.","ar":"أريد أن أعطيك إجابة دقيقة لا سريعة — فدعني أصوغها بشكل صحيح."},{"i":63,"c":"L","s":0,"en":"Good morning — this is Ahmed, thanks for taking my call.","ar":"صباح الخير — معك أحمد، شكراً لتلقّيك مكالمتي."},{"i":64,"c":"L","s":0,"en":"It's a pleasure to finally connect with you.","ar":"يسعدني أن أتواصل معك أخيراً."},{"i":65,"c":"L","s":0,"en":"I appreciate you making the time today.","ar":"أقدّر تخصيصك الوقت اليوم."},{"i":66,"c":"L","s":0,"en":"Thanks for reaching out — I've been looking forward to this conversation.","ar":"شكراً لتواصلك — كنت أتطلّع لهذه المحادثة."},{"i":67,"c":"L","s":0,"en":"Let me quickly introduce myself and what I do.","ar":"دعني أعرّف بنفسي وبما أعمله بسرعة."},{"i":68,"c":"L","s":0,"en":"I look forward to working with you on this.","ar":"أتطلّع للعمل معك على هذا."},{"i":69,"c":"M","s":0,"en":"That makes a lot of sense.","ar":"هذا منطقي جداً."},{"i":70,"c":"M","s":0,"en":"Absolutely, I see your point.","ar":"بالتأكيد، أرى وجهة نظرك."},{"i":71,"c":"M","s":0,"en":"You're right — and that's exactly what I want to address.","ar":"أنت محقّ — وهذا تماماً ما أريد معالجته."},{"i":72,"c":"M","s":0,"en":"I completely agree with your assessment.","ar":"أتفق تماماً مع تقييمك."},{"i":73,"c":"M","s":0,"en":"That's a valid concern, and here's how I'd address it.","ar":"هذا قلق وجيه، وإليك كيف سأعالجه."},{"i":74,"c":"M","s":0,"en":"I hear you, and I think we can work through that.","ar":"أفهمك، وأعتقد أننا نستطيع تجاوز ذلك."},{"i":75,"c":"N","s":0,"en":"Just to make sure I have this right.","ar":"فقط لأتأكد أنني فهمت هذا صحيحاً."},{"i":76,"c":"N","s":0,"en":"Could you walk me through that in a bit more detail?","ar":"هل يمكنك شرح ذلك بمزيد من التفصيل؟"},{"i":77,"c":"N","s":1,"en":"When you say that, do you mean the first option — or the second?","ar":"عندما تقول ذلك، هل تعني الخيار الأول أم الثاني؟"},{"i":78,"c":"N","s":0,"en":"Can you give me a concrete example?","ar":"هل يمكنك إعطائي مثالاً عملياً؟"},{"i":79,"c":"N","s":0,"en":"I want to make sure I'm understanding you correctly — you're saying…","ar":"أريد التأكد أنني أفهمك صحيحاً — أنت تقول…"},{"i":80,"c":"N","s":0,"en":"So if I'm hearing you right, the core issue is…","ar":"إذاً إن كنت أسمعك صحيحاً، فالمشكلة الجوهرية هي…"},{"i":81,"c":"O","s":0,"en":"That actually connects directly to what I wanted to raise.","ar":"هذا يرتبط مباشرةً بما أردت طرحه."},{"i":82,"c":"O","s":0,"en":"Let me touch on something important here.","ar":"دعني أتطرّق لأمر مهم هنا."},{"i":83,"c":"O","s":0,"en":"Building on what you just said…","ar":"بناءً على ما قلته للتو…"},{"i":84,"c":"O","s":0,"en":"To summarize what we've covered so far…","ar":"لتلخيص ما غطّيناه حتى الآن…"},{"i":85,"c":"O","s":0,"en":"Before we wrap up, I want to flag one more thing.","ar":"قبل أن ننهي، أريد الإشارة لأمر أخير."},{"i":86,"c":"O","s":0,"en":"Let me shift gears for a moment.","ar":"دعني أنتقل لموضوع آخر للحظة."},{"i":87,"c":"P","s":0,"en":"Let me be direct with you.","ar":"دعني أكون صريحاً معك."},{"i":88,"c":"P","s":0,"en":"From my experience, the most effective approach here is…","ar":"من خبرتي، النهج الأكثر فاعلية هنا هو…"},{"i":89,"c":"P","s":0,"en":"In my professional judgment…","ar":"في تقديري المهني…"},{"i":90,"c":"P","s":0,"en":"I'll be transparent about that.","ar":"سأكون شفافاً بخصوص ذلك."},{"i":91,"c":"P","s":0,"en":"The way I see it…","ar":"كما أراها…"},{"i":92,"c":"P","s":0,"en":"I'd recommend we approach this carefully, and here's why.","ar":"أوصي بأن نتعامل مع هذا بحذر، وإليك السبب."},{"i":93,"c":"Q","s":1,"en":"Sorry, could you repeat that last part?","ar":"عذراً، هل يمكنك إعادة الجزء الأخير؟"},{"i":94,"c":"Q","s":1,"en":"You're breaking up a little — would you mind saying that again?","ar":"صوتك متقطّع قليلاً — هل تمانع قول ذلك مجدداً؟"},{"i":95,"c":"Q","s":0,"en":"Could you speak up just a bit? The line is a little weak.","ar":"هل يمكنك رفع صوتك قليلاً؟ الخط ضعيف بعض الشيء."},{"i":96,"c":"Q","s":1,"en":"I want to make sure I caught that correctly — did you say the loan amount was 250,000?","ar":"أريد التأكد أنني فهمت ذلك صحيحاً — هل قلت إن مبلغ القرض 250 ألف؟"},{"i":97,"c":"Q","s":0,"en":"Could you slow down just a touch? I want to get every detail right.","ar":"هل يمكنك التمهّل قليلاً؟ أريد أن أضبط كل تفصيلة."},{"i":98,"c":"Q","s":0,"en":"Apologies, I didn't quite follow — could you put it another way?","ar":"آسف، لم أتابع تماماً — هل يمكنك صياغتها بطريقة أخرى؟"},{"i":99,"c":"Q","s":1,"en":"I didn't catch that — could you say it one more time?","ar":"لم ألتقط ذلك — هل يمكنك قوله مرة أخرى؟"},{"i":100,"c":"Q","s":0,"en":"I'm not sure I'm familiar with that term — what do you mean exactly?","ar":"لست متأكداً أنني أعرف هذا المصطلح — ماذا تعني بالضبط؟"},{"i":101,"c":"Q","s":0,"en":"Bear with me for a second — there's a bit of background noise on my end.","ar":"تحمّلني لحظة — هناك بعض الضوضاء في الخلفية عندي."},{"i":102,"c":"Q","s":0,"en":"Just so I don't misquote you later, let me write that down.","ar":"حتى لا أنقل كلامك خطأ لاحقاً، e talk about price.","ar":"فلنتحدث عن القيمة قبل أن نتحدث عن السعر."},{"i":191,"c":"F","s":0,"en":"I'd rather do one thing exceptionally than three things cheaply.","ar":"أفضّل أن أُتقن أمراً واحداً على أن أؤدّي ثلاثة بثمن بخس."},{"i":192,"c":"F","s":0,"en":"Think of it as an investment in approval odds, not just a deliverable.","ar":"اعتبره استثماراً في احتمالات الموافقة، لا مجرد مُنتَج."},{"i":193,"c":"I","s":0,"en":"Shall I send the agreement over so we can lock in the timeline?","ar":"هل أرسل الاتفاقية لنثبّت الجدول الزمني؟"},{"i":194,"c":"I","s":0,"en":"I can start as early as this week if that works for you.","ar":"يمكنني البدء هذا الأسبوع إن كان ذلك مناسباً لك."},{"i":195,"c":"I","s":0,"en":"What would you need from me to feel confident moving forward?","ar":"ماذا تحتاج مني لتشعر بالثقة في المضي قدماً؟"},{"i":196,"c":"E","s":0,"en":"Happy to start with a smaller piece so you can see how I work before committing further.","ar":"يسعدني البدء بجزء أصغر لترى كيف أعمل قبل الالتزام أكثر."},{"i":197,"c":"E","s":0,"en":"I'll be upfront if I ever think something isn't in your best interest.","ar":"سأكون صريحاً إن ظننت يوماً أن شيئاً ليس في مصلحتك."},{"i":198,"c":"J","s":0,"en":"The borrower brings relevant industry experience, which strengthens the management assessment.","ar":"المقترض يجلب خبرة قطاعية ذات صلة، مما يقوّي تقييم الإدارة."},{"i":199,"c":"J","s":0,"en":"Primary repayment is supported by contracted revenue; secondary is the collateral position.","ar":"السداد الأساسي مدعوم بإيراد متعاقَد عليه؛ والثانوي هو وضع الضمانات."},{"i":200,"c":"J","s":0,"en":"We've structured the request to fit comfortably within the SBA eligibility and size standards.","ar":"هيكلنا الطلب ليندرج بمرونة ضمن أهلية ومعايير حجم الـ SBA."},{"i":201,"c":"Q","s":0,"en":"Sorry, the audio cut out — what was the last thing you said?","ar":"عذراً، انقطع الصوت — ما آخر ما قلته؟"},{"i":202,"c":"Q","s":0,"en":"Let me repeat that back to make sure we're aligned.","ar":"دعني أكرّر ذلك لأتأكد أننا مت
