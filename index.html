بالنطاق والجدول الزمني ومستوى التحليل المطلوب."},{"i":1254,"c":"L2s06","s":0,"en":"I'd like to understand your expectations before discussing numbers.","ar":"أودّ أن أفهم توقعاتك قبل الحديث عن الأرقام."},{"i":1255,"c":"L2s06","s":0,"en":"The fee should reflect the value being created, not simply the hours involved.","ar":"الأتعاب يجب أن تعكس القيمة المتحققة، لا مجرد عدد الساعات."},{"i":1256,"c":"L2s06","s":0,"en":"Let me first explain what I believe the engagement requires.","ar":"دعني أشرح أولاً ما أراه مطلوباً في هذا التعاقد."},{"i":1257,"c":"L2s06","s":0,"en":"Once we've defined the scope, I can provide a more accurate estimate.","ar":"بمجرد تحديد النطاق، يمكنني تقديم تقدير أدق."},{"i":1258,"c":"L2s06","s":0,"en":"There are several ways we could structure this engagement.","ar":"هناك عدة طرق يمكن أن نهيكل بها هذا التعاقد."},{"i":1259,"c":"L2s06","s":0,"en":"We can tailor the scope to align with your priorities and budget.","ar":"يمكننا تفصيل النطاق بما يتوافق مع أولوياتك وميزانيتك."},{"i":1260,"c":"L2s06","s":0,"en":"My goal is to recommend the approach that creates the greatest value.","ar":"هدفي أن أوصي بالنهج الذي يحقق أكبر قيمة."},{"i":1261,"c":"L2s07","s":0,"en":"Have you established a budget range for this initiative?","ar":"هل حددت نطاقاً للميزانية لهذه المبادرة؟"},{"i":1262,"c":"L2s07","s":0,"en":"What level of investment were you anticipating?","ar":"ما حجم الاستثمار الذي كنت تتوقعه؟"},{"i":1263,"c":"L2s07","s":0,"en":"Have you allocated resources for this project?","ar":"هل خصصت موارد لهذا المشروع؟"},{"i":1264,"c":"L2s07","s":0,"en":"Is there a budget framework we should work within?","ar":"هل هناك إطار للميزانية يجب أن نعمل ضمنه؟"},{"i":1265,"c":"L2s07","s":0,"en":"Understanding the budget helps me recommend the most appropriate approach.","ar":"فهم الميزانية يساعدني على التوصية بالنهج الأنسب."},{"i":1266,"c":"L2s07","s":0,"en":"My objective is to maximize value within your constraints.","ar":"هدفي تعظيم القيمة ضمن حدودك."},{"i":1267,"c":"L2s07","s":0,"en":"Budget considerations often influence scope and prioritization.","ar":"اعتبارات الميزانية غالباً ما تؤثر على النطاق وترتيب الأولويات."},{"i":1268,"c":"L2s07","s":0,"en":"There may be opportunities to phase the work if needed.","ar":"قد تكون هناك فرص لتقسيم العمل على مراحل إذا لزم الأمر."},{"i":1269,"c":"L2s07","s":0,"en":"We can structure the engagement to fit your objectives.","ar":"يمكننا هيكلة التعاقد بما يناسب أهدافك."},{"i":1270,"c":"L2s07","s":0,"en":"I'd rather discuss expectations openly than make assumptions.","ar":"أفضّل مناقشة التوقعات بصراحة بدلاً من الافتراض."},{"i":1271,"c":"L2s08","s":0,"en":"The cost of a poor decision is often significantly greater than the cost of proper analysis.","ar":"تكلفة القرار الخاطئ غالباً أكبر بكثير من تكلفة التحليل السليم."},{"i":1272,"c":"L2s08","s":0,"en":"In situations like this, preparation frequently determines the outcome.","ar":"في مواقف كهذه، الإعداد كثيراً ما يحدد النتيجة."},{"i":1273,"c":"L2s08","s":0,"en":"The objective is not minimizing cost; it's maximizing decision quality.","ar":"الهدف ليس تقليل التكلفة، بل تعظيم جودة القرار."},{"i":1274,"c":"L2s08","s":0,"en":"One strong recommendation can create substantial value.","ar":"توصية واحدة قوية قد تخلق قيمة كبيرة."},{"i":1275,"c":"L2s08","s":0,"en":"The right analysis can prevent expensive mistakes.","ar":"التحليل الصحيح قد يمنع أخطاء مكلفة."},{"i":1276,"c":"L2s08","s":0,"en":"A well-executed process often pays for itself many times over.","ar":"العملية المنفذة جيداً غالباً ما تغطي تكلفتها أضعافاً."},{"i":1277,"c":"L2s08","s":0,"en":"The financial impact of the decision far exceeds the consulting fee.","ar":"الأثر المالي للقرار يتجاوز أتعاب الاستشارة بكثير."},{"i":1278,"c":"L2s08","s":0,"en":"My clients typically view this as an investment rather than an expense.","ar":"عملائي عادةً يرون هذا استثماراً لا مصروفاً."},{"i":1279,"c":"L2s08","s":0,"en":"The focus should be on return, not merely cost.","ar":"التركيز يجب أن يكون على العائد، لا على التكلفة فقط."},{"i":1280,"c":"L2s08","s":0,"en":"The value created should materially exceed the fee.","ar":"القيمة المتحققة يجب أن تتجاوز الأتعاب بشكل ملموس."},{"i":1281,"c":"L2s09","s":1,"en":"I understand that perspective.","ar":"أتفهّم وجهة النظر هذه."},{"i":1282,"c":"L2s09","s":0,"en":"I may not be the lowest-cost option available.","ar":"قد لا أكون الخيار الأقل تكلفة المتاح."},{"i":1283,"c":"L2s09","s":1,"en":"My focus has never been on being the cheapest provider.","ar":"لم يكن تركيزي يوماً على أن أكون الأرخص."},{"i":1284,"c":"L2s09","s":0,"en":"I focus on delivering meaningful value and quality.","ar":"أركّز على تقديم قيمة وجودة حقيقيتين."},{"i":1285,"c":"L2s09","s":1,"en":"The lowest price and the lowest risk are rarely the same thing.","ar":"أقل سعر وأقل مخاطرة نادراً ما يكونان الشيء نفسه."},{"i":1286,"c":"L2s09","s":0,"en":"My clients typically engage me because the decision itself is important.","ar":"عملائي عادةً يتعاقدون معي لأن القرار نفسه مهم."},{"i":1287,"c":"L2s09","s":0,"en":"The cost of inadequate analysis can be substantial.","ar":"تكلفة التحليل غير الكافي قد تكون كبيرة."},{"i":1288,"c":"L2s09","s":0,"en":"I completely respect the need to manage costs carefully.","ar":"أحترم تماماً الحاجة إلى إدارة التكاليف بعناية."},{"i":1289,"c":"L2s09","s":0,"en":"The key question is whether the expected value justifies the investment.","ar":"السؤال الأساسي هو هل القيمة المتوقعة تبرر الاستثمار."},{"i":1290,"c":"L2s09","s":0,"en":"I encourage clients to evaluate both cost and outcome.","ar":"أشجّع العملاء على تقييم التكلفة والنتيجة معاً."},{"i":1291,"c":"L2s10","s":0,"en":"I'm sure there are lower-cost alternatives available.","ar":"أنا متأكد أن هناك بدائل أقل تكلفة متاحة."},{"i":1292,"c":"L2s10","s":0,"en":"Different providers bring different levels of expertise and depth.","ar":"مقدّمو الخدمة المختلفون يقدمون مستويات مختلفة من الخبرة والعمق."},{"i":1293,"c":"L2s10","s":0,"en":"The right choice depends on your priorities.","ar":"الاختيار الصحيح يعتمد على أولوياتك."},{"i":1294,"c":"L2s10","s":0,"en":"Cost is certainly one factor worth considering.","ar":"التكلفة بالتأكيد عامل يستحق الاعتبار."},{"i":1295,"c":"L2s10","s":0,"en":"I would encourage you to compare both deliverables and methodology.","ar":"أشجّعك على مقارنة المخرجات والمنهجية معاً."},{"i":1296,"c":"L2s10","s":0,"en":"The scope may appear similar while the depth of analysis differs significantly.","ar":"قد يبدو النطاق متشابهاً بينما يختلف عمق التحليل بشكل كبير."},{"i":1297,"c":"L2s10","s":0,"en":"Not all approaches produce the same quality of outcome.","ar":"ليست كل الأساليب تنتج نفس جودة النتيجة."},{"i":1298,"c":"L2s10","s":0,"en":"I respect clients who carefully evaluate multiple options.","ar":"أحترم العملاء الذين يقيّمون الخيارات المتعددة بعناية."},{"i":1299,"c":"L2s10","s":0,"en":"The decision should ultimately be based on value and fit.","ar":"القرار في النهاية يجب أن يُبنى على القيمة والملاءمة."},{"i":1300,"c":"L2s10","s":0,"en":"My role is simply to explain how I approach the work and allow you to decide what best serves your needs.","ar":"دوري ببساطة أن أشرح كيف أتعامل مع العمل وأترك لك أن تقرر ما يخدم احتياجاتك."},{"i":1301,"c":"L2s11","s":0,"en":"I'd like to clearly define the scope before we move forward.","ar":"أودّ تحديد النطاق بوضوح قبل أن نمضي قدماً."},{"i":1302,"c":"L2s11","s":0,"en":"Establishing clear expectations upfront benefits everyone involved.","ar":"وضع توقعات واضحة من البداية يفيد جميع الأطراف."},{"i":1303,"c":"L2s11","s":0,"en":"Let me clarify exactly what is included in the engagement.","ar":"دعني أوضّح بالضبط ما يشمله التعاقد."},{"i":1304,"c":"L2s11","s":0,"en":"It's important that we align on deliverables from the beginning.","ar":"من المهم أن نتفق على المخرجات من البداية."},{"i":1305,"c":"L2s11","s":0,"en":"I want to avoid any ambiguity regarding responsibilities.","ar":"أريد تجنّب أي غموض بشأن المسؤوليات."},{"i":1306,"c":"L2s11","s":0,"en":"A clearly defined scope helps ensure a successful outcome.","ar":"النطاق المحدد بوضوح يساعد على ضمان نتيجة ناجحة."},{"i":1307,"c":"L2s11","s":0,"en":"Let's outline the key objectives and deliverables.","ar":"لنحدد الأهداف والمخرجات الرئيسية."},{"i":1308,"c":"L2s11","s":0,"en":"I believe clarity at the start prevents challenges later.","ar":"أعتقد أن الوضوح في البداية يمنع التحديات لاحقاً."},{"i":1309,"c":"L2s11","s":0,"en":"I'll document the scope to ensure we're aligned.","ar":"سأوثّق النطاق للتأكد من أننا متفقون."},{"i":1310,"c":"L2s11","s":0,"en":"The engagement should be structured around agreed priorities.","ar":"يجب أن يُهيكل التعاقد حول الأولويات المتفق عليها."},{"i":1311,"c":"L2s12","s":1,"en":"That's certainly something we can discuss.","ar":"هذا بالتأكيد شيء يمكننا مناقشته."},{"i":1312,"c":"L2s12","s":0,"en":"That request falls slightly outside the original scope.","ar":"هذا الطلب يقع خارج النطاق الأصلي قليلاً."},{"i":1313,"c":"L2s12","s":0,"en":"We can absolutely explore that as an additional workstream.","ar":"يمكننا بالتأكيد استكشاف ذلك كمسار عمل إضافي."},{"i":1314,"c":"L2s12","s":0,"en":"I'd be happy to provide a separate estimate for that component.","ar":"يسعدني تقديم تقدير منفصل لهذا الجزء."},{"i":1315,"c":"L2s12","s":1,"en":"Let me distinguish between the current scope and the additional request.","ar":"دعني أفرّق بين النطاق الحالي والطلب الإضافي."},{"i":1316,"c":"L2s12","s":0,"en":"That's an important topic, though it wasn't included in our initial agreement.","ar":"هذا موضوع مهم، لكنه لم يكن ضمن اتفاقنا الأولي."},{"i":1317,"c":"L2s12","s":0,"en":"We may need to adjust the scope to accommodate that request.","ar":"قد نحتاج لتعديل النطاق لاستيعاب هذا الطلب."},{"i":1318,"c":"L2s12","s":0,"en":"We can certainly incorporate it with a revised engagement structure.","ar":"يمكننا بالتأكيد إدراجه مع هيكل تعاقد معدّل."},{"i":1319,"c":"L2s12","s":0,"en":"I want to ensure we're allocating appropriate time and resources.","ar":"أريد التأكد من أننا نخصص الوقت والموارد المناسبة."},{"i":1320,"c":"L2s12","s":0,"en":"Additional requirements may impact both timeline and pricing.","ar":"المتطلبات الإضافية قد تؤثر على الجدول الزمني والتسعير معاً."},{"i":1321,"c":"L2s13","s":0,"en":"Let's evaluate the implications before making adjustments.","ar":"لنقيّم الآثار قبل إجراء أي تعديلات."},{"i":1322,"c":"L2s13","s":0,"en":"I'd like to assess how that change affects the broader project.","ar":"أودّ تقييم كيف يؤثر هذا التغيير على المشروع ككل."},{"i":1323,"c":"L2s13","s":0,"en":"That's a reasonable request.","ar":"هذا طلب معقول."},{"i":1324,"c":"L2s13","s":0,"en":"We should consider the impact on deliverables and timing.","ar":"يجب أن نأخذ في الاعتبار الأثر على المخرجات والتوقيت."},{"i":1325,"c":"L2s13","s":0,"en":"I'll outline the available options so you can make an informed decision.","ar":"سأعرض الخيارات المتاحة لتتخذ قراراً مدروساً."},{"i":1326,"c":"L2s13","s":0,"en":"There are a few ways we could approach this.","ar":"هناك عدة طرق يمكننا التعامل بها مع هذا."},{"i":1327,"c":"L2s13","s":0,"en":"We can either expand the scope or prioritize within the existing framework.","ar":"يمكننا إما توسيع النطاق أو إعادة ترتيب الأولويات ضمن الإطار الحالي."},{"i":1328,"c":"L2s13","s":0,"en":"The best option depends on your objectives.","ar":"الخيار الأفضل يعتمد على أهدافك."},{"i":1329,"c":"L2s13","s":0,"en":"I'd recommend evaluating the trade-offs carefully.","ar":"أنصح بتقييم المفاضلات بعناية."},{"i":1330,"c":"L2s13","s":0,"en":"Every adjustment carries implications that should be considered.","ar":"كل تعديل له تبعات يجب أخذها في الاعتبار."},{"i":1331,"c":"L2s14","s":0,"en":"Let’s focus on the outcome we're trying to achieve.","ar":"لنركّز على النتيجة التي نسعى لتحقيقها."},{"i":1332,"c":"L2s14","s":0,"en":"I believe the discussion should center on value rather than cost alone.","ar":"أعتقد أن النقاش يجب أن يتمحور حول القيمة لا التكلفة وحدها."},{"i":1333,"c":"L2s14","s":0,"en":"My objective is to find a solution that works for both parties.","ar":"هدفي إيجاد حل يناسب الطرفين."},{"i":1334,"c":"L2s14","s":0,"en":"I'd like to understand your concerns more clearly.","ar":"أودّ أن أفهم مخاوفك بشكل أوضح."},{"i":1335,"c":"L2s14","s":0,"en":"Perhaps we can explore alternative structures.","ar":"ربما يمكننا استكشاف هياكل بديلة."},{"i":1336,"c":"L2s14","s":0,"en":"Let's identify the underlying issue first.","ar":"لنحدد المشكلة الكامنة أولاً."},{"i":1337,"c":"L2s14","s":0,"en":"There may be more than one way to accomplish the objective.","ar":"قد تكون هناك أكثر من طريقة لتحقيق الهدف."},{"i":1338,"c":"L2s14","s":0,"en":"I believe flexibility exists in the structure, not necessarily the quality.","ar":"أعتقد أن المرونة موجودة في الهيكل، لا بالضرورة في الجودة."},{"i":1339,"c":"L2s14","s":0,"en":"Let's evaluate the available options together.","ar":"لنقيّم الخيارات المتاحة معاً."},{"i":1340,"c":"L2s14","s":0,"en":"The goal is to reach an arrangement that creates mutual value.","ar":"الهدف هو الوصول إلى ترتيب يخلق قيمة متبادلة."},{"i":1341,"c":"L2s15","s":0,"en":"If budget is a concern, we might consider a phased approach.","ar":"إذا كانت الميزانية مصدر قلق، يمكننا التفكير في نهج على مراحل."},{"i":1342,"c":"L2s15","s":0,"en":"We may be able to adjust the timeline to improve efficiency.","ar":"قد نتمكن من تعديل الجدول الزمني لتحسين الكفاءة."},{"i":1343,"c":"L2s15","s":0,"en":"Another option would be to prioritize the highest-impact components first.","ar":"خيار آخر هو أن نعطي الأولوية للمكونات الأعلى أثراً أولاً."},{"i":1344,"c":"L2s15","s":0,"en":"We can explore a narrower initial scope if appropriate.","ar":"يمكننا استكشاف نطاق أولي أضيق إن كان مناسباً."},{"i":1345,"c":"L2s15","s":0,"en":"I prefer adjusting scope rather than compromising quality.","ar":"أفضّل تعديل النطاق بدلاً من التنازل عن الجودة."},{"i":1346,"c":"L2s15","s":0,"en":"There may be opportunities to streamline certain elements.","ar":"قد تكون هناك فرص لتبسيط بعض العناصر."},{"i":1347,"c":"L2s15","s":0,"en":"Let's determine which components are most critical.","ar":"لنحدد المكونات الأكثر أهمية."},{"i":1348,"c":"L2s15","s":0,"en":"We can structure the engagement around immediate priorities.","ar":"يمكننا هيكلة التعاقد حول الأولويات العاجلة."},{"i":1349,"c":"L2s15","s":0,"en":"I'd rather simplify the engagement than reduce the standard of work.","ar":"أفضّل تبسيط التعاقد على خفض مستوى العمل."},{"i":1350,"c":"L2s15","s":0,"en":"My goal is to preserve value while remaining practical.","ar":"هدفي الحفاظ على القيمة مع البقاء عملياً."},{"i":1351,"c":"L2s16","s":0,"en":"Based on our discussion, I believe there is a strong opportunity to create value here.","ar":"بناءً على نقاشنا، أعتقد أن هناك فرصة قوية لخلق قيمة هنا."},{"i":1352,"c":"L2s16","s":0,"en":"I believe we have enough information to outline a practical path forward.","ar":"أعتقد أن لدينا معلومات كافية لرسم مسار عملي للأمام."},{"i":1353,"c":"L2s16","s":0,"en":"It seems we're aligned on the primary objectives.","ar":"يبدو أننا متفقون على الأهداف الأساسية."},{"i":1354,"c":"L2s16","s":0,"en":"I believe the next step is relatively straightforward.","ar":"أعتقد أن الخطوة التالية واضحة نسبياً."},{"i":1355,"c":"L2s16","s":0,"en":"The remaining question is how you'd like to proceed.","ar":"السؤال المتبقي هو كيف تودّ أن نمضي."},{"i":1356,"c":"L2s16","s":0,"en":"From my perspective, the opportunity appears well-defined.","ar":"من وجهة نظري، الفرصة تبدو محددة المعالم بشكل جيد."},{"i":1357,"c":"L2s16","s":0,"en":"I believe we've identified the key priorities.","ar":"أعتقد أننا حددنا الأولويات الرئيسية."},{"i":1358,"c":"L2s16","s":0,"en":"The discussion has been extremely productive.","ar":"كان النقاش مثمراً للغاية."},{"i":1359,"c":"L2s16","s":0,"en":"I appreciate the level of transparency you've provided.","ar":"أقدّر مستوى الشفافية الذي قدمته."},{"i":1360,"c":"L2s16","s":0,"en":"I think we have a solid foundation to move forward.","ar":"أظن أن لدينا أساساً متيناً للمضي قدماً."},{"i":1361,"c":"L2s17","s":1,"en":"I'd be happy to prepare a formal proposal for your review.","ar":"يسعدني إعداد عرض رسمي لمراجعتك."},{"i":1362,"c":"L2s17","s":0,"en":"I'll outline the scope, deliverables, timeline, and investment.","ar":"سأوضح النطاق والمخرجات والجدول الزمني والاستثمار."},{"i":1363,"c":"L2s17","s":0,"en":"The proposal will reflect the priorities we discussed today.","ar":"سيعكس العرض الأولويات التي ناقشناها اليوم."},{"i":1364,"c":"L2s17","s":0,"en":"I'll ensure the recommendations are tailored to your situation.","ar":"سأتأكد من أن التوصيات مصممة لوضعك."},{"i":1365,"c":"L2s17","s":0,"en":"My objective is to provide complete clarity before any commitment is made.","ar":"هدفي أن أقدّم وضوحاً كاملاً قبل أي التزام."},{"i":1366,"c":"L2s17","s":0,"en":"I'll include several options where appropriate.","ar":"سأدرج عدة خيارات حيث يكون ذلك مناسباً."},{"i":1367,"c":"L2s17","s":0,"en":"The proposal will focus on outcomes rather than activities alone.","ar":"سيركّز العرض على النتائج لا على الأنشطة وحدها."},{"i":1368,"c":"L2s17","s":0,"en":"I'll clearly define responsibilities and expectations.","ar":"سأحدد المسؤوليات والتوقعات بوضوح."},{"i":1369,"c":"L2s17","s":0,"en":"I want the engagement structure to support your objectives.","ar":"أريد أن يدعم هيكل التعاقد أهدافك."},{"i":1370,"c":"L2s17","s":0,"en":"You'll have everything needed to make an informed decision.","ar":"سيكون لديك كل ما تحتاجه لاتخاذ قرار مدروس."},{"i":1371,"c":"L2s18","s":0,"en":"There doesn't appear to be a benefit in delaying the analysis unnecessarily.","ar":"لا يبدو أن هناك فائدة من تأجيل التحليل دون داعٍ."},{"i":1372,"c":"L2s18","s":0,"en":"The earlier we begin, the more flexibility we'll have.","ar":"كلما بدأنا مبكراً، زادت المرونة المتاحة لنا."},{"i":1373,"c":"L2s18","s":0,"en":"Addressing the issue proactively may create additional options.","ar":"معالجة المشكلة بشكل استباقي قد تفتح خيارات إضافية."},{"i":1374,"c":"L2s18","s":0,"en":"Timing could become an important factor depending on market conditions.","ar":"قد يصبح التوقيت عاملاً مهماً حسب ظروف السوق."},{"i":1375,"c":"L2s18","s":0,"en":"Early preparation often leads to stronger outcomes.","ar":"الإعداد المبكر غالباً ما يقود إلى نتائج أقوى."},{"i":1376,"c":"L2s18","s":0,"en":"The opportunity may become more complex if postponed for too long.","ar":"قد تصبح الفرصة أكثر تعقيداً إذا تأجلت لفترة طويلة."},{"i":1377,"c":"L2s18","s":0,"en":"Starting sooner allows more time for thoughtful execution.","ar":"البدء مبكراً يتيح وقتاً أطول لتنفيذ مدروس."},{"i":1378,"c":"L2s18","s":0,"en":"A structured process typically benefits from adequate preparation time.","ar":"العملية المنظمة عادةً تستفيد من وقت إعداد كافٍ."},{"i":1379,"c":"L2s18","s":0,"en":"Acting early often reduces avoidable risks.","ar":"التحرك المبكر غالباً ما يقلل المخاطر التي يمكن تجنبها."},{"i":1380,"c":"L2s18","s":0,"en":"My recommendation would be to begin before the situation becomes more constrained.","ar":"توصيتي أن نبدأ قبل أن يصبح الوضع أكثر تقييداً."},{"i":1381,"c":"L2s19","s":0,"en":"If you're comfortable moving forward, I can begin preparing the next steps.","ar":"إذا كنت مرتاحاً للمضي قدماً، يمكنني البدء في إعداد الخطوات التالية."},{"i":1382,"c":"L2s19","s":0,"en":"I'd be pleased to support you through the process.","ar":"يسعدني أن أدعمك خلال العملية."},{"i":1383,"c":"L2s19","s":0,"en":"I believe this engagement could create meaningful value.","ar":"أعتقد أن هذا التعاقد يمكن أن يخلق قيمة حقيقية."},{"i":1384,"c":"L2s19","s":0,"en":"I'm confident we can build a practical roadmap.","ar":"أنا واثق أننا نستطيع بناء خارطة طريق عملية."},{"i":1385,"c":"L2s19","s":0,"en":"I'd welcome the opportunity to work together.","ar":"أرحب بفرصة العمل معاً."},{"i":1386,"c":"L2s19","s":0,"en":"I look forward to helping you achieve your objectives.","ar":"أتطلع لمساعدتك على تحقيق أهدافك."},{"i":1387,"c":"L2s19","s":0,"en":"I believe we can establish a productive working relationship.","ar":"أعتقد أننا نستطيع بناء علاقة عمل مثمرة."},{"i":1388,"c":"L2s19","s":0,"en":"My focus will be on delivering measurable value.","ar":"تركيزي سيكون على تقديم قيمة قابلة للقياس."},{"i":1389,"c":"L2s19","s":0,"en":"I'll ensure the process remains organized and efficient.","ar":"سأحرص على أن تظل العملية منظمة وفعّالة."},{"i":1390,"c":"L2s19","s":0,"en":"I'm committed to producing work that supports sound decision-making.","ar":"ألتزم بتقديم عمل يدعم اتخاذ قرارات سليمة."},{"i":1391,"c":"L2s20","s":0,"en":"I view successful engagements as the beginning of a long-term relationship.","ar":"أرى التعاقدات الناجحة بداية لعلاقة طويلة الأجل."},{"i":1392,"c":"L2s20","s":0,"en":"My goal is to become a trusted resource over time.","ar":"هدفي أن أصبح مرجعاً موثوقاً مع الوقت."},{"i":1393,"c":"L2s20","s":0,"en":"I value long-term partnerships more than one-time transactions.","ar":"أقدّر الشراكات طويلة الأجل أكثر من المعاملات لمرة واحدة."},{"i":1394,"c":"L2s20","s":0,"en":"I believe the strongest client relationships are built on trust and results.","ar":"أؤمن بأن أقوى علاقات العملاء تُبنى على الثقة والنتائج."},{"i":1395,"c":"L2s20","s":0,"en":"I'm always available to provide guidance when needed.","ar":"أنا متاح دائماً لتقديم التوجيه عند الحاجة."},{"i":1396,"c":"L2s20","s":0,"en":"I want clients to feel confident reaching out as new opportunities arise.","ar":"أريد أن يشعر العملاء بالارتياح للتواصل معي كلما ظهرت فرص جديدة."},{"i":1397,"c":"L2s20","s":0,"en":"My objective is to continue creating value beyond the initial engagement.","ar":"هدفي مواصلة خلق القيمة بعد التعاقد الأولي."},{"i":1398,"c":"L2s20","s":0,"en":"I hope this is the first of many successful projects together.","ar":"أتمنى أن يكون هذا أول مشاريع ناجحة كثيرة معاً."},{"i":1399,"c":"L2s20","s":0,"en":"I appreciate the opportunity to earn your trust.","ar":"أقدّر الفرصة لكسب ثقتك."},{"i":1400,"c":"L2s20","s":0,"en":"Thank you again for your time, and I look forward to working with you.","ar":"شكراً مجدداً على وقتك، وأتطلع للعمل معك."},{"i":1401,"c":"L3s01","s":0,"en":"My objective is to understand the credit story behind the transaction.","ar":"هدفي أن أفهم القصة الائتمانية وراء الصفقة."},{"i":1402,"c":"L3s01","s":1,"en":"Every lending decision begins with understanding the borrower.","ar":"كل قرار إقراض يبدأ بفهم المقترض."},{"i":1403,"c":"L3s01","s":0,"en":"The goal is to evaluate both repayment capacity and overall credit risk.","ar":"الهدف تقييم القدرة على السداد ومخاطر الائتمان الإجمالية معاً."},{"i":1404,"c":"L3s01","s":0,"en":"Strong underwriting requires both quantitative and qualitative analysis.","ar":"الاكتتاب القوي يتطلب تحليلاً كمياً ونوعياً معاً."},{"i":1405,"c":"L3s01","s":0,"en":"My role is to identify strengths, weaknesses, risks, and mitigating factors.","ar":"دوري أن أحدد نقاط القوة والضعف والمخاطر وعوامل التخفيف."},{"i":1406,"c":"L3s01","s":0,"en":"Sound underwriting is ultimately about risk-adjusted decision making.","ar":"الاكتتاب السليم في جوهره اتخاذ قرار مُعدَّل بالمخاطر."},{"i":1407,"c":"L3s01","s":0,"en":"A lender's primary concern is repayment.","ar":"الشاغل الأساسي للمقرض هو السداد."},{"i":1408,"c":"L3s01","s":0,"en":"The transaction must make sense from both a business and credit perspective.","ar":"يجب أن تكون الصفقة منطقية من منظور النشاط ومن منظور الائتمان معاً."},{"i":1409,"c":"L3s01","s":0,"en":"The quality of the borrower often matters as much as the quality of the collateral.","ar":"جودة المقترض كثيراً ما تكون بأهمية جودة الضمانات."},{"i":1410,"c":"L3s01","s":0,"en":"The objective is not simply to approve a loan, but to approve the right loan.","ar":"الهدف ليس مجرد الموافقة على قرض، بل الموافقة على القرض الصحيح."},{"i":1411,"c":"L3s02","s":0,"en":"Could you provide a brief overview of the business?","ar":"هل يمكنك إعطاء نظرة عامة مختصرة عن النشاط؟"},{"i":1412,"c":"L3s02","s":0,"en":"How long has the company been operating?","ar":"منذ متى تعمل الشركة؟"},{"i":1413,"c":"L3s02","s":0,"en":"What products or services does the business provide?","ar":"ما المنتجات أو الخدمات التي يقدمها النشاط؟"},{"i":1414,"c":"L3s02","s":0,"en":"What are the company's primary sources of revenue?","ar":"ما المصادر الأساسية لإيرادات الشركة؟"},{"i":1415,"c":"L3s02","s":0,"en":"Who are your key customers?","ar":"من هم عملاؤك الرئيسيون؟"},{"i" :"هل مزيج التمويل مناسب لملف المخاطر؟"},{"i":1633,"c":"L4s04","s":0,"en":"How much leverage is prudent under current conditions?","ar":"ما حجم الرافعة الحصيف في ظل الظروف الحالية؟"},{"i":1634,"c":"L4s04","s":0,"en":"Does the structure provide sufficient flexibility?","ar":"هل يوفر الهيكل مرونة كافية؟"},{"i":1635,"c":"L4s04","s":0,"en":"What level of sponsor commitment is appropriate?","ar":"ما مستوى التزام الراعي المناسب؟"},{"i":1636,"c":"L4s04","s":0,"en":"Is the proposed debt burden sustainable?","ar":"هل عبء الدين المقترح مستدام؟"},{"i":1637,"c":"L4s04","s":0,"en":"How would the structure perform under downside scenarios?","ar":"كيف سيكون أداء الهيكل في سيناريوهات الهبوط؟"},{"i":1638,"c":"L4s04","s":0,"en":"Does the transaction require additional equity support?","ar":"هل تحتاج الصفقة دعماً إضافياً من حقوق الملكية؟"},{"i":1639,"c":"L4s04","s":0,"en":"What financing alternatives should be considered?","ar":"ما بدائل التمويل التي يجب النظر فيها؟"},{"i":1640,"c":"L4s04","s":0,"en":"The structure should balance growth objectives with risk management.","ar":"يجب أن يوازن الهيكل بين أهداف النمو وإدارة المخاطر."},{"i":1641,"c":"L4s05","s":0,"en":"Let's evaluate the transaction through a lender's lens.","ar":"لنقيّم الصفقة بعين المقرض."},{"i":1642,"c":"L4s05","s":0,"en":"What concerns would a credit committee likely raise?","ar":"ما المخاوف التي من المرجح أن تثيرها لجنة الائتمان؟"},{"i":1643,"c":"L4s05","s":0,"en":"What elements of the request are most compelling?","ar":"ما أكثر عناصر الطلب إقناعاً؟"},{"i":1644,"c":"L4s05","s":0,"en":"What weaknesses are likely to attract scrutiny?","ar":"ما نقاط الضعف التي من المرجح أن تخضع للتدقيق؟"},{"i":1645,"c":"L4s05","s":0,"en":"How can the transaction be strengthened before submission?","ar":"كيف يمكن تقوية الصفقة قبل تقديمها؟"},{"i":1646,"c":"L4s05","s":0,"en":"What additional support would improve lender confidence?","ar":"ما الدعم الإضافي الذي سيحسّن ثقة المقرض؟"},{"i":1647,"c":"L4s05","s":0,"en":"How does the transaction compare to similar financings?","ar":"كيف تقارَن الصفقة بعمليات تمويل مشابهة؟"},{"i":1648,"c":"L4s05","s":0,"en":"What questions should we be prepared to answer?","ar":"ما الأسئلة التي يجب أن نكون مستعدين للإجابة عنها؟"},{"i":1649,"c":"L4s05","s":0,"en":"What evidence will lenders expect to see?","ar":"ما الأدلة التي سيتوقع المقرضون رؤيتها؟"},{"i":1650,"c":"L4s05","s":0,"en":"A well-prepared transaction reduces friction throughout the approval process.","ar":"الصفقة المُعَدّة جيداً تقلل الاحتكاك طوال عملية الموافقة."},{"i":1651,"c":"L4s06","s":0,"en":"Let's focus on designing a structure that aligns risk with repayment capacity.","ar":"لنركّز على تصميم هيكل يوائم بين المخاطر والقدرة على السداد."},{"i":1652,"c":"L4s06","s":0,"en":"The objective is to create a structure that remains sustainable throughout the life of the loan.","ar":"الهدف بناء هيكل يظل مستداماً طوال عمر القرض."},{"i":1653,"c":"L4s06","s":0,"en":"A well-designed structure should protect both the borrower and the lender.","ar":"الهيكل المصمم جيداً يجب أن يحمي المقترض والمقرض معاً."},{"i":1654,"c":"L4s06","s":0,"en":"The financing structure must support operational realities.","ar":"يجب أن يدعم هيكل التمويل الواقع التشغيلي."},{"i":1655,"c":"L4s06","s":0,"en":"The proposed structure should be evaluated under multiple scenarios.","ar":"يجب تقييم الهيكل المقترح في ظل سيناريوهات متعددة."},{"i":1656,"c":"L4s06","s":0,"en":"Let's determine whether the requested structure is optimal.","ar":"لنحدد ما إذا كان الهيكل المطلوب هو الأمثل."},{"i":1657,"c":"L4s06","s":0,"en":"There may be opportunities to improve the structure without increasing risk.","ar":"قد تكون هناك فرص لتحسين الهيكل دون زيادة المخاطر."},{"i":1658,"c":"L4s06","s":0,"en":"The transaction should be designed around cash flow rather than optimism.","ar":"يجب تصميم الصفقة حول التدفق النقدي لا حول التفاؤل."},{"i":1659,"c":"L4s06","s":0,"en":"Structure often matters more than pricing.","ar":"الهيكل كثيراً ما يكون أهم من التسعير."},{"i":1660,"c":"L4s06","s":0,"en":"A strong structure can compensate for certain transaction weaknesses.","ar":"الهيكل القوي قد يعوّض بعض نقاط الضعف في الصفقة."},{"i":1661,"c":"L4s07","s":0,"en":"Let's review the sources and uses of funds.","ar":"لنراجع مصادر الأموال واستخداماتها."},{"i":1662,"c":"L4s07","s":0,"en":"Every dollar entering the transaction should be clearly accounted for.","ar":"كل دولار يدخل الصفقة يجب أن يكون مُبرراً بوضوح."},{"i":1663,"c":"L4s07","s":0,"en":"The capital stack should be transparent and logical.","ar":"يجب أن يكون هيكل رأس المال شفافاً ومنطقياً."},{"i":1664,"c":"L4s07","s":0,"en":"Are the funding sources fully identified?","ar":"هل مصادر التمويل محددة بالكامل؟"},{"i":1665,"c":"L4s07","s":0,"en":"Do the proposed sources adequately support the transaction?","ar":"هل تدعم المصادر المقترحة الصفقة بشكل كافٍ؟"},{"i":1666,"c":"L4s07","s":0,"en":"Are there any funding gaps that need to be addressed?","ar":"هل هناك أي فجوات تمويلية تحتاج إلى معالجة؟"},{"i":1667,"c":"L4s07","s":0,"en":"The uses of funds should directly support the stated objectives.","ar":"يجب أن تدعم استخدامات الأموال الأهداف المعلنة بشكل مباشر."},{"i":1668,"c":"L4s07","s":0,"en":"Are all transaction costs appropriately reflected?","ar":"هل جميع تكاليف الصفقة مُدرجة بشكل مناسب؟"},{"i":1669,"c":"L4s07","s":0,"en":"Does the capital allocation support long-term value creation?","ar":"هل يدعم تخصيص رأس المال خلق القيمة على المدى الطويل؟"},{"i":1670,"c":"L4s07","s":0,"en":"A clear sources-and-uses schedule strengthens lender confidence.","ar":"جدول المصادر والاستخدامات الواضح يقوّي ثقة المقرض."},{"i":1671,"c":"L4s08","s":0,"en":"Sponsor commitment is an important indicator of confidence.","ar":"التزام الراعي مؤشر مهم على الثقة."},{"i":1672,"c":"L4s08","s":0,"en":"Let's evaluate the proposed equity contribution.","ar":"لنقيّم المساهمة الرأسمالية المقترحة."},{"i":1673,"c":"L4s08","s":0,"en":"Is the borrower contributing sufficient capital to the transaction?","ar":"هل يساهم المقترض برأس مال كافٍ في الصفقة؟"},{ erentiates this borrower from similar opportunities?","ar":"ما الذي يميز هذا المقترض عن الفرص المشابهة؟"},{"i":1717,"c":"L4s12","s":0,"en":"What characteristics improve credit quality?","ar":"ما الخصائص التي تحسّن جودة الائتمان؟"},{"i":1718,"c":"L4s12","s":0,"en":"How should the business be presented to maximize credibility?","ar":"كيف يجب تقديم النشاط لتعظيم المصداقية؟"},{"i":1719,"c":"L4s12","s":0,"en":"Which facts deserve greater emphasis?","ar":"أي الحقائق تستحق تركيزاً أكبر؟"},{"i":1720,"c":"L4s12","s":0,"en":"The objective is to present the strongest accurate version of the story.","ar":"الهدف تقديم أقوى نسخة دقيقة من القصة."},{"i":1721,"c":"L4s13","s":0,"en":"Every transaction contains weaknesses; the key is addressing them proactively.","ar":"كل صفقة فيها نقاط ضعف؛ والمفتاح هو معالجتها بشكل استباقي."},{"i":1722,"c":"L4s13","s":0,"en":"Let's identify concerns before lenders do.","ar":"لنحدد المخاوف قبل أن يحددها المقرضون."},{"i":1723,"c":"L4s13","s":0,"en":"What aspects of the transaction may attract scrutiny?","ar":"أي جوانب الصفقة قد تخضع للتدقيق؟"},{"i":1724,"c":"L4s13","s":0,"en":"How should those concerns be explained?","ar":"كيف يجب شرح هذه المخاوف؟"},{"i":1725,"c":"L4s13","s":0,"en":"What mitigating factors reduce the associated risk?","ar":"ما عوامل التخفيف التي تقلل المخاطر المرتبطة بها؟"},{"i":1726,"c":"L4s13","s":0,"en":"Which weaknesses are temporary rather than structural?","ar":"أي نقاط الضعف مؤقتة وليست هيكلية؟"},{"i":1727,"c":"L4s13","s":0,"en":"What evidence supports management's response to those concerns?","ar":"ما الدليل الذي يدعم استجابة الإدارة لهذه المخاوف؟"},{"i":1728,"c":"L4s13","s":0,"en":"How should difficult questions be addressed?","ar":"كيف يجب التعامل مع الأسئلة الصعبة؟"},{"i":1729,"c":"L4s13","s":0,"en":"Transparency generally builds more confidence than avoidance.","ar":"الشفافية عموماً تبني ثقة أكبر من التهرب."},{"i":1730,"c":"L4s13","s":0,"en":"Credibility is strengthened when risks are acknowledged openly.","ar":"تتعزز المص لى DSCR."},{"i":2122,"c":"cl1","who":"c","s":0,"en":"We're a franchise — does that change anything?","ar":"نحن امتياز تجاري (فرانشايز) — هل يغيّر ذلك شيئاً؟","note":"نعم: راجع الـ Franchise Directory والـ FDD."},{"i":2123,"c":"cl1","who":"c","s":0,"en":"Honestly, I don't know my numbers that well. That's why I'm calling you.","ar":"بصراحة، لا أعرف أرقامي جيداً. لهذا أتصل بك.","note":"فرصة ذهبية: العميل بيطلب قيادة. ابدأ بالـ discovery."},{"i":2124,"c":"cl1","who":"c","s":0,"en":"What do you need from me to get started?","ar":"ماذا تحتاج مني لنبدأ؟","note":"إشارة شراء. أعطه قائمة مستندات قصيرة وموعد."},{"i":2125,"c":"cl1","who":"c","s":0,"en":"Sounds good — let's touch base next week.","ar":"يبدو جيداً — لنتواصل الأسبوع القادم.","note":"touch base = نتواصل. ثبّت يوم ووقت بدل \"next week\" المفتوحة."},{"i":2126,"c":"cl1","who":"c","s":0,"en":"I'll be upfront with you — we've got a tax lien.","ar":"سأكون صريحاً معك — علينا حجز ضريبي.","note":"upfront = صريح من البداية. tax lien = حق امتياز ضريبي على الأصول. لازم خطة سداد موثقة."},{"i":2127,"c":"cl1","who":"c","s":0,"en":"The appraisal came in low.","ar":"جاء التقييم منخفضاً.","note":"came in low = طلع أقل من المتوقع. فجوة تمويل: renegotiate أو equity إضافي."},{"i":2128,"c":"cl1","who":"c","s":0,"en":"The lender wants a personal guarantee, and I'm not thrilled about it.","ar":"المقرض يريد ضماناً شخصياً، ولست سعيداً بذلك.","note":"not thrilled = مش مبسوط. وضّح إنه شرط معتاد لملاك 20% فأكثر."},{"i":2129,"c":"cl1","who":"c","s":0,"en":"Is that something you could turn around this week?","ar":"هل هذا شيء يمكنك إنجازه هذا الأسبوع؟","note":"turn around = تنجز وتسلّم. لا توعد قبل ما تشوف المستندات."},{"i":2130,"c":"cl1","who":"c","s":0,"en":"We've only been in business about eighteen months.","ar":"نعمل منذ حوالي ثمانية عشر شهراً فقط.","note":"تاريخ تشغيلي قصير: اعتمد على خبرة المالك والتوقعات المتحفظة."},{"i":2131,"c":"cl1","who":"c","s":0,"en":"Can I use my 401(k) for the down payment?","ar":"هل يمكنني استخدام حساب التقاعد 401(k) للدفعة الأولى؟","note":"401(k) = حساب تقاعد أمريكي. يوجد هيكل اسمه ROBS بس محتاج متخصص ضرائب — لا تفتي فيه."},{"i":2132,"c":"cl1","who":"c","s":0,"en":"Ballpark, what am I looking at cost-wise?","ar":"بشكل تقريبي، ما التكلفة التي أتحدث عنها؟","note":"ballpark = رقم تقريبي. اعطِ نطاق مش رقم واحد."},{"i":2133,"c":"cl1","who":"c","s":0,"en":"I'm not trying to nickel-and-dime you, but that seems high.","ar":"لا أحاول المساومة على كل قرش، لكن هذا يبدو مرتفعاً.","note":"nickel-and-dime = يساوم على التفاصيل الصغيرة. اعتراض سعر مهذب."},{"i":2134,"c":"cl1","who":"c","s":0,"en":"Bottom line — can you get this deal done or not?","ar":"الخلاصة — هل تستطيع إتمام هذه الصفقة أم لا؟","note":"سؤال ضغط. رد بثقة على ما تتحكم فيه: جودة الملف والمطابقة مع المقرض."},{"i":2135,"c":"cl1","who":"c","s":0,"en":"Okay, you lost me there. Can you break that down?","ar":"حسناً، لم أعد أتابعك هنا. هل يمكنك تبسيط ذلك؟","note":"you lost me = مش فاهم. break down = فصّصه. ارجع لـ sv1 وبسّط."},{"i":2201,"c":"sb1","s":1,"en":"Before anything else, we confirm the business is eligible — size, industry, and use of proceeds.","ar":"قبل أي شيء، نتأكد أن النشاط مؤهل — الحجم والقطاع واستخدام الحصيلة.","note":"أول فلتر في أي ملف SBA. مبدأ عام — Tier 1."},{"i":2202,"c":"sb1","s":1,"en":"For a change of ownership, plan on bringing at least ten percent of the total project cost as equity.","ar":"في حالة تغيير الملكية، خطط لتقديم عشرة بالمئة على الأقل من إجمالي تكلفة المشروع كحقوق ملكية.","note":"SOP 50 10 8.1 — Tier 1. قلها كحد أدنى للتخطيط؛ المقرض ممكن يطلب أكتر."},{"i":2203,"c":"sb1","s":0,"en":"Your equity injection has to be verified — the lender will want to see where the money came from.","ar":"يجب التحقق من مساهمتك الرأسمالية — سيريد المقرض أن يرى من أين جاء المال.","note":"source of funds: كشوف حساب بنكية تثبت المصدر. Tier 1."},{"i":2204,"c":"sb1","s":0,"en":"A gift letter on its own isn't enough — the lender needs to see the money actually move.","ar":"خطاب الهبة وحده لا يكفي — يحتاج المقرض أن يرى الأموال تتحرك فعلياً.","note":"SOP 50 10 8.1: gift letter أو promissory note لا يكفي بدون دليل مؤيد. Tier 1."},{"i":2205,"c":"sb1","s":1,"en":"A seller note only counts toward your injection if it's on full standby — no principal and no interest for the life of the SBA loan.","ar":"سند البائع لا يُحتسب ضمن مساهمتك إلا إذا كان على تأجيل كامل — بلا أصل ولا فائدة طوال عمر قرض الـ SBA.","note":"SOP 50 10 8.1 — Tier 1. الفائدة ممكن تتراكم وتتسدد بعد سداد قرض الـ SBA."},{"i":2206,"c":"sb1","s":0,"en":"If the seller note is on standby, the seller signs a standby agreement — SBA Form 155 or the lender's equivalent.","ar":"إذا كان سند البائع مؤجلاً، يوقّع البائع اتفاقية تأجيل — نموذج SBA 155 أو ما يعادله لدى المقرض.","note":"SOP 50 10 8.1 — Tier 1."},{"i":2207,"c":"sb1","s":0,"en":"Under the current SOP, seller debt from an acquisition can be refinanced once it's been in place and current for thirty-six months.","ar":"وفق الـ SOP الحالي، يمكن إعادة تمويل دين البائع الناتج عن الاستحواذ بعد بقائه منتظماً لمدة ستة وثلاثين شهراً.","note":"SOP 50 10 8.1 — Tier 1. in place and current = قائم ومنتظم السداد."},{"i":2208,"c":"sb1","s":0,"en":"My fee is disclosed to the lender on SBA Form 159 — that's standard, and it keeps everything transparent.","ar":"تُفصح أتعابي للمقرض على نموذج SBA 159 — هذا إجراء معتاد ويحافظ على الشفافية.","note":"Form 159 = إفصاح أتعاب الـ agent/packager. Tier 1."},{"i":2209,"c":"sb1","s":1,"en":"Fees you pay me can't count toward your equity injection.","ar":"الأتعاب التي تدفعها لي لا تُحتسب ضمن مساهمتك الرأسمالية.","note":"SOP 50 10 8.1: fees paid to an Agent ليست equity. Tier 1."},{"i":2210,"c":"sb1","s":0,"en":"Lenders typically ask for three years of business tax returns, plus year-to-date financials.","ar":"عادةً يطلب المقرضون ثلاث سنوات من الإقرارات الضريبية للنشاط، إضافة إلى القوائم المالية منذ بداية العام.","note":"typically = عادةً. ممارسة سوق — Tier 2، والمقرض يحدد القائمة النهائية."},{"i":2211,"c":"sb1","s":0,"en":"The lender will verify your returns with the IRS — so every number we present has to tie out.","ar":"سيتحقق المقرض من إقراراتك مع مصلحة الضرائب — لذا كل رقم نقدمه يجب أن يتطابق.","note":"tie out = يتطابق. ممارسة معتادة عبر IRS transcripts — Tier 2."},{"i":2212,"c":"sb1","s":1,"en":"We can document legitimate add-backs, but we can't present income your returns don't support.","ar":"يمكننا توثيق الإضافات المشروعة، لكن لا يمكننا تقديم دخل لا تدعمه إقراراتك.","note":"خط أحمر مهني. بيحميك ويحمي العميل."},{"i":2213,"c":"sb1","s":0,"en":"Personal expenses run through the business can sometimes be added back — but only with paper behind them.","ar":"المصروفات الشخصية الممرّرة عبر الشركة يمكن أحياناً إضافتها — لكن فقط بمستندات تدعمها.","note":"with paper behind them = بمستندات. ردّ مباشر على جملة العميل 2107."},{"i":2214,"c":"sb1","s":0,"en":"The SBA guarantee protects the lender, not you — you're still fully liable for the loan.","ar":"ضمان الـ SBA يحمي المقرض وليس أنت — تظل مسؤولاً مسؤولية كاملة عن القرض.","note":"سوء فهم شائع جداً عند العملاء. Tier 1."},{"i":2215,"c":"sb1","s":1,"en":"A loan can't be declined just because collateral is short — but the guarantee isn't a substitute for collateral you do have.","ar":"لا يجوز رفض القرض لمجرد نقص الضمانات — لكن الضمان ليس بديلاً عن الضمانات المتاحة لديك.","note":"SOP 50 10 8.1 — Tier 1. نصفين مهمين: الطمأنة + التحذير."},{"i":2216,"c":"sb1","s":0,"en":"If the business collateral falls short, the lender may look at equity in your personal real estate.","ar":"إذا لم تكفِ ضمانات النشاط، قد ينظر المقرض في حقوق الملكية في عقارك الشخصي.","note":"SOP 50 10 8.1: مش مطلوب رهن لو الـ equity أقل من 25% من القيمة السوقية. Tier 1."},{"i":2217,"c":"sb1","s":0,"en":"Life insurance on key owners is common — and if the lender doesn't require it, they have to justify that.","ar":"التأمين على حياة الملاك الرئيسيين شائع — وإذا لم يطلبه المقرض، عليه أن يبرر ذلك.","note":"SOP 50 10 8.1: الـ credit memo لازم يبرر عدم طلب التأمين. Tier 1."},{"i":2218,"c":"sb1","s":1,"en":"Let's separate what SBA requires from what your lender requires — they're not always the same.","ar":"لنفصل بين ما تشترطه الـ SBA وما يشترطه المقرض — فهما ليسا دائماً نفس الشيء.","note":"lender overlays = شروط إضافية للبنك فوق شروط الـ SBA. جملة بتبيّن خبرتك فوراً."},{"i":2219,"c":"sb1","s":0,"en":"Different SBA lenders have different appetites, so a no from one bank isn't a no from the program.","ar":"لكل مقرض SBA شهية مختلفة، لذا رفض بنك واحد ليس رفضاً من البرنامج.","note":"ردّ على 2117 (رفضنا بنك)."},{"i":2220,"c":"sb1","s":0,"en":"Working capital is a fine use of proceeds, but if it's half the loan or more, the lender has to justify it in the credit memo.","ar":"رأس المال العامل استخدام مقبول للحصيلة، لكن إذا بلغ نصف القرض أو أكثر، على المقرض تبريره في مذكرة الائتمان.","note":"SOP 50 10 8.1: 50% أو أكثر = تبرير إلزامي. Tier 1."},{"i":2221,"c":"sb1","s":0,"en":"For an acquisition, expect the lender to want an independent business valuation.","ar":"في عمليات الاستحواذ، توقّع أن يطلب المقرض تقييماً مستقلاً للنشاط.","note":"expect = توقّع. الشرط التفصيلي يعتمد على حجم الصفقة — Tier 2."},{"i":2222,"c":"sb1","s":0,"en":"Your personal credit and liquidity matter just as much as the business's numbers.","ar":"ائتمانك الشخصي وسيولتك لا يقلّان أهمية عن أرقام النشاط.","note":"العملاء الصغار غالباً بيستغربوا ده."},{"i":2223,"c":"sb1","s":0,"en":"The 504 program is for fixed assets — it won't fund working capital.","ar":"برنامج 504 مخصص للأصول الثابتة — ولا يموّل رأس المال العامل.","note":"Tier 1."},{"i":2224,"c":"sb1","s":1,"en":"Before you sign a letter of intent, let's make sure the structure is SBA-eligible.","ar":"قبل أن توقّع خطاب النوايا، لنتأكد أن الهيكل مؤهل للـ SBA.","note":"LOI = خطاب نوايا. هنا قيمتك الحقيقية: قبل ما الغلطة تحصل."},{"i":2225,"c":"sb1","s":1,"en":"I prepare the package; the lender makes the credit decision. I can't promise an approval.","ar":"أنا أُعدّ الملف؛ والمقرض يتخذ القرار الائتماني. لا يمكنني أن أعد بالموافقة.","note":"ردّ على 2106. خط أحمر أخلاقي وقانوني."},{"i":2226,"c":"sb1","s":0,"en":"What I can promise is a file that answers the lender's questions before they ask them.","ar":"ما يمكنني أن أعد به هو ملف يجيب عن أسئلة المقرض قبل أن يطرحها.","note":"الجملة التي تلي 2225 مباشرة — تحوّل الحد إلى قيمة."},{"i":2227,"c":"sb1","s":0,"en":"Any liens, judgments, or pending litigation will come up — it's better if we explain them first.","ar":"أي حجوزات أو أحكام أو قضايا منظورة ستظهر — الأفضل أن نشرحها نحن أولاً.","note":"SOP 50 10 8.1: الـ memo لازم يناقشها. ردّ على 2126 (tax lien)."},{"i":2228,"c":"sb1","s":0,"en":"Smaller 7(a) loans — three hundred fifty thousand or less — have their own, simpler track.","ar":"قروض 7(a) الأصغر — ثلاثمئة وخمسون ألفاً أو أقل — لها مسار خاص أبسط.","note":"7(a) Small = 350K أو أقل (SOP 50 10 8.1 — Tier 1)."},{"i":2229,"c":"sb1","s":0,"en":"The lender will look at whether your working capital is adequate for at least the next twelve months.","ar":"سينظر المقرض في مدى كفاية رأس المال العامل لديك للاثني عشر شهراً القادمة على الأقل.","note":"SOP 50 10 8.1: تحليل كفاية رأس المال العامل 12 شهر كحد أدنى. Tier 1."},{"i":2230,"c":"sb1","s":0,"en":"If we're refinancing existing debt, any late payments in the past year will need a written explanation.","ar":"إذا كنا نعيد تمويل ديون قائمة، أي تأخر في السداد خلال العام الماضي سيحتاج تفسيراً كتابياً.","note":"SOP 50 10 8.1 — Tier 1."},{"i":2231,"c":"sb2","s":1,"en":"I'm reaching out on behalf of a borrower looking for a 7(a) acquisition loan of about one point two million.","ar":"أتواصل نيابةً عن مقترض يسعى للحصول على قرض استحواذ 7(a) بحوالي مليون ومئتي ألف.","note":"افتتاحية لمكالمة BDO أو بنك. قل الحجم والبرنامج والغرض في جملة واحدة."},{"i":2232,"c":"sb2","s":1,"en":"Is this something that fits your current credit box?","ar":"هل هذا يتوافق مع معاييركم الائتمانية الحالية؟","note":"credit box = نطاق ما يقبله البنك حالياً. مصطلح سوق أمريكي شائع."},{"i":2233,"c":"sb2","s":0,"en":"Are you processing under PLP authority, or would this go through standard processing?","ar":"هل تعالجون بصلاحية PLP، أم سيمر هذا بالمعالجة العادية؟","note":"PLP = Preferred Lender. بيأثر على المدة."},{"i":2234,"c":"sb2","s":0,"en":"What's your appetite right now for change-of-ownership deals?","ar":"ما شهيتكم حالياً لصفقات تغيير الملكية؟","note":"appetite = رغبة البنك في نوع معين من الصفقات."},{"i":2235,"c":"sb2","s":0,"en":"Do you have a minimum loan size, or any industries you stay away from?","ar":"هل لديكم حد أدنى لحجم القرض، أو قطاعات تتجنبونها؟","note":"وفّر وقتك ووقت البنك من أول دقيقة."},{"i":2236,"c":"sb2","s":0,"en":"What global DSCR do you typically underwrite to on deals like this?","ar":"ما نسبة تغطية خدمة الدين الإجمالية التي تكتتبون عليها عادةً في صفقات كهذه؟","note":"global DSCR = تغطية تشمل النشاط والدخل الشخصي للضامنين."},{"i":2237,"c":"sb2","s":1,"en":"Historical cash flow covers proposed debt service at about one point four times.","ar":"التدفق النقدي التاريخي يغطي خدمة الدين المقترحة بحوالي 1.4 مرة.","note":"قل الرقم مع كلمة historical — البنك بيثق في التاريخي أكتر من المتوقع."},{"i":2238,"c":"sb2","s":0,"en":"Equity is fifteen percent: ten percent cash from the buyer, and five percent seller note on full standby.","ar":"حقوق الملكية خمسة عشر بالمئة: عشرة بالمئة نقداً من المشتري، وخمسة بالمئة سند بائع على تأجيل كامل.","note":"هيكل شائع في الاستحواذ. اذكر full standby صراحةً."},{"i":2239,"c":"sb2","s":0,"en":"The seller has agreed to sign a full standby agreement.","ar":"وافق البائع على توقيع اتفاقية تأجيل كامل.","note":"Form 155 أو نموذج البنك."},{"i":2240,"c":"sb2","s":0,"en":"Our fee is disclosed on Form 159, and none of it is counted toward the injection.","ar":"أتعابنا مُفصح عنها على نموذج 159، ولا يُحتسب أي جزء منها ضمن المساهمة الرأسمالية.","note":"جملة بتبني ثقة البنك فيك كـ packager نظيف."},{"i":2241,"c":"sb2","s":0,"en":"The package includes a sources-and-uses, a three-year historical spread, and a twelve-month projection.","ar":"الملف يتضمن جدول مصادر واستخدامات، وتحليلاً تاريخياً لثلاث سنوات، وتوقعات لاثني عشر شهراً.","note":"spread = تفريغ القوائم في نموذج تحليل. لغة البنوك."},{"i":2242,"c":"sb2","s":0,"en":"Every add-back is documented line by line, with support attached.","ar":"كل إضافة موثّقة بنداً بنداً، مع المستندات الداعمة مرفقة.","note":"أهم جملة لتقليل الـ haircut على الـ add-backs."},{"i":2243,"c":"sb2","s":1,"en":"The main risk is customer concentration — the top account is about thirty percent of revenue — and here's how we've mitigated it.","ar":"الخطر الرئيسي هو تركّز العملاء — أكبر حساب يمثل حوالي ثلاثين بالمئة من الإيرادات — وإليك كيف خففنا هذا الخطر.","note":"اذكر الخطر قبل ما البنك يكتشفه. ده جوهر ACIMA."},{"i":2244,"c":"sb2","s":0,"en":"The buyer has eight years of industry experience, including three as general manager.","ar":"لدى المشتري ثماني سنوات من الخبرة في القطاع، منها ثلاث كمدير عام.","note":"management = ركن أساسي في القرار."},{"i":2245,"c":"sb2","s":0,"en":"The seller will stay on for a ninety-day transition.","ar":"سيبقى البائع لفترة انتقالية مدتها تسعون يوماً.","note":"transition = تسليم واستلام. بيقلل مخاطر الاستحواذ."},{"i":2246,"c":"sb2","s":1,"en":"What would you need to see to get this to a term sheet?","ar":"ما الذي تحتاج رؤيته للوصول بهذا إلى ورقة شروط مبدئية؟","note":"term sheet = عرض شروط مبدئي. سؤال يحرّك الصفقة للأمام."},{"i":2247,"c":"sb2","s":0,"en":"Is there anything in the file that would be a non-starter for your credit team?","ar":"هل يوجد في الملف ما قد يكون عائقاً قاطعاً لفريق الائتمان لديكم؟","note":"non-starter = مرفوض من الأساس. اكتشف الـ deal-killer بدري."},{"i":2248,"c":"sb2","s":0,"en":"If the loan isn't fully secured, the borrower is prepared to pledge available personal real estate.","ar":"إذا لم يكن القرض مغطى بالكامل بالضمانات، فالمقترض مستعد لرهن العقار الشخصي المتاح.","note":"pledge = يرهن. بيبيّن جدية المقترض."},{"i":2249,"c":"sb2","s":0,"en":"When could we expect an initial read from your credit team?","ar":"متى يمكن أن نتوقع رأياً مبدئياً من فريق الائتمان لديكم؟","note":"initial read = انطباع مبدئي.  is one point six, and the quick ratio is point nine.","pr":"1.6 ⟪one-point-six⟫ · 0.9 ⟪point nine⟫ — الأمريكان غالباً بيشيلوا الصفر","ar":"نسبة التداول 1.6، ونسبة السيولة السريعة 0.9."},{"i":2327,"c":"nm1","s":0,"en":"Personal net worth is six hundred forty thousand, with two hundred ten thousand in liquid assets.","pr":"$640,000 ⟪six-forty⟫ · $210,000 ⟪two-ten⟫","ar":"صافي الثروة الشخصية ستمئة وأربعون ألفاً، منها مئتان وعشرة آلاف أصول سائلة."},{"i":2328,"c":"nm1","s":0,"en":"The guarantor's FICO score is seven forty-two.","pr":"FICO ⟪FIE-koh⟫ · 742 ⟪seven forty-two⟫","ar":"درجة الجدارة الائتمانية FICO للضامن 742."},{"i":2329,"c":"nm1","s":0,"en":"Year-to-date through June, revenue is two point three five million.","pr":"YTD ⟪Y-T-D⟫ أو ⟪year-to-date⟫ · $2.35M ⟪two-point-three-five⟫","ar":"منذ بداية العام حتى يونيو، الإيرادات 2.35 مليون."},{"i":2330,"c":"nm1","s":0,"en":"Annualized, that's about four point seven million.","pr":"annualized ⟪AN-yoo-uh-lized⟫ · $4.7M ⟪four-point-seven⟫","ar":"على أساس سنوي، هذا حوالي 4.7 مليون."},{"i":2331,"c":"nm1","s":0,"en":"The add-backs total ninety-six thousand four hundred.","pr":"$96,400 ⟪ninety-six four⟫","ar":"إجمالي الإضافات ستة وتسعون ألفاً وأربعمئة."},{"i":2332,"c":"nm1","s":0,"en":"We normalized the owner's salary at one hundred twenty thousand.","pr":"$120,000 ⟪one-twenty⟫ · normalized ⟪NOR-muh-lized⟫","ar":"قمنا بتطبيع راتب المالك عند مئة وعشرين ألفاً."},{"i":2333,"c":"nm1","s":0,"en":"Q3 is the seasonal low — about fifteen percent of annual sales.","pr":"Q3 ⟪Q-three⟫ · 15% ⟪fif-TEEN⟫","ar":"الربع الثالث هو القاع الموسمي — حوالي خمسة عشر بالمئة من المبيعات السنوية."},{"i":2334,"c":"nm1","s":0,"en":"That's a two-hundred-fifty-basis-point margin improvement.","pr":"250 bps ⟪two-fifty bips⟫ أو ⟪two and a half points⟫","ar":"هذا تحسن في الهامش بمئتين وخمسين نقطة أساس."},{"i":2335,"c":"nm1","s":0,"en":"Break-even revenue is about three point one million.","pr":"break-even ⟪BRAKE-even⟫ · $3.1M ⟪three-point-one⟫","ar":"إيرادات one backs up what they're projecting.","ar":"ما حققوه فعلياً يدعم ما يتوقعونه."},{"i":2405,"c":"mm1","s":1,"memo":"Projections appear aggressive relative to historical trends.","en":"These projections are more optimistic than anything they've actually done.","ar":"هذه التوقعات أكثر تفاؤلاً من أي شيء حققوه فعلياً."},{"i":2406,"c":"mm1","s":0,"memo":"Liquidity is considered adequate.","en":"They've got enough cash to ride out a rough patch.","ar":"لديهم نقد كافٍ لتجاوز فترة صعبة."},{"i":2407,"c":"mm1","s":0,"memo":"Leverage remains elevated post-transaction.","en":"After the deal, they'll be carrying a lot of debt.","ar":"بعد الصفقة، سيحملون قدراً كبيراً من الديون."},{"i":2408,"c":"mm1","s":0,"memo":"Management possesses relevant industry experience.","en":"The owner knows this business inside and out.","ar":"المالك يعرف هذا النشاط من الداخل والخارج."},{"i":2409,"c":"mm1","s":1,"memo":"The request is recommended for approval subject to standard conditions.","en":"I'd approve it — with the usual conditions.","ar":"سأوافق عليه — مع الشروط المعتادة."},{"i":2410,"c":"mm1","s":0,"memo":"Repayment capacity has not been sufficiently demonstrated.","en":"They haven't shown me how they'll pay this back.","ar":"لم يوضحوا لي كيف سيسددون هذا."},{"i":2411,"c":"mm1","s":0,"memo":"Margin compression may adversely impact repayment capacity.","en":"If margins keep shrinking, the payments get tight.","ar":"إذا استمرت الهوامش في الانكماش، ستصبح الأقساط مرهقة."},{"i":2412,"c":"mm1","s":0,"memo":"The working capital position is constrained.","en":"Their cash is tied up — mostly in receivables and inventory.","ar":"نقدهم محبوس — في الغالب في الذمم المدينة والمخزون."},{"i":2413,"c":"mm1","s":0,"memo":"The secondary source of repayment is liquidation of collateral.","en":"If things go wrong, plan B is selling the assets.","ar":"إذا ساءت الأمور، الخطة البديلة هي بيع الأصول."},{"i":2414,"c":"mm1","s":0,"memo":"Key-person risk is mitigated by an assignment of life insurance.","en":"If something happens to the owner, the insurance pays off the loan.","ar":"إذا حدث شيء للمالك، يسدد التأمين القرض."},{"i":2415,"c":"mm1","s":0,"memo":"Revenue exhibits seasonal volatility.","en":"Sales swing a lot depending on the time of year.","ar":"المبيعات تتأرجح كثيراً حسب وقت السنة."},{"i":2416,"c":"mm1","s":0,"memo":"Quality of earnings is supported by documented add-backs.","en":"The adjustments are real — every one of them has paper behind it.","ar":"التعديلات حقيقية — كل واحد منها مدعوم بمستندات."},{"i":2417,"c":"mm1","s":0,"memo":"The transaction is consistent with the institution's risk appetite.","en":"This is the kind of deal the bank actually wants.","ar":"هذا هو نوع الصفقة الذي يريده البنك فعلاً."},{"i":2418,"c":"mm1","s":1,"memo":"Approval is not recommended as presented.","en":"Not like this — but here's what would change my mind.","ar":"ليس بهذا الشكل — لكن إليك ما قد يغيّر رأيي."},{"i":2419,"c":"mm1","s":0,"memo":"The borrower has demonstrated resilience through prior economic cycles.","en":"They've been through bad years before and came out fine.","ar":"مرّوا بسنوات سيئة من قبل وخرجوا منها بخير."},{"i":2420,"c":"mm1","s":0,"memo":"Several key assumptions remain unvalidated.","en":"A few big assumptions here haven't been checked yet.","ar":"بعض الافتراضات الكبيرة هنا لم يتم التحقق منها بعد."},{"i":2501,"c":"cl2","who":"c","en":"Honestly, your fee is a lot more than I expected.","ar":"بصراحة، أتعابك أعلى بكثير مما توقعت.","s":0},{"i":2502,"c":"cl2","who":"c","en":"I found a guy on Fiverr who'll build the model for two hundred bucks.","ar":"وجدت شخصاً على Fiverr سيبني النموذج بمئتي دولار.","s":0},{"i":2503,"c":"cl2","who":"c","en":"Can you at least knock it down to half?","ar":"هل يمكنك على الأقل تخفيضها إلى النصف؟","s":0},{"i":2504,"c":"cl2","who":"c","en":"If I hire you, can you guarantee the loan gets approved?","ar":"إذا تعاقدت معك، هل تضمن الموافقة على القرض؟","s":0},{"i":2505,"c":"cl2","who":"c","en":"Then what exactly am I paying you for?","ar":"إذن مقابل ماذا أدفع لك بالضبط؟","s":0},{"i":2506,"c":"cl2","who":"c","en":"Another broker told me he'd guarantee it.","ar":"وسيط آخر قال لي إنه سيضمنها.","s":0},{"i":2507,"c":"cl2","who":"c","en":"The bank turned us down. They said our DSCR was too low.","ar":"رفضنا البنك. قالوا إن نسبة تغطية خدمة الدين منخفضة جداً.","s":0},{"i":2508,"c":"cl2","who":"c","en":"But we're profitable — I just don't get it.","ar":"لكننا نحقق أرباحاً — لا أفهم ذلك.","s":0},{"i":2509,"c":"cl2","who":"c","en":"So should I just try another bank?","ar":"إذن هل أجرّب بنكاً آخر فقط؟","s":0},{"i":2510,"c":"cl2","who":"c","en":"Look, my tax returns don't really show what we make.","ar":"اسمع، إقراراتي الضريبية لا تُظهر فعلاً ما نكسبه.","s":0},{"i":2511,"c":"cl2","who":"c","en":"Everybody does it. Can't you just adjust the numbers in the model?","ar":"الجميع يفعل ذلك. ألا يمكنك تعديل الأرقام في النموذج فقط؟","s":0},{"i":2512,"c":"cl2","who":"c","en":"So there's no way around it?","ar":"إذن لا توجد طريقة للالتفاف على ذلك؟","s":0},{"i":2513,"c":"cl2","who":"c","en":"I love this deal, but I don't have the full ten percent down.","ar":"تعجبني هذه الصفقة، لكن ليس لدي العشرة بالمئة كاملة كدفعة أولى.","s":0},{"i":2514,"c":"cl2","who":"c","en":"The seller said he'd finance part of it. Doesn't that count?","ar":"البائع قال إنه سيموّل جزءاً منها. ألا يُحتسب ذلك؟","s":0},{"i":2515,"c":"cl2","who":"c","en":"What if I just borrow it from my brother?","ar":"وماذا لو اقترضتها من أخي فقط؟","s":0},{"i":2516,"c":"cl2","who":"c","en":"Your client gets forty percent of revenue from one customer. That's a problem for us.","ar":"عميلك يحصل على أربعين بالمئة من إيراداته من عميل واحد. هذه مشكلة بالنسبة لنا.","s":0},{"i":2517,"c":"cl2","who":"c","en":"What happens if that customer walks?","ar":"ماذا يحدث إذا رحل ذلك العميل؟","s":0},{"i":2518,"c":"cl2","who":"c","en":"I'm not sure our credit committee will get comfortable with this.","ar":"لست متأكداً أن لجنة الائتمان لدينا ستطمئن لهذا.","s":0},{"i":2519,"c":"cl2","who":"c","en":"We're going to grow thirty percent next year — easily.","ar":"سننمو ثلاثين بالمئة العام القادم — بسهولة.","s":0},{"i":2520,"c":"cl2","who":"c","en":"Why are you cutting my projections? You're supposed to be on my side.","ar":"لماذا تخفّض توقعاتي؟ من المفترض أن تكون في صفّي.","s":0},{"i":2521,"c":"cl2","who":"c","en":"Fine, but the bank should still see our upside.","ar":"حسناً، لكن يجب أن يرى البنك إمكانات النمو لدينا.","s":0},{"i":2522,"c":"cl2","who":"c","en":"Coverage is only one point one eight. Why should we approve this?","ar":"التغطية 1.18 فقط. لماذا يجب أن نوافق على هذا؟","s":0},{"i":2523,"c":"cl2","who":"c","en":"And what's the secondary source of repayment?","ar":"وما مصدر السداد الثانوي؟","s":0},{"i":2524,"c":"cl2","who":"c","en":"What if revenue drops further next year?","ar":"وماذا لو انخفضت الإيرادات أكثر العام القادم؟","s":0},{"i":2525,"c":"cl2","who":"c","en":"While you're at it, can you also put together a pitch deck?","ar":"وأنت تعمل على ذلك، هل يمكنك أيضاً إعداد عرض تقديمي؟","s":0},{"i":2526,"c":"cl2","who":"c","en":"It's just a few slides — it shouldn't take you long.","ar":"إنها بضع شرائح فقط — لن تأخذ منك وقتاً طويلاً.","s":0},{"i":2527,"c":"cl2","who":"c","en":"I thought that was included.","ar":"ظننت أن ذلك مشمول.","s":0},{"i":2528,"c":"cl2","who":"c","en":"Honestly, this doesn't really fit our credit box right now.","ar":"بصراحة، هذا لا يتوافق حقاً مع معاييرنا الائتمانية حالياً.","s":0},{"i":2529,"c":"cl2","who":"c","en":"We're not doing many startups this year.","ar":"لا نموّل الكثير من الشركات الناشئة هذا العام.","s":0},{"i":2530,"c":"cl2","who":"c","en":"Maybe come back to us in six months.","ar":"ربما تعود إلينا بعد ستة أشهر.","s":0},{"i":2531,"c":"cl2","who":"c","en":"The appraisal came in ninety thousand short.","ar":"جاء التقييم أقل بتسعين ألفاً.","s":0},{"i":2532,"c":"cl2","who":"c","en":"And the seller won't budge on price.","ar":"والبائع لن يتزحزح عن السعر.","s":0},{"i":2533,"c":"cl2","who":"c","en":"So do we just walk away?","ar":"إذن هل ننسحب فقط؟","s":0},{"i":2534,"c":"cl2","who":"c","en":"Be straight with me — is this deal fundable or not?","ar":"كن صريحاً معي — هل هذه الصفقة قابلة للتمويل أم لا؟","s":0},{"i":2535,"c":"cl2","who":"c","en":"That's not what I wanted to hear.","ar":"ليس هذا ما أردت سماعه.","s":0},{"i":2536,"c":"cl2","who":"c","en":"What would you do in my shoes?","ar":"ماذا كنت ستفعل لو كنت مكاني؟","s":0},{"i":2601,"c":"ob1","st":"A","en":"I hear you — and it's fair to compare.","ar":"أفهمك — ومن حقك أن تقارن.","s":0},{"i":2602,"c":"ob1","st":"C","en":"But the model isn't what you're paying for — a lender-ready file is, and a weak one can cost you the deal.","ar":"لكنك لا تدفع مقابل النموذج — بل مقابل ملف جاهز للمقرض، والملف الضعيف قد يكلفك الصفقة.","s":0},{"i":2603,"c":"ob1","st":"I","en":"What happens to your timeline if the bank sends the package back?","ar":"ماذا يحدث لجدولك الزمني إذا أعاد البنك الملف؟","s":0},{"i":2604,"c":"ob1","st":"M","en":"If budget is tight, we can start with the credit review only and add the full package later.","ar":"إذا كانت الميزانية ضيقة، يمكننا البدء بالمراجعة الائتمانية فقط وإضافة الملف الكامل لاحقاً.","s":0},{"i":2605,"c":"ob1","st":"V","en":"Want me to send both options in writing today so you can compare?","ar":"هل تريد أن أرسل لك الخيارين كتابياً اليوم لتقارن بينهما؟","s":0},{"i":2606,"c":"ob1","st":"A","en":"That's exactly the right question to ask.","ar":"هذا بالضبط السؤال الصحيح.","s":0},{"i":2607,"c":"ob1","st":"C","en":"Nobody can honestly guarantee an approval — the lender makes the credit decision, and anyone promising otherwise is a red flag.","ar":"لا أحد يستطيع بأمانة أن يضمن الموافقة — المقرض هو من يتخذ القرار الائتماني، وأي شخص يعد بغير ذلك علامة تحذير.","s":0},{"i":2608,"c":"ob1","st":"I","en":"What would make you feel confident before we submit — knowing the weak spots in advance?","ar":"ما الذي سيجعلك واثقاً قبل أن نقدّم الملف — معرفة نقاط الضعف مسبقاً؟","s":0},{"i":2609,"c":"ob1","st":"M","en":"What I do guarantee is that every number ties out and every risk is explained before the lender asks.","ar":"ما أضمنه هو أن كل رقم سيتطابق وكل خطر سيُشرح قبل أن يسأل المقرض.","s":0},{"i":2610,"c":"ob1","st":"V","en":"Let me do a quick fundability check first — if it isn't bankable, I'll tell you before you spend more.","ar":"دعني أجري فحصاً سريعاً لقابلية التمويل أولاً — إذا لم تكن قابلة للتمويل، سأخبرك قبل أن تنفق أكثر.","s":0},{"i":2611,"c":"ob2","st":"A","en":"I'm sorry to hear that — a decline is frustrating, especially when the business is profitable.","ar":"يؤسفني سماع ذلك — الرفض محبط، خاصة حين يكون النشاط رابحاً.","s":0},{"i":2612,"c":"ob2","st":"C","en":"Profit and cash available for debt service aren't the same thing — the bank looks at what's left after taxes, owner draws, and existing payments.","ar":"الربح والنقد المتاح لخدمة الدين ليسا الشيء نفسه — البنك ينظر لما يتبقى بعد الضرائب ومسحوبات المالك والأقساط القائمة.","s":0},{"i":2613,"c":"ob2","st":"I","en":"Did they share the coverage number they calculated, and which years they used?","ar":"هل أطلعوك على رقم التغطية الذي حسبوه، وأي السنوات استخدموا؟","s":0},{"i":2614,"c":"ob2","st":"M","en":"We can recast the numbers with documented add-backs, and look at a longer term or a smaller request to bring coverage up.","ar":"يمكننا إعادة صياغة الأرقام بإضافات موثقة، والنظر في مدة أطول أو طلب أصغر لرفع التغطية.","s":0},{"i":2615,"c":"ob2","st":"V","en":"Send me the decline letter and three years of returns, and I'll tell you within a week whether it's fixable.","ar":"أرسل لي خطاب الرفض وإقرارات ثلاث سنوات، وسأخبرك خلال أسبوع إن كان الأمر قابلاً للإصلاح.","s":0},{"i":2616,"c":"ob1","st":"A","en":"I appreciate you being upfront about that.","ar":"أقدّر صراحتك في هذا الأمر.","s":0},{"i":2617,"c":"ob1","st":"C","en":"Lenders underwrite to the returns and verify them with the IRS — income we can't document simply doesn't count.","ar":"المقرضون يكتتبون على الإقرارات ويتحققون منها مع مصلحة الضرائب — الدخل الذي لا نستطيع توثيقه لا يُحتسب ببساطة.","s":0},{"i":2618,"c":"ob1","st":"I","en":"Which expenses are personal, and do you have receipts or statements for them?","ar":"أي المصروفات شخصية، وهل لديك إيصالات أو كشوف لها؟","s":0},{"i":2619,"c":"ob1","st":"M","en":"Legitimate add-backs we can document; for the rest, the options are amended returns with your CPA, or sizing the loan to what the returns support.","ar":"الإضافات المشروعة يمكننا توثيقها؛ أما الباقي فالخيارات إقرارات معدّلة مع محاسبك، أو تحديد حجم القرض بما تدعمه الإقرارات.","s":0},{"i":2620,"c":"ob1","st":"V","en":"Let's go through last year's return line by line on our next call — I'll send you a short list to prepare.","ar":"لنراجع إقرار العام الماضي بنداً بنداً في مكالمتنا القادمة — سأرسل لك قائمة قصيرة للتحضير.","s":0},{"i":2621,"c":"ob2","st":"A","en":"That's a common gap, and it's good we're catching it before the LOI.","ar":"هذه فجوة شائعة، ومن الجيد أننا نكتشفها قبل خطاب النوايا.","s":0},{"i":2622,"c":"ob2","st":"C","en":"The injection can't be skipped — and a seller note only counts if it's on full standby, with no payments for the life of the SBA loan.","ar":"لا يمكن تجاوز المساهمة — وسند البائع لا يُحتسب إلا إذا كان على تأجيل كامل، بلا دفعات طوال عمر قرض الـ SBA.","s":0},{"i":2623,"c":"ob2","st":"I","en":"How much cash can you verify today, and would the seller accept full standby on part of the note?","ar":"كم من النقد يمكنك إثباته اليوم، وهل سيقبل البائع التأجيل الكامل على جزء من السند؟","s":0},{"i":2624,"c":"ob2","st":"M","en":"A personal loan can work, but only if you can repay it from a source other than the business — so we'd need to show that.","ar":"القرض الشخصي قد ينجح، لكن فقط إذا أمكنك سداده من مصدر غير النشاط — لذا سنحتاج لإثبات ذلك.","s":0},{"i":2625,"c":"ob2","st":"V","en":"Let me model two structures — cash plus a standby note, and a lower price — and we'll take the stronger one to the seller.","ar":"دعني أنمذج هيكلين — نقد مع سند مؤجل، وسعر أقل — ونأخذ الأقوى إلى البائع.","s":0},{"i":2626,"c":"ob3","st":"A","en":"That's a valid concern, and we flagged it ourselves in the memo.","ar":"قلق في محله، وقد أشرنا إليه بأنفسنا في المذكرة.","s":0},{"i":2627,"c":"ob3","st":"C","en":"That said, the relationship is eleven years old, under contract through 2028, with no payment issues.","ar":"ومع ذلك، العلاقة عمرها إحدى عشرة سنة، وبعقد حتى 2028، دون أي مشكلات في السداد.","s":0},{"i":2628,"c":"ob3","st":"I","en":"What coverage would your committee need to see if that account dropped by half?","ar":"ما التغطية التي ستحتاج لجنتكم رؤيتها إذا انخفض ذلك الحساب إلى النصف؟","s":0},{"i":2629,"c":"ob3","st":"M","en":"Even if that customer cut volume in half, coverage stays around one point one eight, and the owner has agreed to a concentration covenant.","ar":"حتى لو خفّض ذلك العميل حجمه إلى النصف، تظل التغطية حوالي 1.18، ووافق المالك على تعهد خاص بالتركّز.","s":0},{"i":2630,"c":"ob3","st":"V","en":"Would it help if I sent you the downside run and the customer contract before you take it to committee?","ar":"هل سيفيد أن أرسل لك سيناريو الهبوط وعقد العميل قبل أن ترفعه للجنة؟","s":0},{"i":2631,"c":"ob2","st":"A","en":"I love the ambition, and I believe the growth is possible.","ar":"أحب هذا الطموح، وأعتقد أن النمو ممكن.","s":0},{"i":2632,"c":"ob2","st":"C","en":"But the lender sizes the loan on what's defensible, not what's possible — and you've never grown more than twelve percent.","ar":"لكن المقرض يحدد حجم القرض بناءً على ما يمكن الدفاع عنه لا ما هو ممكن — ولم تنمُ أبداً أكثر من اثني عشر بالمئة.","s":0},{"i":2633,"c":"ob2","st":"I","en":"What's specifically different next year — new contracts, new locations, signed orders?","ar":"ما الذي سيختلف تحديداً العام القادم — عقود جديدة، مواقع جديدة، طلبيات موقعة؟","s":0},{"i":2634,"c":"ob2","st":"M","en":"Let's build a base case the bank can believe, and show the thirty percent as an upside case — with what has to happen for it to come true.","ar":"لنبنِ سيناريو أساسياً يصدّقه البنك، ونعرض الثلاثين بالمئة كسيناريو صعود — مع ما يجب أن يحدث لتحقيقه.","s":0},{"i":2635,"c":"ob2","st":"V","en":"If you send me the signed contracts, I'll fold them into the base case today.","ar":"إذا أرسلت لي العقود الموقعة، سأدمجها في السيناريو الأساسي اليوم.","s":0},{"i":2636,"c":"ob3","st":"A","en":"That's the right question — the coverage is thin, and I won't pretend otherwise.","ar":"هذا هو السؤال الصحيح — التغطية ضعيفة، ولن أتظاهر بغير ذلك.","s":0},{"i":2637,"c":"ob3","st":"C","en":"But one point one eight is on the trailing year, which included a one-time equipment repair; normalized, it's one point three one.","ar":"لكن 1.18 محسوبة على العام الماضي، الذي تضمّن إصلاح معدات لمرة واحدة؛ وبعد التطبيع تصبح 1.31.","s":0},{"i":2638,"c":"ob3","st":"I","en":"Is the concern the level itself, or the trend behind it?","ar":"هل القلق من المستوى نفسه، أم من الاتجاه وراءه؟","s":0},{"i":2639,"c":"ob3","st":"M","en":"We've added a six-month interest reserve, a personal guarantee backed by real estate, and quarterly reporting.","ar":"أضفنا احتياطي فوائد لستة أشهر، وضماناً شخصياً مدعوماً بعقار، وتقارير ربع سنوية.","s":0},{"i":2640,"c":"ob3","st":"V","en":"I'd recommend approval with those conditions, and I'm happy to walk through the downside case now.","ar":"أوصي بالموافقة بهذه الشروط، ويسعدني شرح سيناريو الهبوط الآن.","s":0},{"i":2641,"c":"ob1","st":"A","en":"Happy to help with that — a deck is a natural next step.","ar":"يسعدني المساعدة في ذلك — العرض التقديمي خطوة طبيعية تالية.","s":0},{"i":2642,"c":"ob1","st":"C","en":"It's outside the scope we agreed on, though, and doing it properly takes real time.","ar":"لكنه خارج النطاق الذي اتفقنا عليه، وإنجازه بشكل صحيح يتطلب وقتاً حقيقياً.","s":0},{"i":2643,"c":"ob1","st":"I","en":"Who's the deck for — a lender, an investor, or a partner — and when do you need it?","ar":"لمن العرض — مقرض أم مستثمر أم شريك — ومتى تحتاجه؟","s":0},{"i":2644,"c":"ob1","st":"M","en":"I can quote it as a separate piece, or we can swap it for something in the current scope if timing matters more.","ar":"يمكنني تسعيره كجزء منفصل، أو نستبدله ببند في النطاق الحالي إذا كان التوقيت أهم.","s":0},{"i":2645,"c":"ob1","st":"V","en":"I'll send you a one-page change order today so you can choose.","ar":"سأرسل لك أمر تعديل من صفحة واحدة اليوم لتختار.","s":0},{"i":2646,"c":"ob3","st":"A","en":"I appreciate the straight answer — that saves us both time.","ar":"أقدّر الإجابة الصريحة — هذا يوفر وقتنا معاً.","s":0},{"i":2647,"c":"ob3","st":"C","en":"Before I go — the borrower isn't a pure startup; she's buying an existing business with five years of cash flow.","ar":"قبل أن أنهي — المقترضة ليست شركة ناشئة بالكامل؛ إنها تشتري نشاطاً قائماً بتدفق نقدي لخمس سنوات.","s":0},{"i":2648,"c":"ob3","st":"I","en":"Is it the industry, the size, or the structure that puts it outside the box?","ar":"هل القطاع أم الحجم أم الهيكل هو ما يضعه خارج المعايير؟","s":0},{"i":2649,"c":"ob3","st":"M","en":"If it's the structure, we could increase the seller's standby piece or reduce the loan size.","ar":"إذا كان الهيكل، يمكننا زيادة الجزء المؤجل من البائع أو تقليل حجم القرض.","s":0},{"i":2650,"c":"ob3","st":"V","en":"If it's still a no, could you point me to a lender who's more active in this space?","ar":"إذا ظل الجواب لا، هل يمكنك أن ترشدني إلى مقرض أكثر نشاطاً في هذا المجال؟","s":0},{"i":2651,"c":"ob2","st":"A","en":"That's frustrating — and it happens more often than people think.","ar":"هذا محبط — ويحدث أكثر مما يظن الناس.","s":0},{"i":2652,"c":"ob2","st":"C","en":"The lender will only lend against the appraised value, so either the gap gets filled or the price has to move.","ar":"المقرض سيُقرض فقط على أساس القيمة المقدّرة، لذا إما أن تُسدّ الفجوة أو يتغير السعر.","s":0},{"i":2653,"c":"ob2","st":"I","en":"Is the seller open to carrying part of the gap, and how much more cash could you put in?","ar":"هل البائع منفتح على تحمّل جزء من الفجوة، وكم من النقد الإضافي يمكنك ضخه؟","s":0},{"i":2654,"c":"ob2","st":"M","en":"We could cover it with a larger seller note, part of it on standby, or ask the appraiser to review comparables we think were missed.","ar":"يمكننا تغطيتها بسند بائع أكبر، جزء منه مؤجل، أو نطلب من المقيّم مراجعة صفقات مقارنة نعتقد أنها أُغفلت.","s":0},{"i":2655,"c":"ob2","st":"V","en":"Let me draft the options and a short note you can share with the seller tomorrow.","ar":"دعني أصيغ الخيارات ومذكرة قصيرة يمكنك مشاركتها مع البائع غداً.","s":0},{"i":2656,"c":"ob1","st":"A","en":"I'll be straight with you, because that's what you're paying me for.","ar":"سأكون صريحاً معك، لأن هذا ما تدفع لي مقابله.","s":0},{"i":2657,"c":"ob1","st":"C","en":"As structured today, I don't think a lender will approve it — the debt is too heavy for the cash flow.","ar":"بهيكلها الحالي، لا أعتقد أن مقرضاً سيوافق عليها — الدين ثقيل جداً على التدفق النقدي.","s":0},{"i":2658,"c":"ob1","st":"I","en":"How much flexibility do you have on price, timing, or bringing in a partner?","ar":"ما مقدار المرونة لديك في السعر أو التوقيت أو إدخال شريك؟","s":0},{"i":2659,"c":"ob1","st":"M","en":"If the price comes down about ten percent, or the seller carries more on standby, coverage moves into a range lenders accept.","ar":"إذا انخفض السعر حوالي عشرة بالمئة، أو تحمّل البائع جزءاً أكبر مؤجلاً، تنتقل التغطية إلى نطاق يقبله المقرضون.","s":0},{"i":2660,"c":"ob1","st":"V","en":"My advice is to renegotiate before you walk — I can put the numbers on one page for your meeting with the seller.","ar":"نصيحتي أن تعيد التفاوض قبل أن تنسحب — يمكنني وضع الأرقام في صفحة واحدة لاجتماعك مع البائع.","s":0}],"CONVOS":[{"id":"cv1","icon":"☕","title":"Model Client — Sunrise Café","col":"#2E7D32","tag":"بنكي","sub":"صاحبة مقهى تريد financial model لفرع ثانٍ","lines":[{"who":"them","name":"Maria","en":"Hi! I run Sunrise Café — we've been open three years and I want to open a second location. My accountant said I need a financial model for the bank?","ar":"أهلاً! أدير مقهى Sunrise منذ ثلاث سنوات وأريد فتح فرع ثانٍ. قال محاسبي إنني أحتاج نموذجاً مالياً للبنك؟","note":"العميلة تعرض حاجتها"},{"who":"you","en":"Thanks for hopping on, Maria. Before we dive in, give me the thirty-second version: what are you trying to get funded, and by when?","ar":"شكراً لانضمامك يا ماريا. قبل أن نبدأ، أعطيني النسخة المختصرة: ما الذي تريدين تمويله، ومتى؟","note":"افتتاح + سؤال التركيز"},{"who":"them","name":"Maria","en":"Around a hundred eighty thousand for the buildout, ideally financed by end of Q3.","ar":"نحو مئة وثمانين ألفاً للتجهيز، ويُفضّل تمويله بنهاية الربع الثالث.","note":"المبلغ والتوقيت"},{"who":"you","en":"And what's your repayment going to come from — the existing café's cash flow, or the new location?","ar":"ومن أين سيأتي السداد — من التدفق النقدي للمقهى الحالي أم من الفرع الجديد؟","note":"سؤال مصدر السداد"},{"who":"them","name":"Maria","en":"Mostly the new location once it's running.","ar":"من الفرع الجديد بشكل أساسي بمجرد تشغيله.","note":"تعتمد على الفرع الجديد"},{"who":"you","en":"Here's what a credit committee flags immediately. A lender doesn't fund a business — they fund a repayment story, and right now your story leans entirely on a location that doesn't exist yet.","ar":"إليك ما تلاحظه لجنة الائتمان فوراً. المقرض لا يموّل نشاطاً — بل يموّل قصة سداد، وقصتك الآن تعتمد كلياً على فرع لم يوجد بعد.","note":"عدسة المصرفي — projection risk"},{"who":"them","name":"Maria","en":"Oh. My accountant didn't mention that. Is that something you can fix?","ar":"آه. محاسبي لم يذكر ذلك. هل هذا شيء يمكنك إصلاحه؟","note":"تطلب الحل"},{"who":"you","en":"It is. The model proves the numbers, but the real value is the credit lens I put on top — a Banker's View showing the lender your strengths, risks, and the conditions they'll likely attach.","ar":"نعم. النموذج يثبت الأرقام، لكن القيمة الحقيقية في العدسة الائتمانية التي أضعها فوقه — رؤية مصرفية تُظهر للمقرض نقاط قوتك ومخاطرك والشروط التي سيضعها.","note":"يشرح القيمة + الـ Banker’s View"},{"who":"them","name":"Maria","en":"I see you're newer on the platform, though. No offense.","ar":"لكنني أرى أنك جديد على المنصة. لا أقصد الإساءة.","note":"تعترض على الجدّة"},{"who":"you","en":"Fair question — I'd ask the same. I'm new to this platform; I'm not new to credit. I've sat on the other side of that table for eighteen years. Judge me on the work — take a look at the sample.","ar":"سؤال وجيه — كنت سأسأل المثل. أنا جديد على هذه المنصة، لست جديداً على الائتمان. جلست على الجانب الآخر من تلك الطاولة ثمانية عشر عاماً. احكمي عليّ بالعمل — انظري إلى النموذج.","note":"الرد على اعتراض الجدّة"},{"who":"them","name":"Maria","en":"That's reassuring. What would this run?","ar":"هذا مُطمئن. كم سيكلّف هذا؟","note":"تسأل عن السعر"},{"who":"you","en":"The investor-ready model starts around seven hundred. And let's keep that in proportion — the fee is a fraction of the hundred-eighty thousand you're trying to unlock.","ar":"النموذج الجاهز للمستثمر يبدأ من نحو سبعمئة. ولنضع ذلك في نصابه — الأتعاب جزء يسير من المئة والثمانين ألفاً التي تحاولين الحصول عليها.","note":"السعر + تأطيره"},{"who":"them","name":"Maria","en":"That's fair. Let's do it.","ar":"هذا عادل. فلنفعلها.","note":"توافق"},{"who":"you","en":"Here's the next step — I'll send a short intake form and we can get started today.","ar":"إليك الخطوة التالية — سأرسل استمارة قصيرة ويمكننا البدء اليوم.","note":"الإغلاق"}]},{"id":"cv2","icon":"🚚","title":"SBA Client — FastTrack Logistics","col":"#C62828","tag":"بنكي","sub":"صاحب لوجستيات يضغط على السعر","lines":[{"who":"them","name":"Dave","en":"I'll be quick — we move freight for a couple of big retail accounts and want an SBA loan for six new trucks. I've got a guy who'll do the package for four hundred bucks. So what do you do differently?","ar":"سأكون سريعاً — ننقل البضائع لعميلين كبيرين في التجزئة ونريد قرض SBA لستّ شاحنات جديدة. لديّ شخص سيُجهّز الحزمة بأربعمئة دولار. فما الذي تفعله بشكل مختلف؟","note":"يريد SBA + يقارن بمنافس أرخص"},{"who":"you","en":"Let me make sure I understand — six trucks to take on freight you're turning away, SBA package done right. Quick question: just the trucks, or working capital too?","ar":"دعني أتأكد أنني فهمت — ستّ شاحنات لتلبية شحنات ترفضها حالياً، وحزمة SBA مُعدّة بشكل صحيح. سؤال سريع: الشاحنات فقط أم رأس مال عامل أيضاً؟","note":"توضيح + سؤال تشخيص"},{"who":"them","name":"Dave","en":"Just the trucks. Two accounts are about seventy percent of our revenue, but they're rock solid.","ar":"الشاحنات فقط. عميلان يمثّلان نحو سبعين بالمئة من إيرادنا، لكنهما ثابتان تماماً.","note":"تركّز 70% في عميلين"},{"who":"you","en":"Okay, here's where I earn my fee. Two customers at seventy percent of revenue — that's concentration risk, and on an SBA file it's one of the first things the credit officer flags.","ar":"حسناً، هنا أستحق أتعابي. عميلان بسبعين بالمئة من الإيراد — هذا خطر تركّز، وفي ملف SBA هو من أول ما يلاحظه ضابط الائتمان.","note":"عدسة المصرفي — خطر التركّز"},{"who":"them","name":"Dave","en":"Huh. So does that kill it?","ar":"حسناً. هل يُفشل ذلك الصفقة؟","note":"يسأل إن كان قاتلاً"},{"who":"you","en":"No — it's manageable, but it has to be addressed head-on. We propose a mitigant: a covenant requiring advance notice on any material change to those contracts. That's the difference between a model that works and a file that gets approved.","ar":"لا — يمكن إدارته، لكن يجب معالجته مباشرةً. نقترح مُخفِّفاً: شرطاً يتطلب إشعاراً مسبقاً بأي تغيير جوهري في تلك العقود. هذا هو الفرق بين نموذج يعمل وملف يُعتمد.","note":"الحل + جملة الهوية"},{"who":"them","name":"Dave","en":"My four-hundred-dollar guy is definitely not saying any of this. But price matters — why pay you a multiple?","ar":"صاحب الأربعمئة دولار قطعاً لا يقول أياً من هذا. لكن السعر مهم — لماذا أدفع لك أضعافاً؟","note":"اعتراض السعر"},{"who":"you","en":"I hear you. Let me reframe it: what does it cost you if the deal gets declined and you start over? A cheaper package that gets rejected is the expensive option.","ar":"أفهمك. دعني أعيد التأطير: كم يكلّفك إن رُفضت الصفقة وبدأت من جديد؟ حزمة أرخص تُرفض هي الخيار الأغلى.","note":"إعادة تأطير السعر"},{"who":"them","name":"Dave","en":"Fair point. What's the next step?","ar":"نقطة وجيهة. ما الخطوة التالية؟","note":"يقتنع"},{"who":"you","en":"Let's start with the SBA index and the credit memo, then scope the full package. I'll send a short intake form and we can get moving today.","ar":"فلنبدأ بفهرس الـ SBA والمذكرة الائتمانية، ثم نحدّد الحزمة الكاملة. سأرسل استمارة قصيرة ويمكننا التحرّك اليوم.","note":"الـ funnel + الإغلاق"}]},{"id":"cv3","icon":"🏛️","title":"The Lender Call","col":"#880E4F","tag":"بنكي","sub":"تمثّل عميلك أمام ضابط ائتمان","lines":[{"who":"them","name":"Karen","en":"Hi, this is Karen with the bank — I understand you're representing the borrower on the FastTrack file?","ar":"مرحباً، أنا كارين من البنك — أفهم أنك تمثّل المقترض في ملف FastTrack؟","note":"ضابطة ائتمان تتصل"},{"who":"you","en":"I am — thanks for taking the call, Karen. I structured the package and wanted to walk you through it before it hits your desk. Give me two minutes to frame it.","ar":"نعم — شكراً لتلقّيك المكالمة يا كارين. أنا هيكلت الحزمة وأردت أن أشرحها لك قبل وصولها لمكتبك. أمهليني دقيقتين لأؤطّرها.","note":"تقديم مهني ندّ لندّ"},{"who":"them","name":"Karen","en":"Sure, go ahead.","ar":"بالتأكيد، تفضّل.","note":"تأذن"},{"who":"you","en":"We're presenting this as a medium-risk credit with a clear primary repayment source and adequate collateral coverage. The global DSCR comes in at one-point-four times, comfortably above the one-point-two-five benchmark.","ar":"نقدّم هذا كائتمان متوسط المخاطر بمصدر سداد أساسي واضح وتغطية ضمانات كافية. الـ DSCR الكلي يبلغ 1.4 مرة، فوق معيار الـ 1.25 بمريح.","note":"صياغة لجنة الائتمان + الأرقام"},{"who":"them","name":"Karen","en":"What about concentration? Two accounts, right? That'll come up.","ar":"ماذا عن التركّز؟ عميلان، صحيح؟ ستُثار هذه النقطة.","note":"تختبره بسؤال المخاطر"},{"who":"you","en":"It will, and we've addressed it directly rather than burying it. The mitigant is a covenant requiring advance notice on any material contract change. And on a stressed basis — a fifteen-percent revenue decline — the deal still services its debt.",
